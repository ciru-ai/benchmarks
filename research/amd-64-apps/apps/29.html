<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Meeting Planner</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --warning: #fbbf24;
            --danger: #ef4444;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #app-container {
            width: 960px;
            max-width: 95vw;
            height: 600px;
            max-height: 90vh;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            box-sizing: border-box;
            position: relative;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 2rem;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
        .controls { display: flex; gap: 1rem; align-items: center; }
        button {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.95); }
        [data-testid="primary-action"] { background: var(--accent); color: var(--bg); }
        [data-testid="reset"] { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); }
        [data-testid="reset"]:hover { border-color: var(--danger); color: var(--danger); }
        
        #status-bar {
            background: rgba(0,0,0,0.2);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            border-left: 4px solid var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            flex-grow: 1;
        }
        .zone-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .city-name { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.5rem; }
        .time-display { font-size: 2.5rem; font-weight: 700; margin: 1rem 0; font-variant-numeric: tabular-nums; }
        .date-display { font-size: 0.9rem; color: var(--text-muted); height: 1.2em; }
        .offset { font-size: 0.8rem; color: var(--text-muted); }
        
        .day-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .day-same { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .day-next { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
        .day-prev { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; overflow-y: auto; }
            #app-container { height: auto; min-height: 100vh; padding: 1rem; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <div>
            <h1>Timezone Sync</h1>
            <p style="color: var(--text-muted); margin: 4px 0 0 0;">Planning meeting window across global hubs</p>
        </div>
        <div class="controls">
            <button id="btn-advance" data-testid="primary-action">Advance +1 Hour</button>
            <button id="btn-reset" data-testid="reset">Reset</button>
        </div>
    </header>

    <div id="status" data-testid="status">Initializing...</div>

    <main class="grid">
        <!-- New York -->
        <div class="zone-card" id="card-ny">
            <div>
                <div class="city-name">New York</div>
                <div class="offset">UTC-5 / EDT</div>
            </div>
            <div class="time-display" id="time-ny">--:--</div>
            <div class="date-display" id="date-ny"><span class="day-indicator"></span><span class="label">---</span></div>
        </div>

        <!-- London -->
        <div class="zone-card" id="card-ldn">
            <div>
                <div class="city-name">London</div>
                <div class="offset">UTC+0 / GMT</div>
            </div>
            <div class="time-display" id="time-ldn">--:--</div>
            <div class="date-display" id="date-ldn"><span class="day-indicator"></span><span class="label">---</span></div>
        </div>

        <!-- Tokyo -->
        <div class="zone-card" id="card-tky">
            <div>
                <div class="city-name">Tokyo</div>
                <div class="offset">UTC+9 / JST</div>
            </div>
            <div class="time-display" id="time-tky">--:--</div>
            <div class="date-display" id="date-tky"><span class="day-indicator"></span><span class="label">---</span></div>
        </div>
    </main>
</div>

<script>
    /**
     * APP STATE & CONFIGURATION
     */
    const INITIAL_STATE = {
        utcHour: 12, // Start at Noon UTC
        utcDate: new Date().toISOString().split('T')[0] // Current date
    };

    let state = { ...INITIAL_STATE };
    let timerInterval = null;

    const ZONES = [
        { id: 'ny', zone: 'America/New_York' },
        { id: 'ldn', zone: 'Europe/London' },
        { id: 'tky', zone: 'Asia/Tokyo' }
    ];

    // DOM Elements
    const elStatus = document.getElementById('status');
    const btnAdvance = document.getElementById('btn-advance');
    const btnReset = document.getElementById('btn-reset');

    /**
     * CORE LOGIC
     */
    function updateUI() {
        // Create base date object based on state
        // We set the hours manually to control the simulation
        const baseDate = new Date(`2023-01-01T${state.utcHour.toString().padStart(2, '0')}:00:00Z`);
        
        // To handle day rollovers correctly without complex math, we treat the state as absolute offset from a fixed epoch
        // But for this demo, simplicity wins: let's calculate each zone relative to a simulated UTC timestamp
        const simTimestamp = new Date(`${state.utcDate}T${state.utcHour.toString().padStart(2, '0')}:00:00Z`).getTime();

        elStatus.textContent = `Current Simulation: ${state.utcDate} @ ${state.utcHour.toString().padStart(2, '0')}:00 UTC`;

        ZONES.forEach(z => {
            const timeStr = new Intl.DateTimeFormat('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true,
                timeZone: z.zone
            }).format(simTimestamp);

            const dateParts = new Intl.DateTimeFormat('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                timeZone: z.zone
            }).format(simTimestamp);

            const cardTime = document.getElementById(`time-${z.id}`);
            const cardDate = document.getElementById(`date-${z.id}`);
            const indicator = cardDate.querySelector('.day-indicator');
            const label = cardDate.querySelector('.label');

            if (!cardTime || !cardDate) return;

            cardTime.textContent = timeStr;
            label.textContent = dateParts;

            // Day Rollover Detection Logic
            // Compare local date part to UTC date part
            const utcDateOnly = new Date(simTimestamp).getUTCDate();
            const localDateObj = new Date(new Intl.DateTimeFormat('en-US', {timeZone: z.zone, year:'numeric', month:'numeric', day:'numeric'}).format(simTimestamp));
            // Simplified approach for visualization: compare weekday string vs UTC weekday
            const localWeekday = new Intl.DateTimeFormat('en-US', {weekday: 'long', timeZone: z.zone}).format(simTimestamp);
            const utcWeekday = new Intl.DateTimeFormat('en-US', {weekday: 'long', timeZone: 'UTC'}).format(simTimestamp);
            
            // Using simple comparison of formatted dates to detect if they fall on different calendar days than UTC
            const localFull = new Intl.DateTimeFormat('en-US', {year: 'numeric', month: 'numeric', day: 'numeric', timeZone: z.zone}).format(simTimestamp);
            const utcFull = new Intl.DateTimeFormat('en-US', {year: 'numeric', month: 'numeric', day: 'numeric', timeZone: 'UTC'}).format(simTimestamp);

            indicator.className = 'day-indicator';
            if (localFull === utcFull) {
                indicator.classList.add('day-same');
            } else {
                // If local is greater than UTC, it's tomorrow (Next), otherwise yesterday (Prev)
                const lD = new Date(localFull);
                const uD = new Date(utcFull);
                indicator.classList.add(lD > uD ? 'day-next' : 'day-prev');
            }
        });
    }

    function advanceHour() {
        state.utcHour++;
        if (state.utcHour >= 24) {
            state.utcHour = 0;
            const d = new Date(state.utcDate);
            d.setUTCDate(d.getUTCDate() + 1);
            state.utcDate = d.toISOString().split('T')[0];
        }
        updateUI();
    }

    function resetApp() {
        stopTimer();
        state = { ...INITIAL_STATE };
        updateUI();
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            advanceHour();
        }, 1000); // Fast forward mode for demo purposes
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    /**
     * EVENT HANDLERS
     */
    function init() {
        btnAdvance.addEventListener('click', () => {
            advanceHour();
            startTimer(); // Restart timer movement on interaction
        });

        btnReset.addEventListener('click', resetApp);

        // Initial render
        updateUI();
    }

    window.onload = init;

</script>
</body>
</html>
