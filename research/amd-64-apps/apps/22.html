<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Relay</title>
    <style>
        :root {
            --cream: #fdfaf5;
            --charcoal: #2c2c2e;
            --lavender: #a29bfe;
            --vermilion: #ff4757;
            --shadow: rgba(162, 155, 254, 0.4);
        }
        body {
            margin: 0;
            background: var(--charcoal);
            color: var(--cream);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 4px solid var(--lavender);
            line-height: 0;
        }
        canvas {
            background: var(--cream);
            display: block;
        }
        .ui-panel {
            padding: 15px;
            text-align: center;
            background: #3a3a3c;
            width: 960px;
            max-width: 100vw;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls-hint { font-size: 0.8rem; color: #ccc; }
        button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        #primary-btn { background: var(--lavender); color: var(--charcoal); margin-right: 10px; }
        #reset-btn { background: transparent; border: 2px solid var(--vermilion); color: var(--vermilion); }
        [data-testid="status"] { font-weight: bold; color: var(--lavender); }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .overlay h2 { font-size: 3rem; margin: 0; color: var(--vermilion); }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="600"></canvas>
        <div id="win-overlay" class="overlay">
            <h2 id="result-text">YOU WIN!</h2>
            <p>The shadows aligned.</p>
        </div>
    </div>

    <div class="ui-panel">
        <div>
            <span data-testid="status">Status: Ready</span>
        </div>
        <div class="controls-hint">A/D or Arrows to move • SPACE to Jump</div>
        <div>
            <button id="primary-btn" data-testid="primary-action">START GAME</button>
            <button id="reset-btn" data-testid="reset">RESET</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.querySelector('[data-testid="status"]');
        const primaryBtn = document.getElementById('primary-btn');
        const resetBtn = document.getElementById('reset-btn');
        const winOverlay = document.getElementById('win-overlay');
        const resultText = document.getElementById('result-text');

        // Game Constants
        const GRAVITY = 0.6;
        const FRICTION = 0.8;
        const JUMP_FORCE = -14;
        const SPEED = 0.8;
        const MAX_SPEED = 5;
        const SHADOW_DELAY_MS = 2000; // 2 seconds delay

        // State Management
        let gameState = 'IDLE'; // IDLE, PLAYING, WON, LOST
        let lastTime = 0;
        let history = []; // Stores {x, y, timestamp}

        const player = {
            x: 100, y: 400, w: 30, h: 45, vx: 0, vy: 0, grounded: false, color: '#2c2c2e'
        };

        const platforms = [
            { x: 0, y: 550, w: 300, h: 50 },     // Start Platform
            { x: 400, y: 450, w: 200, h: 30 },   // Mid Platform
            { x: 750, y: 550, w: 210, h: 50 },   // End Platform
            { x: 0, y: 590, w: 960, h: 10 }      // Ground (below pit)
        ];

        const switchTrigger = { x: 450, y: 440, w: 40, h: 10, active: false };
        const exitGate = { x: 880, y: 450, w: 10, h: 100, isOpen: false };
        const pit = { x: 300, y: 550, w: 100, h: 50 };

        const keys = {};

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function init() {
            player.x = 100; player.y = 400; player.vx = 0; player.vy = 0;
            history = [];
            switchTrigger.active = false;
            exitGate.isOpen = false;
            gameState = 'IDLE';
            updateStatus("Ready");
            winOverlay.style.display = 'none';
            requestAnimationFrame(gameLoop);
        }

        function updateStatus(msg) {
            statusEl.textContent = `Status: ${msg}`;
        }

        function start() {
            if (gameState === 'WON' || gameState === 'LOST') return;
            gameState = 'PLAYING';
            updateStatus("Recording...");
            primaryBtn.disabled = true;
        }

        function reset() {
            init();
            primaryBtn.disabled = false;
        }

        function endGame(won) {
            gameState = won ? 'WON' : 'LOST';
            resultText.textContent = won ? "SUCCESS!" : "FAILED!";
            resultText.style.color = won ? "#a29bfe" : "#ff4757";
            winOverlay.style.display = 'flex';
            updateStatus(won ? "Victory" : "Try Again");
            primaryBtn.disabled = false;
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.w &&
                   rect1.x + rect1.w > rect2.x &&
                   rect1.y < rect2.y + rect2.h &&
                   rect1.y + rect1.h > rect2.y;
        }

        function update(dt) {
            if (gameState !== 'PLAYING') return;

            // Input
            if (keys['ArrowLeft'] || keys['KeyA']) player.vx -= SPEED;
            if (keys['ArrowRight'] || keys['KeyD']) player.vx += SPEED;
            if ((keys['Space'] || keys['ArrowUp' ] || keys['KeyW']) && player.grounded) {
                player.vy = JUMP_FORCE;
                player.grounded = false;
            }

            // Physics
            player.vx *= FRICTION;
            player.vy += GRAVITY;
            player.x += player.vx;
            player.y += player.vy;

            // Floor Collision
            player.grounded = false;
            for (let p of platforms) {
                if (player.vx >= 0 || player.vx <= 0) { // Simple collision logic
                    if (player.x + player.w > p.x && player.x < p.x + p.w &&
                        player.y + player.h > p.y && player.y + player.h < p.y + p.h + 10 &&
                        player.vy >= 0) {
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                    }
                }
            }

            // Record Position for Shadow
            history.push({ x: player.x, y: player.y, t: Date.now() });

            // Switch Logic (Player OR Shadow hits switch)
            // Find shadow pos from 2s ago
            const now = Date.now();
            const shadowPos = history.findLast(h => now - h.t <= SHADOW_DELAY_MS + 100 && now - h.t >= SHADOW_DELAY_MS - 100);
            // More robust: find first entry where time is approx T-2s
            let targetIdx = history.findIndex(h => (now - h.t) >= SHADOW_DELAY_MS);
            let sX = 0, sY = 0;
            if (targetIdx !== -1) {
                sX = history[targetIdx].x;
                sY = history[targetIdx].y;
            } else if (history.length > 0) {
                sX = history[0].x;
                sY = history[0].y;
            }

            const playerOnSwitch = checkCollision(player, switchTrigger);
            const shadowOnSwitch = checkCollision({x: sX, y: sY, w: 30, h: 45}, switchTrigger);
            
            if (playerOnSwitch || shadowOnSwitch) {
                switchTrigger.active = true;
                exitGate.isOpen = true;
            } else {
                switchTrigger.active = false;
                exitGate.isOpen = false;
            }

            // Win/Loss Conditions
            if (checkCollision(player, exitGate) && exitGate.isOpen) {
                endGame(true);
            }
            if (player.y > canvas.height) {
                endGame(false);
            }

            // Cleanup history
            while (history.length > 0 && history[0].t < now - 3000) {
                history.shift();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Platforms
            ctx.fillStyle = '#ddd';
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

            // Draw Pit Area (Visual cue)
            ctx.fillStyle = '#eee';
            ctx.fillRect(pit.x, pit.y, pit.w, pit.h);

            // Draw Switch
            ctx.fillStyle = switchTrigger.active ? '#a29bfe' : '#555';
            ctx.fillRect(switchTrigger.x, switchTrigger.y, switchTrigger.w, switchTrigger.h);

            // Draw Exit Gate
            ctx.fillStyle = exitGate.isOpen ? 'rgba(162, 155, 254, 0.3)' : '#555';
            ctx.fillRect(exitGate.x, exitGate.y, exitGate.w, exitGate.h);
            if(!exitGate.isOpen) {
               ctx.strokeStyle = '#555';
               ctx.strokeRect(exitGate.x, exitGate.y, exitGate.w, exitGate.h);
            }

            // Draw Shadow
            if (gameState === 'PLAYING' || gameState === 'WON' || gameState === 'LOST') {
                const now = Date.now();
                const targetT = now - SHADOW_DELAY_MS;
                // Find closest historical frame
                let bestFrame = null;
                let minDiff = Infinity;
                for (let h of history) {
                    let diff = Math.abs(h.t - targetT);
                    if (diff < minDiff) {
                        minDiff = diff;
                        bestFrame = h;
                    }
                }

                if (bestFrame) {
                    ctx.globalAlpha = 0.4;
                    ctx.fillStyle = '#a29bfe';
                    ctx.fillRect(bestFrame.x, bestFrame.y, player.w, player.h);
                    ctx.globalAlpha = 1.0;
                }
            }

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);
            // Eyes for player direction
            ctx.fillStyle = 'white';
            let eyeOffset = player.vx >= 0 ? 18 : 5;
            ctx.fillRect(player.x + eyeOffset, player.y + 10, 5, 5);
        }

        function gameLoop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        primaryBtn.addEventListener('click', start);
        resetBtn.addEventListener('click', reset);

        // Initialize
        init();

    </script>
</body>
</html>
