<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Gallery | Editorial Poster Archive</title>
    <style>
        :root {
            --bg: #f4f4f2;
            --fg: #1a1a1a;
            --accent: #e63946;
            --card-bg: #ffffff;
            --shadow: rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            color: var(--fg);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #app-container {
            width: 960px;
            height: 600px;
            background: var(--bg);
            position: relative;
            display: grid;
            grid-template-columns: 280px 1fr;
            border: 1px solid #ddd;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        /* Sidebar */
        aside {
            background: #eee;
            padding: 2rem 1.5rem;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        h1 { font-size: 1.5rem; letter-spacing: -1px; text-transform: uppercase; border-bottom: 3px solid var(--fg); padding-bottom: 5px; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        button {
            cursor: pointer;
            padding: 10px 15px;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        #btn-primary { background: var(--fg); color: white; width: 100%; }
        #btn-primary:hover { background: var(--accent); }
        #btn-reset { background: transparent; border: 1px solid #aaa; color: #666; width: 100%; font-size: 0.7rem; }
        #btn-reset:hover { border-color: var(--accent); color: var(--accent); }
        #status { font-size: 0.8rem; color: #666; font-style: italic; line-height: 1.4; }

        /* Main Content Area */
        main { position: relative; overflow: hidden; background: #fff; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 40px;
            height: 100%;
            overflow-y: auto;
        }
        .poster-thumb {
            aspect-ratio: 3/4;
            background: #ddd;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 4px 6px var(--shadow);
        }
        .poster-thumb:hover { transform: scale(1.05) translateY(-5px); z-index: 10; }
        
        /* Detail View Overlay */
        #detail-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 100;
            display: none; /* Controlled by JS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .canvas-container {
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            line-height: 0;
        }
        canvas { background: #fff; max-height: 70vh; width: auto; }
        .detail-info { margin-top: 20px; text-align: center; }
        .detail-info h2 { font-size: 2rem; text-transform: uppercase; margin-bottom: 5px; }
        .detail-info p { color: #666; font-family: serif; font-size: 1.1rem; }

        /* Responsive Small Preview Mode (simulated via container scaling if needed) */
        @media (max-width: 600px) {
            #app-container { transform: scale(0.5); transform-origin: top left; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <aside>
        <h1>Paper <br>Gallery</h1>
        <div class="controls">
            <button id="btn-primary" data-testid="primary-action">View Featured</button>
            <button id="btn-reset" data-testid="reset">Reset Gallery</button>
        </div>
        <div id="status" data-testid="status">Ready to browse. Select a piece to begin.</div>
    </aside>

    <main id="main-view">
        <!-- Grid items generated by JS -->
        <div class="gallery-grid" id="grid-container"></div>

        <!-- Fullscreen Detail View -->
        <div id="detail-overlay">
            <div class="canvas-container">
                <canvas id="poster-canvas"></canvas>
            </div>
            <div class="detail-info">
                <h2 id="detail-title">Poster Title</h2>
                <p id="detail-desc">Artistic Series Vol. 1</p>
            </div>
            <button id="close-detail" style="margin-top: 20px; background:#eee;" onclick="closeDetail()">Close View</button>
        </div>
    </main>
</div>

<script>
    /** STATE MANAGEMENT **/
    const state = {
        activeId: null,
        isViewing: false,
        posters: [
            { id: 1, title: "Monolith", color: "#e63946", accent: "#f1faee", shape: 'rect' },
            { id: 2, title: "Ethereal", color: "#457b9d", accent: "#a8dadc", shape: 'circle' },
            { id: 3, title: "Obsidian", color: "#1d3557", accent: "#f1faee", shape: 'triangle' },
            { id: 4, title: "Solaris", color: "#ffb703", accent: "#fb8500", shape: 'rect' },
            { id: 5, title: "Verdant", color: "#2a9d8f", accent: "#e9c46a", shape: 'circle' },
            { id: 6, title: "Crimson", color: "#ae2012", accent: "#ffffff", shape: 'triangle' }
        ]
    };

    /** DOM ELEMENTS **/
    const els = {
        grid: document.getElementById('grid-container'),
        status: document.getElementById('status'),
        primaryBtn: document.getElementById('btn-primary'),
        resetBtn: document.getElementById('btn-reset'),
        overlay: document.getElementById('detail-overlay'),
        canvas: document.getElementById('poster-canvas'),
        detTitle: document.getElementById('detail-title'),
        detDesc: document.getElementById('detail-desc')
    };

    const ctx = els.canvas.getContext('2d');

    /** CORE FUNCTIONS **/

    function init() {
        renderGrid();
        updateStatus("System Idle");
    }

    function renderGrid() {
        els.grid.innerHTML = '';
        state.posters.forEach(p => {
            const div = document.createElement('div');
            div.className = 'poster-thumb';
            div.onclick = () => openPoster(p.id);
            // Mini Canvas preview on thumb
            const miniCanvas = document.createElement('canvas');
            miniCanvas.width = 100;
            miniCanvas.height = 130;
            div.appendChild(miniCanvas);
            setTimeout(() => drawMiniPreview(miniCanvas, p), 10);
            els.grid.appendChild(div);
        });
    }

    function drawMiniPreview(cvs, poster) {
        const mctx = cvs.getContext('2d');
        mctx.fillStyle = '#fff';
        mctx.fillRect(0,0,100,130);
        mctx.fillStyle = poster.color;
        mctx.beginPath();
        if(poster.shape === 'rect') mctx.rect(20, 20, 60, 90);
        else if(poster.shape === 'circle') mctx.arc(50, 50, 35, 0, Math.PI * 2);
        else { // triangle
            mctx.moveTo(50, 15); mctx.lineTo(85, 85); mctx.lineTo(15, 85); mctx.closePath();
        }
        mctx.fill();
    }

    function openPoster(id) {
        const poster = state.posters.find(p => p.id === id);
        if(!poster) return;

        state.isViewing = true;
        state.activeId = id;
        
        els.detTitle.innerText = poster.title;
        els.detDesc.innerText = `Composition #${poster.id} • Digital Print`;
        els.overlay.style.display = 'flex';
        
        drawFullPoster(poster);
        updateStatus(`Viewing ${poster.title}`);
    }

    function closeDetail() {
        els.overlay.style.display = 'none';
        state.isViewing = false;
        state.activeId = null;
        updateStatus("Browsing mode active");
    }

    function drawFullPoster(poster) {
        // Set high res dimensions
        els.canvas.width = 400;
        els.canvas.height = 550;
        
        // Background
        ctx.fillStyle = poster.color;
        ctx.fillRect(0, 0, 400, 550);
        
        // Artistic Elements
        ctx.fillStyle = poster.accent;
        ctx.globalAlpha = 0.8;
        
        if(poster.shape === 'rect') {
            ctx.fillRect(50, 50, 300, 450);
        } else if(poster.shape === 'circle') {
            ctx.beginPath();
            ctx.arc(200, 275, 150, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.moveTo(200, 50);
            ctx.lineTo(350, 500);
            ctx.lineTo(50, 500);
            ctx.closePath();
            ctx.fill();
        }

        // Typography layer
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 40px serif';
        ctx.textAlign = 'center';
        ctx.fillText(poster.title.toUpperCase(), 200, 500);
        
        // Texture effect
        ctx.globalCompositeOperation = 'overlay';
        for(let i=0; i<100; i++) {
            ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.1})`;
            ctx.beginPath();
            ctx.arc(Math.random()*400, Math.random()*550, Math.random()*2, 0, Math.PI*2);
            ctx.fill();
        }
    }

    function updateStatus(msg) {
        els.status.innerText = msg;
    }

    function resetApp() {
        closeDetail();
        updateStatus("Gallery Restored");
        // Visual feedback for reset
        document.body.style.backgroundColor = '#fff';
        setTimeout(() => { document.body.style.backgroundColor = 'var(--bg)'; }, 200);
    }

    /** EVENT HANDLERS **/
    els.primaryBtn.addEventListener('click', () => {
        openPoster(state.posters[0].id);
    });

    els.resetBtn.addEventListener('click', resetApp);

    // Initialization
    window.onload = init;

</script>
</body>
</html>
