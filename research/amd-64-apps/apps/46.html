<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Archipelago</title>
    <style>
        :root {
            --bg: #f4f1ea; /* Cream Paper */
            --coast: #2c3e50; /* Dark Coastline */
            --text: #2c3e50;
            --ruby: #e74c3c;
            --emerald: #2ecc71;
            --sapphire: #3498db;
            --topaz: #f1c40f;
            --amethyst: #9b59b6;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text);
        }
        #app-container {
            width: 960px;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            max-height: 600px;
            display: flex;
            flex-direction: row;
            gap: 30px;
            padding: 20px;
            box-sizing: border-box;
        }
        @media (max-width: 960px) {
            #app-container { flex-direction: column; aspect-ratio: auto; height: auto; }
        }
        #game-board {
            position: relative;
            background: var(--coast);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        canvas {
            display: block;
            background: transparent;
        }
        #ui-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 250px;
        }
        .stats {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #status {
            font-size: 0.9rem;
            font-style: italic;
            margin-bottom: 20px;
            color: #555;
        }
        .palette {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .color-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .color-btn:active { transform: scale(0.9); }
        .controls {
            display: flex;
            gap: 10px;
        }
        button.main-btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button[data-testid="primary-action"] { background: var(--coast); color: white; }
        button[data-testid="reset"] { background: #bdc3c7; color: var(--text); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Colors */
        .c-0 { background-color: var(--ruby); }
        .c-1 { background-color: var(--emerald); }
        .c-2 { background-color: var(--sapphire); }
        .c-3 { background-color: var(--topaz); }
        .c-4 { background-color: var(--amethyst); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="game-board">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="ui-panel">
        <div>
            <div class="stats" id="move-counter">Moves Left: 22</div>
            <div id="status" data-testid="status">Ready to sail?</div>
        </div>

        <div class="palette" id="palette-container">
            <!-- Buttons generated by JS -->
        </div>

        <div class="controls">
            <button id="startBtn" class="main-btn" data-testid="primary-action">Start Game</button>
            <button id="resetBtn" class="main-btn" data-testid="reset">Reset</button>
        </div>
    </div>
</div>

<script>
/**
 * INK ARCHIPELAGO - GAME LOGIC
 */
const CONFIG = {
    gridSize: 8,
    cellSize: 60,
    colors: ['#e74c3c', '#2ecc71', '#3498db', '#f1c40f', '#9b59b6'], // Ruby, Emerald, Sapphire, Topaz, Amethyst
    maxMoves: 22
};

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.statusEl = document.querySelector('[data-testid="status"]');
        this.movesEl = document.getElementById('move-counter');
        this.paletteContainer = document.getElementById('palette-container');
        this.startBtn = document.getElementById('startBtn');
        this.resetBtn = document.getElementById('resetBtn');

        this.grid = [];
        this.ownedColorIdx = 0;
        this.movesLeft = 0;
        this.isGameOver = false;
        this.isPlaying = false;
        this.animationQueue = [];

        this.init();
    }

    init() {
        this.canvas.width = CONFIG.gridSize * CONFIG.cellSize;
        this.canvas.height = CONFIG.gridSize * CONFIG.cellSize;
        this.createPalette();
        this.setupEvents();
        this.reset();
    }

    createPalette() {
        CONFIG.colors.forEach((_, i) => {
            const btn = document.createElement('button');
            btn.className = `color-btn c-${i}`;
            btn.dataset.colorIdx = i;
            btn.addEventListener('click', () => this.handleMove(i));
            this.paletteContainer.appendChild(btn);
        });
    }

    generateBoard() {
        // Seeded random logic for consistent "solvable" feeling boards
        let seed = 42;
        const rand = () => {
            seed = (seed * 16807) % 2147483624;
            return seed / 2147483624;
        };

        this.grid = Array(CONFIG.gridSize).fill().map(() => 
            Array(CONFIG.gridSize).fill().map(() => Math.floor(rand() * 5))
        );
        // Ensure start node matches first move potential
        this.ownedColorIdx = this.grid[0][0];
    }

    reset() {
        this.stopAnimations();
        this.generateBoard();
        this.ownedColorIdx = this.grid[0][0];
        this.movesLeft = CONFIG.maxMoves;
        this.isGameOver = false;
        this.isPlaying = false;
        this.updateUI("Awaiting command.");
        this.render();
    }

    start() {
        this.isPlaying = true;
        this.isGameOver = false;
        this.movesLeft = CONFIG.maxMoves;
        this.updateUI("Sailing started...");
        this.render();
    }

    stopAnimations() {
        this.animationQueue = [];
    }

    updateUI(msg) {
        if (this.statusEl) this.statusEl.textContent = msg;
        if (this.movesEl) this.movesEl.textContent = `Moves Left: ${this.movesLeft}`;
    }

    handleMove(targetColorIdx) {
        if (!this.isPlaying || this.isGameOver) return;
        if (targetColorIdx === this.ownedColorIdx) return;

        this.movesLeft--;
        this.executeFloodFill(targetColorIdx);
        this.checkWinCondition();
        this.render();
    }

    executeFloodFill(targetColorIdx) {
        const targetOldColor = this.ownedColorIdx;
        const queue = [[0, 0]]; // We always expand from the origin of ownership
        // Actually we need to find the existing contiguous component of the CURRENT color
        // but since the player chooses a NEW color, they absorb neighbors.
        // Standard Flood Fill rules: Find all connected cells of SAME color as current owner's territory.
        
        const visited = new Set();
        const q = [];
        
        // Find all cells currently part of the "owner" group
        const findOwned = (r, c) => {
            const key = `${r},${c}`;
            if (r < 0 || r >= CONFIG.gridSize || c < 0 || c >= CONFIG.gridSize) return;
            if (visited.has(key)) return;
            if (this.grid[r][c] !== this.ownedColorIdx) return;
            
            visited.add(key);
            q.push([r, c]);
            findOwned(r + 1, c);
            findOwned(r - 1, c);
            findOwned(r, c + 1);
            findOwned(r, c - 1);
        };
        
        // In our specific version, the user selects a color that is ADJACENT to their mass
        // Let's find any cell belonging to the current mass to start expansion
        // But simpler: User clicks a color. If that color is adjacent to ANY cell of current mass,
        // then ALL cells of THAT color that touch the mass become part of the mass.
        
        // Correct interpretation: All cells of Target Color that are adjacent to Current Mass join the mass.
        // This can trigger chain reactions if multiple colors are joined.
        // To simplify & match standard mechanics: The user picks a color, and all cells of that color 
        // connected to the current cluster merge into the cluster.
        
        const frontier = [];
        const seenInMass = new Set();
        const stack = [];

        // 1. Identify current mass
        const identifyMass = (r, c) => {
            const k = `${r},${c}`;
            if (r<0||r>=CONFIG.gridSize||c<0||c>=CONFIG.gridSize||seenInMass.has(k)||this.grid[r][c]!==this.ownedColorIdx) return;
            seenInMass.add(k);
            stack.push([r, c]);
            identifyMass(r+1, c); identifyMass(r-1, c);
            identifyMass(r, c+1); identifyMass(r, c-1);
        };
        identifyMass(0,0);

        // 2. Expand to target color
        const expansionStack = [...stack];
        const expandedSet = new Set(stack.map(p => `${p[0]},${p[1]}`));
        const finalColors = new Set(stack.map(p => `${p[0]},${p[1]}`));

        while(expansionStack.length > 0) {
            const [r, c] = expansionStack.pop();
            [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr, dc]) => {
                const nr = r + dr, nc = c + dc;
                const nk = `${nr},${nc}`;
                if (nr>=0 && nr<CONFIG.gridSize && nc>=0 && nc<CONFIG.gridSize && !expandedSet.has(nk)) {
                    if (this.grid[nr][nc] === targetColorIdx) {
                        expandedSet.add(nk);
                        finalColors.add(nk);
                        expansionStack.push([nr, nc]);
                    } else if (this.grid[nr][nc] === this.ownedColorIdx) {
                        // Already part of mass, just ensure it's marked
                        // handled by being in stack initially
                    }
                }
            });
        }

        // 3. Apply Change
        for (let coord of finalColors) {
            const [fr, fc] = coord.split(',').map(Number);
            this.grid[fr][fc] = targetColorIdx;
        }
        this.ownedColorIdx = targetColorIdx;

        // Animation effect
        this.animateExpansion();
    }

    animateExpansion() {
        // Simple flash animation logic could go here, but for brevity, 
        // we rely on the immediate render change which feels snappy.
    }

    checkWinCondition() {
        let count = 0;
        for(let r=0; r<CONFIG.gridSize; r++) {
            for(let c=0; c<CONFIG.gridSize; c++) {
                if(this.grid[r][c] === this.ownedColorIdx) count++;
            }
        }

        if (count === CONFIG.gridSize * CONFIG.gridSize) {
            this.isGameOver = true;
            this.isPlaying = false;
            this.updateUI("VICTORY! You conquered the archipelago!");
        } else if (this.movesLeft <= 0) {
            this.isGameOver = true;
            this.isPlaying = false;
            this.updateUI("DEFEAT! The tide has taken you.");
        } else {
            this.updateUI(`Surviving...`);
        }
    }

    render() {
        const ctx = this.ctx;
        const s = CONFIG.cellSize;

        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        for (let r = 0; r < CONFIG.gridSize; r++) {
            for (let c = 0; c < CONFIG.gridSize; c++) {
                const colorIdx = this.grid[r][c];
                ctx.fillStyle = CONFIG.colors[colorIdx];
                ctx.fillRect(c * s + 2, r * s + 2, s - 4, s - 4);
                
                // Draw subtle borders for tiles
                ctx.strokeStyle = 'rgba(0,0,0,0.05)';
                ctx.strokeRect(c * s + 2, r * s + 2, s - 4, s - 4);
            }
        }

        // Highlight Owned Region Outline
        this.drawOwnershipOutline();
    }

    drawOwnershipOutline() {
        const ctx = this.ctx;
        const s = CONFIG.cellSize;
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 4;
        ctx.setLineDash([5, 5]);

        // Calculate boundary of owned cells
        const points = [];
        for (let r = 0; r < CONFIG.gridSize; r++) {
            for (let c = 0; c < CONFIG.gridSize; c++) {
                if (this.grid[r][c] === this.ownedColorIdx) {
                    // Add corners for each cell to form a polygon path
                    points.push({x: c*s+2, y: r*s+2});
                    points.push({x: (c+1)*s-2, y: r*s+2});
                    points.push({x: (c+1)*s-2, y: (r+1)*s-2});
                    points.push({x: c*s+2, y: (r+1)*s-2});
                }
            }
        }

        // Note: A complex contour algorithm would be needed for perfect outlines.
        // Here we draw a simplified highlight for owned cells to represent the "region".
        ctx.setLineDash([]);
        for (let r = 0; r < CONFIG.gridSize; r++) {
            for (let c = 0; c < CONFIG.gridSize; c++) {
                if (this.grid[r][c] === this.ownedColorIdx) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(c * s + 5, r * s + 5, s - 10, s - 10);
                }
            }
        }
    }

    setupEvents() {
        this.startBtn.addEventListener('click', () => {
            this.start();
            this.updateUI("The voyage begins...");
        });
        this.resetBtn.addEventListener('click', () => this.reset());
    }
}

// Initialize App
window.addEventListener('DOMContentLoaded', () => {
    new Game();
});
</script>
</body>
</html>
