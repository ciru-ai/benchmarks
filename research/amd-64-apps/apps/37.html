<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ring Runner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a12;
            color: #e0e0ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: auto;
        }

        #toolbar {
            width: 960px;
            max-width: 95vw;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            background: linear-gradient(to bottom, #1a1a2e, #0f0f1a);
            border: 1px solid #333;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            padding: 6px 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        #primaryBtn {
            background-color: #ff8c00;
            color: #ffffff;
        }

        #resetBtn {
            background-color: #444;
            color: #ccc;
        }

        #status {
            font-size: 14px;
            letter-spacing: 1px;
            color: #aaa;
        }

        #gameContainer {
            position: relative;
            width: 960px;
            height: min(600px, calc(100vh - 115px));
            background: radial-gradient(circle at center, #1b1b3d 0%, #05050a 100%);
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 15px;
            color: #666;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <div class="controls">
            <button id="primaryBtn" data-testid="primary-action">Play</button>
            <button id="resetBtn" data-testid="reset">Reset</button>
        </div>
        <div id="status" data-testid="status">READY</div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="instructions">A / D or LEFT / RIGHT to rotate • Avoid orange ring segments</div>

    <script>
        /**
         * RING RUNNER - GAME LOGIC
         */

        const state = {
            running: false,
            score: 0,
            targetScore: 25,
            gameOver: false,
            lastTime: 0,
            elapsedTime: 0,
            speedMultiplier: 1.0,
            satelliteAngle: 0,
            rings: [],
            stars: []
        };

        const config = {
            orbitRadius: 120,
            satelliteSize: 6,
            ringGapWidth: Math.PI * 0.5, // Size of the safe opening
            starCount: 100,
            baseSpeed: 120, // Pixels per second (radial)
            collisionMargin: 10 // Tolerance for hit detection
        };

        const dom = {
            canvas: document.getElementById('gameCanvas'),
            ctx: document.getElementById('gameCanvas').getContext('2d'),
            primaryBtn: document.getElementById('primaryBtn'),
            resetBtn: document.getElementById('resetBtn'),
            status: document.getElementById('status')
        };

        let keys = {};
        let animationFrameId = null;

        // --- Initialization ---

        function init() {
            dom.canvas.width = 960;
            dom.canvas.height = 600;
            setupStars();
            spawnInitialRings();
            render();
        }

        function setupStars() {
            state.stars = [];
            for (let i = 0; i < config.starCount; i++) {
                state.stars.push({
                    x: Math.random() * dom.canvas.width,
                    y: Math.random() * dom.canvas.height,
                    r: Math.random() * 1.5,
                    opacity: Math.random(),
                    speed: 0.001 + Math.random() * 0.005
                });
            }
        }

        function spawnInitialRings() {
            state.rings = [];
            state.score = 0;
            state.speedMultiplier = 1.0;
            // Spawn upcoming rings spread out along the Z-axis (approaching distance)
            for (let i = 0; i < 30; i++) {
                createRing(i * 400 + 700);
            }
        }

        function createRing(distZ) {
            // Angle where the gap is located
            const gapCenter = Math.random() * Math.PI * 2;
            state.rings.push({
                z: distZ, // Distance from player orbit plane (virtual depth)
                gapCenter: gapCenter,
                thickness: 15,
                active: true
            });
        }

        // --- Core Logic ---

        function update(dt) {
            if (!state.running || state.gameOver) return;

            // Increase difficulty over time
            state.speedMultiplier += dt * 0.01;

            // Rotate Satellite
            const rotationSpeed = 3.5;
            if (keys['ArrowLeft'] || keys['a']) state.satelliteAngle -= rotationSpeed * dt;
            if (keys['ArrowRight'] || keys['d']) state.satelliteAngle += rotationSpeed * dt;

            // Normalize angle
            state.satelliteAngle %= Math.PI * 2;

            // Move Rings
            state.rings.forEach(ring => {
                ring.z -= config.baseSpeed * state.speedMultiplier * dt;

                // Collision Check: When ring reaches the orbit plane (z approx 0)
                if (ring.z <= 5 && ring.z >= -5) {
                    // Calculate angular difference between satellite and gap
                    let diff = Math.abs((state.satelliteAngle % (Math.PI * 2)) - (ring.gapCenter % (Math.PI * 2)));
                    if (diff > Math.PI) diff = Math.PI * 2 - diff;

                    // If not in gap, collision!
                    if (diff > config.ringGapWidth / 2) {
                        endGame(false);
                    } else {
                        // Passed successfully
                        if (!ring.passed) {
                            ring.passed = true;
                            state.score++;
                            updateStatus(`SCORE: ${state.score}`);
                            if (state.score >= state.targetScore) endGame(true);
                        }
                    }
                }

                // Recycle ring if it passes through
                if (ring.z < -50) {
                    ring.z = 1000;
                    ring.gapCenter = Math.random() * Math.PI * 2;
                    ring.passed = false;
                }
            });
        }

        function endGame(win) {
            state.running = false;
            state.gameOver = true;
            cancelAnimationFrame(animationFrameId);
            updateStatus(win ? "VICTORY!" : "CRASHED!");
            dom.primaryBtn.textContent = win ? "REPLAY" : "TRY AGAIN";
        }

        function updateStatus(msg) {
            dom.status.textContent = msg;
        }

        // --- Rendering ---

        function render() {
            const ctx = dom.ctx;
            const w = dom.canvas.width;
            const h = dom.canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            ctx.clearRect(0, 0, w, h);

            // 1. Draw Stars (Background)
            ctx.fillStyle = '#fff';
            state.stars.forEach(s => {
                s.opacity += s.speed;
                if (s.opacity > 1 || s.opacity < 0.1) s.speed *= -1;
                ctx.globalAlpha = Math.max(0.1, Math.min(1, s.opacity));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // 2. Draw UV Tunnel Effect (Subtle Radial Gradient)
            const grad = ctx.createRadialGradient(cx, cy, 50, cx, cy, 400);
            grad.addColorStop(0, '#1a1a3d');
            grad.addColorStop(1, '#05050a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // 3. Draw Rings (Back to Front based on Z)
            // Sort rings by Z descending (further away first)
            const sortedRings = [...state.rings].sort((a, b) => b.z - a.z);

            sortedRings.forEach(ring => {
                // Project 3D z to 2D size/alpha
                const scale = Math.max(0, 1 - (ring.z / 1000));
                const radius = config.orbitRadius * scale;
                const alpha = Math.min(1, (1000 - ring.z) / 500);

                if (ring.z < 1000 && ring.z > -100) {
                    drawRingSegment(ctx, cx, cy, ring, radius, alpha);
                }
            });

            // 4. Draw Orbit Path (The line the satellite follows)
            ctx.beginPath();
            ctx.arc(cx, cy, config.orbitRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // 5. Draw Satellite
            const satX = cx + Math.cos(state.satelliteAngle) * config.orbitRadius;
            const satY = cy + Math.sin(state.satelliteAngle) * config.orbitRadius;

            // Trail effect
            ctx.beginPath();
            ctx.moveTo(satX, satY);
            ctx.lineTo(cx, cy); // simple trail logic would require history, keeping it simple
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.stroke();

            // The White Satellite
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#fff";
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(satX, satY, config.satelliteSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 6. Next Gap Arrow
            // Find the nearest incoming ring to show target
            const nextRing = state.rings.find(r => r.z > 0);
            if (nextRing && !state.gameOver) {
                const ax = cx + Math.cos(nextRing.gapCenter) * (config.orbitRadius + 20);
                const ay = cy + Math.sin(nextRing.gapCenter) * (config.orbitRadius + 20);
                ctx.strokeStyle = "#ff8c00";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ax, ay);
                ctx.lineTo(cx + Math.cos(nextRing.gapCenter) * (config.orbitRadius + 5), cy + Math.sin(nextRing.gapCenter) * (config.orbitRadius + 5));
                ctx.stroke();
            }

            requestAnimationFrame(loop);
        }

        function drawRingSegment(ctx, cx, cy, ring, radius, alpha) {
            const startAngle = ring.gapCenter - (config.ringGapWidth / 2);
            const endAngle = ring.gapCenter + (config.ringGapWidth / 2);

            // Outer Segment (Orange)
            ctx.beginPath();
            ctx.arc(cx, cy, radius, endAngle, startAngle + Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 140, 0, ${alpha})`;
            ctx.lineWidth = ring.thickness;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Inner glow segment
            ctx.beginPath();
            ctx.arc(cx, cy, radius, endAngle, startAngle + Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 140, 0, ${alpha * 0.3})`;
            ctx.lineWidth = ring.thickness * 2;
            ctx.stroke();
        }

        function loop(timestamp) {
            const deltaTime = Math.min((timestamp - state.lastTime) / 1000, 0.1);
            state.lastTime = timestamp;

            update(deltaTime);
            render();
        }

        // --- Input Handlers ---

        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            // Prevent scrolling with arrows
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
        });
        window.addEventListener('keyup', e => {
            keys[e.key] = false;
        });

        dom.primaryBtn.addEventListener('click', () => {
            if (!state.running && !state.gameOver) {
                start();
            } else if (state.gameOver) {
                reset();
                start();
            }
        });

        dom.resetBtn.addEventListener('click', reset);

        function start() {
            state.running = true;
            state.gameOver = false;
            state.lastTime = performance.now();
            dom.primaryBtn.textContent = "PAUSE";
            updateStatus("RUNNING");
            // We don't call requestAnimationFrame here because loop is already running via initialization
        }

        function reset() {
            cancelAnimationFrame(animationFrameId);
            state.running = false;
            state.gameOver = false;
            state.score = 0;
            state.satelliteAngle = 0;
            dom.primaryBtn.textContent = "Play";
            updateStatus("READY");
            spawnInitialRings();
            render();
        }

        // Entry Point
        init();

    </script>
</body>
</html>
