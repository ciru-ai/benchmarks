<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Deck | Session Planner</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 960px;
            height: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: 300px 1fr;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
            position: relative;
        }

        header {
            grid-column: 1 / span 2;
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.5rem; letter-spacing: -0.025em; color: var(--accent); }

        /* Sidebar Controls */
        aside {
            grid-row: 2 / span 2;
            padding: 20px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }

        select, input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        button {
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s ease;
            border: none;
            text-align: center;
        }

        #primaryBtn { background: var(--accent); color: var(--bg); width: 100%; }
        #primaryBtn:hover { background: var(--accent-hover); transform: translateY(-1px); }

        #resetBtn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); width: 100%; font-size: 0.8rem; }
        #resetBtn:hover { border-color: var(--danger); color: var(--danger); }

        /* Main Content Area */
        main {
            padding: 20px 30px;
            overflow-y: auto;
            position: relative;
        }

        .deck-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .exercise-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            padding: 12px 16px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            align-items: center;
            gap: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .ex-info h3 { font-size: 1rem; margin-bottom: 2px; }
        .ex-stats { display: flex; gap: 10px; align-items: baseline; }
        .stat-val { font-weight: bold; color: var(--accent); }
        .stat-lbl { font-size: 0.75rem; color: var(--text-muted); }

        .btn-remove { color: var(--danger); background: none; padding: 4px 8px; font-size: 0.8rem; }
        .btn-move { color: var(--text-muted); background: none; padding: 4px 8px; }
        .btn-move:hover { color: var(--text-gradient); }

        /* Footer Status Bar */
        footer {
            grid-column: 2;
            padding: 10px 30px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.1);
        }

        #timerDisplay { font-family: monospace; font-size: 1.4rem; color: var(--accent); }
        #status { font-size: 0.85rem; color: var(--text-muted); }

        /* Empty State */
        .empty-msg {
            text-align: center;
            margin-top: 60px;
            color: var(--text-muted);
            font-style: italic;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            <h1>WORKOUT DECK</h1>
            <div id="timerContainer">
                <span id="timerDisplay">00:00</span>
            </div>
        </header>

        <aside>
            <div class="control-group">
                <label for="exSelect">Exercise Template</label>
                <select id="exSelect"></select>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="control-group">
                    <label for="setInput">Sets</label>
                    <input type="number" id="setInput" value="3" min="1" max="12">
                </div>
                <div class="control-group">
                    <label for="repInput">Reps</label>
                    <input type="number" id="repInput" value="10" min="1" max="100">
                </div>
            </div>
            <button id="primaryBtn" data-testid="primary-action">Add Exercise</button>
            <hr style="border: 0; border-top: 1px solid var(--border); width: 100%;">
            <button id="resetBtn" data-testid="reset">Reset Session</button>
        </aside>

        <main>
            <div id="deckList" class="deck-list">
                <!-- Exercises injected here -->
            </div>
            <div id="emptyMsg" class="empty-msg">No exercises added to deck yet. Start your session!</div>
        </main>

        <footer>
            <div id="status" data-testid="status">Status: Idle</div>
            <div id="sessionStats" style="font-size: 0.8rem; color: var(--text-muted);">Total Volume: <span id="totalVol">0</span>kg</div>
        </footer>
    </div>

    <script>
        // --- INITIALIZATION & DATA ---
        const EXERCISE_TEMPLATES = [
            { id: 'ex1', name: 'Barbell Squat', weight: 80 },
            { id: 'ex2', name: 'Bench Press', weight: 60 },
            { id: 'ex3', name: 'Deadlift', weight: 100 },
            { id: 'ex4', name: 'Overhead Press', weight: 40 },
            { id: 'ex5', name: 'Pull Ups', weight: 0 }, // Weight is load if applicable
            { id: 'ex6', name: 'Bicep Curls', weight: 15 }
        ];

        let state = {
            workoutDeck: [],
            secondsElapsed: 0,
            timerInterval: null,
            isTimerRunning: false
        };

        // --- DOM BINDING ---
        const dom = {
            exSelect: document.getElementById('exSelect'),
            setInput: document.getElementById('setInput'),
            repInput: document.getElementById('repInput'),
            primaryBtn: document.getElementById('primaryBtn'),
            resetBtn: document.getElementById('resetBtn'),
            deckList: document.getElementById('deckList'),
            emptyMsg: document.getElementById('emptyMsg'),
            status: document.getElementById('status'),
            timerDisplay: document.getElementById('timerDisplay'),
            totalVol: document.getElementById('totalVol')
        };

        // --- CORE LOGIC ---

        function init() {
            // Populate Select
            EXERCISE_TEMPLATES.forEach(ex => {
                const opt = document.createElement('option');
                opt.value = ex.id;
                opt.textContent = `${ex.name}`;
                dom.exSelect.appendChild(opt);
            });

            // Event Listeners
            dom.primaryBtn.addEventListener('click', handleAddExercise);
            dom.resetBtn.addEventListener('click', handleReset);
            
            render();
        }

        function handleAddExercise() {
            const templateId = dom.exSelect.value;
            const template = EXERCISE_TEMPLATES.find(t => t.id === templateId);
            const sets = parseInt(dom.setInput.value) || 0;
            const reps = parseInt(dom.repInput.value) || 0;

            if (sets <= 0 || reps <= 0) return;

            const newEntry = {
                uid: Date.now(), // unique instance id
                name: template.name,
                baseWeight: template.weight,
                sets: sets,
                reps: reps
            };

            state.workoutDeck.push(newEntry);
            startTimer();
            updateStatus(`Added ${newEntry.name}`);
            render();
        }

        function handleRemove(uid) {
            state.workoutDeck = state.workoutDeck.filter(item => item.uid !== uid);
            if (state.workoutDeck.length === 0) stopTimer();
            updateStatus("Exercise removed");
            render();
        }

        function moveItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= state.workoutDeck.length) return;
            
            const temp = state.workoutDeck[index];
            state.workoutDeck[index] = state.workoutDeck[newIndex];
            state.workoutDeck[newIndex] = temp;
            
            render();
        }

        function handleReset() {
            stopTimer();
            state.workoutDeck = [];
            state.secondsElapsed = 0;
            updateStatus("Session reset");
            render();
        }

        // Timer Logic
        function startTimer() {
            if (state.isTimerRunning) return;
            state.isTimerRunning = true;
            state.timerInterval = setInterval(() => {
                state.secondsElapsed++;
                updateTimerUI();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(state.timerInterval);
            state.isTimerRunning = false;
        }

        function updateTimerUI() {
            const mins = Math.floor(state.secondsElapsed / 60);
            const secs = state.secondsElapsed % 60;
            dom.timerDisplay.textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateStatus(msg) {
            dom.status.textContent = `Status: ${msg}`;
        }

        // Rendering Engine
        function render() {
            // Clear list
            dom.deckList.innerHTML = '';
            
            // Toggle empty message
            dom.emptyMsg.style.display = state.workoutDeck.length === 0 ? 'block' : 'none';

            let totalVolumeAccumulated = 0;

            state.workoutDeck.forEach((item, index) => {
                const vol = item.sets * item.reps * item.baseWeight;
                totalVolumeAccumulated += vol;

                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.innerHTML = `
                    <div class="ex-info">
                        <h3>${item.name}</h3>
                        <div class="ex-stats">
                            <span><span class="stat-val">${item.sets}</span> <span class="stat-lbl">SETS</span></span>
                            <span><span class="stat-val">${item.reps}</span> <span class="stat-lbl">REPS</span></span>
                            <span><span class="stat-val">${item.baseWeight}</span> <span class="stat-lbl">KG</span></span>
                        </div>
                    </div>
                    <div>
                        <button class="btn-move" data-idx="${index}" data-dir="-1">↑</button>
                        <button class="btn-move" data-idx="${index}" data-dir="1">↓</button>
                    </div>
                    <div>
                        <button class="btn-remove" data-uid="${item.uid}">Remove</button>
                    </div>
                `;

                // Attach local event listeners to newly created buttons
                card.querySelector('[data-dir="-1"]').addEventListener('click', () => moveItem(index, -1));
                card.querySelector('[data-dir="1"]').addEventListener('click', () => moveItem(index, 1));
                card.querySelector('.btn-remove').addEventListener('click', () => handleRemove(item.uid));

                dom.deckList.appendChild(card);
            });

            dom.totalVol.textContent = totalVolumeAccumulated.toLocaleString();
            updateTimerUI();
        }

        // Boot App
        init();

    </script>
</body>
</html>
