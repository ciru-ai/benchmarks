<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Studio | Architecture Portfolio</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }
        #app-container {
            width: 100%;
            max-width: 960px;
            min-height: 600px;
            background: #111827;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 2rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 1.5rem; letter-spacing: -0.05em; color: var(--accent); }
        .controls { display: flex; gap: 10px; align-items: center; }
        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }
        [data-testid="primary-action"] { background: var(--accent); color: var(--bg); }
        [data-testid="primary-action"]:hover { transform: translateY(-2px); filter: brightness(1.1); }
        [data-testid="reset"] { background: transparent; border: 1px solid #475569; color: var(--text-dim); }
        [data-testid="reset"]:hover { background: #ef4444; color: white; border-color: #ef4444; }
        
        #status { font-size: 0.85rem; color: var(--text-dim); font-style: italic; }

        .filter-bar {
            padding: 1rem 2rem;
            display: flex;
            gap: 10px;
            background: #1e293b44;
        }
        .filter-btn {
            background: none;
            border: 1px solid #334155;
            color: var(--text-dim);
            font-size: 0.8rem;
            padding: 4px 12px;
        }
        .filter-btn.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            padding: 2rem;
            flex-grow: 1;
        }
        .project-card {
            background: var(--card);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .project-card:hover { transform: scale(1.03); border-color: var(--accent); }
        .card-img { width: 100%; height: 160px; background: #0f172a; }
        .card-info { padding: 1rem; }
        .card-info h3 { font-size: 1rem; margin-bottom: 4px; }
        .card-info p { font-size: 0.8rem; color: var(--text-dim); }

        /* Detail Overlay */
        #detail-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 3rem;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .close-detail { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 2rem; }
        .detail-content { max-width: 700px; margin: auto; }
        .detail-hero { width: 100%; height: 300px; margin-bottom: 2rem; border-radius: 8px; }

        @media (max-width: 600px) {
            header { flex-direction: column; gap: 1rem; text-align: center; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <div>
            <h1>NORTHSTAR <span style="font-weight: 300;">STUDIO</span></h1>
            <div id="status" data-testid="status">Viewing All Projects</div>
        </div>
        <div class="controls">
            <button id="primaryBtn" data-testid="primary-action">View Featured Project</button>
            <button id="resetBtn" data-testid="reset">Reset View</button>
        </div>
    </header>

    <nav class="filter-bar">
        <button class="filter-btn active" onclick="app.filter('all')">All</button>
        <button class="filter-btn" onclick="app.filter('Residential')">Residential</button>
        <button class="filter-btn" onclick="app.filter('Commercial')">Commercial</button>
        <button class="filter-btn" onclick="app.filter('Public')">Public</button>
    </nav>

    <main class="grid" id="projectGrid"></main>

    <div id="detail-overlay">
        <span class="close-detail" onclick="app.closeDetail()">&times;</span>
        <div class="detail-content" id="detailContent">
            <!-- Dynamic Content -->
        </div>
    </div>
</div>

<script>
const app = (() => {
    const projects = [
        { id: 1, title: "The Obsidian House", type: "Residential", desc: "A minimalist sanctuary carved into basalt cliffs.", color: "#334155" },
        { id: 2, title: "Nexus Plaza", type: "Commercial", desc: "High-density glass structure for urban centers.", color: "#0ea5e9" },
        { id: 3, title: "Elysium Pavilion", type: "Public", desc: "Open-air community hub using timber lattices.", color: "#10b981" },
        { id: 4, title: "Void Loft", type: "Residential", desc: "Industrial loft conversion with brutalist themes.", color: "#64748b" },
        { id: 5, title: "Sky Bridge Office", type: "Commercial", desc: "Floating workspace suspended between towers.", color: "#8b5cf6" },
        { id: 6, title: "Zenith Library", type: "Public", desc: "Curvilinear geometry focused on light diffusion.", color: "#f59e0b" }
    ];

    let currentState = {
        viewingProject: null,
        filter: 'all'
    };

    const elements = {
        grid: document.getElementById('projectGrid'),
        status: document.querySelector('[data-testid="status"]'),
        primary: document.getElementById('primaryBtn'),
        reset: document.getElementById('resetBtn'),
        overlay: document.getElementById('detail-overlay'),
        detailContent: document.getElementById('detailContent')
    };

    function createSvgIcon(color) {
        return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="${color}" fill-opacity="0.2"/><path d="M10 80 L50 20 L90 80 Z" stroke="${color}" stroke-width="4" fill="none"/><path d="M30 80 L70 80 M50 20 L50 80" stroke="${color}" stroke-width="2" stroke-dasharray="4"/></svg>`;
    }

    function render() {
        elements.grid.innerHTML = '';
        projects.forEach(p => {
            if (currentState.filter !== 'all' && p.type !== currentState.filter) return;
            
            const card = document.createElement('div');
            card.className = 'project-card';
            card.onclick = () => openDetail(p);
            card.innerHTML = `
                <div class="card-img">${createSvgIcon(p.color)}</div>
                <div class="card-info">
                    <h3>${p.title}</h3>
                    <p>${p.type}</p>
                </div>
            `;
            elements.grid.appendChild(card);
        });
    }

    function openDetail(project) {
        currentState.viewingProject = project;
        elements.overlay.style.display = 'flex';
        elements.detailContent.innerHTML = `
            <div class="detail-hero">${createSvgIcon(project.color)}</div>
            <h2>${project.title}</h2>
            <p style="color: var(--accent); margin-bottom: 1rem;">${project.type} Design Concept</p>
            <p style="line-height: 1.6; color: var(--text-dim);">${project.desc} This architectural study explores the intersection of materiality and spatial volume, utilizing advanced parametric modeling to optimize solar gain and structural integrity.</p>
            <br><br>
            <canvas id="detailCanvas" width="400" height="100" style="border: 1px solid #334155; border-radius: 4px;"></canvas>
        `;
        updateStatus(`Inspecting ${project.title}`);
        drawPattern();
    }

    function drawPattern() {
        const canvas = document.getElementById('detailCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1;
        for(let i=0; i<400; i+=20) {
            for(let j=0; j<100; j+=20) {
                ctx.strokeRect(i, j, 15, 15);
            }
        }
    }

    function closeDetail() {
        elements.overlay.style.display = 'none';
        currentState.viewingProject = null;
        render();
        updateStatus(currentState.filter === 'all' ? 'Browsing Gallery' : `Filtering by ${currentState.filter}`);
    }

    function filter(category) {
        currentState.filter = category;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === category || (category === 'all' && btn.innerText === 'All'));
        });
        render();
        updateStatus(currentState.filter === 'all' ? 'Browsing Gallery' : `Filtering by ${currentState.filter}`);
    }

    function updateStatus(msg) {
        elements.status.textContent = msg;
    }

    function init() {
        // Event Listeners
        elements.primary.addEventListener('click', () => {
            openDetail(projects[0]);
        });

        elements.reset.addEventListener('click', () => {
            currentState = { viewingProject: null, filter: 'all' };
            closeDetail();
            filter('all');
        });

        render();
    }

    return { init, filter, closeDetail };
})();

window.onload = app.init;
</script>
</body>
</html>
