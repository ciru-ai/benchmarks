<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Pocket</title>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --text: #1e293b;
            --accent: #4f46e5;
            --border: #e2e8f0;
            --code-bg: #f1f5f9;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #app-container {
            width: 960px;
            height: 600px;
            background: var(--panel);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        @media (max-width: 768px) {
            #app-container { width: 100vw; height: 100vh; grid-template-columns: 1fr; }
        }
        .pane {
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow: hidden;
        }
        .editor-pane { border-right: 1px solid var(--border); }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { font-size: 1.2rem; margin: 0; color: var(--accent); }
        textarea {
            flex-grow: 1;
            resize: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
        }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1); }
        .preview-pane { background: #fff; overflow-y: auto; }
        .controls { display: flex; gap: 10px; padding-top: 10px; }
        button {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:active { transform: translateY(1px); }
        [data-testid="primary-action"] { background: var(--accent); color: white; }
        [data-testid="reset"] { background: #ef4444; color: white; }
        #status { font-size: 0.85rem; color: #64748b; font-style: italic; }
        /* Preview Styles */
        .p-render h1 { border-bottom: 2px solid var(--border); padding-bottom: 5px; }
        .p-render h2 { border-bottom: 1px solid var(--border); padding-bottom: 3px; }
        .p-render code { background: var(--code-bg); padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        .p-render pre { background: var(--code-bg); padding: 10px; border-radius: 5px; overflow-x: auto; }
        .p-render ul { padding-left: 20px; }
        .p-render blockquote { border-left: 4px solid var(--accent); margin: 0; padding-left: 15px; color: #475569; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Editor Side -->
    <section class="pane editor-pane">
        <header>
            <h1>Markdown Pocket</h1>
            <span id="status" data-testid="status">Ready</span>
        </header>
        <textarea id="editor" spellcheck="false"></textarea>
        <div class="controls">
            <button id="btn-add" data-testid="primary-action">Insert Section</button>
            <button id="btn-reset" data-testid="reset">Reset</button>
        </div>
    </section>

    <!-- Preview Side -->
    <section class="pane preview-pane">
        <div id="preview" class="p-render"></div>
    </section>
</div>

<script>
(function() {
    const INITIAL_STATE = `# Welcome to Pocket\nThis is your live **markdown** playground.\n\n## Features\n* Real-time rendering\n* Zero dependencies\n* Instant sections\n\n\`\`\`javascript\nconsole.log("Hello World");\n\`\`\``;
    
    let state = {
        content: INITIAL_STATE
    };

    const elEditor = document.getElementById('editor');
    const elPreview = document.getElementById('preview');
    const elStatus = document.getElementById('status');
    const btnAdd = document.getElementById('btn-add');
    const btnReset = document.getElementById('btn-reset');

    /**
     * Simple Markdown Parser (Regex based)
     */
    function parseMarkdown(md) {
        let html = md
            // Escape HTML tags to prevent XSS
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            // Headers
            .replace(/^### (.*$)/gm, '<h3>$1</h3>')
            .replace(/^## (.*$)/gm, '<h2>$1</h2>')
            .replace(/^# (.*$)/gm, '<h1>$1</h1>')
            // Bold
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            // Italic
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            // Code Blocks
            .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
            // Inline Code
            .replace(/`(.*?)`/g, '<code>$1</code>')
            // Blockquotes
            .replace(/^\> (.*$)/gm, '<blockquote>$1</blockquote>')
            // Unordered Lists
            .replace(/^\* (.*$)/gm, '<ul><li>$1</li></ul>')
            .replace(/<\/ul>\n<ul>/g, '') // Merge adjacent lists
            // Line breaks
            .replace(/\n$/gm, '<br>');

        return html.trim();
    }

    function updateUI() {
        elEditor.value = state.content;
        elPreview.innerHTML = parseMarkdown(state.content);
        elStatus.textContent = `Chars: ${state.content.length} | Mode: Editing`;
    }

    function insertSection() {
        const timestamp = new Date().toLocaleTimeString();
        const section = `\n\n## Update @ ${timestamp}\nNew entry added via primary action!`;
        state.content += section;
        updateUI();
    }

    function resetApp() {
        state.content = INITIAL_STATE;
        updateUI();
        elStatus.textContent = "State Restored";
    }

    function init() {
        if (!elEditor || !elPreview || !elStatus || !btnAdd || !btnReset) return;

        // Event Listeners
        elEditor.addEventListener('input', (e) => {
            state.content = e.target.value;
            elPreview.innerHTML = parseMarkdown(state.content);
            elStatus.textContent = `Chars: ${state.content.length} | Mode: Typing`;
        });

        btnAdd.addEventListener('click', () => {
            insertSection();
            elStatus.textContent = "Section Inserted";
        });

        btnReset.addEventListener('click', () => {
            resetApp();
        });

        // Initial Load
        updateUI();
    }

    init();
})();
</script>

</body>
</html>
