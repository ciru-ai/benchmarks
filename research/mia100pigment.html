#pigment-bench {
  --desk:#e6dbc9;
  --sheet:#f6edda;
  --carbon:#322e29;
  --graphite:#5d554b;
  --ruling:#afa28f;
  --front:#37635c;
  --violet:#4d4266;
  --serif:"Bench Instrument", "Times New Roman", serif;
  --reading:Georgia, "Nimbus Roman", "Times New Roman", serif;
  --mono:"IBM Plex Mono", "Liberation Mono", Courier, monospace;
  --front-y:28.96%;
  background:var(--desk);
  color:var(--carbon);
  color-scheme:light;
  font-family:var(--reading);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  position:relative;
  isolation:isolate;
  box-sizing:border-box;
  width:100%;
  container-type:inline-size;
  display:grid;
  align-content:center;
}
#pigment-bench *, #pigment-bench *::before, #pigment-bench *::after {box-sizing:border-box}
#pigment-bench :is(h1,p,figure) {margin:0}
#pigment-bench canvas {display:block}
#pigment-bench .desk-grain, #pigment-bench .sheet-grain, #pigment-bench .ink-field, #pigment-bench .tape-grain {
  position:absolute; inset:0; width:100%; height:100%; pointer-events:none;
}
#pigment-bench .desk-grain {z-index:-1; opacity:.63}
#pigment-bench .bench-layout {
  position:relative;
  margin-inline:auto;
  width:100%;
  max-width:1060px;
  padding:clamp(40px,6.8cqi,84px) clamp(28px,6.3cqi,76px) clamp(30px,5cqi,60px);
  display:grid;
  grid-template-columns:minmax(190px, 265px) minmax(0, 435px);
  gap:clamp(30px,6.5cqi,104px);
  align-items:center;
  justify-content:space-between;
}
#pigment-bench .bench-notes {min-width:0}
#pigment-bench .bench-heading {margin-bottom:clamp(25px,4.3cqi,49px)}
#pigment-bench .bench-kicker, #pigment-bench .pigment-key thead th {
  font:400 10px/1.4 var(--mono);
  color:var(--graphite);
  text-transform:uppercase;
  letter-spacing:.13em;
}
#pigment-bench .bench-kicker {display:flex; align-items:center; gap:10px; margin-bottom:20px}
#pigment-bench .bench-kicker::before {content:""; display:block; width:22px; height:1px; background:currentColor}
#pigment-bench h1 {
  font:400 clamp(62px,8.8cqi,88px)/.88 var(--serif);
  letter-spacing:-.035em;
  color:var(--carbon);
}
#pigment-bench h1 em {font-weight:400; letter-spacing:-.038em; white-space:nowrap}
#pigment-bench .bench-method {
  margin-top:24px; max-width:25ch;
  font:400 clamp(15px,1.72cqi,18px)/1.48 var(--reading);
  color:var(--graphite);
  text-wrap:pretty;
}
#pigment-bench .bench-control {border-top:1px solid var(--ruling); padding:17px 0 0}
#pigment-bench .control-heading {display:flex; justify-content:space-between; align-items:baseline; gap:6px}
#pigment-bench .control-heading label {font:400 25px/1 var(--serif)}
#pigment-bench .control-heading output {font:400 14px/1.4 var(--mono); color:var(--front); white-space:nowrap}
#pigment-bench .control-heading small {font:inherit; font-size:11px}
#pigment-bench .bench-track {position:relative; margin:2px 0 0; padding:0 0 1px}
#pigment-bench .bench-track::before {content:""; position:absolute; bottom:1px; left:8px; right:8px; height:4px; background:repeating-linear-gradient(to right,var(--ruling) 0 1px,transparent 1px 5%); border-right:1px solid var(--ruling); pointer-events:none}
#pigment-bench input[type="range"] {
  --progress:76%;
  -webkit-appearance:none; appearance:none; display:block; width:100%; height:42px; margin:0; padding:0;
  background:transparent; cursor:ew-resize; border:0; border-radius:0; box-shadow:none;
}
#pigment-bench input[type="range"]:focus-visible {outline:2px solid var(--front); outline-offset:2px}
#pigment-bench input[type="range"]::-webkit-slider-runnable-track {
  height:2px; background:linear-gradient(to right,var(--front) 0 var(--progress), #b5a994 var(--progress) 100%);
}
#pigment-bench input[type="range"]::-webkit-slider-thumb {
  appearance:none; width:16px; height:16px; margin-top:-7px; border-radius:50%;
  background:var(--front); border:2px solid var(--desk); box-shadow:0 0 0 1px var(--front);
}
#pigment-bench input[type="range"]::-moz-range-track {height:2px; background:#b5a994}
#pigment-bench input[type="range"]::-moz-range-progress {height:2px; background:var(--front)}
#pigment-bench input[type="range"]::-moz-range-thumb {
  width:12px; height:12px; background:var(--front); border:2px solid var(--desk);
  border-radius:50%; box-shadow:0 0 0 1px var(--front);
}
#pigment-bench input[type="range"]:hover {--front:#244c46}
#pigment-bench .track-numbers {position:relative; height:14px; margin:3px 8px 0; font:400 10px/1.3 var(--mono); color:var(--graphite)}
#pigment-bench .track-numbers span {position:absolute; transform:translateX(-50%)}
#pigment-bench .track-numbers span:nth-child(1) {left:0}
#pigment-bench .track-numbers span:nth-child(2) {left:25%}
#pigment-bench .track-numbers span:nth-child(3) {left:50%}
#pigment-bench .track-numbers span:nth-child(4) {left:75%}
#pigment-bench .track-numbers span:nth-child(5) {left:100%}
#pigment-bench .pigment-key {border-collapse:collapse; border-spacing:0; width:100%; margin:clamp(24px,3.6cqi,42px) 0 0; color:var(--carbon)}
#pigment-bench .pigment-key :is(th,td) {padding:0; font-weight:400; text-align:left; border:0; background:transparent}
#pigment-bench .pigment-key thead th {padding:0 0 8px; border-bottom:1px solid var(--ruling)}
#pigment-bench .pigment-key :is(td,th):last-child {text-align:right}
#pigment-bench .pigment-key tbody th {font:400 17px/1.3 var(--reading); padding:6px 0 4px}
#pigment-bench .pigment-key tbody tr:first-child :is(th,td) {padding-top:9px}
#pigment-bench .pigment-key td {font:400 11px/1 var(--mono); color:var(--graphite); font-variant-numeric:tabular-nums}
#pigment-bench .ink-chip {width:11px; height:11px; display:inline-block; margin-right:9px; border-radius:48% 44% 49% 40%; background:#427e71}
#pigment-bench [data-ink="ochre"] {background:#b2803a; border-radius:43% 48% 39% 49%}
#pigment-bench [data-ink="violet"] {background:var(--violet)}
#pigment-bench .bench-specimen {
  --scale-width:clamp(38px,5.5cqi,58px);
  --notes-width:clamp(70px,10.8cqi,108px);
  min-width:0; width:100%; justify-self:center;
  max-width:calc(var(--scale-width) + var(--notes-width) + clamp(154px,29cqi,247px));
}
#pigment-bench .specimen-stage {
  display:grid; grid-template-columns:var(--scale-width) minmax(0,1fr) var(--notes-width);
  position:relative; height:clamp(490px,55cqi,585px); align-items:stretch;
}
#pigment-bench .specimen-scale {position:relative; color:var(--graphite); margin-right:12px; margin-left:1px}
#pigment-bench .scale-unit {position:absolute; right:0; top:calc(10% - 29px); font:italic 13px/1 var(--reading)}
#pigment-bench .scale-marks {position:absolute; width:100%; top:10%; height:79%}
#pigment-bench .scale-tick {position:absolute; right:0; width:4px; height:1px; background:var(--ruling); transform:translateY(-.5px)}
#pigment-bench .scale-tick.major {width:10px; background:#82796c}
#pigment-bench .scale-tick span {position:absolute; right:15px; top:0; transform:translateY(-50%); font:400 10px/1 var(--mono)}
#pigment-bench .sheet-shadow {position:relative; filter:drop-shadow(1px 3px 2px #60523a26) drop-shadow(4px 7px 5px #5d4d3321)}
#pigment-bench .filter-sheet {position:absolute; inset:0; background:var(--sheet); isolation:isolate; overflow:hidden}
#pigment-bench .wet-zone {position:absolute; top:var(--front-y); left:0; right:0; bottom:0; background:rgba(137,141,111,.055); border-top:1px dashed #5a7063a1}
#pigment-bench .pencil-origin {position:absolute; top:89%; left:7%; right:7%; border-top:1px solid #6c615a55; transform:rotate(-.6deg)}
#pigment-bench .adhesive {
  position:absolute; z-index:2; top:-11px; left:calc(50% + (var(--scale-width) - var(--notes-width)) / 2);
  transform:translateX(-50%) rotate(-4deg); width:clamp(78px,11.6cqi,122px); height:27px;
  background:rgba(192,167,114,.49); box-shadow:inset 0 1px #f7e8c66b, inset 0 -1px #9c865d3b;
  clip-path:polygon(1% 0, 100% 0, 98.8% 12%,100% 19%,98.5% 28%,99.8% 39%,98.5% 52%,100% 63%,98.8% 77%,100% 88%,99% 100%,0 100%,1.7% 89%,.6% 78%,2% 69%,.5% 58%,1.6% 48%,0 35%,1.3% 22%,.2% 10%);
}
#pigment-bench .strip-notes {position:relative; color:var(--graphite)}
#pigment-bench .level-note {
  position:absolute; width:100%; display:flex; align-items:center; gap:6px;
  font:italic 15px/1 var(--reading); transform:translateY(-50%); white-space:nowrap;
}
#pigment-bench .level-note::before {content:""; width:clamp(10px,2cqi,25px); height:1px; background:currentColor; opacity:.55}
#pigment-bench .front-note {top:var(--front-y); color:var(--front)}
#pigment-bench .origin-note {top:89%}
#pigment-bench .bench-specimen figcaption {
  display:flex; align-items:baseline; justify-content:center; gap:8px;
  margin:23px var(--notes-width) 0 var(--scale-width);
  font:italic 14px/1.3 var(--reading); color:var(--graphite); text-align:center;
}
#pigment-bench .bench-specimen figcaption span {font:400 9px/1 var(--mono); text-transform:uppercase; letter-spacing:.07em; white-space:nowrap}
#pigment-bench .bench-sr {position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}

@container (max-width:750px) {
  #pigment-bench .bench-layout {grid-template-columns:minmax(160px,.75fr) minmax(0,1.25fr); gap:30px; padding-inline:30px}
  #pigment-bench .bench-specimen {--notes-width:72px; --scale-width:38px}
  #pigment-bench .level-note {font-size:12px; gap:4px}
  #pigment-bench .bench-specimen figcaption {margin-right:22px; margin-left:0}
  #pigment-bench .specimen-scale {margin-right:8px}
  #pigment-bench .scale-tick span {right:13px}
}
@container (max-width:570px) {
  #pigment-bench .bench-layout {grid-template-columns:minmax(117px,.77fr) minmax(0,1fr); padding:36px 18px 27px; gap:19px; align-items:center}
  #pigment-bench .bench-specimen {--scale-width:27px; --notes-width:0px}
  #pigment-bench .specimen-stage {height:clamp(405px,96cqi,485px)}
  #pigment-bench .strip-notes {display:none}
  #pigment-bench .bench-kicker {display:block; font-size:9px; letter-spacing:.08em; margin-bottom:13px}

  <style>html,body { margin:0; background:#e6dbc9; } body > #pigment-bench { min-height:100svh; }</style>

<body>
<main id="pigment-bench" aria-labelledby="bench-title">
    <canvas class="desk-grain" aria-hidden="true"></canvas>
    <div class="bench-layout">
      <section class="bench-notes" aria-labelledby="bench-title">
        <header class="bench-heading">
          <p class="bench-kicker">Paper chromatography</p>
          <h1 id="bench-title">Pigment<br><em>test bench</em></h1>
          <p class="bench-method" id="bench-method">Slide to zero to see the original ink blot. Raise the water front and watch its colours travel apart.</p>
        </header>

        <div class="bench-control">
          <div class="control-heading">
            <label for="water-front">Water front</label>
            <output for="water-front" id="front-reading" aria-live="off">76 <small>mm</small></output>
          </div>
          <div class="bench-track">
            <input type="range" id="water-front" aria-describedby="bench-method" min="0" max="100" step="1" value="76" aria-valuetext="76 millimetres">
          </div>
          <div class="track-numbers" aria-hidden="true"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
        </div>

        <table class="pigment-key" aria-label="Pigment travel from the origin">
          <thead><tr><th scope="col">Pigment</th><th scope="col">Rise / mm</th></tr></thead>
          <tbody>
            <tr><th scope="row"><i class="ink-chip" data-ink="teal" aria-hidden="true"></i>Teal</th><td data-rise="0.83">63.1</td></tr>
            <tr><th scope="row"><i class="ink-chip" data-ink="ochre" aria-hidden="true"></i>Ochre</th><td data-rise="0.52">39.5</td></tr>
            <tr><th scope="row"><i class="ink-chip" data-ink="violet" aria-hidden="true"></i>Violet</th><td data-rise="0.25">19.0</td></tr>
          </tbody>
        </table>
      </section>

      <figure class="bench-specimen" aria-label="Calibrated chromatography strip">
        <div class="specimen-stage">
          <div class="specimen-scale" aria-hidden="true"><span class="scale-unit">mm</span><div class="scale-marks"></div></div>
          <div class="sheet-shadow">
            <div class="filter-sheet">
              <canvas class="sheet-grain" aria-hidden="true"></canvas>
              <div class="wet-zone" aria-hidden="true"></div>
              <div class="pencil-origin" aria-hidden="true"></div>
              <canvas class="ink-field" role="img" aria-label="Teal, ochre and violet bands above a dark origin blot."></canvas>
            </div>
          </div>
          <div class="adhesive" aria-hidden="true"><canvas class="tape-grain"></canvas></div>
          <div class="strip-notes" aria-hidden="true">
            <span class="level-note front-note">Water front</span>
            <span class="level-note origin-note">Origin</span>
          </div>
        </div>
        <figcaption><span>Fig. 1</span> Mixed ink on filter paper</figcaption>
      </figure>
    </div>
    <span class="bench-sr" role="status" aria-live="polite" aria-atomic="true"></span>
  </main>
  <script>
(() => {
  const stocks = {
    desk:  { seed: 1947, grain: 0.092, fibres: 290, length: 6, vertical: false },
    strip: { seed: 7381, grain: 0.125, fibres: 570, length: 14, vertical: true },
    tape:  { seed: 4835, grain: 0.105, fibres: 430, length: 9, vertical: false }
  };
  const materials = new Map();
  const rendered = new WeakMap();

  function randomFrom(seed) {
    let value = seed;
    return () => {
      value = (Math.imul(value, 1664525) + 1013904223) >>> 0;
      return value / 4294967296;
    };
  }

  function tile(side, density) {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = Math.round(side * density);
    return canvas;
  }

  function makeMaterial(stock, density) {
    const random = randomFrom(stock.seed);
    const grain = tile(193, density);
    const grainContext = grain.getContext("2d");
    const pixels = grainContext.createImageData(grain.width, grain.height);
    // Small differences in the paper pulp make clusters of coarser grain.
    // Integer wavelengths keep the variation continuous at tile boundaries.
    const strengths = Array.from({ length: grain.width }, (_, x) =>
      0.85 + 0.15 * Math.sin(x * 4 * Math.PI / grain.width)
    );
    for (let y = 0; y < grain.height; y++) {
      const crossGrain = 0.88 + 0.12 * Math.cos(y * 6 * Math.PI / grain.height);
      for (let x = 0; x < grain.width; x++) {
        const value = random() * 2 - 1;
        const light = value > 0;
        const i = (y * grain.width + x) * 4;
        pixels.data[i] = light ? 255 : 65;
        pixels.data[i + 1] = light ? 251 : 47;
        pixels.data[i + 2] = light ? 236 : 25;
        pixels.data[i + 3] = Math.abs(value) * stock.grain * 255 *
          strengths[x] * crossGrain * (light ? 1.55 : 0.85);
      }
    }
    grainContext.putImageData(pixels, 0, 0);

    const fibres = tile(317, density);
    const fibreContext = fibres.getContext("2d");
    fibreContext.scale(density, density);
    fibreContext.lineCap = "round";
    for (let i = 0; i < stock.fibres; i++) {
      const x = random() * 317;
      const y = random() * 317;
      const length = 1.5 + random() ** 2 * stock.length;
      const angle = stock.vertical && random() < 0.65
        ? Math.PI / 2 + (random() - 0.5) * 0.95
        : random() * Math.PI * 2;
      const dx = Math.cos(angle) * length;
      const dy = Math.sin(angle) * length;
      const bend = (random() - 0.5) * 0.26;
      fibreContext.strokeStyle = random() < 0.57
        ? "rgba(94, 72, 40, 0.11)"
        : "rgba(255, 252, 236, 0.36)";
      fibreContext.lineWidth = 0.3 + random() * 0.52;
      fibreContext.beginPath();
      fibreContext.moveTo(x, y);
      fibreContext.quadraticCurveTo(
        x + dx * 0.5 + dy * bend, y + dy * 0.5 - dx * bend,
        x + dx, y + dy
      );
      fibreContext.stroke();
    }
    return [grain, fibres];
  }

  window.drawBenchPaper = function drawBenchPaper(canvas, kind) {
    const stock = stocks[kind];
    if (!stock || !canvas.clientWidth || !canvas.clientHeight) return;
    const density = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.round(canvas.clientWidth * density));
    const height = Math.max(1, Math.round(canvas.clientHeight * density));
    const materialKey = kind + "/" + density;
    const key = materialKey + "/" + width + "/" + height;
    if (rendered.get(canvas) === key && canvas.width === width && canvas.height === height) return;

    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    if (!materials.has(materialKey)) {
      materials.set(materialKey, makeMaterial(stock, density));
    }
    for (const layer of materials.get(materialKey)) {
      ctx.fillStyle = ctx.createPattern(layer, "repeat");
      ctx.fillRect(0, 0, width, height);
    }
    rendered.set(canvas, key);
  };
})();
</script>
  <script>
(() => {
  "use strict";

  const pigments = [
    { travel: 0.83, width: 0.99, height: 0.216, seed: 13, colors: ["#115956", "#24766c", "#498e77", "#569a89", "#28665e", "#75ab8a"] },
    { travel: 0.52, width: 0.91, height: 0.196, seed: 43, colors: ["#91602b", "#b1782b", "#c09043", "#c6a063", "#895a28", "#b8893a"] },
    { travel: 0.25, width: 0.87, height: 0.193, seed: 71, colors: ["#4d4266", "#665477", "#584b68", "#85708c", "#473e59", "#897c91"] },
  ];
  const origin = { seed: 106, colors: ["#262827", "#363532", "#302e35", "#434039", "#283231", "#665d58"] };
  const layers = new Map();

  function seededRandom(seed) {
    let state = seed;
    return () => {
      state = (Math.imul(1664525, state) + 1013904223) >>> 0;
      return state / 4294967296;
    };
  }

  // The deposit is laid down along several uneven little tide marks. Its
  // diffuse tails and pinholes share the paper's lateral variations.
  function deposit(specimen) {
    if (layers.has(specimen)) return layers.get(specimen);
    const sheet = document.createElement("canvas");
    const width = sheet.width = 660;
    const height = sheet.height = 260;
    const ctx = sheet.getContext("2d");
    const random = seededRandom(specimen.seed);
    const normal = () => Math.sqrt(-2 * Math.log(1 - random())) * Math.cos(2 * Math.PI * random());
    const isOrigin = specimen === origin;
    const phase = specimen.seed * 1.3247 % (Math.PI * 2);
    const isTeal = specimen === pigments[0];
    const isOchre = specimen === pigments[1];
    const profile = [];
    for (let i = 0; i < width; i++) {
      const u = (i / width - 0.5) * 2;
      const edge = Math.max(0, 1 - Math.pow(Math.abs(u), 3.0));
      const grainEdge = 0.012 * Math.sin(19 * u + phase) + 0.006 * Math.cos(53 * u - phase);
      let tide;
      if (isOrigin) tide = 0.12 * u * u + 0.04 * u;
      else if (isTeal) tide = 0.037 * Math.sin(4 * u) - 0.014 * Math.cos(8 * u);
      else if (isOchre) tide = 0.13 * u * u - 0.038 + 0.016 * Math.sin(7 * u);
      else tide = -0.037 * u + 0.021 * Math.sin(6 * u - 1);
      const channels = Math.sin(47 * u + phase) + 0.65 * Math.cos(24 * u - phase) + 0.3 * Math.sin(83 * u);
      const wick = Math.pow(Math.max(0, channels / 1.9), 2);
      const crest = 0.90 + 0.18 * Math.sin(8 * u + phase) + 0.09 * Math.cos(29 * u);
      profile.push({ tide: tide + grainEdge, breadth: Math.pow(edge, 0.61) * crest, wick, edge });
    }
    const count = isOrigin ? 27500 : isTeal ? 30200 : 24600;
    for (let n = 0; n < count; n++) {
      const u = (random() * 2 - 1) * 0.69 + (random() * 2 - 1) * 0.19 + normal() * 0.081;
      if (Math.abs(u) >= 0.99) continue;
      const x = (u * 0.5 + 0.5) * width;
      const { tide, breadth, wick, edge } = profile[Math.floor(x)];
      const type = random();
      const g = normal();
      let offset;
      let alpha = 0.21 + 0.61 * random();
      if (isOrigin) {
        offset = g < 0 ? 0.172 * g : 0.095 * g;
        if (type < 0.20) offset += (random() - 0.45) * 0.47;
      } else if (isTeal) {
        if (type < 0.30) {
          offset = 0.13 * g + 0.13 + 0.41 * wick * random();
          alpha *= 0.66;
        } else {
          offset = 0.09 * g - 0.044 + 0.036 * Math.cos(9 * u);
        }
      } else if (isOchre) {
        offset = type < 0.27 ? 0.065 * g + 0.092 : 0.05 * g - 0.034;
        if (type < 0.15) offset += 0.13 * g;
      } else {
        offset = type < 0.26 ? 0.11 * Math.abs(g) + 0.21 * wick * random() : 0.067 * g - 0.024;
        offset += 0.022 * Math.sin(15 * u) * Math.abs(g);
      }
      const v = 0.50 + tide + offset * breadth;
      if (v < 0.01 || v > 0.99) continue;
      // Tiny irregular clearings break up the deposit at several scales.
      const pulp = Math.sin(u * 85 + v * 49) * Math.cos(u * 51 - v * 94)
        + 0.7 * Math.sin(u * 138 + Math.sin(v * 47) * 2);
      if (pulp > 0.74 && random() < (isOrigin ? 0.22 : 0.68)) continue;
      const size = 0.65 + Math.pow(random(), 2.0) * 2.65;
      ctx.fillStyle = specimen.colors[Math.floor(random() * specimen.colors.length)];
      ctx.globalAlpha = alpha * Math.min(1, edge * 5);
      ctx.beginPath();
      ctx.ellipse(x, v * height, size, size * (0.50 + 0.52 * random()), random() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
    layers.set(specimen, sheet);
    return sheet;
  }

  window.drawPigments = (canvas, fraction) => {
    const progress = Math.min(1, Math.max(0, Number(fraction) || 0));
    const width = canvas.clientWidth || canvas.getBoundingClientRect().width;
    const height = canvas.clientHeight || canvas.getBoundingClientRect().height;
    if (!width || !height) return;
    const ratio = Math.min(window.devicePixelRatio || 1, 3);
    const pixelsWide = Math.round(width * ratio);
    const pixelsHigh = Math.round(height * ratio);
    if (canvas.width !== pixelsWide) canvas.width = pixelsWide;
    if (canvas.height !== pixelsHigh) canvas.height = pixelsHigh;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(pixelsWide / width, 0, 0, pixelsHigh / height, 0, 0);
    ctx.clearRect(0, 0, width, height);
    const baseline = 0.89 * height;
    const spread = Math.sqrt(progress);
    function drawLayer(specimen, center, w, h, alpha) {
      ctx.globalAlpha = alpha;
      ctx.drawImage(deposit(specimen), (width - w) / 2, center - h / 2, w, h);
    }
    for (const pigment of pigments) {
      const w = width * (0.37 + (pigment.width - 0.37) * spread);
      const h = height * (0.074 + (pigment.height - 0.074) * spread);
      drawLayer(pigment, baseline - height * 0.79 * progress * pigment.travel, w, h, Math.min(1, progress * 8));
    }
    drawLayer(origin, baseline, width * (0.37 - 0.065 * spread), height * (0.125 - 0.015 * spread), 1);
    ctx.globalAlpha = 1;
  };
})();
</script>
  <script>
(() => {
  "use strict";
  const bench = document.getElementById("pigment-bench");
  const select = selector => bench.querySelector(selector);
  const slider = select("#water-front");
  const reading = select("#front-reading");
  const ink = select(".ink-field");
  const sheet = select(".filter-sheet");
  const scale = select(".scale-marks");
  const status = select(".bench-sr");
  const originLabel = select(".origin-note");
  const frontLabel = select(".front-note");
  const rows = [...bench.querySelectorAll("[data-rise]")];
  const materials = [[".desk-grain", "desk"], [".sheet-grain", "strip"], [".tape-grain", "tape"]];

  for (let mm = 0; mm <= 100; mm += 2) {
    const tick = document.createElement("span");
    tick.className = "scale-tick";
    tick.style.top = (100 - mm) + "%";
    if (mm % 10 === 0) {
      tick.classList.add("major");
      const number = document.createElement("span");
      number.textContent = mm;
      tick.append(number);
    }
    scale.append(tick);
  }

  // Vary the contour by fractions of a millimetre, like the torn edge of a strip.
  function deckleEdge() {
    const {clientWidth: w, clientHeight: h} = sheet;
    if (!w || !h) return;
    let seed = 91;
    function fuzz() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    const points = [];
    const point = (x,y) => points.push(x.toFixed(2) + "px " + y.toFixed(2) + "px");
    for (let x = 0; x < w; x += 3) point(x, fuzz() * .95);
    for (let y = 0; y < h; y += 3) point(w - fuzz() * 1.3, y);
    for (let x = w; x > 0; x -= 2) point(x, h - fuzz() * 1.65);
    for (let y = h; y > 0; y -= 3) point(fuzz() * 1.05, y);
    sheet.style.clipPath = "polygon(" + points.join(",") + ")";
  }

  function paint() {
    const mm = slider.valueAsNumber;
    const fraction = mm / 100;
    bench.style.setProperty("--front-y", (89 - 79 * fraction) + "%");
    slider.style.setProperty("--progress", mm + "%");
    const distance = mm + (mm === 1 ? " millimetre" : " millimetres");
    slider.setAttribute("aria-valuetext", distance);
    reading.firstChild.nodeValue = mm + " ";
    for (const row of rows) row.textContent = (mm * Number(row.dataset.rise)).toFixed(1);
    const nearOrigin = sheet.clientHeight * .79 * fraction < 24;
    originLabel.style.visibility = nearOrigin ? "hidden" : "visible";
    frontLabel.textContent = mm === 0 ? "Origin" : "Water front";
    const summary = mm === 0 ? "A single dark ink blot at the origin."
      : "Water front at " + distance + ". Teal rose " + rows[0].textContent + " millimetres, ochre " + rows[1].textContent + " and violet " + rows[2].textContent + ".";
    ink.setAttribute("aria-label", summary);
    window.drawPigments(ink, fraction);
  }

  let paintFrame = 0;
  function schedulePaint() {
    if (paintFrame) return;
    paintFrame = requestAnimationFrame(() => { paintFrame = 0; paint(); });
  }
  function restore(state) {
    const value = state?.modelContent?.waterFrontMm;
    if (Number.isInteger(value) && value >= 0 && value <= 100) {
      slider.value = value;
      schedulePaint();
    }
  }

  slider.addEventListener("input", schedulePaint);
  slider.addEventListener("change", () => {
    paint();
    status.textContent = ink.getAttribute("aria-label");
    window.openai?.setWidgetState?.({modelContent:{waterFrontMm:slider.valueAsNumber}})?.catch?.(() => {});
  });
  window.addEventListener("openai:set_globals", event => restore(event.detail?.globals?.widgetState));
  restore(window.openai?.widgetState);

  let resizeFrame = 0;
  function resize() {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      deckleEdge();
      for (const [selector, kind] of materials) window.drawBenchPaper(select(selector), kind);
      paint();
    });
  }
  const observer = new ResizeObserver(resize);
  observer.observe(bench);
  observer.observe(sheet);
  window.addEventListener("resize", resize);
  resize();
})();
</script>
