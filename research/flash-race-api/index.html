<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Flash Race | Ciru Inference Lab</title><meta name="description" content="Recorded Hermes and tool races: eight local Flash stacks and Qwen3.8 Flash API."><link rel="icon" href="assets/crown-ciru.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="race.css"><script defer src="race.js"></script></head><body><header class="topbar"><div class="wrap"><a class="brand" href="/research/"><img src="assets/crown-ciru.png" alt="Ciru"><div class="brandword"><span>Ciru</span><small>INFERENCE LAB</small></div></a><a class="edition" href="/research/strix-showdown-20261001/">Full research ↗</a></div></header><main class="wrap"><section class="section classic-race" id="race" aria-labelledby="race-title">
    <div class="sec-head">
      <span class="eyebrow">RECORDED BENCHMARK REPLAY</span>
      <h2 id="race-title">Flash Race</h2>

    </div>
    <div class="race" id="race-box">
      <div class="race-top">
        <div class="clock">
          <span class="clock-label">Benchmark clock</span>
          <span class="clock-time" id="race-clock">00:00.00</span>
          <span class="clock-sub" id="race-clock-sub">replay speed ×10</span>
        </div>
        <div class="race-ctrl">
          <div class="row" role="group" aria-label="Race">
            <div class="tabs" id="race-modes"></div>
          </div>
          <div class="row">
            <span class="lbl">Speed</span>
            <div class="tabs" id="race-speeds"></div>
            <button class="btn primary" id="race-play" type="button">▶ Play</button>
            <button class="btn" id="race-restart" type="button">↺ Restart</button><button class="btn" id="race-finish" type="button">Finish ↗</button>
          </div>
        </div>
      </div>
      <div class="scrub"><span>start</span><input type="range" id="race-scrub" min="0" max="100" step="0.01" value="0" aria-label="Scrub race time"><span id="race-end">0:00</span></div>
      <p class="race-blurb" id="race-blurb"></p>
      <div class="lanes" id="race-lanes"></div>
      <div class="legend-row">
        <span><i style="background:var(--pass)"></i>pass</span><span><i style="background:var(--partial)"></i>partial credit</span><span><i style="background:var(--fail)"></i>fail</span><span><i style="background:#16181d;box-shadow:inset 0 0 0 1.5px var(--cyan)"></i>in progress</span>
      </div>
      <div class="race-result" id="race-result"></div>
      <div class="race-foot">
        <div class="feed"><h4>Race feed</h4><ol id="race-feed"></ol></div>
        <div class="standings"><h4>Live standings · points</h4><ol id="race-standings"></ol></div>
      </div>
    </div>
  </section></main><div class="rtip" id="rtip" hidden></div><noscript>Enable JavaScript to replay the race.</noscript></body></html>
