<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Solar System Toy</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Solar System Toy</h1>
        <p>Drag to rotate | Scroll to zoom</p>
    </div>

    <!-- Load Three.js and OrbitControls from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 150, 300);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white light
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 5000, 1000);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // --- Textures Placeholder (Colors) ---
        const createPlanet = (size, color, distance, speed, name) => {
            // Orbit Path (Ring)
            const orbitGeom = new THREE.RingGeometry(distance - 0.5, distance + 0.5, 64);
            const orbitMat = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide });
            const orbit = new THREE.Mesh(orbitGeom, orbitMat);
            orbit.rotation.x = Math.PI / 2;
            scene.add(orbit);

            // Planet Sphere
            const geom = new THREE.SphereGeometry(size, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geom, mat);
            
            // Pivot object for rotation around sun
            const pivot = new THREE.Object3D();
            scene.add(pivot);
            pivot.add(mesh);
            mesh.position.set(distance, 0, 0);

            return { mesh, pivot, speed };
        };

        // --- Stars Background ---
        const starGeometry = new THREE.BufferGeometry();
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff });
        const starVertices = [];
        for (let i = 0; i < 5000; i++) {
            const x = (Math.random() - 0.5) * 2000;
            const y = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * 2000;
            starVertices.push(x, y, z);
        }
        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // --- Celestial Bodies ---
        // Sun
        const sunGeom = new THREE.SphereGeometry(15, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        const sun = new THREE.Mesh(sunGeom, sunMat);
        scene.add(sun);

        // Planet Data: size, color, distance, speed
        const planets = [
            createPlanet(2, 0xaaaaaa, 30, 0.04),  // Mercury
            createPlanet(3.5, 0xffcc99, 50, 0.015), // Venus
            createPlanet(4, 0x2277ff, 70, 0.01),   // Earth
            createPlanet(3, 0xff4422, 90, 0.008),  // Mars
            createPlanet(8, 0xddbb99, 130, 0.004), // Jupiter
            createPlanet(7, 0xeebb99, 170, 0.002)  // Saturn
        ];

        // --- Labels (CSS Overlay Method for performance) ---
        const labels = [];
        function createLabel(text, distance) {
            const div = document.createElement('div');
            div.style.position = 'absolute';
            div.style.color = 'white';
            div.style.fontSize = '12px';
            div.style.pointerEvents = 'none';
            document.body.appendChild(div);
            return { element: div, distance };
        }

        const labelNames = ["Sun", "Mercury", "Venus", "Earth", "Mars", "Jupiter", "Saturn"];
        // Note: In this simplified version, we'll just update positions in the loop.

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Rotate Sun
            sun.rotation.y += 0.005;

            // Orbit Planets
            planets.forEach((p, index) => {
                p.pivot.rotation.y += p.speed;
                p.mesh.rotation.y += 0.02; // Self-rotation
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
