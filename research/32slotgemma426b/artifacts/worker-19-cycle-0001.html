<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Poly Landscape</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #a3d1ff; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Sky blue
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(30, 20, 40);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(50, 50, 20);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);

    // --- Terrain Generation (Low Poly) ---
    const terrainWidth = 100;
    const terrainDepth = 100;
    const segments = 40;
    
    const geometry = new THREE.PlaneGeometry(terrainWidth, terrainDepth, segments, segments);
    geometry.rotateX(-Math.PI / 2);

    // Deform vertices to create mountains
    const vertices = geometry.attributes.position.array;
    for (let i = 0; i < vertices.length; i += 3) {
        const x = vertices[i];
        const z = vertices[i + 2];
        // Simple noise-like function using sine waves
        const height = Math.sin(x * 0.15) * Math.cos(z * 0.15) * 4 + 
                       Math.sin(x * 0.05) * 3 + 
                       Math.cos(z * 0.08) * 2;
        vertices[i + 1] = height; // Set Y coordinate (height)
    }
    geometry.computeVertexNormals();

    // Material for terrain - Flat shading gives the "low poly" look
    const terrainMaterial = new THREE.MeshStandardMaterial({
        color: 0x4a7c44,
        flatShading: true,
        roughness: 0.8
    });
    const terrain = new THREE.Mesh(geometry, terrainMaterial);
    terrain.receiveShadow = true;
    scene.add(terrain);

    // --- Floating Objects (Pyramids) ---
    const objectsGroup = new THREE.Group();
    scene.add(objectsGroup);

    const pyramidGeom = new THREE.ConeGeometry(1, 2, 4); // 4 sides makes it a pyramid
    const pyramidMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, flatShading: true });

    for (let i = 0; i < 25; i++) {
        const pyramid = new THREE.Mesh(pyramidGeom, pyramidMat);
        // Random positions in the air
        pyramid.position.x = (Math.random() - 0.5) * 80;
        pyramid.position.z = (Math.random() - 0.5) * 80;
        pyramid.position.y = Math.random() * 10 + 2;
        pyramid.castShadow = true;
        
        // Custom properties for animation
        pyramid.userData.rotationSpeed = (Math.random() - 0.5) * 0.05;
        pyramid.userData.floatOffset = Math.random() * Math.PI * 2;
        
        objectsGroup.add(pyramid);
    }

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();

        // 1. Camera Drift (Gentle floating motion)
        camera.position.x = 40 + Math.sin(elapsed * 0.2) * 5;
        camera.position.z = 40 + Math.cos(elapsed * 0.2) * 5;
        camera.lookAt(0, 0, 0);

        // 2. Animate Floating Objects (Rotation and Bobbing)
        objectsGroup.children.forEach(obj => {
            obj.rotation.y += obj.userData.rotationSpeed;
            obj.rotation.x += 0.01;
            // Vertical bobbing using sine wave
            obj.position.y = (Math.sin(elapsed + obj.userData.floatOffset) * 2) + 5;
        });

        // 3. Animate Light (Sun movement/color shift simulation)
        directionalLight.position.x = Math.sin(elapsed * 0.1) * 60;
        directionalLight.position.z = Math.cos(elapsed * 0.1) * 60;

        renderer.render(scene, camera);
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
