<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Crystal Sculpture</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // --- Objects ---

    // 1. Stars Background
    const starGeometry = new THREE.BufferGeometry();
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff });
    const starVertices = [];
    for (let i = 0; i < 5000; i++) {
        const x = (Math.random() - 0.5) * 2000;
        const y = (Math.random() - 0.5) * 2000;
        const z = (Math.random() - 0.5) * 2000;
        starVertices.push(x, y, z);
    }
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // 2. The Crystal Sculpture (Octahedron)
    // We use MeshPhysicalMaterial for high-end "glass/crystal" look
    const crystalGeometry = new THREE.OctahedronGeometry(1.5, 0); // Low detail for sharp edges
    const crystalMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x00ffff,
        metalness: 0.1,
        roughness: 0.02,
        transmission: 0.9, // Transparency/Refraction
        thickness: 1.5,    // Refraction depth
        ior: 2.4,          // Index of refraction (Diamond-like)
        specularIntensity: 1,
        clearcoat: 1,
        transparent: true,
        opacity: 0.8
    });

    const crystal = new THREE.Mesh(crystalGeometry, crystalMaterial);
    scene.add(crystal);

    // Inner core (adds depth to the refraction)
    const innerGeometry = new THREE.IcosahedronGeometry(0.5, 0);
    const innerMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x44aaff });
    const innerCore = new THREE.Mesh(innerGeometry, innerMaterial);
    crystal.add(innerCore);

    // 3. Orbiting Lights
    const light1 = new THREE.PointLight(0xff00ff, 50, 20); // Magenta
    scene.add(light1);

    const light2 = new THREE.PointLight(0x00ffff, 50, 20); // Cyan
    scene.add(light2);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    // --- Animation Loop ---

    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;

        // Rotate Crystal
        crystal.rotation.y += 0.005;
        crystal.rotation.z += 0.003;
        innerCore.rotation.x -= 0.01;

        // Orbit Lights around the crystal
        light1.position.set(
            Math.sin(time * 0.7) * 4,
            Math.cos(time * 0.5) * 3,
            Math.sin(time * 0.3) * 4
        );

        light2.position.set(
            Math.cos(time * 0.5) * 4,
            Math.sin(time * 0.8) * 3,
            Math.cos(time * 0.6) * 4
        );

        // Subtle star movement
        stars.rotation.y += 0.0002;

        controls.update();
        renderer.render(scene, camera);
    }

    // Handle Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
