<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starship Command Interface</title>
    <style>
        :root {
            --panel-bg: #1a1a2e;
            --display-bg: #0f3460;
            --text-color: #00ffcc;
            --warning: #ff4d4d;
            --success: #00ff88;
            --accent: #e94560;
        }

        body {
            background-color: #050505;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        #cockpit {
            width: 95vw;
            height: 85vh;
            background: var(--panel-bg);
            border: 4px solid #333;
            border-radius: 20px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            box-shadow: inset 0 0 50px #000, 0 0 30px rgba(0,255,204,0.2);
        }

        .module {
            background: var(--display-bg);
            border: 2px solid #16213e;
            padding: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--text-color);
            padding-bottom: 5px;
            letter-spacing: 2px;
        }

        /* Gauges */
        .gauge-container {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
        }

        .gauge-bar-outer {
            width: 100%;
            height: 25px;
            background: #0a0a1a;
            border: 1px solid var(--text-color);
            margin: 5px 0;
        }

        .gauge-bar-inner {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #00ffcc, #0088ff);
            transition: width 0.3s ease;
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        button {
            background: #16213e;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:active {
            transform: scale(0.95);
            background: var(--text-color);
            color: black;
        }

        button.danger { border-color: var(--warning); color: var(--warning); }
        button.danger:hover { background: var(--warning); color: white; }

        /* Log */
        #log {
            font-size: 0.75rem;
            height: 120px;
            overflow-y: auto;
            color: #88aaff;
            scrollbar-width: none;
        }
        #log::-webkit-scrollbar { display: none; }

        /* Warning Light */
        .warning-light {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #300;
            box-shadow: none;
        }

        .warning-active {
            animation: blink 0.5s infinite alternate;
            background: var(--warning) !important;
            box-shadow: 0 0 15px var(--warning);
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.2; }
        }

        /* Map/Radar */
        #radar {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1b4332 0%, #081c15 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .radar-sweep {
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent 70%, rgba(0, 255, 136, 0.4) 100%);
            position: absolute;
            top: -50%;
            left: -50%;
            animation: sweep 4s linear infinite;
        }

        @keyframes sweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .blip {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div id="cockpit">
    <!-- Left Column -->
    <div class="module">
        <h2>Systems Status</h2>
        <div class="gauge-container">
            <div>
                <label>Engine Power</label>
                <div class="gauge-bar-outer"><div id="engine-gauge" class="gauge-bar-inner" style="width: 65%"></div></div>
            </div>
            <div>
                <label>Shield Integrity</label>
                <div class="gauge-bar-outer"><div id="shield-gauge" class="gauge-bar-inner" style="width: 100%"></div></div>
            </div>
            <div>
                <label>Oxygen Level</label>
                <div class="gauge-bar-outer"><div id="oxygen-gauge" class="gauge-bar-inner" style="width: 92%"></div></div>
            </div>
        </div>
    </div>

    <!-- Center Column -->
    <div class="module">
        <h2>Tactical Radar</h2>
        <div id="radar">
            <div class="radar-sweep"></div>
            <div id="blip" class="blip" style="top: 30%; left: 60%;"></div>
        </div>
    </div>

    <!-- Right Column -->
    <div class="module">
        <h2>Command Input</h2>
        <div class="controls">
            <button onclick="updateSystem('engine', 10)">THRUST</button>
            <button onclick="updateSystem('engine', -10)">RETARD</button>
            <button onclick="toggleShields()" id="shield-btn">SHIELDS: ON</button>
            <button class="danger" onclick="triggerAlert()">ALARM</button>
        </div>
    </div>

    <!-- Bottom Left -->
    <div class="module">
        <h2>Comms Log</h2>
        <div id="log">
            <div>[SYS] All systems nominal...</div>
        </div>
    </div>

    <!-- Bottom Center/Right (Combined via grid span) -->
    <div class="module" style="grid-column: 2 / 4;">
        <h2>Core Diagnostics</h2>
        <div id="diag-text">READY FOR COMMANDS...</div>
        <div id="warning-light" class="warning-light"></div>
    </div>
</div>

<script>
    const state = {
        engine: 65,
        shields: true,
        oxygen: 92,
        alertMode: false
    };

    function log(msg) {
        const logEl = document.getElementById('log');
        const entry = document.createElement('div');
        entry.textContent = `[${new Date().toLocaleTimeString([], {hour12:false})}] ${msg}`;
        logEl.prepend(entry);
    }

    function updateSystem(type, val) {
        if (type === 'engine') {
            state.engine = Math.min(Math.max(state.engine + val, 0), 100);
            document.getElementById('engine-gauge').style.width = state.engine + '%';
            log(`Engine thrust adjusted to ${state.engine}%`);
        }
    }

    function toggleShields() {
        state.shields = !state.shields;
        const btn = document.getElementById('shield-btn');
        const shieldGauge = document.getElementById('shield-gauge');
        
        if (state.shields) {
            btn.innerText = "SHIELDS: ON";
            btn.style.color = "#00ff88";
            shieldGauge.style.width = '100%';
            log("Shield generators stabilized.");
        } else {
            btn.innerText = "SHIELDS: OFF";
            btn.style.color = "#ff4d4d";
            shieldGauge.style.width = '0%';
            log("WARNING: Shields offline!");
        }
    }

    function triggerAlert() {
        state.alertMode = !state.alertMode;
        const light = document.getElementById('warning-light');
        if (state.alertMode) {
            light.classList.add('warning-active');
            document.body.style.boxShadow = "inset 0 0 100px rgba(255,77,77,0.3)";
            log("!!! CRITICAL ALERT ACTIVATED !!!");
            document.getElementById('diag-text').innerText = "SYSTEM ERROR: UNKNOWN ANOMALY DETECTED";
        } else {
            light.classList.remove('warning-active');
            document.body.style.boxShadow = "none";
            log("Alert cleared by command.");
            document.getElementById('diag-text').innerText = "READY FOR COMMANDS...";
        }
    }

    // Random events simulation
    setInterval(() => {
        if (!state.alertMode) {
            // Subtle oxygen depletion
            state.oxygen -= 0.1;
            document.getElementById('oxygen-gauge').style.width = state.oxygen + '%';
            
            if (Math.random() > 0.95) {
                log("Minor cosmic radiation detected.");
            }
        } else {
            // Chaos mode during alert
            state.engine -= Math.random() * 2;
            document.getElementById('engine-gauge').style.width = state.engine + '%';
        }

        // Random blip movement
        const blip = document.getElementById('blip');
        if (Math.random() > 0.7) {
            blip.style.top = Math.random() * 80 + "%";
            blip.style.left = Math.random() * 80 + "%";
        }

    }, 1000);

</script>

</body>
</html>
