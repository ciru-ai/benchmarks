<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Pop</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 80vw;
            max-width: 600px;
            height: 70vh;
            background-color: #34495e;
            border: 4px solid #ecf0f1;
            border-radius: 15px;
            cursor: crosshair;
            overflow: hidden;
        }

        #ui {
            display: flex;
            gap: 30px;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .target {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease-out;
            animation: spawn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes spawn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        button {
            padding: 12px 30px;
            font-size: 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #2ecc71;
        }

        .score-pop {
            position: absolute;
            color: #f1c40f;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.5s ease-out forwards;
        }

        @keyframes floatUp {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-40px); }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Score: <span id="score-val">0</span></div>
        <div>Time: <span id="timer-val">30</span>s</div>
    </div>

    <div id="game-container">
        <div id="overlay">
            <h1 id="msg-title">Target Pop</h1>
            <p id="msg-score"></p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score-val');
        const timerEl = document.getElementById('timer-val');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const msgTitle = document.getElementById('msg-title');
        const msgScore = document.getElementById('msg-score');

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let timerInterval;
        let spawnTimeout;

        function startGame() {
            score = 0;
            timeLeft = 30;
            gameActive = true;
            scoreEl.textContent = score;
            timerEl.textContent = timeLeft;
            overlay.style.display = 'none';
            
            startTimer();
            spawnTarget();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function spawnTarget() {
            if (!gameActive) return;

            // Clear previous targets if any exist to prevent clutter, 
            // though we usually wait for click.
            const existing = document.querySelector('.target');
            if (existing && gameActive) {
                // If you want multiple targets on screen at once, remove this check
                // but it makes the game harder/easier depending on design.
            }

            const target = document.createElement('div');
            const size = Math.floor(Math.random() * 40) + 30; // Size between 30-70px
            const x = Math.random() * (container.clientWidth - size);
            const y = Math.random() * (container.clientHeight - size);
            const colors = ['#e74c3c', '#f1c40f', '#9b59b6', '#3498db', '#e67e22'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            target.className = 'target';
            target.style.width = `${size}px`;
            target.style.height = `${size}px`;
            target.style.left = `${x}px`;
            target.style.top = `${y}px`;
            target.style.backgroundColor = color;
            target.style.boxShadow = `0 0 15px ${color}`;

            target.addEventListener('mousedown', (e) => {
                popTarget(e, target);
            });

            container.appendChild(target);

            // Schedule next spawn
            const delay = Math.max(400, 1000 - (score * 5)); // Gets faster as score increases
            spawnTimeout = setTimeout(spawnTarget, delay);
        }

        function popTarget(e, target) {
            if (!gameActive) return;
            
            // Prevent click bubbling to container if needed
            e.stopPropagation();

            score++;
            scoreEl.textContent = score;
            
            // Visual Feedback: Floating Score
            const pop = document.createElement('div');
            pop.className = 'score-pop';
            pop.style.left = `${target.offsetLeft}px`;
            pop.style.top = `${target.offsetTop}px`;
            pop.textContent = '+1';
            container.appendChild(pop);
            setTimeout(() => pop.remove(), 500);

            // Remove target
            target.remove();
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            clearTimeout(spawnTimeout);
            
            // Clean up remaining targets
            const targets = document.querySelectorAll('.target');
            targets.forEach(t => t.remove());

            msgTitle.textContent = "Game Over!";
            msgScore.textContent = `Final Score: ${score}`;
            startBtn.textContent = "Play Again";
            overlay.style.display = 'flex';
        }

        // Handle clicking on background (miss)
        container.addEventListener('mousedown', () => {
            if(gameActive && score > 0) {
                // Optional: Penalty for missing?
                // score--;
                // scoreEl.textContent = score;
            }
        });

        startBtn.addEventListener('click', startGame);

    </script>
</body>
</html>
