<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Tunnel Animation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const RING_COUNT = 100;
        const TUNNEL_LENGTH = 200;
        const RING_SPACING = 5;

        let scene, camera, renderer, rings = [];

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Create Rings
            const geometry = new THREE.TorusGeometry(10, 0.5, 16, 100);
            
            for (let i = 0; i < RING_COUNT; i++) {
                const material = new THREE.MeshBasicMaterial({ 
                    color: new THREE.Color(), 
                    transparent: true, 
                    opacity: 0.8 
                });
                const ring = new THREE.Mesh(geometry, material);

                // Distribute rings along Z axis (tunnel depth)
                ring.position.z = -i * RING_SPACING;
                
                // Random initial rotation for variety
                ring.rotation.x = Math.random() * Math.PI;
                ring.rotation.y = Math.random() * Math.PI;

                scene.add(ring);
                rings.push({
                    mesh: ring,
                    speed: 0.5 + Math.random() * 1.5 // Individual speed variation
                });
            }

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            rings.forEach((ringObj, index) => {
                const mesh = ringObj.mesh;
                
                // Move toward camera (decreasing Z)
                mesh.position.z += ringObj.speed;

                // Color Cycling based on time and position
                const hue = (time * 0.1 + (index / RING_COUNT)) % 1;
                mesh.material.color.setHSL(hue, 0.8, 0.5);

                // Subtle rotation for the "swirl" effect
                mesh.rotation.z += 0.01;

                // Reset ring to back of tunnel once it passes camera
                if (mesh.position.z > 30) {
                    mesh.position.z = -RING_COUNT * RING_SPACING + 30;
                }
            });

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
