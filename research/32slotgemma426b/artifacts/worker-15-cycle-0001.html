<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Tunnel Animation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, tunnelGroup;
        const ringCount = 50;
        const tunnelSpeed = 0.2;
        const rings = [];

        init();
        animate();

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            tunnelGroup = new THREE.Group();
            scene.add(tunnelGroup);

            // Create Rings
            const geometry = new THREE.TorusGeometry(10, 0.1, 16, 100);
            
            for (let i = 0; i < ringCount; i++) {
                const material = new THREE.MeshBasicMaterial({ 
                    color: new THREE.Color().setHSL(i / ringCount, 1, 0.5),
                    transparent: true,
                    opacity: 0.8
                });
                
                const ring = new THREE.Mesh(geometry, material);
                
                // Distribute rings along the Z axis
                ring.position.z = -i * (25 / ringCount);
                
                // Add some variety to rotation/scale
                ring.rotation.x = Math.random() * Math.PI;
                ring.rotation.y = Math.random() * Math.PI;
                
                tunnelGroup.add(ring);
                rings.push(ring);
            }

            // Lights (though using BasicMaterial, added for potential expansion)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            rings.forEach((ring, index) => {
                // Move ring towards camera (negative Z direction)
                ring.position.z += tunnelSpeed;

                // Color cycling effect
                const hue = (index / ringCount + time * 0.1) % 1;
                ring.material.color.setHSL(hue, 0.8, 0.5);

                // Reset ring to the back when it passes the camera
                if (ring.position.z > 5) {
                    ring.position.z = -45; // Start far away
                    // Randomize rotation for variety each time it loops
                    ring.rotation.x += Math.PI / 2;
                }

                // Slight wobble effect
                ring.position.x = Math.sin(time + index) * 0.5;
                ring.position.y = Math.cos(time + index) * 0.5;
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
