<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Data Center Visualization</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00f2ff;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.7);
        }
        h1 { margin: 0; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
        p { margin: 5px 0; font-size: 12px; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Neural Core Node v4.2</h1>
        <p>Status: OPERATIONAL</p>
        <p>Data Throughput: 842 TB/s</p>
    </div>

    <!-- Load Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x020205, 0.15);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x4040ff, 0.2);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00f2ff, 1, 50);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // --- Data Center Components ---
        const rackGroup = new THREE.Group();
        scene.add(rackGroup);

        const racks = [];
        const numRacksX = 4;
        const numRacksZ = 3;
        const spacing = 4;

        // Materials
        const metalMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 });
        const glowMaterial = new THREE.MeshBasicMaterial({ color: 0x00f2ff, transparent: true, opacity: 0.8 });

        // Create Server Racks
        for (let i = 0; i < numRacksX; i++) {
            for (let j = 0; j < numRacksZ; j++) {
                const rackGeometry = new THREE.BoxGeometry(2, 5, 2);
                const rack = new THREE.Mesh(rackGeometry, metalMaterial);
                
                // Position racks in a grid
                rack.position.set(
                    (i - (numRacksX-1)/2) * spacing,
                    2.5,
                    (j - (numRacksZ-1)/2) * spacing
                );
                
                // Add "LED" strips to the front of racks
                const ledGeom = new THREE.PlaneGeometry(0.1, 4);
                const ledMat = new THREE.MeshBasicMaterial({ color: 0x00f2ff });
                const ledStrip = new THREE.Mesh(ledGeom, ledMat);
                ledStrip.position.set(1.01, 2.5, 0); // Slightly in front of rack face
                rack.add(ledStrip);

                // Add "Server Slots" (small glowing boxes)
                const slotCount = 8;
                for(let s=0; s < slotCount; s++) {
                    const slotGeom = new THREE.BoxGeometry(1.8, 0.2, 1.8);
                    const slotMat = new THREE.MeshBasicMaterial({ color: 0x0044ff });
                    const slot = new THREE.Mesh(slotGeom, slotMat);
                    slot.position.set(0, -2 + (s * 0.6), 1.05); // Positioned on rack face
                    rack.add(slot);

                    // Create a pulse light for each slot
                    const pulseLight = new THREE.PointLight(0x00f2ff, 0.5, 2);
                    pulseLight.position.set(0, -2 + (s * 0.6), 1.5);
                    rack.add(pulseLight);
                }

                racks.push({ mesh: rack, lights: ledStrip });
                rackGroup.add(rack);
            }
        }

        // Floor grid
        const gridHelper = new THREE.GridHelper(40, 40, 0x00f2ff, 0x111133);
        gridHelper.position.y = 0.05;
        scene.add(gridHelper);

        // Data Pulses (Moving light particles)
        const particleCount = 100;
        const pulseGeometry = new THREE.SphereGeometry(0.05, 8, 8);
        const pulseMaterial = new THREE.MeshBasicMaterial({ color: 0x00f2ff });
        const pulses = [];

        for (let i = 0; i < particleCount; i++) {
            const p = new THREE.Mesh(pulseGeometry, pulseMaterial);
            resetPulse(p);
            scene.add(p);
            pulses.push(p);
        }

        function resetPulse(p) {
            // Randomly pick a rack to start from and move towards another direction
            const rx = (Math.floor(Math.random() * numRacksX) - (numRacksX-1)/2) * spacing;
            const rz = (Math.floor(Math.random() * numRacksZ) - (numRacksZ-1)/2) * spacing;
            p.position.set(rx, 2, rz + 5);
            p.userData = {
                speed: 0.05 + Math.random() * 0.1,
                direction: new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, -0.2)
            };
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 1. Animate Pulses
            pulses.forEach(p => {
                p.position.addScaledVector(p.userData.direction, p.userData.speed);
                if (Math.abs(p.position.x) > 20 || Math.abs(p.position.z) < -5) {
                    resetPulse(p);
                }
            });

            // 2. Animate Rack LEDs (Flicker/Glow effect)
            racks.forEach((r, idx) => {
                const scale = 0.8 + Math.sin(time * 2 + idx) * 0.2;
                r.lights.material.opacity = scale;
            });

            // 3. Camera subtle movement (Cinematic drift)
            camera.position.y += Math.sin(time * 0.5) * 0.005;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
