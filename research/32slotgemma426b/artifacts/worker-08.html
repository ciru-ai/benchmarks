<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Typography: Local Inference</title>
    <style>
        :root {
            --bg: #050505;
            --fg: #ffffff;
            --accent: #00ffcc;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            perspective: 1000px;
        }

        .word {
            position: absolute;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: none;
            will-change: transform, opacity;
            font-size: clamp(2rem, 15vw, 8rem);
        }

        .highlight {
            color: var(--accent);
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
        }

        #overlay {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-family: monospace;
            color: #444;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="overlay">> SYSTEM_READY: LOCAL_INFERENCE_MODE</div>

    <script>
        const container = document.getElementById('canvas-container');
        const phrases = [
            { text: "LOCAL", type: "standard" },
            { text: "INFERENCE", type: "highlight" },
            { text: "NO CLOUD", type: "standard" },
            { text: "PRIVACY FIRST", type: "highlight" },
            { text: "TOKENS", type: "standard" },
            { text: "STREAMING...", type: "highlight" },
            { text: "MAX THROUGHPUT", type: "standard" },
            { text: "LOW LATENCY", type: "highlight" },
            { text: "SLOTS", type: "standard" },
            { text: "BATCH PROCESSING", type: "highlight" },
            { text: "ON DEVICE", type: "standard" },
            { text: "FULL CONTROL", type: "highlight" }
        ];

        class KineticWord {
            constructor(text, isHighlight) {
                this.el = document.createElement('div');
                this.el.className = `word ${isHighlight ? 'highlight' : ''}`;
                this.el.innerText = text;
                container.appendChild(this.el);

                this.reset();
            }

            reset() {
                const isCenter = Math.random() > 0.7;
                
                // Random position or center
                if (isCenter) {
                    this.x = window.innerWidth / 2;
                    this.y = window.innerHeight / 2;
                    this.scale = 1;
                    this.opacity = 1;
                    this.z = 0;
                } else {
                    const side = Math.floor(Math.random() * 4);
                    if (side === 0) { // Top
                        this.x = Math.random() * window.innerWidth;
                        this.y = -100;
                    } else if (side === 1) { // Bottom
                        this.x = Math.random() * window.innerWidth;
                        this.y = window.innerHeight + 100;
                    } else if (side === 2) { // Left
                        this.x = -400;
                        this.y = Math.random() * window.innerHeight;
                    } else { // Right
                        this.x = window.innerWidth + 400;
                        this.y = Math.random() * window.innerHeight;
                    }
                    this.scale = Math.random() * 0.5 + 0.2;
                    this.opacity = 0;
                    this.z = -500;
                }

                this.targetY = this.y + (Math.random() - 0.5) * 600;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.life = 1.0; // For fading out
                this.decay = Math.random() * 0.005 + 0.003;
            }

            update() {
                // Movement logic (Drift and flow)
                this.x += this.vx;
                this.y += this.vy;
                this.z -= 2; // Moving towards camera
                
                if (this.opacity < 1) this.opacity += 0.05;

                // Animate toward target or just drift
                this.el.style.transform = `translate3d(${this.x}px, ${this.y}px, ${this.z}px) scale(${this.scale})`;
                this.el.style.opacity = this.opacity;

                // Life cycle management
                if (this.z < -1000 || this.opacity <= 0) {
                    this.reset();
                }
            }
        }

        const activeWords = [];
        let phraseIndex = 0;

        function init() {
            // Create initial particles/words
            for (let i = 0; i < 15; i++) {
                createWordFromPhrase();
            }
            animate();
        }

        function createWordFromPhrase() {
            const phraseObj = phrases[phraseIndex];
            activeWords.push(new KineticWord(phraseObj.text, phraseObj.type === 'highlight'));
            
            // Cycle through the array of words
            phraseIndex = (phraseIndex + 1) % phrases.length;

            // Staggered timing for new words appearing
            setTimeout(() => {
                createWordFromPhrase();
            }, 800);
        }

        function animate() {
            activeWords.forEach(word => word.update());
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            // Refresh logic if needed, but CSS handles responsiveness well here
        });

        init();
    </script>
</body>
</html>
