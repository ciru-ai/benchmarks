<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Swarm Monitor</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #f87171;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .stats-summary {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .stat-value {
            color: var(--accent);
            font-weight: bold;
            margin-left: 5px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .worker-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
            border: 1px solid #334155;
        }

        .worker-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .worker-id {
            font-weight: bold;
            letter-spacing: 0.5px;
            color: var(--accent);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-online { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-busy { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
        .status-error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .metric-label { color: #94a3b8; }
        .metric-value { font-family: monospace; font-weight: bold; }

        canvas {
            width: 100%;
            height: 40px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1 style="margin:0; font-size: 1.5rem;">AI Swarm Control Center</h1>
        <div id="clock" style="font-family: monospace; color: #64748b;"></div>
    </div>
    <div class="stats-summary">
        <div class="stat-item">ACTIVE: <span class="stat-value" id="total-active">0</span></div>
        <div class="stat-item">LOAD: <span class="stat-value" id="avg-load">0%</span></div>
    </div>
</header>

<div class="dashboard-grid" id="dashboard">
    <!-- Cards generated by JS -->
</div>

<script>
    const TOTAL_WORKERS = 32;
    const workers = [];
    const dashboard = document.getElementById('dashboard');

    // Initialize Worker Data
    function init() {
        for (let i = 1; i <= TOTAL_WORKERS; i++) {
            workers.push({
                id: `AGENT-${i.toString().padStart(2, '0')}`,
                status: 'online',
                load: Math.floor(Math.random() * 30) + 10,
                tokens: Math.floor(Math.random() * 500),
                history: Array.from({length: 20}, () => Math.floor(Math.random() * 40) + 10)
            });

            const card = document.createElement('div');
            card.className = 'worker-card';
            card.id = `card-${i}`;
            card.innerHTML = `
                <div class="card-header">
                    <span class="worker-id">${workers[i-1].id}</span>
                    <span id="status-${i}" class="status-indicator status-online"></span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">CPU Load</span>
                    <span class="metric-value" id="load-${i}">${workers[i-1].load}%</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Tokens/s</span>
                    <span class="metric-value" id="token-${i}">${workers[i-1].tokens}</span>
                </div>
                <canvas id="chart-${i}" width="240" height="40"></canvas>
            `;
            dashboard.appendChild(card);
        }
    }

    function drawSparkline(workerIdx) {
        const canvas = document.getElementById(`chart-${workerIdx + 1}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const data = workers[workerIdx].history;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';

        const step = canvas.width / (data.length - 1);
        for(let i = 0; i < data.length; i++) {
            // Scale value to height (assuming max load is ~100)
            const x = i * step;
            const y = canvas.height - (data[i] / 100 * canvas.height);
            if(i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Fill area
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, 'rgba(56, 189, 248, 0.3)');
        gradient.addColorStop(1, 'rgba(56, 189, 248, 0)');
        ctx.fillStyle = gradient;
        ctx.fill();
    }

    function update() {
        let totalLoad = 0;
        let activeCount = 0;

        workers.forEach((w, i) => {
            // Randomize values for "live" effect
            const change = (Math.random() - 0.5) * 10;
            w.load = Math.max(5, Math.min(98, w.load + change));
            w.tokens = Math.max(10, Math.floor(w.tokens + (Math.random() - 0.4) * 20));
            
            // Update history array for sparkline
            w.history.push(w.load);
            if(w.history.length > 20) w.history.shift();

            // Randomly change status
            const rand = Math.random();
            let statusClass = 'status-online';
            if (rand > 0.95) {
                statusClass = 'status-error';
                w.load = 98;
            } else if (rand > 0.7) {
                statusClass = 'status-busy';
            }

            // Update DOM
            document.getElementById(`status-${i+1}`).className = `status-indicator ${statusClass}`;
            document.getElementById(`load-${i+1}`).innerText = `${Math.round(w.load)}%`;
            document.getElementById(`token-${i+1}`).innerText = w.tokens;

            drawSparkline(i);

            // Summary Stats logic
            totalLoad += w.load;
            if (statusClass !== 'status-error') activeCount++;
        });

        document.getElementById('total-active').innerText = `${activeCount}/${TOTAL_WORKERS}`;
        document.getElementById('avg-load').innerText = `${Math.round(totalLoad / TOTAL_WORKERS)}%`;
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString();
    }

    // Start system
    init();
    setInterval(update, 1000); // Update data every second
    setInterval(updateClock, 1000);
</script>

</body>
</html>
