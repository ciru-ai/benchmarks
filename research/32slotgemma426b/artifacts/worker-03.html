<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Neon Cube Field</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            pointer-events: none;
            user-select: none;
        }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; }
        p { margin: 5px 0; opacity: 0.8; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Neon Matrix</h1>
        <p>Camera: Auto-Orbiting</p>
        <p>Cubes: Procedural Neon Field</p>
    </div>

    <!-- Load Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white light
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00ffff, 2, 50);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        // --- Cube Field Creation ---
        const cubeCount = 400;
        const cubes = [];
        const geometry = new THREE.BoxGeometry(1, 1, 1);

        // Colors for the neon effect (Cyan, Magenta, Lime)
        const colors = [0x00ffff, 0xff00ff, 0x39ff14];

        for (let i = 0; i < cubeCount; i++) {
            // Use MeshStandardMaterial with high metalness/low roughness for "glow" look
            const material = new THREE.MeshStandardMaterial({
                color: colors[Math.floor(Math.random() * colors.length)],
                emissive: colors[Math.floor(Math.random() * colors.length)],
                emissiveIntensity: 2,
                metalness: 0.8,
                roughness: 0.2
            });

            const cube = new THREE.Mesh(geometry, material);

            // Random positions in a large volume
            cube.position.x = (Math.random() - 0.5) * 100;
            cube.position.y = (Math.random() - 0.5) * 100;
            cube.position.z = (Math.random() - 0.5) * 100;

            // Random rotation starts
            cube.rotation.x = Math.random() * Math.PI;
            cube.rotation.y = Math.random() * Math.PI;

            // Store initial scale for animation variety
            cube.userData.rotSpeed = (Math.random() - 0.5) * 0.02;
            cube.userData.scaleTarget = Math.random();

            scene.add(cube);
            cubes.push(cube);
        }

        // Add a starfield/dust effect using Points
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 150;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.1, color: 0xffffff });
        const starField = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(starField);

        // --- Animation Loop ---
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Rotate Cubes
            cubes.forEach((cube, index) => {
                cube.rotation.x += cube.userData.rotSpeed;
                cube.rotation.y += cube.userData.rotSpeed * 0.5;
                
                // Subtle pulsing effect
                const pulse = Math.sin(time + index) * 0.2 + 1;
                cube.scale.set(pulse, pulse, pulse);
            });

            // Animate Camera (Orbiting movement)
            camera.position.x = Math.sin(time * 0.3) * 40;
            camera.position.z = Math.cos(time * 0.3) * 40;
            camera.position.y = Math.sin(time * 0.2) * 15;
            camera.lookAt(0, 0, 0);

            // Rotate starfield slightly for depth perception
            starField.rotation.y += 0.0005;

            renderer.render(scene, camera);
        }

        // --- Handle Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
