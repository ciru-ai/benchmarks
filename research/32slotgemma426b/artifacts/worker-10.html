<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Runner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.2);
            border: 4px solid #0f3460;
        }

        canvas {
            display: block;
            background-color: #16213e;
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
            text-shadow: 2px 2px #000;
        }

        #gameOverScreen {
            display: none;
            pointer-events: auto;
            background: rgba(15, 52, 96, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #e94560;
        }

        h1 { margin: 0 0 10px 0; color: #e94560; }
        p { margin-bottom: 20px; font-size: 18px; }

        button {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #e94560;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover { background-color: #ff4d6d; }
        button:active { transform: scale(0.95); }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="scoreBoard">Score: 0</div>
    
    <div id="uiLayer">
        <div id="gameOverScreen">
            <h1>GAME OVER</h1>
            <p id="finalScoreText">Score: 0</p>
            <button onclick="resetGame()">RESTART</button>
        </div>
        <div class="controls-hint" id="hint">Press SPACE or CLICK to Jump</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('scoreBoard');
    const finalScoreText = document.getElementById('finalScoreText');
    const gameOverScreen = document.getElementById('gameOverScreen');

    // Game Constants
    canvas.width = 800;
    canvas.height = 400;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -12;
    const INITIAL_SPEED = 5;
    const SPEED_INCREMENT = 0.001;

    // Game State
    let score = 0;
    let gameActive = true;
    let speed = INITIAL_SPEED;
    let obstacles = [];
    let frameCount = 0;

    const player = {
        x: 80,
        y: canvas.height - 50,
        width: 35,
        height: 35,
        velocityY: 0,
        color: '#4ecca3',
        jump() {
            if (this.y === canvas.height - this.height) {
                this.velocityY = JUMP_FORCE;
            }
        },
        update() {
            this.velocityY += GRAVITY;
            this.y += this.velocityY;

            // Floor collision
            if (this.y > canvas.height - this.height) {
                this.y = canvas.height - this.height;
                this.velocityY = 0;
            }
        },
        draw() {
            ctx.fillStyle = this.color;
            // Add a little "pulse" effect to player
            const pulse = Math.sin(Date.now() / 100) * 3;
            ctx.fillRect(this.x - pulse/2, this.y - pulse/2, this.width + pulse, this.height + pulse);
        }
    };

    class Obstacle {
        constructor() {
            this.width = 30 + Math.random() * 40;
            this.height = 30 + Math.random() * 50;
            this.x = canvas.width;
            this.y = canvas.height - this.height;
            this.color = '#e94560';
        }

        update() {
            this.x -= speed;
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.width, this.height);
            // Glow effect
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
            ctx.shadowBlur = 0;
        }
    }

    function spawnObstacle() {
        const minGap = 70; // minimum frames between obstacles
        if (frameCount > frameCount + minGap) {
             // logic handled by random probability to vary distance
        }
        // Randomly spawn based on speed and chance
        if (Math.random() < 0.02 && frameCount % 10 === 0) {
            obstacles.push(new Obstacle());
        }
    }

    function checkCollision(p, o) {
        return p.x < o.x + o.width &&
               p.x + p.width > o.x &&
               p.y < o.y + o.height &&
               p.y + p.height > o.y;
    }

    function resetGame() {
        score = 0;
        speed = INITIAL_SPEED;
        obstacles = [];
        gameActive = true;
        frameCount = 0;
        player.y = canvas.height - player.height;
        player.velocityY = 0;
        gameOverScreen.style.display = 'none';
        scoreElement.innerText = `Score: 0`;
        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        gameActive = false;
        finalScoreText.innerText = `Final Score: ${Math.floor(score)}`;
        gameOverScreen.style.display = 'block';
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') player.jump();
    });
    canvas.addEventListener('mousedown', () => player.jump());
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        player.jump();
    }, {passive: false});

    function gameLoop() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background Grid Effect
        ctx.strokeStyle = '#1f4068';
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=50) {
            ctx.beginPath(); ctx.moveTo(i - (frameCount % 50), 0); ctx.lineTo(i - (frameCount % 50), canvas.height); ctx.stroke();
        }

        // Update Player
        player.update();
        player.draw();

        // Handle Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].update();
            obstacles[i].draw();

            // Collision Detection
            if (checkCollision(player, obstacles[i])) {
                gameOver();
            }

            // Remove off-screen obstacles and increase score
            if (obstacles[i].x + obstacles[i].width < 0) {
                obstacles.splice(i, 1);
                score += 10;
                speed += SPEED_INCREMENT; // Speed ramping
                scoreElement.innerText = `Score: ${Math.floor(score)}`;
            }
        }

        // Spawn logic (frequency increases with speed)
        if (frameCount % Math.max(20, Math.floor(60 - speed)) === 0) {
             if (Math.random() < 0.3) obstacles.push(new Obstacle());
        }

        frameCount++;
        requestAnimationFrame(gameLoop);
    }

    // Start the game
    resetGame();
</script>
</body>
</html>
