<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Journey Timeline</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 40% 60%;
            height: 100vh;
        }

        /* Left Side: Timeline Navigation */
        .timeline-nav {
            padding: 2rem;
            border-right: 1px solid #334155;
            overflow-y: auto;
            position: relative;
        }

        h1 { margin-bottom: 2rem; font-size: 1.5rem; color: var(--primary); }

        .timeline-track {
            position: absolute;
            left: 40px;
            top: 100px;
            bottom: 50px;
            width: 4px;
            background: #334155;
            z-index: 1;
        }

        .progress-bar {
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 0%;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            transition: height 0.3s ease;
        }

        .milestone {
            position: relative;
            padding-left: 50px;
            margin-bottom: 2.5rem;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.2s ease;
        }

        .milestone:hover { transform: translateX(10px); }

        .dot {
            position: absolute;
            left: -7px;
            top: 5px;
            width: 18px;
            height: 18px;
            background: var(--bg);
            border: 4px solid #334155;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .milestone.active .dot {
            background: var(--primary);
            border-color: var(--secondary);
            box-shadow: 0 0 15px var(--primary);
        }

        .milestone-content h3 { font-size: 1rem; margin-bottom: 4px; }
        .milestone-content span { font-size: 0.85rem; color: var(--text-muted); }

        /* Right Side: Detail Panel */
        .detail-panel {
            padding: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .card {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.active {
            opacity: 1;
            transform: translateY(0);
        }

        .card h2 { font-size: 2.5rem; margin-bottom: 1rem; color: var(--primary); }
        .card .date { display: block; font-weight: bold; color: var(--secondary); margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .card p { font-size: 1.1rem; color: var(--text-muted); line-height: 1.8; }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
            .timeline-nav { height: auto; border-right: none; padding-bottom: 4rem; }
            .detail-panel { min-height: 50vh; padding: 2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Timeline Selection -->
    <aside class="timeline-nav">
        <h1>Project Roadmap</h1>
        <div class="timeline-track">
            <div id="progress" class="progress-bar"></div>
        </div>

        <div id="milestones-list">
            <!-- Milestones injected via JS -->
        </div>
    </aside>

    <!-- Detail Display -->
    <main class="detail-panel">
        <div id="detail-card" class="card">
            <span class="date" id="detail-date"></span>
            <h2 id="detail-title">Select a milestone</h2>
            <p id="detail-desc">Click on the timeline to explore the journey of our innovation.</p>
        </div>
    </main>
</div>

<script>
    const data = [
        {
            id: 1,
            year: "JANUARY 2023",
            title: "The Concept",
            desc: "Everything started with a simple idea in a small garage. We identified the core problem and sketched out the first architectural diagrams that would form our foundation."
        },
        {
            id: 2,
            year: "MARCH 2023",
            title: "Prototype Phase",
            desc: "Our engineering team spent months building a functional MVP. It was messy and unpolished, but it proved that the core logic worked as intended."
        },
        {
            id: 3,
            year: "AUGUST 2023",
            title: "Beta Launch",
            desc: "We released our first closed beta to a select group of 100 users. The feedback was overwhelming and helped us refine the user experience significantly."
        },
        {
            id: 4,
            year: "DECEMBER 2023",
            title: "Global Expansion",
            desc: "Scaling our infrastructure to support thousands of concurrent users across three continents. This marked our transition from a startup to a global player."
        },
        {
            id: 5,
            year: "CURRENTLY",
            title: "Continuous Evolution",
            desc: "We are now integrating AI-driven insights and expanding our ecosystem of integrations to provide even more value to our community."
        }
    ];

    const milestonesList = document.getElementById('milestones-list');
    const detailCard = document.getElementById('detail-card');
    const progressBar = document.getElementById('progress');
    
    // DOM Elements for content updates
    const dTitle = document.getElementById('detail-title');
    const dDate = document.getElementById('detail-date');
    const dDesc = document.getElementById('detail-desc');

    function init() {
        data.forEach((item, index) => {
            const milestoneDiv = document.createElement('div');
            milestoneDiv.className = 'milestone';
            if(index === 0) milestoneDiv.classList.add('active');
            milestoneDiv.dataset.id = item.id;
            
            milestoneDiv.innerHTML = `
                <div class="dot"></div>
                <div class="milestone-content">
                    <h3>${item.title}</h3>
                    <span>${item.year}</span>
                </div>
            `;

            milestoneDiv.addEventListener('click', () => selectMilestone(item, milestoneDiv));
            milestonesList.appendChild(milestoneDiv);
        });

        // Set initial state
        selectMilestone(data[0], document.querySelector('.milestone'));
    }

    function selectMilestone(item, element) {
        // Update Active State in Sidebar
        document.querySelectorAll('.milestone').forEach(m => m.classList.remove('active'));
        element.classList.add('active');

        // Update Progress Bar Height
        const allMilestones = Array.from(document.querySelectorAll('.milestone'));
        const index = allMilestones.indexOf(element);
        const progressPercent = (index / (data.length - 1)) * 100;
        progressBar.style.height = `${progressPercent}%`;

        // Update Detail Card with animation trigger
        detailCard.classList.remove('active');
        
        setTimeout(() => {
            dTitle.textContent = item.title;
            dDate.textContent = item.year;
            dDesc.textContent = item.desc;
            detailCard.classList.add('active');
        }, 300);
    }

    // Initialize the page
    init();
</script>

</body>
</html>
