<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynthWave Visualizer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.8);
            padding: 15px 25px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            user-select: none;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type=range] {
            cursor: pointer;
            accent-color: #ff007a;
        }

        .label-val {
            min-width: 35px;
            text-align: right;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="status">SYNTHETIC AUDIO SIMULATION ACTIVE</div>

    <div id="ui-layer">
        <div class="control-group">
            <span>Intensity</span>
            <input type="range" id="intensity" min="1" max="10" step="0.1" value="5">
        </div>
        <div class="control-group">
            <span>Speed</span>
            <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <span>Color Shift</span>
            <input type="range" id="colorShift" min="0" max="360" step="1" value="280">
        </div>
    </div>

    <canvas id="visualizer"></canvas>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const intensityInput = document.getElementById('intensity');
        const speedInput = document.getElementById('speed');
        const colorInput = document.getElementById('colorShift');

        let width, height;
        let bars = [];
        const barCount = 64;
        let frame = 0;

        // Simulation variables (The "Fake" Audio Data)
        let beatPulse = 0;
        let targetBeatPulse = 0;
        let audioData = new Array(barCount).fill(0);

        function init() {
            resize();
            createBars();
            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function createBars() {
            bars = [];
            for (let i = 0; i < barCount; i++) {
                bars.push({
                    x: 0,
                    w: width / barCount + 4,
                    h: 0,
                    targetH: 0
                });
            }
        }

        function updateSimulation() {
            const intensity = parseFloat(intensityInput.value);
            const speed = parseFloat(speedInput.value);
            
            frame += 0.05 * speed;

            // Simulate a rhythmic beat pulse every ~60 frames
            if (Math.random() > 0.97) {
                targetBeatPulse = intensity * 50;
            }
            beatPulse += (targetBeatPulse - beatPulse) * 0.15;
            targetBeatPulse *= 0.85;

            // Generate fake frequency data
            for (let i = 0; i < barCount; i++) {
                const noise = Math.sin(frame + i * 0.2) * 20;
                const beatEffect = Math.sin((frame * speed) + (i * 0.1)) * (beatPulse * intensity);
                // Create complex waveform pattern using multiple sine waves
                const wave = Math.sin(frame * 0.5 + i * 0.3) * 40;
                const randomJitter = Math.random() * (intensity * 5);
                
                audioData[i] = Math.max(10, 200 + beatEffect + wave + noise + randomJitter);
            }

            // Update bar heights and positions
            bars.forEach((bar, i) => {
                bar.w = (width / barCount) * 0.8;
                bar.x = i * (width / barCount);
                bar.h = audioData[i] * intensity;
            });
        }

        function drawWaveform() {
            ctx.beginPath();
            ctx.lineWidth = 2;
            const hueBase = parseInt(colorInput.value);
            ctx.strokeStyle = `hsla(${hueBase}, 80%, 60%, 0.5)`;

            for (let i = 0; i < barCount; i++) {
                const x = bars[i].x + bars[i].w / 2;
                const y = height / 2 - audioData[i] * 0.5;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function drawBars() {
            const hueBase = parseInt(colorInput.value);
            bars.forEach((bar, i) => {
                // Gradient for bars
                const grad = ctx.createLinearGradient(0, height / 2 - bar.h/2, 0, height / 2 + bar.h/2);
                grad.addColorStop(0, `hsla(${hueBase}, 80%, 60%, 0)`);
                grad.addColorStop(0.5, `hsla(${(hueBase + 40) % 360}, 80%, 60%, 1)`);
                grad.addColorStop(1, `hsla(${hueBase}, 80%, 60%, 0)`);

                ctx.fillStyle = grad;
                
                // Draw symmetric bars (top and bottom)
                const barHeight = bar.h * 2;
                ctx.fillRect(bar.x, height / 2 - bar.h, bar.w, bar.h); // Top half
                ctx.fillRect(bar.x, height / 2, bar.w, bar.h);        // Bottom half (inverted style)
            });
        }

        function drawBackground() {
            // Dark trail effect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
            ctx.fillRect(0, 0, width, height);

            // Center Glow
            const glow = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width * 0.6);
            glow.addColorStop(0, `hsla(${colorInput.value}, 50%, 10%, ${beatPulse / 1000})`);
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);
        }

        function animate() {
            updateSimulation();
            drawBackground();
            drawWaveform();
            drawBars();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
    </script>
</body>
</html>
