<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starship Command Interface</title>
    <style>
        :root {
            --panel-bg: #1a1a2e;
            --display-bg: #0f3460;
            --text-color: #00ffcc;
            --warning: #ff4d4d;
            --accent: #4ecca3;
        }

        body {
            background-color: #050505;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #control-panel {
            background: var(--panel-bg);
            width: 90vw;
            max-width: 1000px;
            height: 80vh;
            border: 4px solid #333;
            border-radius: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            grid-template-rows: auto 1fr auto;
            gap: 15px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2);
        }

        /* Header / Status Bar */
        header {
            grid-column: span 3;
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* Gauges Section */
        .gauges {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .gauge-container {
            background: #000;
            padding: 15px;
            border: 1px solid var(--accent);
            text-align: center;
        }

        .gauge-bar-bg {
            width: 100%;
            height: 20px;
            background: #222;
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
        }

        .gauge-fill {
            height: 100%;
            width: 50%;
            background: var(--accent);
            transition: width 0.3s ease, background 0.5s;
        }

        /* Controls Section */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: #222;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 15px 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--accent);
            color: #000;
        }

        button:active {
            transform: scale(0.95);
        }

        button.danger {
            border-color: var(--warning);
            color: var(--warning);
        }

        button.danger:hover {
            background: var(--warning);
            color: #000;
        }

        /* Log Section */
        .log-panel {
            background: black;
            border: 1px solid #444;
            padding: 10px;
            font-size: 0.85rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
        }

        .log-entry { margin-bottom: 5px; }
        .log-time { color: #888; margin-right: 10px; }
        .log-warn { color: var(--warning); font-weight: bold; }

        /* Warning Light */
        #alert-light {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #300;
            box-shadow: inset 0 0 10px #000;
            display: inline-block;
        }

        .alert-active {
            animation: blink 0.5s infinite alternate;
            background: var(--warning) !important;
            box-shadow: 0 0 20px var(--warning);
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

    </style>
</head>
<body>

<div id="control-panel">
    <header>
        <span>USS-ENTERPRISE // STATUS: <span id="ship-status">NOMINAL</span></span>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="clock">00:00:00</span>
            <div id="alert-light"></div>
        </div>
    </header>

    <section class="gauges">
        <div class="gauge-container">
            <div>ENGINE OUTPUT</div>
            <div class="gauge-bar-bg"><div id="engine-fill" class="gauge-fill"></div></div>
        </div>
        <div class="gauge-container">
            <div>SHIELD INTEGRITY</div>
            <div class="gauge-bar-bg"><div id="shield-fill" class="gauge-fill"></div></div>
        </div>
        <div class="gauge-container">
            <div>OXYGEN LEVEL</div>
            <div class="gauge-bar-bg"><div id="oxygen-fill" class="gauge-fill"></div></div>
        </div>
    </section>

    <section class="controls">
        <button onclick="adjustEngine(10)">Engage Warp</button>
        <button onclick="adjustEngine(-10)">Reduce Power</button>
        <button onclick="repairShields()">Repair Shields</button>
        <button onclick="toggleLifeSupport()" id="life-support-btn">LS: ON</button>
        <button class="danger" style="grid-column: span 2;" onclick="triggerEmergency()">EMERGENCY VENT</button>
    </section>

    <section class="log-panel" id="log-display">
        <!-- Logs appear here -->
    </section>
</div>

<script>
    // State Management
    let state = {
        engine: 40,
        shields: 100,
        oxygen: 95,
        lifeSupport: true,
        isAlert: false,
        status: 'NOMINAL'
    };

    const logDisplay = document.getElementById('log-display');
    const alertLight = document.getElementById('alert-light');

    // Helper functions
    function addLog(msg, type = '') {
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        const time = new Date().toLocaleTimeString([], { hour12: false });
        entry.innerHTML = `<span class="log-time">[${time}]</span><span>${msg}</span>`;
        logDisplay.prepend(entry);
    }

    function updateUI() {
        // Update Gauges
        document.getElementById('engine-fill').style.width = `${state.engine}%`;
        document.getElementById('shield-fill').style.width = `${state.shields}%`;
        document.getElementById('oxygen-fill').style.width = `${state.oxygen}%`;

        // Color logic for gauges
        document.getElementById('shield-fill').style.background = state.shields < 30 ? 'var(--warning)' : 'var(--accent)';
        document.getElementById('engine-fill').style.background = state.engine > 90 ? '#ffcc00' : 'var(--accent)';

        // Status Text and Alert Light
        const statusEl = document.getElementById('ship-status');
        if (state.shields < 30 || state.oxygen < 25) {
            state.isAlert = true;
            statusEl.innerText = "CRITICAL";
            statusEl.style.color = "var(--warning)";
            alertLight.classList.add('alert-active');
        } else if (state.engine > 90) {
            state.isAlert = false;
            statusEl.innerText = "OVERLOAD";
            statusEl.style.color = "#ffcc00";
            alertLight.classList.remove('alert-active');
        } else {
            state.isAlert = false;
            statusEl.innerText = "NOMINAL";
            statusEl.style.color = "var(--text-color)";
            alertLight.classList.remove('alert-active');
        }

        document.getElementById('life-support-btn').innerText = `LS: ${state.lifeSupport ? 'ON' : 'OFF'}`;
    }

    // Control Actions
    function adjustEngine(val) {
        state.engine = Math.min(100, Math.max(0, state.engine + val));
        addLog(`Engine output adjusted to ${state.engine}%`);
        updateUI();
    }

    function repairShields() {
        if (state.shields < 100) {
            state.shields = Math.min(100, state.shields + 15);
            addLog("Shield reinforcement sequence initiated.");
            updateUI();
        } else {
            addLog("Shields at maximum capacity.");
        }
    }

    function toggleLifeSupport() {
        state.lifeSupport = !state.lifeSupport;
        addLog(`Life support toggled: ${state.lifeSupport ? 'ENABLED' : 'DISABLED'}`, state.lifeSupport ? '' : 'log-warn');
        updateUI();
    }

    function triggerEmergency() {
        state.engine = 0;
        state.shields -= 20;
        addLog("!!! EMERGENCY VENTING INITIATED !!!", "log-warn");
        updateUI();
    }

    // Simulation Loop (Passive decay/events)
    setInterval(() => {
        // Oxygen decays if life support is off or engine is high
        if (!state.lifeSupport) {
            state.oxygen = Math.max(0, state.oxygen - 1);
        } else {
            state.oxygen = Math.min(100, state.oxygen + 0.2);
        }

        // Random damage events
        if (Math.random() > 0.98 && state.shields < 100) {
            const dmg = Math.floor(Math.random() * 5) + 1;
            state.shields = Math.max(0, state.shields - dmg);
            addLog(`Micrometeoroid impact! Shields lost ${dmg}%`, 'log-warn');
        }

        // Engine heat/drain logic
        if (state.engine > 80) {
            state.oxygen -= 0.1; // High engine usage consumes more air
        }

        updateUI();
    }, 2000);

    // Clock update
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour12: false });
    }, 1000);

    // Init
    addLog("System Boot Sequence Complete.");
    addLog("All systems operational.");
    updateUI();

</script>
</body>
</html>
