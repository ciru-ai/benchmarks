<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Interactive Scene</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: monospace; }
        canvas { display: block; }
        #overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            pointer-events: none;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="overlay">FPS: <span id="fps">60</span></div>

    <!-- Import Map for Three.js Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration & Variables ---
        let scene, camera, renderer, torusKnot, stars;
        let mouseX = 0, mouseY = 0;
        const targetRotationX = 0, targetRotationY = 0;
        let currentRotationX = 0, currentRotationY = 0;

        // FPS Tracking
        const fpsDisplay = document.getElementById('fps');
        let lastTime = performance.now();
        let frameCount = 0;

        init();
        animate();

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Torus Knot
            const geometry = new THREE.TorusKnotGeometry(1, 0.3, 150, 20);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x00ffcc, 
                metalness: 0.7, 
                roughness: 0.2,
                wireframe: true 
            });
            torusKnot = new THREE.Mesh(geometry, material);
            scene.add(torusKnot);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0xff00ff, 2);
            pointLight1.position.set(5, 5, 5);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x00ffff, 2);
            pointLight2.position.set(-5, -5, 5);
            scene.add(pointLight2);

            // Starfield (Particles)
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff });
            const starVertices = [];
            for (let i = 0; i < 5000; i++) {
                const x = (Math.random() - 0.5) * 100;
                const y = (Math.random() - 0.5) * 100;
                const z = (Math.random() - 0.5) * 100;
                starVertices.push(x, y, z);
            }
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            // Event Listeners
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);
        }

        function onMouseMove(event) {
            // Normalize mouse coordinates from -1 to +1
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            frameCount++;

            // FPS Calculation every second
            if (time >= lastTime + 1000) {
                fpsDisplay.innerText = frameCount;
                frameCount = 0;
                lastTime = time;
            }

            // Rotate Torus Knot
            torusKnot.rotation.x += 0.01;
            torusKnot.rotation.y += 0.015;

            // Mouse Parallax Effect (Smoothing)
            targetRotationY = mouseX * 0.5;
            targetRotationX = mouseY * 0.5;
            
            currentRotationX += (targetRotationX - currentRotationX) * 0.05;
            currentRotationY += (targetRotationY - currentRotationY) * 0.05;

            camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            // Subtle star movement
            stars.rotation.y -= 0.0005;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
