<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynthWave Visualizer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.8);
            padding: 15px 25px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            align-items: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type=range] {
            cursor: pointer;
            accent-color: #ff0055;
        }

        .label {
            margin-bottom: 5px;
            opacity: 0.7;
        }

        h1 {
            position: absolute;
            top: 20px;
            left: 30px;
            color: white;
            font-weight: 200;
            letter-spacing: 5px;
            margin: 0;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <h1>SYNTH_VISUAL</h1>

    <div class="controls">
        <div class="control-group">
            <span class="label">Intensity</span>
            <input type="range" id="intensity" min="0.5" max="3" step="0.1" value="1.5">
        </div>
        <div class="control-group">
            <span class="label">Speed</span>
            <input type="range" id="speed" min="0.2" max="2" step="0.1" value="1">
        </div>
        <div class="control-group">
            <span class="label">Color Shift</span>
            <input type="range" id="hue" min="0" max="360" step="1" value="280">
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const intensityInput = document.getElementById('intensity');
        const speedInput = document.getElementById('speed');
        const hueInput = document.getElementById('hue');

        let width, height;
        let bars = [];
        const barCount = 64;
        let frame = 0;
        let beatPulse = 0;

        // Configuration
        class Bar {
            constructor(index) {
                this.index = index;
                this.reset();
            }

            reset() {
                this.height = Math.random() * height / 2;
                this.targetHeight = this.height;
                this.offset = (Math.sin(this.index * 0.5) * 100);
            }

            update(intensity, speed) {
                // Simulate audio frequency fluctuation using sine waves + randomness
                const noise = Math.sin(frame * 0.02 * speed + this.index) * 50;
                const pulseMod = beatPulse * 150 * intensity;
                this.targetHeight = (Math.abs(noise) + (beatPulse * 300)) * intensity;
                
                // Smooth transition to target height
                this.height += (this.targetHeight - this.height) * 0.2;
            }

            draw(ctx, hueBase) {
                const barWidth = width / barCount;
                const x = this.index * barWidth;
                const y = height / 2 - this.height / 2;

                // Create Gradient
                const grad = ctx.createLinearGradient(0, height/2 - this.height, 0, height/2 + this.height);
                grad.addColorStop(0, `hsla(${hueBase}, 80%, 60%, 0)`);
                grad.addColorStop(0.5, `hsla(${(hueBase + 40) % 360}, 100%, 50%, ${0.5 * beatPulse + 0.2})`);
                grad.addColorStop(1, `hsla(${hueBase}, 80%, 60%, 0)`);

                ctx.fillStyle = grad;
                ctx.fillRect(x + 2, y, barWidth - 4, this.height);
            }
        }

        function init() {
            resize();
            bars = [];
            for (let i = 0; i < barCount; i++) {
                bars.push(new Bar(i));
            }
            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);

        function drawWaveform() {
            ctx.beginPath();
            ctx.lineWidth = 3;
            const hueBase = parseInt(hueInput.value);
            
            for (let i = 0; i <= barCount; i++) {
                const x = (i / barCount) * width;
                // Create a complex waveform using multiple sine waves
                const wave1 = Math.sin(i * 0.2 + frame * 0.05);
                const wave2 = Math.sin(i * 0.5 - frame * 0.1);
                const wave3 = Math.cos(frame * 0.02);
                
                const y = (height / 2) + (wave1 * wave2 * wave3 * 100 * intensityInput.value * beatPulse);

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = `hsla(${hueBase}, 100%, 70%, ${beatPulse})`;
            ctx.shadowBlur = 20 * beatPulse;
            ctx.shadowColor = `hsla(${hueBase}, 100%, 50%, 1)`;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear with slight trail effect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
            ctx.fillRect(0, 0, width, height);

            frame++;

            // Simulate a "beat" every ~60 frames using a decaying sine wave pulse
            // This creates the rhythmic pulsing effect without audio
            const beatCycle = Math.sin(frame * 0.15);
            if (beatCycle > 0.9) {
                beatPulse += (beatCycle - beatPulse) * 0.3;
            } else {
                beatPulse *= 0.92; // Decay
            }

            const intensity = parseFloat(intensityInput.value);
            const speed = parseFloat(speedInput.value);
            const hueBase = parseInt(hueInput.value);

            // Draw Background Grid/Glow
            ctx.strokeStyle = `rgba(${Math.sin(frame*0.01)*50 + 20}, 0, ${Math.cos(frame*0.01)*50 + 20}, 0.1)`;
            ctx.lineWidth = 1;
            for(let i=0; i<width; i+=100) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();
            }
            for(let j=0; j<height; j+=100) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(width, j); ctx.stroke();
            }

            // Draw Bars
            bars.forEach(bar => {
                bar.update(intensity, speed);
                bar.draw(ctx, hueBase);
            });

            drawWaveform();

            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
