<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Video Experience</title>
    <style>
        :root {
            --bg-color: #0a0a12;
            --accent-color: #00f2ff;
            --text-color: #ffffff;
            --secondary-color: #7000ff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Background Animated Shapes */
        .canvas-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            filter: blur(60px);
            border-radius: 50%;
            opacity: 0.5;
            animation: float 20s infinite alternate ease-in-out;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-color);
            top: -10%;
            left: -10%;
            animation-duration: 25s;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: var(--secondary-color);
            bottom: -10%;
            right: -10%;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(20vw, 20vh) rotate(180deg); }
            100% { transform: translate(-10vw, 30vh) rotate(360deg); }
        }

        /* Main Content Overlay */
        .overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-color);
            z-index: 10;
        }

        /* Countdown Styles */
        #countdown {
            font-size: 8rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -5px;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
        }

        /* Caption Styles */
        #caption {
            font-size: 1.5rem;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
        }

        #caption.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Progress Bar */
        .progress-container {
            position: absolute;
            bottom: 50px;
            width: 60%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
            box-shadow: 0 0 15px var(--accent-color);
        }

        /* Cinematic Glitch Effect */
        .glitch {
            animation: glitch-anim 2s infinite;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 2px 0 red, -2px 0 blue; }
            5% { text-shadow: -3px 0 red, 3px 0 blue; }
            10% { text-shadow: 2px 0 red, -2px 0 blue; }
            15% { text-shadow: none; }
        }

    </style>
</head>
<body>

    <div class="canvas-container">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="overlay">
        <h1 id="countdown" class="glitch">05</h1>
        <p id="caption">INITIALIZING SEQUENCE...</p>
    </div>

    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <script>
        const countdownEl = document.getElementById('countdown');
        const captionEl = document.getElementById('caption');
        const progressEl = document.getElementById('progress-bar');

        let timeLeft = 5;
        const totalTime = 5;

        // Captions sequence
        const captions = [
            "INITIALIZING SEQUENCE...",
            "LOADING ASSETS...",
            "STABILIZING CORE...",
            "PREPARING LAUNCH...",
            "SYSTEM READY."
        ];

        function updateVideo() {
            if (timeLeft > 0) {
                // Update Countdown Text
                countdownEl.textContent = timeLeft.toString().padStart(2, '0');
                
                // Update Progress Bar
                const progressPercent = ((totalTime - timeLeft) / totalTime) * 100;
                progressEl.style.width = `${progressPercent}%`;

                // Update Captions based on time
                const captionIndex = Math.floor(((totalTime - timeLeft) / totalTime) * captions.length);
                if (captionEl.textContent !== captions[captionIndex]) {
                    captionEl.classList.remove('visible');
                    setTimeout(() => {
                        captionEl.textContent = captions[captionIndex];
                        captionEl.classList.add('visible');
                    }, 300);
                }

                timeLeft--;
            } else {
                // Final State
                countdownEl.textContent = "GO";
                countdownEl.style.fontSize = "12rem";
                progressEl.style.width = "100%";
                captionEl.textContent = "ENGAGED";
                captionEl.classList.add('visible');
                
                // Trigger a final screen flash effect via JS
                document.body.style.backgroundColor = "#ffffff";
                setTimeout(() => {
                    document.body.style.transition = "background-color 2s ease";
                    document.body.style.backgroundColor = "#0a0a12";
                }, 100);

                // Loop the video experience after a delay
                setTimeout(resetSequence, 3000);
            }
        }

        function resetSequence() {
            timeLeft = totalTime;
            progressEl.style.width = "0%";
            countdownEl.style.fontSize = "8rem";
            updateVideo();
        }

        // Start the loop
        updateVideo();
        setInterval(() => {
            // This handles logic if we weren't using a controlled countdown, 
            // but here we use our custom interval logic inside updateVideo via timeout-like flow.
        }, 1000);

        // Manual Interval to drive the animation loop
        const timer = setInterval(() => {
            if (timeLeft <= 0 && countdownEl.textContent !== "GO") {
                // This is handled by the else block in updateVideo, 
                // but we need an interval that keeps running for the logic flow.
            }
        }, 1000);

        // Refined timing loop
        let clock = setInterval(() => {
            if (timeLeft > 0) {
                updateVideo();
            } else if (countdownEl.textContent === "GO") {
                // Just waiting for the resetSequence timeout
            } else {
                clearInterval(clock);
            }
        }, 1000);

    </script>
</body>
</html>
