<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Clicker</title>
    <style>
        :root {
            --bg-color: #0a0e14;
            --circuit-color: #1a2639;
            --accent-color: #00ffcc;
            --text-color: #e0f7fa;
            --panel-color: rgba(25, 35, 50, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            user-select: none;
        }

        /* Animated Circuit Background */
        #circuit-board {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #16213e 0%, #0a0e14 100%);
        }

        .trace {
            position: absolute;
            background: var(--circuit-color);
            z-index: -1;
        }

        @keyframes pulse {
            0% { opacity: 0.2; }
            50% { opacity: 0.6; color: var(--accent-color); }
            100% { opacity: 0.2; }
        }

        /* Game Layout */
        #game-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
        }

        /* Sidebar / Upgrades */
        #sidebar {
            background: var(--panel-color);
            border-right: 2px solid var(--accent-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .stat-panel {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--accent-color);
            text-align: center;
        }

        #score { font-size: 2rem; color: var(--accent-color); font-weight: bold; }
        #sps { font-size: 0.9rem; opacity: 0.8; }

        .upgrade-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .upgrade-card:hover {
            background: rgba(0, 255, 204, 0.1);
            border-color: var(--accent-color);
        }

        .upgrade-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .upgrade-name { font-weight: bold; display: block; }
        .upgrade-cost { font-size: 0.85rem; color: #ffcc00; }

        /* Main Click Area */
        #main-area {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #core-target {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px var(--accent-color);
            transition: transform 0.05s;
            position: relative;
        }

        #core-target:active {
            transform: scale(0.95);
        }

        #core-inner {
            width: 160px;
            height: 160px;
            background: #0a0e14;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border: 4px solid var(--accent-color);
        }

        /* Floating Text */
        .floating-text {
            position: absolute;
            color: var(--accent-color);
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="circuit-board"></div>

<div id="game-container">
    <aside id="sidebar">
        <h2 style="margin-top:0; color: var(--accent-color);">CIRCUIT CLICKER</h2>
        
        <div class="stat-panel">
            <div id="score">0</div>
            <div id="sps">Power: 0.0/s</div>
        </div>

        <div id="upgrades-list" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- Upgrades injected by JS -->
        </div>
    </aside>

    <main id="main-area">
        <div id="core-target">
            <div id="core-inner">CLICK CORE</div>
        </div>
    </main>
</div>

<script>
    // --- Game State ---
    const state = {
        bits: 0,
        bps: 0, // Bits Per Second (SPS)
        clickValue: 1,
        upgrades: [
            { id: 'capacitor', name: 'Capacitor', cost: 15, power: 1, count: 0, type: 'auto' },
            { id: 'resistor', name: 'Resistor Array', cost: 100, power: 5, count: 0, type: 'auto' },
            { id: 'transistor', name: 'Micro-Transistor', cost: 500, power: 20, count: 0, type: 'auto' },
            { id: 'processor', name: 'CPU Core', cost: 2500, power: 75, count: 0, type: 'auto' },
            { id: 'overclock', name: 'Overclocker', cost: 1000, power: 2, count: 0, type: 'click' }
        ]
    };

    // --- DOM Elements ---
    const scoreEl = document.getElementById('score');
    const spsEl = document.getElementById('sps');
    const coreTarget = document.getElementById('core-target');
    const upgradesList = document.getElementById('upgrades-list');
    const circuitBoard = document.getElementById('circuit-board');

    // --- Initialization ---
    function init() {
        createBackground();
        renderUpgrades();
        gameLoop();
    }

    // Create decorative lines for the background
    function createBackground() {
        for (let i = 0; i < 25; i++) {
            const line = document.createElement('div');
            line.className = 'trace';
            const isVert = Math.random() > 0.5;
            if (isVert) {
                line.style.width = '1px';
                line.style.height = (Math.random() * 40 + 20) + '%';
                line.style.left = Math.random() * 100 + '%';
            } else {
                line.style.height = '1px';
                line.style.width = (Math.random() * 40 + 20) + '%';
                line.style.top = Math.random() * 100 + '%';
            }
            line.style.opacity = Math.random() * 0.3;
            circuitBoard.appendChild(line);
        }
    }

    function renderUpgrades() {
        upgradesList.innerHTML = '';
        state.upgrades.forEach((u, index) => {
            const card = document.createElement('div');
            card.className = `upgrade-card ${state.bits < u.cost ? 'disabled' : ''}`;
            card.id = `upgrade-${index}`;
            card.innerHTML = `
                <span class="upgrade-name">${u.name} (${u.count})</span>
                <span class="upgrade-cost">Cost: ${Math.floor(u.cost)} bits | +${u.power}${u.type === 'click' ? ' per click' : '/s'}</span>
            `;
            card.onclick = () => buyUpgrade(index);
            upgradesList.appendChild(card);
        });
    }

    // --- Game Logic ---
    function updateDisplay() {
        scoreEl.innerText = Math.floor(state.bits).toLocaleString();
        spsEl.innerText = `Power: ${state.bps.toFixed(1)}/s`;

        // Update upgrade availability visual state
        state.upgrades.forEach((u, index) => {
            const el = document.getElementById(`upgrade-${index}`);
            if (el) {
                if (state.bits >= u.cost) {
                    el.classList.remove('disabled');
                } else {
                    el.classList.add('disabled');
                }
            }
        });
    }

    function buyUpgrade(index) {
        const upgrade = state.upgrades[index];
        if (state.bits >= upgrade.cost) {
            state.bits -= upgrade.cost;
            upgrade.count++;
            
            if (upgrade.type === 'auto') {
                state.bps += upgrade.power;
            } else {
                state.clickValue += upgrade.power;
            }

            // Increase cost for next purchase (exponential)
            upgrade.cost = Math.floor(upgrade.cost * 1.25);
            
            renderUpgrades();
            updateDisplay();
        }
    }

    function spawnFloatingText(x, y, val) {
        const text = document.createElement('div');
        text.className = 'floating-text';
        text.innerText = `+${val}`;
        text.style.left = `${x}px`;
        text.style.top = `${y}px`;
        document.body.appendChild(text);
        setTimeout(() => text.remove(), 1000);
    }

    // --- Loops ---
    coreTarget.addEventListener('click', (e) => {
        state.bits += state.clickValue;
        spawnFloatingText(e.clientX, e.clientY, state.clickValue);
        updateDisplay();
    });

    function gameLoop() {
        // Add bits based on BPS every 100ms (divided by 10)
        if (state.bps > 0) {
            state.bits += (state.bps / 10);
            updateDisplay();
        } else {
            // Even if no bps, we update display to show cost changes/availability
            updateDisplay();
        }
        setTimeout(gameLoop, 100);
    }

    init();
</script>

</body>
</html>
