<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Reflex</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --panel-color: #34495e;
            --text-color: #ecf0f1;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 600px;
            height: 400px;
            background-color: var(--panel-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            cursor: crosshair;
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .stat {
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        #target {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: none;
            transition: transform 0.1s ease;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        #target:active {
            transform: scale(0.8);
        }

        #menu, #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        h1 { margin-bottom: 10px; color: #3498db; }
        p { margin-bottom: 20px; text-align: center; line-height: 1.6; }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #2ecc71; }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #bdc3c7;
        }

        .hidden { display: none !important; }

        #last-score {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- UI Stats -->
        <div id="ui-layer">
            <div class="stat">Time: <span id="timer">30</span>s</div>
            <div class="stat">Score: <span id="score">0</span></div>
        </div>

        <!-- The Target -->
        <div id="target"></div>

        <!-- Main Menu -->
        <div id="menu">
            <h1>Color Reflex</h1>
            <p>Click the targets as fast as you can!<br>Don't let them disappear.</p>
            <button onclick="startGame()">START GAME</button>
            <div class="controls-hint">Goal: Maximize score in 30 seconds</div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over" class="hidden">
            <h1>Time's Up!</h1>
            <div id="last-score">Score: 0</div>
            <p>Your reaction speed matters!</p>
            <button onclick="startGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const target = document.getElementById('target');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const menu = document.getElementById('menu');
        const gameOverScreen = document.getElementById('game-over');
        const lastScoreEl = document.getElementById('last-score');

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let timerInterval;
        let targetTimeout;
        let startTime;

        const colors = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#e67e22'];

        function startGame() {
            // Reset variables
            score = 0;
            timeLeft = 30;
            gameActive = true;
            scoreEl.innerText = score;
            timerEl.innerText = timeLeft;
            
            // UI Toggles
            menu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            // Start Timer
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

            spawnTarget();
        }

        function updateTimer() {
            timeLeft--;
            timerEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }

        function spawnTarget() {
            if (!gameActive) return;

            // Randomize Position (keeping target inside container boundaries)
            const padding = 60;
            const maxX = container.clientWidth - padding;
            const maxY = container.clientHeight - padding;
            
            const x = Math.floor(Math.random() * maxX) + (padding / 2);
            const y = Math.floor(Math.random() * maxY) + (padding / 2);

            // Randomize Color
            const color = colors[Math.floor(Math.random() * colors.length)];

            target.style.left = x + 'px';
            target.style.top = y + 'px';
            target.style.backgroundColor = color;
            target.style.boxShadow = `0 0 20px ${color}`;
            target.style.display = 'block';

            startTime = Date.now();

            // Target disappears after a random time (difficulty increases as time decreases)
            const duration = Math.max(600, 1500 - (score * 10)); 
            clearTimeout(targetTimeout);
            targetTimeout = setTimeout(() => {
                if (gameActive) spawnTarget();
            }, duration);
        }

        // Handle clicking the target
        target.addEventListener('mousedown', function(e) {
            if (!gameActive) return;
            
            const reactionTime = Date.now() - startTime;
            
            // Scoring logic: faster clicks give more points
            // Base 100 pts, minus penalty for time taken
            let points = Math.max(10, 100 - Math.floor(reactionTime / 10));
            score += points;
            
            scoreEl.innerText = score;
            target.style.display = 'none';
            clearTimeout(targetTimeout);
            spawnTarget();

            // Prevent click from triggering container events if added later
            e.stopPropagation();
        });

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            clearTimeout(targetTimeout);
            target.style.display = 'none';
            
            lastScoreEl.innerText = "Final Score: " + score;
            gameOverScreen.classList.remove('hidden');
        }

        // Keyboard shortcut for testing/accessibility (Space to start)
        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space' && !gameActive && menu.classList.contains('hidden') === false) {
                startGame();
            }
        });

    </script>
</body>
</html>
