<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Particle Globe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            pointer-events: none; /* Allows mouse interaction to pass through to canvas */
            user-select: none;
        }
        h1 {
            font-size: 3rem;
            letter-spacing: 0.5rem;
            margin: 0;
            text-transform: uppercase;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }
        p {
            font-size: 1rem;
            letter-spacing: 0.2rem;
            color: #4af;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>GLOBE</h1>
        <p>INTERACTIVE PARTICLES</p>
    </div>

    <!-- Import Map for Three.js modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const PARTICLE_COUNT = 8000;
        const SPHERE_RADIUS = 5;

        let scene, camera, renderer, particles;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        init();
        animate();

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Create Particles
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // Distribute points on a sphere using spherical coordinates
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;

                const x = SPHERE_RADIUS * Math.cos(theta) * Math.sin(phi);
                const y = SPHERE_RADIUS * Math.sin(theta) * Math.sin(phi);
                const z = SPHERE_RADIUS * Math.cos(phi);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // Color Gradient (Blue to Cyan)
                const color = new THREE.Color();
                color.setHSL(0.5 + Math.random() * 0.1, 0.8, 0.5);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.05,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);
        }

        function onMouseMove(event) {
            // Normalize mouse coordinates from -1 to +1
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;

            // Subtle UI interaction: fade text on move
            const ui = document.getElementById('ui');
            ui.style.opacity = Math.max(0.2, 1 - (Math.abs(mouseX) + Math.abs(mouseY)) / 2);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Auto-rotation logic
            particles.rotation.y += 0.002;
            particles.rotation.x += 0.001;

            // Mouse influence (Interpolation for smoothness)
            targetRotationY = mouseX * 0.5;
            targetRotationX = -mouseY * 0.5;

            particles.rotation.y += (targetRotationY - particles.rotation.y) * 0.05; // Note: This is a simplified approach, we use additive rotation above too.
            // To make it feel more responsive to mouse without fighting auto-rotate, let's adjust the target behavior:
            particles.rotation.y += (mouseX * 0.1 - particles.rotation.y * 0.02); // Just a gentle drift

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
