<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Particle Globe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #ui-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            pointer-events: none; /* Allows mouse to pass through to canvas */
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin: 0;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }

        p {
            font-weight: 200;
            letter-spacing: 4px;
            color: #aaa;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>GLOBE</h1>
        <p>INTERACTIVE PARTICLE SYSTEM</p>
    </div>

    <!-- Load Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const PARTICLE_COUNT = 8000;
        const SPHERE_RADIUS = 5;

        let scene, camera, renderer, particles, particleSystem;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        init();
        animate();

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Create Particles
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // Spherical distribution math
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT); // Uniformly distributed on sphere
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;

                const x = SPHERE_RADIUS * Math.cos(theta) * Math.sin(phi);
                const y = SPHERE_RADIUS * Math.sin(theta) * Math.sin(phi);
                const z = SPHERE_RADIUS * Math.cos(phi);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // Color logic (Blue to Cyan gradient)
                colors[i * 3] = 0.2;           // R
                colors[i * 3 + 1] = 0.5 + Math.random() * 0.5; // G
                colors[i * 3 + 2] = 1.0;       // B
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.05,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            // Add a subtle glow/core light (optional)
            const coreGeom = new THREE.SphereGeometry(SPHERE_RADIUS * 0.95, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0x001133,
                transparent: true,
                opacity: 0.4
            });
            const core = new THREE.Mesh(coreGeom, coreMat);
            scene.add(core);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);
        }

        function onMouseMove(event) {
            // Normalize mouse coordinates (-1 to +1)
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Auto-rotation logic
            particleSystem.rotation.y += 0.002;
            particleSystem.rotation.x += 0.001;

            // Interactive mouse influence (Smoothing)
            targetRotationY += (mouseX * 0.5 - particleSystem.rotation.y) * 0.05;
            targetRotationX += (-mouseY * 0.5 - particleSystem.rotation.x) * 0.05;

            particleSystem.rotation.y += (targetRotationY - particleSystem.rotation.y) * 0.1;
            particleSystem.rotation.x += (targetRotationX - particleSystem.rotation.x) * 0.1;

            // Subtle pulse effect
            const time = Date.now() * 0.001;
            particleSystem.scale.set(
                1 + Math.sin(time) * 0.05,
                1 + Math.sin(time) * 0.05,
                1 + Math.sin(time) * 0.05
            );

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
