<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title]Animated Comic Sequence</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-border: #333;
            --speech-bg: white;
            --text-color: black;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
        }

        /* Comic Container */
        #comic-viewport {
            width: 600px;
            height: 400px;
            background: white;
            border: 8px solid var(--panel-border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Scene Wrapper */
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Scene Transitions */
        .active {
            animation: fadeInOut 4s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(1.1); }
            15% { opacity: 1; transform: scale(1); }
            85% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.9); }
        }

        /* Visual Elements */
        .character {
            position: absolute;
            bottom: 20px;
            width: 120px;
            height: 180px;
            border-radius: 50% 50% 0 0;
            transition: all 0.5s ease;
        }

        #hero { background: #3498db; left: -150px; } /* Blue character */
        #villain { background: #e74c3c; right: -150px; } /* Red character */

        /* Animations for Characters */
        .walk-in { animation: walkIn 2s forwards ease-out; }
        @keyframes walkIn { to { left: 100px; } }

        .shake { animation: shakeAnim 0.5s infinite; }
        @keyframes shakeAnim {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, -2px) rotate(-1deg); }
            40% { transform: translate(-1px, 2px) rotate(1deg); }
            60% { transform: translate(3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, 2px) rotate(-1deg); }
        }

        /* Speech Bubbles */
        .bubble {
            position: absolute;
            background: var(--speech-bg);
            border: 3px solid black;
            border-radius: 50%;
            padding: 15px;
            font-weight: bold;
            text-align: center;
            max-width: 120px;
            opacity: 0;
            z-index: 10;
        }

        .bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            border-width: 15px 15px 0 0;
            border-style: solid;
            border-color: white transparent;
        }

        .bubble::before {
            content: '';
            position: absolute;
            bottom: -22px;
            left: 45%;
            border-width: 18px 18px 0 0;
            border-style: solid;
            border-color: black transparent;
        }

        .show-bubble { animation: popIn 0.3s ease-out forwards; }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Action Text (POW! BAM!) */
        .action-text {
            position: absolute;
            font-size: 60px;
            color: #f1c40f;
            text-shadow: 3px 3px black;
            font-style: italic;
            z-index: 20;
            display: none;
        }

        /* Controls */
        .controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        button:hover { background: #c0392b; }

        /* Scene Backgrounds */
        .bg-city { background: linear-gradient(#87CEEB, #E0F6FF); }
        .bg-dark { background: #2c3e50; }
    </style>
</head>
<body>

    <div id="comic-viewport">
        <!-- Scene 1 -->
        <div class="scene bg-city active" id="s1">
            <div id="hero" class="character walk-in"></div>
            <div class="bubble" style="top: 50px; left: 40px;">Is anyone here?</div>
        </div>

        <!-- Scene 2 -->
        <div class="scene bg-dark" id="s2">
            <div id="villain" class="character shake" style="right: 100px;"></div>
            <div class="bubble" style="top: 50px; right: 40px;">I have been waiting!</div>
        </div>

        <!-- Scene 3 -->
        <div class="scene bg-dark" id="s3">
            <div id="hero" class="character shake" style="left: 100px;"></div>
            <div id="villain" class="character shake" style="right: 100px;"></div>
            <div class="action-text" id="powText" style="top: 40%; left: 35%;">POW!</div>
        </div>

        <!-- Scene 4 -->
        <div class="scene bg-city" id="s4">
            <div id="hero" class="character" style="left: 100px; transform: rotate(90deg); bottom: -50px;"></div>
            <div class="bubble" style="top: 150px; left: 230px;">...that hurt.</div>
        </div>
    </div>

    <div class="controls">
        <button id="playBtn">Play Comic</button>
    </div>

    <script>
        const scenes = document.querySelectorAll('.scene');
        const playBtn = document.getElementById('playBtn');
        const powText = document.getElementById('powText');
        let isPlaying = false;
        let currentSceneIdx = 0;
        let timer;

        function runComic() {
            if (currentSceneIdx >= scenes.length) {
                resetComic();
                return;
            }

            // Remove active class from all
            scenes.forEach(s => s.classList.remove('active'));
            
            // Special handling for Scene 3 Action Text
            powText.style.display = 'none';

            // Activate current scene
            const currentScene = scenes[currentSceneIdx];
            currentScene.classList.add('active');

            // Trigger special animations based on index
            if (currentSceneIdx === 2) {
                setTimeout(() => { powText.style.display = 'block'; }, 1000);
            }

            currentSceneIdx++;
            timer = setTimeout(runComic, 4000); // Match CSS animation duration
        }

        function resetComic() {
            clearInterval(timer);
            isPlaying = false;
            currentSceneIdx = 0;
            playBtn.innerText = "Play Comic";
            scenes.forEach(s => s.classList.remove('active'));
            scenes[0].classList.add('active');
        }

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                isPlaying = true;
                playBtn.innerText = "Reset";
                runComic();
            } else {
                resetComic();
            }
        });
    </script>
</body>
</html>
