<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Catcher Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0a0a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            background: linear-gradient(to bottom, #0a0a2e 0%, #1b1b4e 100%);
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            display: flex;
            gap: 30px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="timer">60</span>s</div>
        <div>Lives: <span id="lives">3</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const livesEl = document.getElementById('lives');

        // Game Settings
        canvas.width = 600;
        canvas.height = 800;
        
        let score = 0;
        let lives = 3;
        let timeLeft = 60;
        let gameActive = true;
        let keys = {};

        // Player Object
        const player = {
            width: 80,
            height: 20,
            x: canvas.width / 2 - 40,
            y: canvas.height - 50,
            speed: 7,
            color: '#00d2ff'
        };

        // Stars Array
        let stars = [];
        const starFrequency = 0.03; // Probability of spawning a star per frame

        // Event Listeners for Controls
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        class Star {
            constructor() {
                this.radius = Math.random() * 10 + 5;
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = -20;
                this.speed = Math.random() * 3 + 2;
                this.color = `hsl(${Math.random() * 60 + 40}, 100%, 70%)`; // Yellowish colors
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0; // Reset shadow for performance
            }
        }

        function spawnStars() {
            if (Math.random() < starFrequency) {
                stars.push(new Star());
            }
        }

        function updatePlayer() {
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
        }

        function drawPlayer() {
            ctx.fillStyle = player.color;
            // Draw a rounded rectangle for the paddle
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.width, player.height, 10);
            ctx.fill();
            // Glow effect
            ctx.shadowBlur = 20;
            ctx.shadowColor = player.color;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function checkCollisions() {
            for (let i = stars.length - 1; i >= 0; i--) {
                const s = stars[i];
                
                // Collision with player paddle
                if (s.y + s.radius > player.y && 
                    s.x > player.x && 
                    s.x < player.x + player.width) {
                    stars.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;
                } 
                // Missed star (falls off bottom)
                else if (s.y > canvas.height) {
                    stars.splice(i, 1);
                    lives--;
                    livesEl.innerText = lives;
                    if (lives <= 0) gameOver("GAME OVER - OUT OF LIVES");
                }
            }
        }

        function gameOver(message) {
            gameActive = false;
            setTimeout(() => {
                alert(`${message}\nFinal Score: ${score}`);
                resetGame();
            }, 10);
        }

        function resetGame() {
            score = 0;
            lives = 3;
            timeLeft = 60;
            stars = [];
            player.x = canvas.width / 2 - player.width/2;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            timerEl.innerText = timeLeft;
            gameActive = true;
        }

        // Timer Interval
        setInterval(() => {
            if (gameActive) {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) gameOver("TIME'S UP!");
            }
        }, 1000);

        function gameLoop() {
            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameActive) {
                updatePlayer();
                spawnStars();

                stars.forEach((star, index) => {
                    star.update();
                    star.draw();
                });

                checkCollisions();
                drawPlayer();
            }

            requestAnimationFrame(gameLoop);
        }

        // Start Game
        gameLoop();

    </script>
</body>
</html>
