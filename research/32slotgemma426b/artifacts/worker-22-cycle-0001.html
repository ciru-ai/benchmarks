<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Pilot</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050505;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #444;
            background: radial-gradient(circle, #1a1a2e 0%, #050505 100%);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        .ui {
            position: absolute;
            top: 20px;
            text-align: center;
            pointer-events: none;
            width: 100%;
        }
        #scoreBoard {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        #overlay {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            width: 600px;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            background: #00d4ff;
            border: none;
            color: black;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover {
            background: #fff;
        }
        .controls {
            margin-top: 15px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="ui">
        <div id="scoreBoard">Score: 0</div>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div id="overlay">
        <h1 id="title">KEYBOARD PILOT</h1>
        <p id="finalScore"></p>
        <button onclick="startGame()">START MISSION</button>
        <p class="controls">Use ARROW KEYS to navigate</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreBoard');
        const overlay = document.getElementById('overlay');
        const finalScoreText = document.getElementById('finalScore');
        const titleText = document.getElementById('title');

        let gameActive = false;
        let score = 0;
        let player, meteors, particles, animationId, spawnRate;
        let keys = {};

        // Input Listeners
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        class Player {
            constructor() {
                this.width = 30;
                this.height = 30;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height / 2 - this.height / 2;
                this.speed = 5;
                this.color = '#00d4ff';
            }

            draw() {
                // Draw ship shape
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.closePath();
                ctx.fill();
                
                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
            }

            update() {
                if (keys['ArrowUp'] && this.y > 0) this.y -= this.speed;
                if (keys['ArrowDown'] && this.y < canvas.height - this.height) this.y += this.speed;
                if (keys['ArrowLeft'] && this.x > 0) this.x -= this.speed;
                if (keys['ArrowRight'] && this.x < canvas.width - this.width) this.x += this.speed;
            }
        }

        class Meteor {
            constructor() {
                this.size = Math.random() * 30 + 15;
                // Spawn from edges
                const side = Math.floor(Math.random() * 4);
                if (side === 0) { // Top
                    this.x = Math.random() * canvas.width;
                    this.y = -this.size;
                } else if (side === 1) { // Right
                    this.x = canvas.width + this.size;
                    this.y = Math.random() * canvas.height;
                } else if (side === 2) { // Bottom
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + this.size;
                } else { // Left
                    this.x = -this.size;
                    this.y = Math.random() * canvas.height;
                }

                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                const speed = 1 + (score / 500); // Get faster as score increases
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
            }

            draw() {
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ff4d4d';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.life = 1.0;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 77, 77, ${this.life})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function startGame() {
            player = new Player();
            meteors = [];
            particles = [];
            score = 0;
            spawnRate = 1000;
            gameActive = true;
            overlay.style.display = 'none';
            lastSpawnTime = Date.now();
            animate();
        }

        function gameOver() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            titleText.innerText = "MISSION FAILED";
            finalScoreText.innerText = `Final Score: ${Math.floor(score)}`;
            overlay.style.display = 'flex';
        }

        let lastSpawnTime = 0;

        function animate() {
            if (!gameActive) return;
            animationId = requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update Score
            score += 0.1;
            scoreElement.innerText = `Score: ${Math.floor(score)}`;

            // Spawn Meteors
            let now = Date.now();
            if (now - lastSpawnTime > Math.max(200, spawnRate - (score / 5))) {
                meteors.push(new Meteor());
                lastSpawnTime = now;
            }

            player.update();
            player.draw();

            // Handle Meteors
            for (let i = meteors.length - 1; i >= 0; i--) {
                meteors[i].update();
                meteors[i].draw();

                // Collision Detection
                const dx = player.x + player.width/2 - meteors[i].x;
                const dy = player.y + player.height/2 - meteors[i].y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < (player.width/2 + meteors[i].size/2)) {
                    // Explosion particles
                    for(let p=0; p<15; p++) particles.push(new Particle(meteors[i].x, meteors[i].y));
                    gameOver();
                }

                // Remove off-screen meteors
                if (meteors[i].x < -100 || meteors[i].x > canvas.width + 100 || 
                    meteors[i].y < -100 || meteors[i].y > canvas.height + 100) {
                    meteors.splice(i, 1);
                }
            }

            // Handle Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

    </script>
</body>
</html>
