<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dash</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --bg-dark: #0a0a0c;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 600px;
            height: 400px;
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
            background: rgba(0, 0, 0, 0.8);
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stats {
            position: absolute;
            top: 10px;
            width: 95%;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-blue);
            pointer-events: none;
        }

        #menu {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid var(--neon-pink);
            text-align: center;
            box-shadow: 0 0 30px var(--neon-pink);
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 48px;
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
            letter-spacing: 5px;
        }

        button {
            padding: 12px 30px;
            font-size: 20px;
            background: transparent;
            color: white;
            border: 2px solid var(--neon-pink);
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink);
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <div class="stats">
            <span id="scoreDisplay">Score: 0</span>
            <span id="timerDisplay">Time: 30</span>
        </div>

        <div id="ui-layer">
            <div id="menu">
                <h1 id="title">NEON DASH</h1>
                <p id="finalScore" style="display:none; font-size: 24px; margin-bottom: 20px;"></p>
                <button id="startBtn">Start Game</button>
                <div class="controls-hint">Use [Arrow Keys] or [WASD] to move</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const menu = document.getElementById('menu');
        const startBtn = document.getElementById('startBtn');
        const title = document.getElementById('title');
        const finalScoreText = document.getElementById('finalScore');

        // Game Constants
        const PLAYER_SIZE = 20;
        const TARGET_SIZE = 15;
        const ENEMY_SIZE = 15;
        const INITIAL_TIME = 30;

        // Game State
        let score = 0;
        let timeLeft = INITIAL_TIME;
        let gameActive = false;
        let player = { x: 300, y: 200, speed: 5 };
        let targets = [];
        let enemies = [];
        let keys = {};
        let lastTime = 0;
        let spawnTimer = 0;

        // Event Listeners
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        startBtn.addEventListener('click', startGame);

        function startGame() {
            score = 0;
            timeLeft = INITIAL_TIME;
            player = { x: canvas.width / 2, y: canvas.height / 2, speed: 5 };
            targets = [];
            enemies = [];
            gameActive = true;
            menu.style.display = 'none';
            scoreDisplay.innerText = `Score: ${score}`;
            timerDisplay.innerText = `Time: ${timeLeft}`;
            requestAnimationFrame(gameLoop);

            // Countdown Timer
            const timerInterval = setInterval(() => {
                if (!gameActive) {
                    clearInterval(timerInterval);
                    return;
                }
                timeLeft--;
                timerDisplay.innerText = `Time: ${timeLeft}`;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function spawnTarget() {
            targets.push({
                x: Math.random() * (canvas.width - TARGET_SIZE),
                y: Math.random() * (canvas.height - TARGET_SIZE),
                color: '#ff00ff' // Pink targets
            });
        }

        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            if (side === 0) { x = 0; y = Math.random() * canvas.height; } // Left
            else if (side === 2) { x = canvas.width; y = Math.random() * canvas.height; } // Right
            else if (side === 1) { x = Math.random() * canvas.width; y = 0; } // Top
            else { x = Math.random() * canvas.width; y = canvas.height; } // Bottom

            enemies.push({
                x: x,
                y: y,
                vx: (player.x - x) / 150,
                vy: (player.y - y) / 150,
                color: '#00f2ff' // Blue enemies
            });
        }

        function endGame() {
            gameActive = false;
            menu.style.display = 'block';
            title.innerText = "GAME OVER";
            finalScoreText.innerText = `Final Score: ${score}`;
            finalScoreText.style.display = 'block';
            startBtn.innerText = "Try Again";
        }

        function update(dt) {
            if (!gameActive) return;

            // Player Movement
            if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

            // Boundary Check
            player.x = Math.max(0, Math.min(canvas.width - PLAYER_SIZE, player.x));
            player.y = Math.max(0, Math.min(canvas.height - PLAYER_SIZE, player.y));

            // Spawn Targets logic (ensure at least one target exists)
            if (targets.length < 3 && Math.random() < 0.02) spawnTarget();
            if (targets.length === 0) spawnTarget();

            // Enemy Spawning (gets harder over time)
            spawnTimer += dt;
            const spawnRate = Math.max(400, 1500 - (score * 10));
            if (spawnTimer > spawnRate) {
                spawnEnemy();
                spawnTimer = 0;
            }

            // Update Enemies
            enemies.forEach((enemy, index) => {
                enemy.x += enemy.vx * (1 + score/20);
                enemy.y += enemy.vy * (1 + score/20);

                // Collision with Player
                if (player.x < enemy.x + ENEMY_SIZE &&
                    player.x + PLAYER_SIZE > enemy.x &&
                    player.y < enemy.y + ENEMY_SIZE &&
                    player.y + PLAYER_SIZE > enemy.y) {
                    endGame();
                }

                // Remove enemies that fly off screen
                if (enemy.x < -50 || enemy.x > canvas.width + 50 || enemy.y < -50 || enemy.y > canvas.height + 50) {
                    enemies.splice(index, 1);
                }
            });

            // Update Targets
            targets.forEach((target, index) => {
                if (player.x < target.x + TARGET_SIZE &&
                    player.x + PLAYER_SIZE > target.x &&
                    player.y < target.y + TARGET_SIZE &&
                    player.y + PLAYER_SIZE > target.y) {
                    targets.splice(index, 1);
                    score++;
                    scoreDisplay.innerText = `Score: ${score}`;
                }
            });
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = 'rgba(10, 10, 12, 0.3)'; // Motion blur effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!gameActive) return;

            // Draw Player
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);

            // Draw Targets
            targets.forEach(target => {
                ctx.shadowBlur = 15;
                ctx.shadowColor = target.color;
                ctx.fillStyle = target.color;
                ctx.fillRect(target.x, target.y, TARGET_SIZE, TARGET_SIZE);
            });

            // Draw Enemies
            enemies.forEach(enemy => {
                ctx.shadowBlur = 15;
                ctx.shadowColor = enemy.color;
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.arc(enemy.x + ENEMY_SIZE/2, enemy.y + ENEMY_SIZE/2, ENEMY_SIZE/2, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.shadowBlur = 0; // Reset shadow for performance
        }

        function gameLoop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            update(dt);
            draw();

            if (gameActive) {
                requestAnimationFrame(gameLoop);
            }
        }

    </script>
</body>
</html>
