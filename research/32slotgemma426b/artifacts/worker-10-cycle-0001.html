<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Runner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }

        #game-container {
            position: relative;
            border: 4px solid #0f3460;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            background-color: #16213e;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
            text-shadow: 2px 2px #000;
        }

        #menu {
            display: none;
            pointer-events: auto;
            background: rgba(15, 52, 96, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px #e94560;
        }

        h1 { margin: 0 0 20px 0; color: #e94560; }
        p { font-size: 18px; margin-bottom: 20px; }

        button {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #e94560;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover { background-color: #ff4d6d; }
        button:active { transform: scale(0.95); }

        .controls-hint {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="score-board">Score: 0</div>
        <div id="ui-layer">
            <div id="menu">
                <h1 id="status-text">PULSE RUNNER</h1>
                <p id="final-score">Final Score: 0</p>
                <button onclick="resetGame()">START GAME</button>
            </div>
        </div>
    </div>

    <div class="controls-hint">Press SPACE or TAP to Jump</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score-board');
        const menu = document.getElementById('menu');
        const finalScoreText = document.getElementById('final-score');
        const statusText = document.getElementById('status-text');

        // Game Constants
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        const INITIAL_SPEED = 5;
        const SPEED_INCREMENT = 0.001;
        const OBSTACLE_SPAWN_CHANCE = 0.02;

        // Game State
        let player, obstacles, score, gameSpeed, isGameOver, animationId;

        class Player {
            constructor() {
                this.width = 35;
                this.height = 35;
                this.x = 80;
                this.y = canvas.height - this.height - 20;
                this.vy = 0;
                this.color = '#e94560';
            }

            jump() {
                if (this.y === canvas.height - this.height - 20) {
                    this.vy = JUMP_FORCE;
                }
            }

            update() {
                this.vy += GRAVITY;
                this.y += this.vy;

                // Ground collision
                const groundY = canvas.height - this.height - 20;
                if (this.y > groundY) {
                    this.y = groundY;
                    this.vy = 0;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw player with a slight glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
        }

        class Obstacle {
            constructor(speed) {
                this.width = 25 + Math.random() * 30;
                this.height = 40 + Math.random() * 40;
                this.x = canvas.width;
                this.y = canvas.height - this.height - 20;
                this.speed = speed;
                this.color = '#0f3460'; // Darker contrast for the obstacle itself
            }

            update() {
                this.x -= this.speed;
            }

            draw() {
                ctx.fillStyle = '#533483';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // Outline for obstacle
                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        function init() {
            player = new Player();
            obstacles = [];
            score = 0;
            gameSpeed = INITIAL_SPEED;
            isGameOver = false;
            menu.style.display = 'block';
            statusText.innerText = "PULSE RUNNER";
            finalScoreText.innerText = "";
        }

        function resetGame() {
            init();
            animate();
        }

        function gameOver() {
            isGameOver = true;
            cancelAnimationFrame(animationId);
            statusText.innerText = "GAME OVER";
            finalScoreText.innerText = "Final Score: " + Math.floor(score);
            menu.style.display = 'block';
        }

        function animate() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ground Line
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 20);
            ctx.lineTo(canvas.width, canvas.height - 20);
            ctx.strokeStyle = '#533483';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Update & Draw Player
            player.update();
            player.draw();

            // Handle Obstacles
            if (Math.random() < OBSTACLE_SPAWN_CHANCE) {
                obstacles.push(new Obstacle(gameSpeed));
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                // Collision Detection
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    gameOver();
                }

                // Remove off-screen obstacles and increase score
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score += 1;
                    gameSpeed += SPEED_INCREMENT; // Speed ramping
                }
            }

            // Update Score UI
            scoreElement.innerText = `Score: ${Math.floor(score)}`;

            animationId = requestAnimationFrame(animate);
        }

        // Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') player.jump();
        });

        canvas.addEventListener('touchstart', () => {
            player.jump();
        }, false);

        // Initial Load
        init();
    </script>
</body>
</html>
