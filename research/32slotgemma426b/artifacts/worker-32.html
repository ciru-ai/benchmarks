<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Model Loader</title>
    <style>
        :root {
            --bg-color: #05070a;
            --accent-primary: #00f2ff;
            --accent-secondary: #7000ff;
            --slot-empty: rgba(255, 255, 255, 0.05);
            --text-main: #e0e0e0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Background Ambient Glow */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(112, 0, 255, 0.15) 0%, transparent 70%);
            z-index: -1;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 800px;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 8px;
            margin-bottom: 40px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Grid System */
        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 12px;
            margin-bottom: 40px;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
        }

        .slot {
            aspect-ratio: 1/1;
            background: var(--slot-empty);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .slot::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: none;
        }

        .slot.active {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .slot.active::after {
            animation: shine 1.5s infinite;
        }

        @keyframes shine {
            to { left: 150%; }
        }

        /* Progress Section */
        .status-container {
            margin-top: 20px;
        }

        .caption {
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-primary);
            margin-bottom: 15px;
            height: 20px;
        }

        .progress-wrapper {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
            box-shadow: 0 0 10px var(--accent-primary);
            transition: width 0.2s ease;
        }

        /* Controls */
        .controls {
            margin-top: 50px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 24px;
            cursor: pointer;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        button:hover {
            background: white;
            color: black;
        }

        button.active {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Model Initialization</h1>
        
        <div id="grid" class="grid">
            <!-- 32 slots generated by JS -->
        </div>

        <div class="status-container">
            <div id="caption" class="caption">System Standby</div>
            <div class="progress-wrapper">
                <div id="progress-bar"></div>
            </div>
            <div style="margin-top: 10px; font-size: 0.7rem; color: #555;" id="percentage">0%</div>
        </div>

        <div class="controls">
            <button id="btn-play" onclick="toggleLoop()">Stop Loop</button>
            <button id="btn-reset" onclick="resetLoader()">Reset</button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const progressBar = document.getElementById('progress-bar');
        const caption = document.getElementById('caption');
        const percentageText = document.getElementById('percentage');
        const btnPlay = document.getElementById('btn-play');
        
        const TOTAL_SLOTS = 32;
        let isLooping = true;
        let currentSlot = 0;
        let timer = null;

        // Status messages for cinematic feel
        const messages = [
            "Allocating Memory...",
            "Mapping Neural Pathways...",
            "Synchronizing Voxels...",
            "Optimizing Geometry...",
            "Loading Textures...",
            "Compiling Shaders...",
            "Verifying Integrity...",
            "Finalizing Model..."
        ];

        // Create 32 slots
        for (let i = 0; i < TOTAL_SLOTS; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            grid.appendChild(slot);
        }

        const slots = document.querySelectorAll('.slot');

        function updateLoader() {
            if (!isLooping && currentSlot >= TOTAL_SLOTS) return;

            // Update Progress Bar & Text
            const progress = (currentSlot / TOTAL_SLOTS) * 100;
            progressBar.style.width = `${progress}%`;
            percentageText.innerText = `${Math.round(progress)}%`;

            // Update Caption based on progress segments
            const msgIndex = Math.floor((currentSlot / TOTAL_SLOTS) * messages.length);
            caption.innerText = messages[msgIndex] || messages[messages.length - 1];

            // Visual Slot Activation
            if (currentSlot < TOTAL_SLOTS) {
                slots[currentSlot].classList.add('active');
                currentSlot++;
            } else {
                if (isLooping) {
                    setTimeout(() => resetLoader(), 2000); // Pause at end before loop
                } else {
                    caption.innerText = "Sequence Complete";
                    return;
                }
            }

            // Speed variation for cinematic effect
            let nextTick = 150 - (currentSlot * 3); 
            if(nextTick < 20) nextTick = 20;
            timer = setTimeout(updateLoader, nextTick);
        }

        function resetLoader() {
            clearTimeout(timer);
            currentSlot = 0;
            progressBar.style.width = '0%';
            percentageText.innerText = '0%';
            caption.innerText = "System Reset";
            slots.forEach(s => s.classList.remove('active'));
            setTimeout(() => {
                if(isLooping) updateLoader();
            }, 500);
        }

        function toggleLoop() {
            isLooping = !isLooping;
            btnPlay.innerText = isLooping ? "Stop Loop" : "Start Loop";
            btnPlay.classList.toggle('active', !isLooping);
            
            if (isLooping) {
                updateLoader();
            } else {
                clearTimeout(timer);
                caption.innerText = "Sequence Paused";
            }
        }

        // Initialize
        window.onload = () => {
            updateLoader();
        };
    </script>
</body>
</html>
