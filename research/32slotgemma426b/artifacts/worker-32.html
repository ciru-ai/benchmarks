<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Model Loader</title>
    <style>
        :root {
            --bg: #050505;
            --accent: #00f2ff;
            --accent-dim: rgba(0, 242, 255, 0.3);
            --grid-color: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Background Grid Effect */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            top: -50%;
            z-index: -1;
            opacity: 0.3;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 800px;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-size: 1.5rem;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-dim);
        }

        /* Grid Layout for Slots */
        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 12px;
            margin-bottom: 40px;
        }

        .slot {
            aspect-ratio: 1/1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--grid-color);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .slot::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transition: none;
        }

        .slot.active {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-dim);
        }

        .slot.active::after {
            animation: sweep 1.5s infinite ease-in-out;
        }

        @keyframes sweep {
            to { left: 200%; }
        }

        /* Progress Section */
        .status-container {
            margin-top: 20px;
        }

        #caption {
            font-family: monospace;
            font-size: 14px;
            color: var(--accent);
            height: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .progress-wrapper {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            border-radius: 2px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transition: width 0.3s ease;
        }

        /* Controls */
        .controls {
            margin-top: 40px;
        }

        button {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 25px;
            cursor: pointer;
            font-family: monospace;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent-dim);
        }

        button:active { transform: scale(0.95); }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Neural Model Initialization</h1>
        
        <div id="slot-grid" class="grid">
            <!-- JS will inject 32 slots here -->
        </div>

        <div class="status-container">
            <div id="caption">SYSTEM READY...</div>
            <div class="progress-wrapper">
                <div id="progress-bar"></div>
            </div>
        </div>

        <div class="controls">
            <button onclick="toggleLoop()" id="loopBtn">LOOP: ON</button>
            <button onclick="resetLoader()">RESET</button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('slot-grid');
        const progressBar = document.getElementById('progress-bar');
        const caption = document.getElementById('caption');
        const loopBtn = document.getElementById('loopBtn');
        
        let isLooping = true;
        let currentSlot = 0;
        const totalSlots = 32;
        const statuses = [
            "Allocating memory buffers...",
            "Loading weights: Layer {n}...",
            "Optimizing tensor shapes...",
            "Synchronizing GPU kernels...",
            "Validating checksums...",
            "Initializing attention heads...",
            "Finalizing model state..."
        ];

        // Create 32 slots
        for (let i = 0; i < totalSlots; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.id = `slot-${i}`;
            grid.appendChild(slot);
        }

        function updateLoader() {
            if (currentSlot >= totalSlots) {
                caption.innerText = "INITIALIZATION COMPLETE";
                progressBar.style.width = "100%";
                
                if (!isLooping) return;
                
                setTimeout(resetLoader, 2000);
                return;
            }

            // Update Slots Visuals
            const slotElements = document.querySelectorAll('.slot');
            slotElements.forEach((el, idx) => {
                if (idx < currentSlot) {
                    el.classList.add('active');
                    el.style.borderColor = 'var(--accent)';
                    el.style.background = 'rgba(0, 242, 255, 0.1)';
                } else if (idx === currentSlot) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                    el.style.borderColor = 'var(--grid-color)';
                    el.style.background = 'rgba(255, 255, 255, 0.03)';
                }
            });

            // Update Progress & Text
            const progressPercent = (currentSlot / totalSlots) * 100;
            progressBar.style.width = `${progressPercent}%`;
            
            const statusIdx = Math.floor((currentSlot / totalSlots) * statuses.length);
            let msg = statuses[statusIdx].replace('{n}', currentSlot + 1);
            caption.innerText = msg;

            currentSlot++;
            setTimeout(updateLoader, 80 + Math.random() * 150);
        }

        function resetLoader() {
            currentSlot = 0;
            progressBar.style.width = "0%";
            const slotElements = document.querySelectorAll('.slot');
            slotElements.forEach(el => {
                el.classList.remove('active');
                el.style.borderColor = '';
                el.style.background = '';
            });
            caption.innerText = "RESTARTING SEQUENCE...";
            setTimeout(updateLoader, 1000);
        }

        function toggleLoop() {
            isLooping = !isLooping;
            loopBtn.innerText = `LOOP: ${isLooping ? 'ON' : 'OFF'}`;
            if (isLooping) resetLoader();
        }

        // Start the demo
        window.onload = updateLoader;
    </script>
</body>
</html>
