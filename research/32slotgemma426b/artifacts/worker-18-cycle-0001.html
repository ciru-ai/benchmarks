<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Grid</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-back: #2c3e50;
            --card-front: #ffffff;
            --accent: #3498db;
            --success: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { color: #2c3e50; margin-bottom: 10px; }

        .stats-container {
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #34495e;
            font-weight: bold;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            perspective: 1000px;
        }

        .card {
            width: 80px;
            height: 80px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg) scale(0.95);
            opacity: 0.7;
            cursor: default;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card-back {
            background-color: var(--card-back);
            color: white;
        }

        .card-front {
            background-color: var(--card-front);
            transform: rotateY(180deg);
        }

        button {
            margin-top: 30px;
            padding: 10px 25px;
            font-size: 1rem;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        @media (max-width: 400px) {
            .card { width: 65px; height: 65px; }
            .game-grid { gap: 10px; }
        }
    </style>
</head>
<body>

    <h1>Memory Grid</h1>

    <div class="stats-container">
        <div>Time: <span id="timer">0</span>s</div>
        <div>Score: <span id="score">0</span></div>
    </div>

    <div class="game-grid" id="grid">
        <!-- Cards generated by JS -->
    </div>

    <button onclick="resetGame()">New Game</button>

    <script>
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        
        const icons = ['🍎', '🍌', '🍇', '🍓', '🍒', '🍍', '🥝', '🍉'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let score = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let isLockBoard = false;

        function createCardSet() {
            const doubleIcons = [...icons, ...icons];
            return doubleIcons.sort(() => Math.random() - 0.5);
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            timerElement.textContent = '0';
            timerInterval = setInterval(() => {
                secondsElapsed++;
                timerElement.textContent = secondsElapsed;
            }, 1000);
        }

        function createBoard() {
            gridElement.innerHTML = '';
            const cardValues = createCardSet();
            cardValues.forEach(value => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.value = value;

                card.innerHTML = `
                    <div class="card-face card-back">?</div>
                    <div class="card-face card-front">${value}</div>
                `;

                card.addEventListener('click', flipCard);
                gridElement.appendChild(card);
            });
        }

        function flipCard() {
            if (isLockBoard) return;
            if (this === flippedCards[0]) return;
            if (this.classList.contains('matched')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLockBoard = true;
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.value === card2.dataset.value;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            flippedCards[0].classList.add('matched');
            flippedCards[1].classList.add('matched');
            
            score += 10;
            scoreElement.textContent = score;
            matchedPairs++;

            if (matchedPairs === icons.length) {
                clearInterval(timerInterval);
                setTimeout(() => alert(`Victory! Time: ${secondsElapsed}s | Score: ${score}`), 500);
            }

            resetTurn();
        }

        function unflipCards() {
            setTimeout(() => {
                flippedCards[0].classList.remove('flipped');
                flippedCards[1].classList.remove('flipped');
                resetTurn();
            }, 1000);
        }

        function resetTurn() {
            flippedCards = [];
            isLockBoard = false;
        }

        function resetGame() {
            matchedPairs = 0;
            score = 0;
            scoreElement.textContent = '0';
            timerElement.textContent = '0';
            flippedCards = [];
            isLockBoard = false;
            clearInterval(timerInterval);
            createBoard();
        }

        // Initialize Game
        createBoard();
        startTimer();

    </script>
</body>
</html>
