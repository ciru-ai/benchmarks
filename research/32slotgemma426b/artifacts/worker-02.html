<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dash</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00e5;
            --bg-dark: #0a0a12;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 600px;
            height: 400px;
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
            background: rgba(0, 0, 0, 0.8);
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .stats {
            position: absolute;
            top: 10px;
            width: 95%;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-blue);
            pointer-events: none;
        }

        #menu {
            background: rgba(10, 10, 18, 0.9);
            padding: 30px;
            border: 2px solid var(--neon-pink);
            text-align: center;
            pointer-events: auto;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 48px;
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue);
            letter-spacing: 5px;
        }

        button {
            padding: 12px 30px;
            font-size: 20px;
            background: transparent;
            color: var(--neon-pink);
            border: 2px solid var(--neon-pink);
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }

        button:hover {
            background: var(--neon-pink);
            color: white;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <div class="stats">
            <span id="scoreDisplay">SCORE: 0</span>
            <span id="timerDisplay">TIME: 30s</span>
        </div>

        <div id="ui-layer">
            <div id="menu">
                <h1 id="title">NEON DASH</h1>
                <p id="finalScore" style="display:none; font-size: 24px; margin-bottom: 20px;">Final Score: 0</p>
                <button id="startBtn">Start Game</button>
                <div class="controls-hint">Use Arrow Keys or WASD to move</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const menu = document.getElementById('menu');
        const title = document.getElementById('title');
        const finalScoreText = document.getElementById('finalScore');

        // Game Constants
        const PLAYER_SIZE = 20;
        const TARGET_SIZE = 15;
        const ENEMY_SIZE = 15;
        const INITIAL_TIME = 30;

        // Game State
        let score = 0;
        let timeLeft = INITIAL_TIME;
        let gameActive = false;
        let player = { x: 300, y: 200, speed: 5 };
        let target = { x: 0, y: 0 };
        let enemies = [];
        let particles = [];
        let keys = {};
        let timerInterval;

        // Input Listeners
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function initGame() {
            score = 0;
            timeLeft = INITIAL_TIME;
            gameActive = true;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            enemies = [];
            particles = [];
            spawnTarget();
            
            scoreDisplay.innerText = `SCORE: ${score}`;
            timerDisplay.innerText = `TIME: ${timeLeft}s`;
            menu.style.display = 'none';
            finalScoreText.style.display = 'none';

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `TIME: ${timeLeft}s`;
                if (timeLeft <= 0) endGame();
            }, 1000);

            requestAnimationFrame(gameLoop);
        }

        function spawnTarget() {
            target.x = Math.random() * (canvas.width - TARGET_SIZE * 2) + TARGET_SIZE;
            target.y = Math.random() * (canvas.height - TARGET_SIZE * 2) + TARGET_SIZE;
        }

        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            if(side === 0) { x = 0; y = Math.random() * canvas.height; } // Left
            else if(side === 1) { x = canvas.width; y = Math.random() * canvas.height; } // Right
            else if(side === 2) { x = Math.random() * canvas.width; y = 0; } // Top
            else { x = Math.random() * canvas.width; y = canvas.height; } // Bottom

            enemies.push({
                x: x,
                y: y,
                vx: (player.x - x) / (timeLeft * 15 + 60), // Speed increases as time decreases
                vy: (player.y - y) / (timeLeft * 15 + 60),
                life: 200
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1.0,
                    color: color
                });
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            menu.style.display = 'block';
            title.innerText = "GAME OVER";
            finalScoreText.innerText = `Final Score: ${score}`;
            finalScoreText.style.display = 'block';
            startBtn.innerText = "Try Again";
        }

        function update() {
            if (!gameActive) return;

            // Movement logic
            if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

            // Screen bounds
            player.x = Math.max(0, Math.min(canvas.width - PLAYER_SIZE, player.x));
            player.y = Math.max(0, Math.min(canvas.height - PLAYER_SIZE, player.y));

            // Target collision
            const distToTarget = Math.hypot(player.x + PLAYER_SIZE/2 - target.x, player.y + PLAYER_SIZE/2 - target.y);
            if (distToTarget < PLAYER_SIZE) {
                score += 10;
                scoreDisplay.innerText = `SCORE: ${score}`;
                createParticles(target.x, target.y, '#ff00e5');
                spawnTarget();
                // Spawn enemy every time we get a point
                if (score % 30 === 0) spawnEnemy(); 
            }

            // Enemy logic
            enemies.forEach((enemy, index) => {
                enemy.x += enemy.vx * 2;
                enemy.y += enemy.vy * 2;

                // Collision with player
                const distToPlayer = Math.hypot(player.x + PLAYER_SIZE/2 - enemy.x, player.y + PLAYER_SIZE/2 - enemy.y);
                if (distToPlayer < PLAYER_SIZE / 1.5) {
                    endGame();
                }

                // Remove old enemies
                enemy.life--;
                if (enemy.life <= 0) enemies.splice(index, 1);
            });

            // Particle logic
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            });

            // Randomly spawn enemies over time
            if (Math.random() < 0.02 && score > 50) spawnEnemy();
        }

        function draw() {
            ctx.fillStyle = 'rgba(10, 10, 18, 0.3)'; // Motion blur effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Target
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff00e5';
            ctx.fillStyle = '#ff00e5';
            ctx.beginPath();
            ctx.arc(target.x, target.y, TARGET_SIZE / 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw Player
            ctx.shadowColor = '#00f2ff';
            ctx.fillStyle = '#00f2ff';
            ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);

            // Draw Enemies
            ctx.shadowColor = 'red';
            ctx.fillStyle = '#ff3333';
            enemies.forEach(enemy => {
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, ENEMY_SIZE / 2, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.shadowBlur = 5;
                ctx.shadowColor = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', initGame);
    </script>
</body>
</html>
