<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumTrade | Market Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --up: #22c55e;
            --down: #ef4444;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 2rem; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 { font-size: 0.875rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-card .value { font-size: 1.5rem; font-weight: 700; margin: 0.5rem 0; }
        .trend { font-size: 0.875rem; display: flex; align-items: center; gap: 4px; }
        .trend.up { color: var(--up); }
        .trend.down { color: var(--down); }

        /* Chart Section */
        .chart-container {
            grid-column: span 3;
            height: 400px;
        }
        .market-summary { grid-column: span 1; }

        /* Table Section */
        .table-section {
            grid-column: span 4;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            text-align: left;
        }
        th {
            color: var(--text-dim);
            font-weight: 500;
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: color 0.2s;
        }
        th:hover { color: var(--accent); }
        td { padding: 16px 12px; border-bottom: 1px solid #33415544; font-size: 0.9rem; }
        tr:hover { background: rgba(255,255,255,0.02); }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-container, .table-section { grid-column: span 2; }
        }
    </style>
</head>
<body>

    <header style="max-width: 1400px; margin: 0 auto 2rem auto;">
        <h1>Market Overview</h1>
        <p style="color: var(--text-dim);">Real-time simulated market data</p>
    </header>

    <div class="dashboard-grid">
        <!-- Stats Row -->
        <div class="card stat-card">
            <h3>Total Balance</h3>
            <div class="value">$42,850.12</div>
            <div class="trend up">▲ 2.4%</div>
        </div>
        <div class="card stat-card">
            <h3>Active Trades</h3>
            <div class="value">12</div>
            <div class="trend down">▼ 1</div>
        </div>
        <div class="card stat-card">
            <h3>Daily PNL</h3>
            <div class="value" style="color: var(--up);">+$840.30</div>
            <div class="trend up">▲ 5.2%</div>
        </div>
        <div class="card stat-card">
            <h3>Volatility (Index)</h3>
            <div class="value">14.2%</div>
            <div class="trend down">▼ 0.8%</div>
        </div>

        <!-- Chart Row -->
        <div class="card chart-container">
            <canvas id="marketChart"></canvas>
        </div>
        <div class="card market-summary">
            <h3>Market Sentiment</h3>
            <div style="margin-top: 1.5rem;">
                <p style="font-size: 0.8rem; color: var(--text-dim);">Fear & Greed Index</p>
                <h2 style="color: #fbbf24;">72 (Greed)</h2>
            </div>
        </div>

        <!-- Table Row -->
        <div class="card table-section">
            <h3>Watchlist</h3>
            <table id="assetTable">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Asset ↕</th>
                        <th onclick="sortTable(1)">Price ↕</th>
                        <th onclick="sortTable(2)">Change ↕</th>
                        <th onclick="sortTable(3)">Volume ↕</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data injected via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- FAKE DATA ---
        const marketData = [
            { asset: 'Bitcoin', price: 64230.50, change: 2.45, vol: '$1.2B' },
            { asset: 'Ethereum', price: 3450.12, change: -1.20, vol: '$850M' },
            { asset: 'Solana', price: 145.67, change: 5.82, vol: '$210M' },
            { asset: 'Cardano', price: 0.45, change: -0.32, vol: '$45M' },
            { asset: 'Polkadot', price: 7.21, change: 1.15, vol: '$92M' },
            { asset: 'Avalanche', price: 38.90, change: -2.45, vol: '$120M' }
        ];

        // --- CHART LOGIC ---
        const ctx = document.getElementById('marketChart').getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(56, 189, 248, 0.3)');
        gradient.addColorStop(1, 'rgba(56, 189, 248, 0)');

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00'],
                datasets: [{
                    label: 'Market Index',
                    data: [6200, 6250, 6220, 6300, 6280, 6350, 6420],
                    borderColor: '#38bdf8',
                    borderWidth: 3,
                    fill: true,
                    backgroundColor: gradient,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                }
            }
        });

        // --- TABLE LOGIC ---
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(row => {
                const tr = document.createElement('tr');
                const changeClass = row.change >= 0 ? 'up' : 'down';
                const sign = row.change >= 0 ? '+' : '';
                tr.innerHTML = `
                    <td style="font-weight: 600;">${row.asset}</td>
                    <td>$${row.price.toLocaleString()}</td>
                    <td class="${changeClass}">${sign}${row.change}%</td>
                    <td>${row.vol}</td>
                    <td><button style="background: var(--accent); border:none; padding: 4px 12px; border-radius: 4px; cursor:pointer;">Trade</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function sortTable(n) {
            const table = document.getElementById("assetTable");
            let switching = true, i, x, y, shouldSwitch, dir = "asc", switchcount = 0;
            while (switching) {
                switching = false;
                const rows = table.rows;
                for (i = 1; i < (rows.length - 1); i++) {
                    shouldSwitch = false;
                    x = rows[i].getElementsByTagName("TD")[n];
                    y = rows[i + 1].getElementsByTagName("TD")[n];
                    
                    let xVal = x.innerText.replace(/[$,%]/g, '');
                    let yVal = y.innerText.replace(/[$,%]/g, '');
                    
                    if (!isNaN(parseFloat(xVal))) {
                        xVal = parseFloat(xVal);
                        yVal = parseFloat(yVal);
                    }

                    if (dir == "asc") {
                        if (xVal > yVal) { shouldSwitch = true; break; }
                    } else if (dir == "desc") {
                        if (xVal < yVal) { shouldSwitch = true; break; }
                    }
                }
                if (shouldSwitch) {
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                    switchcount++;
                } else {
                    if (switchcount == 0 && dir == "asc") {
                        dir = "desc";
                        switching = true;
                    }
                }
            }
        }

        // Initial Load & Real-time Simulation
        renderTable(marketData);

        setInterval(() => {
            // Simulate price movement
            marketData.forEach(item => {
                const change = (Math.random() - 0.5) * 2;
                item.price += item.price * (change / 100);
            });
            renderTable(marketData);

            // Simulate chart movement
            chart.data.datasets[0].data.shift();
            const lastVal = chart.data.datasets[0].data[chart.data.datasets[0].data.length - 1];
            chart.data.datasets[0].data.push(lastVal + (Math.random() - 0.5) * 20);
            chart.update('none');
        }, 3000);

    </script>
</body>
</html>
