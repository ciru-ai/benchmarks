<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Comic Sequence</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-border: #333;
            --speech-bg: white;
            --text-color: black;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Bangers', 'Comic Sans MS', cursive, sans-serif;
        }

        /* Comic Container */
        #comic-stage {
            position: relative;
            width: 600px;
            height: 400px;
            background: #eee;
            border: 8px solid var(--panel-border);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Panels / Scenes */
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
        }

        /* Character Styling */
        .character {
            position: absolute;
            bottom: 20px;
            width: 100px;
            height: 150px;
            background: #3498db;
            border-radius: 50% 50% 0 0;
            transition: all 0.5s ease;
        }

        /* Scene 1: The Discovery */
        #scene1 { background: #a2d9ff; display: flex; }
        #scene1 .character { left: -150px; animation: walkIn 3s forwards; }
        
        @keyframes walkIn {
            to { left: 150px; }
        }

        /* Scene 2: The Surprise */
        #scene2 { background: #ffeb3b; display: none; }
        #scene2 .character { left: 400px; transform: scale(1.2); animation: shake 0.5s infinite; }
        
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(3px, 2px) rotate(1deg); }
            60% { transform: translate(-1px, -1px) rotate(1deg); }
            80% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, 2px) rotate(0deg); }
        }

        /* Scene 3: The Explosion */
        #scene3 { background: #e74c3c; display: none; }
        #scene3 .explosion {
            width: 50px; height: 50px;
            background: orange;
            border-radius: 50%;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(20); opacity: 0; }
        }

        /* Speech Bubbles */
        .bubble {
            position: absolute;
            background: var(--speech-bg);
            border: 3px solid black;
            padding: 15px;
            border-radius: 50%;
            font-weight: bold;
            text-align: center;
            min-width: 80px;
            opacity: 0;
            transform: scale(0);
        }

        .bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            border-width: 20px 15px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }

        /* Animations for Bubbles */
        .show-bubble { animation: popIn 0.4s forwards; }
        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* Controls */
        .controls {
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        button:hover { background: #c0392b; }

    </style>
</head>
<body>

    <div id="comic-stage">
        <!-- Scene 1 -->
        <div class="scene" id="scene1">
            <div class="character"></div>
            <div class="bubble" style="top: 50px; left: 280px;" id="b1">Wait... what is that?</div>
        </div>

        <!-- Scene 2 -->
        <div class="scene" id="scene2">
            <div class="character" style="background: #9b59b6;"></div>
            <div class="bubble" style="top: 80px; left: 350px;" id="b2">OH NOOOOO!</div>
        </div>

        <!-- Scene 3 -->
        <div class="scene" id="scene3">
            <div class="explosion"></div>
            <div class="bubble" style="top: 150px; left: 240px;" id="b3">KABOOM!</div>
        </div>
    </div>

    <div class="controls">
        <button id="playBtn">Play Sequence</button>
    </div>

    <script>
        const scenes = ['scene1', 'scene2', 'scene3'];
        let currentSceneIndex = 0;
        let isPlaying = false;
        let timer;

        const playBtn = document.getElementById('playBtn');
        const sceneElements = document.querySelectorAll('.scene');
        const bubbles = document.querySelectorAll('.bubble');

        function resetComic() {
            isPlaying = true;
            currentSceneIndex = 0;
            playBtn.textContent = "Pause";
            playSequence();
        }

        function pauseComic() {
            isPlaying = false;
            clearTimeout(timer);
            playBtn.textContent = "Resume";
        }

        function playSequence() {
            if (!isPlaying) return;

            // Hide all scenes and bubbles
            sceneElements.forEach(s => s.style.display = 'none');
            bubbles.forEach(b => b.classList.remove('show-bubble'));

            const currentSceneId = scenes[currentSceneIndex];
            const activeScene = document.getElementById(currentSceneId);
            activeScene.style.display = 'flex';

            // Trigger bubble animation with delay
            const bubbleInScene = activeScene.querySelector('.bubble');
            if (bubbleInScene) {
                setTimeout(() => {
                    bubbleInScene.classList.add('show-bubble');
                }, 800);
            }

            currentSceneIndex++;

            if (currentSceneIndex < scenes.length) {
                timer = setTimeout(playSequence, 3500);
            } else {
                // End of comic
                setTimeout(() => {
                    isPlaying = false;
                    playBtn.textContent = "Replay";
                }, 2000);
            }
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseComic();
            } else if (playBtn.textContent === "Resume" || playBtn.textContent === "Replay") {
                resetComic();
            } else {
                resetComic();
            }
        });

    </script>
</body>
</html>
