<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inference Kinetic Typography</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-color: #00ffcc;
            --secondary-color: #7000ff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            perspective: 1000px;
        }

        .word {
            position: absolute;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: none;
            will-change: transform, opacity;
            mix-blend-mode: screen;
        }

        .glitch {
            color: var(--accent-color);
            text-shadow: 2px 0 var(--secondary-color), -2px 0 #ff00c8;
        }

        #overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-family: monospace;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="overlay">RUNNING LOCAL INFERENCE...</div>

    <script>
        const container = document.getElementById('canvas-container');
        const wordsData = [
            { text: "LOCAL", color: "#ffffff" },
            { text: "INFERENCE", color: "#00ffcc", weight: "900" },
            { text: "TOKENS", color: "#7000ff" },
            { text: "SLOTS", color: "#ff00c8" },
            { text: "THROUGHPUT", color: "#ffffff", glitch: true },
            { text: "LATENCY", color: "#7000ff" },
            { text: "QUANTIZED", color: "#00ffcc" },
            { text: "ON-DEVICE", color: "#ffffff" },
            { text: "KV CACHE", color: "#7000ff" },
            { text: "FAST", color: "#00ffcc" }
        ];

        class KineticWord {
            constructor(text, color, glitch = false) {
                this.element = document.createElement('div');
                this.element.className = 'word' + (glitch ? ' glitch' : '');
                this.element.innerText = text;
                this.element.style.color = color;
                this.element.style.fontSize = Math.random() * (80 - 30) + 30 + 'px';
                
                container.appendChild(this.element);

                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.z = Math.random() * -500;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.vz = (Math.random() - 0.5) * 5;
                this.life = 1.0;
                this.decay = Math.random() * 0.005 + 0.002;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;
                this.life -= this.decay;

                // Boundary bounce (simplified)
                if(this.x < 0 || this.x > window.innerWidth) this.vx *= -1;
                if(this.y < 0 || this.y > window.innerHeight) this.vy *= -1;

                const scale = Math.max(0.5, this.life);
                this.element.style.transform = `translate3d(${this.x}px, ${this.y}px, ${this.z}px) scale(${scale})`;
                this.element.style.opacity = this.life;
            }

            remove() {
                container.removeChild(this.element);
            }
        }

        let activeWords = [];

        function spawnWord() {
            const data = wordsData[Math.floor(Math.random() * wordsData.length)];
            activeWords.push(new KineticWord(data.text, data.color, data.glitch));
        }

        function animate() {
            for (let i = activeWords.length - 1; i >= 0; i--) {
                activeWords[i].update();
                if (activeWords[i].life <= 0) {
                    activeWords[i].remove();
                    activeWords.splice(i, 1);
                }
            }

            // Randomly spawn new words based on "throughput" simulation logic
            if (Math.random() > 0.85) {
                spawnWord();
            }

            requestAnimationFrame(animate);
        }

        // Initial burst
        for(let i=0; i<15; i++) {
            setTimeout(spawnWord, i * 200);
        }

        window.addEventListener('resize', () => {
            container.innerHTML = '';
            activeWords = [];
        });

        animate();
    </script>
</body>
</html>
