  <template id="buildPrompt">Build Prompt: Qwen Agent Bot in Three.js

Create a complete, self-contained index.html that renders an impressive 3D Qwen Agent Bot using Three.js.

The bot is the physical embodiment of a powerful LLM agent. It should look sleek, intelligent, futuristic, and believable enough to exist as a real machine.

Visual Design

Build a humanoid sci-fi robot with:

a smooth angular head and glowing visor

a transparent or partially open chest containing a luminous AI core

dark graphite mechanical structure with white ceramic armor panels

violet, blue, and cyan emissive lighting

articulated arms, hands, legs, shoulders, and neck

visible cooling vents, cables, joints, and layered mechanical parts

a strong, readable silhouette

premium cinematic hard-surface design

Add several glowing Mixture-of-Experts modules around the chest, shoulders, or upper back. Some modules should pulse brightly while others remain dim. Animate light traveling between the head, chest core, expert modules, and arms to represent token routing and active reasoning.

Give the bot a confident standing pose with one hand interacting with a floating holographic interface.

Three.js Requirements

Produce one working HTML file containing all CSS and JavaScript.

Use:

Three.js from a CDN

OrbitControls

procedural geometry made from Three.js primitives and custom mesh combinations

physically based materials

emissive materials

shadows

cinematic lighting

a dark futuristic environment

subtle fog or particles

a reflective or metallic platform

responsive full-screen rendering

Add animation for:

rotating chest-core rings

pulsing expert modules

moving data lights

subtle head movement

holographic UI motion

gentle idle mechanical motion

The holographic interface should show abstract agent activity, token streams, expert activation, and system status using simple glowing shapes, lines, and panels.

Interaction

Include:

mouse orbit

zoom

smooth camera controls

automatic slow camera rotation when idle

a small UI button to pause or resume animation

a small UI button to reset the camera

Output

Return only the complete contents of index.html.

The result should run immediately when opened in a browser and should look polished enough to serve as a visual prototype for a real-time LLM monitoring interface.</template>

  }
  function makeArm(side, raised) {
    const shoulder=new THREE.Group(); shoulder.position.set(side*1.85,6.04,.04); shoulder.rotation.z=side*(raised?.22:.08);bot.add(shoulder);
    sphere(shoulder,.49,graphiteDark); torus(shoulder,.46,.075,raised?violet:blue,[0,0,0],[Math.PI/2,0,0]);
    box(shoulder,[.89,.57,.92],ceramic,[side*.18,.04,.03],[0,0,side*.12]);
    const a=new THREE.Vector3(side*.18,-.25,.06), b=new THREE.Vector3(side*.69,raised?-1.27:-1.58,.2);
    between(shoulder,a,b,.27,graphite);
    box(shoulder,[.52,1.12,.55],ceramic,[side*.45,raised?-.75:-.91,.15],[0,0,side*(raised?.38:.2)]);
    sphere(shoulder,.31,graphiteDark,[side*.73,raised?-1.42:-1.72,.2]);
    const c=new THREE.Vector3(side*.73,raised?-1.55:-1.85,.2),d=new THREE.Vector3(side*1.15,raised?-2.22:-3.0,.26);
    between(shoulder,c,d,.22,graphiteSoft);
    box(shoulder,[.42,raised?.65:1.12,.48],ceramic,[side*.98,raised?-1.87:-2.42,.24],[0,0,side*(raised?.36:.14)]);
    for(let j=0;j<3;j++) strip(shoulder,.09,.03,cyan,[side*1.22,raised?-1.82-j*.15:-2.1-j*.22,.5]);
    idleJoints.push({part:shoulder,phase:side*1.7,amp:raised?.045:.025});
  }
  makeArm(-1,false);makeArm(1,true); const lowHand=makeHand(bot,-1,false);const raisedHand=makeHand(bot,1,true);

  // Braided power and coolant cables across the exposed spine and shoulders.
  const cables=[
    [new THREE.Vector3(-1.72,6.15,-.35),new THREE.Vector3(-1.25,5.15,-.63),new THREE.Vector3(-.5,4.55,-.55),cyan],
    [new THREE.Vector3(1.72,6.18,-.36),new THREE.Vector3(1.25,5.15,-.68),new THREE.Vector3(.5,4.55,-.56),violet],
    [new THREE.Vector3(-.58,6.52,-.5),new THREE.Vector3(-.95,5.85,-.82),new THREE.Vector3(-.53,4.72,-.64),blue],
    [new THREE.Vector3(.58,6.52,-.5),new THREE.Vector3(.95,5.85,-.82),new THREE.Vector3(.53,4.72,-.64),cyan]
  ];
  cables.forEach((q,i)=>{const t=tube(bot,q.slice(0,3),.045,q[3]);activeEmissives.push({mesh:t.mesh,base:i<2?.85:.55,phase:i});});

  // Mixture-of-Experts capsules: 8 deliberate, independently pulsing reasoning modules.
  function makeExpert(pos, color, phase, label) {
    const group=new THREE.Group();group.position.copy(pos);group.rotation.y=Math.atan2(pos.x,pos.z);bot.add(group);
    box(group,[.58,.76,.25],graphite,[0,0,0]);box(group,[.46,.52,.055],ceramicShade,[0,0,.165]);
    const lamp=box(group,[.28,.16,.035],color,[0,.03,.205]);
    for(let i=-1;i<=1;i++) box(group,[.3,.035,.03],dimCyan,[0,i*.18,.238]);
    const tag=makeLabel(label, '#9defff', 256);tag.position.set(0,-.52,.18);tag.scale.set(.68,.25,1);group.add(tag);
    experts.push({group,lamp,phase,base:phase%3===0?3.2:.65}); activeEmissives.push({mesh:lamp,base:phase%3===0?3.2:.65,phase});
  }
  [[-1.65,5.55,.18,cyan],[-1.97,5.18,-.24,violet],[1.65,5.55,.18,blue],[1.97,5.18,-.24,cyan],[-1.65,6.36,-.28,violet],[1.65,6.36,-.28,cyan],[-.93,4.42,-.53,blue],[.93,4.42,-.53,violet]].forEach((v,i)=>makeExpert(new THREE.Vector3(v[0],v[1],v[2]),v[3],i,'E'+String(i+1).padStart(2,'0')));

  // A translucent holographic workspace at the raised hand.
  const holo=new THREE.Group();holo.position.set(4.15,5.65,.12);holo.rotation.y=-.33;scene.add(holo);
  const holoPanel=new THREE.Mesh(new THREE.PlaneGeometry(2.75,1.78),new THREE.MeshBasicMaterial({color:0x1ecfff,transparent:true,opacity:.075,depthWrite:false,side:THREE.DoubleSide}));holoPanel.position.z=.02;holo.add(holoPanel);
  const edgeMat=new THREE.LineBasicMaterial({color:0x63edff,transparent:true,opacity:.85});
  const outline=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1.37,-.89,.05),new THREE.Vector3(1.37,-.89,.05),new THREE.Vector3(1.37,.89,.05),new THREE.Vector3(-1.37,.89,.05)]),edgeMat);holo.add(outline);
  for(let y=-.55;y<=.55;y+=.275){const line=new THREE.Mesh(new THREE.PlaneGeometry(2.28,.015),new THREE.MeshBasicMaterial({color:y===.275?0x9a5cff:0x40e9ff,transparent:true,opacity:.7,depthWrite:false}));line.position.set(-.12,y,.07);holo.add(line);holoParts.push({mesh:line,phase:y*7});}
  for(let x=-1.1;x<=.95;x+=.41){const bar=new THREE.Mesh(new THREE.PlaneGeometry(.16,.18+Math.random()*.55),new THREE.MeshBasicMaterial({color:x>.3?0xad66ff:0x45efff,transparent:true,opacity:.72,depthWrite:false}));bar.position.set(x,-.42,.08);holo.add(bar);holoParts.push({mesh:bar,phase:x*5});}
  const holoRing=torus(holo,.58,.018,cyan,[0,.05,.15]);const holoRing2=torus(holo,.88,.012,violet,[0,.05,.13],[0,0,.36]);holoParts.push({mesh:holoRing,phase:0,ring:1},{mesh:holoRing2,phase:1,ring:-.65});
  const holoTitle=makeLabel('AGENT // ACTIVE','#b4f8ff',512);holoTitle.position.set(-.13,.58,.16);holoTitle.scale.set(1.8,.34,1);holo.add(holoTitle);
  const holoWords=makeLabel('TOKENS   EXPERTS   TOOL CALLS','#a771ff',512);holoWords.position.set(.02,-.72,.16);holoWords.scale.set(2.3,.21,1);holo.add(holoWords);
  const holoLight=new THREE.PointLight(0x23e9ff,6,5,2);holoLight.position.set(0,0,.9);holo.add(holoLight);

  // Animated token packets route thought from visor to core, experts, limbs and hologram.
  const routes=[
    [new THREE.Vector3(0,7.3,.8),new THREE.Vector3(0,6.2,1.12),new THREE.Vector3(0,5.28,1.25)],
    [new THREE.Vector3(0,5.28,1.25),new THREE.Vector3(-1.55,5.7,.65),new THREE.Vector3(-2.2,5.65,.28)],
    [new THREE.Vector3(0,5.28,1.25),new THREE.Vector3(1.55,5.7,.65),new THREE.Vector3(2.2,5.65,.28)],
    [new THREE.Vector3(0,5.25,1.1),new THREE.Vector3(1.65,5.1,.75),new THREE.Vector3(3.75,5.55,.4)],
    [new THREE.Vector3(0,5.18,1.12),new THREE.Vector3(-1.45,4.75,.55),new THREE.Vector3(-2.65,4.5,.36)]
  ];
  routes.forEach((pts,i)=>{const curve=new THREE.CatmullRomCurve3(pts);for(let n=0;n<2;n++){const packet=sphere(scene,.075,n%2?cyan:violet);packet.castShadow=false;const glow=new THREE.PointLight(n%2?0x45efff:0xa765ff,.8,2,2);packet.add(glow);dataPackets.push({mesh:packet,curve,offset:(i*.21+n*.52)%1,speed:.085+i*.012});}});

  const clock=new THREE.Clock();let paused=false;let elapsed=0;let lastInput=performance.now();
  function setToast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(setToast.timer);setToast.timer=setTimeout(()=>t.classList.remove('show'),1800);}
  document.getElementById('pauseButton').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume motion':'Pause motion';setToast(paused?'ANIMATION PAUSED':'ANIMATION RESUMED');});
  document.getElementById('resetButton').addEventListener('click',()=>{camera.position.copy(homePosition);controls.target.copy(homeTarget);controls.update();lastInput=performance.now();setToast('CAMERA RESET');});
  document.getElementById('copyButton').addEventListener('click',async()=>{
    const text=document.getElementById('buildPrompt').content.textContent.trim();
    try { await navigator.clipboard.writeText(text); } catch { const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove(); }
    setToast('BUILD PROMPT COPIED');
  });
  ['pointerdown','wheel','touchstart'].forEach(type=>renderer.domElement.addEventListener(type,()=>{lastInput=performance.now();controls.autoRotate=false;},{passive:true}));
  controls.addEventListener('start',()=>{lastInput=performance.now();controls.autoRotate=false;});

  function animate(){
    requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(!paused)elapsed+=dt;
    const t=elapsed;
    controls.autoRotate=!paused && performance.now()-lastInput>4200;
    controls.update();
    if(!paused){
      bot.position.y=.43+Math.sin(t*1.25)*.025; headPivot.rotation.y=Math.sin(t*.55)*.12;headPivot.rotation.x=Math.sin(t*.83)*.025;
      torso.rotation.y=Math.sin(t*.35)*.018;raisedHand.rotation.z=.5+Math.sin(t*1.1)*.035;lowHand.rotation.z=.2+Math.sin(t*.86)*.025;
      rings.forEach(r=>r.mesh.rotation.z+=dt*r.speed*.9);
      experts.forEach((e,i)=>{const p=.5+.5*Math.sin(t*(1.3+(i%3)*.24)+e.phase);e.lamp.material.emissiveIntensity=e.base*(.35+p*.8);e.group.position.y+=Math.sin(t*.9+e.phase)*.0008;});
      activeEmissives.forEach(e=>{if(e.mesh.material && 'emissiveIntensity' in e.mesh.material)e.mesh.material.emissiveIntensity=e.base*(.7+.3*Math.sin(t*2.1+e.phase));});
      dataPackets.forEach(d=>{const u=(d.offset+t*d.speed)%1;d.mesh.position.copy(d.curve.getPointAt(u));d.mesh.scale.setScalar(.72+.5*Math.sin(t*7+d.offset*18));});
      holo.rotation.z=Math.sin(t*.55)*.018;holoParts.forEach((h,i)=>{if(h.ring)h.mesh.rotation.z+=dt*h.ring;else {h.mesh.material.opacity=.34+.36*(.5+.5*Math.sin(t*2+h.phase));h.mesh.position.x+=Math.sin(t*1.5+h.phase)*.0015;}});
      particles.rotation.y+=dt*.009;inlay.material.opacity=.52+.25*Math.sin(t*1.3);innerInlay.material.opacity=.54+.28*Math.sin(t*1.7+1);
    }
    document.getElementById('clock').textContent=new Date(Math.floor(t*1000)).toISOString().slice(11,19);
    const bright=experts.filter(e=>Math.sin(t*1.5+e.phase)>.05).length;document.getElementById('expertReadout').textContent=String(Math.max(4,bright)).padStart(2,'0')+' / 08';
    renderer.render(scene,camera);
  }
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  animate();
  </script>
</body>
</html>
