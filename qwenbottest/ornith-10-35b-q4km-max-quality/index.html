<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Qwen Agent Bot — 3D Interface</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#050508;font-family:'Courier New',monospace}
canvas{display:block}
#ui{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10}
#ui button{background:rgba(10,10,30,.7);border:1px solid rgba(100,140,255,.4);color:#7af;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px;backdrop-filter:blur(8px);transition:all .2s}
#ui button:hover{border-color:rgba(100,140,255,.9);color:#fff;box-shadow:0 0 16px rgba(100,140,255,.3)}
#title{position:fixed;top:20px;left:50%;transform:translateX(-50%);color:rgba(120,170,255,.7);font-size:14px;letter-spacing:4px;text-transform:uppercase;pointer-events:none;text-shadow:0 0 20px rgba(100,140,255,.4)}
#status{position:fixed;top:50px;right:24px;color:rgba(100,200,255,.5);font-size:11px;text-align:right;line-height:1.8;pointer-events:none}
</style>
</head>
<body>
<div id="title">Qwen Agent Bot</div>
<div id="status"></div>
<div id="ui">
  <button id="btnPause">⏸ Pause</button>
  <button id="btnReset">⟳ Reset Camera</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ─── Scene Setup ───
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050508);
scene.fog = new THREE.FogExp2(0x050508, 0.035);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(4, 3.5, 6);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
controls.target.set(0, 1.8, 0);
controls.maxDistance = 15;
controls.minDistance = 2;

// ─── Lighting ───
const ambientLight = new THREE.AmbientLight(0x1a1a2e, 0.5);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0x8899ff, 1.5);
keyLight.position.set(5, 8, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x4466aa, 0.6);
fillLight.position.set(-4, 3, -2);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0x6644ff, 2, 10);
rimLight.position.set(-2, 5, -3);
scene.add(rimLight);

const chestGlow = new THREE.PointLight(0x4488ff, 3, 4);
chestGlow.position.set(0, 2.2, 0.6);
scene.add(chestGlow);

// ─── Materials ───
const graphiteMat = new THREE.MeshStandardMaterial({
  color: 0x1a1a24, metalness: 0.9, roughness: 0.3
});
const ceramicMat = new THREE.MeshStandardMaterial({
  color: 0xe8e8f0, metalness: 0.2, roughness: 0.4
});
const darkCeramicMat = new THREE.MeshStandardMaterial({
  color: 0x2a2a3a, metalness: 0.5, roughness: 0.5
});
const emissiveViolet = new THREE.MeshStandardMaterial({
  color: 0x6633aa, emissive: 0x8844ff, emissiveIntensity: 2, metalness: 0.3, roughness: 0.2
});
const emissiveBlue = new THREE.MeshStandardMaterial({
  color: 0x2244aa, emissive: 0x4488ff, emissiveIntensity: 2, metalness: 0.3, roughness: 0.2
});
const emissiveCyan = new THREE.MeshStandardMaterial({
  color: 0x22aacc, emissive: 0x44eeff, emissiveIntensity: 2.5, metalness: 0.3, roughness: 0.2
});
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x112244, metalness: 0.1, roughness: 0.05, transparent: true, opacity: 0.3, transmission: 0.8
});
const coreMat = new THREE.MeshStandardMaterial({
  color: 0x2244ff, emissive: 0x4488ff, emissiveIntensity: 4, metalness: 0.8, roughness: 0.1
});
const platformMat = new THREE.MeshStandardMaterial({
  color: 0x0a0a15, metalness: 1.0, roughness: 0.15
});

// ─── Platform ───
const platformGeo = new THREE.CylinderGeometry(2.5, 2.8, 0.15, 64);
const platform = new THREE.Mesh(platformGeo, platformMat);
platform.position.y = -0.075;
platform.receiveShadow = true;
platform.castShadow = true;
scene.add(platform);

const ringGeo = new THREE.TorusGeometry(2.6, 0.02, 8, 128);
const ringMat = new THREE.MeshStandardMaterial({color: 0x4488ff, emissive: 0x4488ff, emissiveIntensity: 1.5});
const ring1 = new THREE.Mesh(ringGeo, ringMat);
ring1.rotation.x = Math.PI/2;
ring1.position.y = 0.01;
scene.add(ring1);

const ring2Geo = new THREE.TorusGeometry(2.3, 0.015, 8, 128);
const ring2 = new THREE.Mesh(ring2Geo, ringMat.clone());
ring2.rotation.x = Math.PI/2;
ring2.position.y = 0.02;
ring2.material.emissiveIntensity = 0.8;
scene.add(ring2);

// ─── Robot Group ───
const robot = new THREE.Group();
scene.add(robot);

// ─── Legs ───
function createLeg(side) {
  const leg = new THREE.Group();
  const s = side === 'left' ? 1 : -1;
  
  // Upper leg
  const upperGeo = new THREE.BoxGeometry(0.28, 0.7, 0.35);
  const upper = new THREE.Mesh(upperGeo, graphiteMat);
  upper.position.y = 0.7;
  upper.castShadow = true;
  leg.add(upper);
  
  // Knee joint
  const kneeGeo = new THREE.SphereGeometry(0.16, 16, 16);
  const knee = new THREE.Mesh(kneeGeo, darkCeramicMat);
  knee.position.y = 0.35;
  leg.add(knee);
  
  // Lower leg
  const lowerGeo = new THREE.BoxGeometry(0.24, 0.65, 0.3);
  const lower = new THREE.Mesh(lowerGeo, graphiteMat);
  lower.position.y = 0.05;
  lower.castShadow = true;
  leg.add(lower);
  
  // Foot
  const footGeo = new THREE.BoxGeometry(0.32, 0.1, 0.45);
  const foot = new THREE.Mesh(footGeo, darkCeramicMat);
  foot.position.set(0, -0.22, 0.05);
  foot.castShadow = true;
  leg.add(foot);
  
  // Glowing accent
  const accentGeo = new THREE.BoxGeometry(0.04, 0.5, 0.36);
  const accent = new THREE.Mesh(accentGeo, emissiveBlue);
  accent.position.set(s * 0.14, 0.7, 0);
  leg.add(accent);
  
  leg.position.set(s * 0.35, 0.35, 0);
  return leg;
}
const leftLeg = createLeg('left');
const rightLeg = createLeg('right');
robot.add(leftLeg, rightLeg);

// ─── Torso ───
const torso = new THREE.Group();
torso.position.y = 2.05;

// Main body
const bodyGeo = new THREE.BoxGeometry(0.9, 1.1, 0.5);
const body = new THREE.Mesh(bodyGeo, graphiteMat);
body.castShadow = true;
torso.add(body);

// Ceramic chest plates
const chestPlateGeo = new THREE.BoxGeometry(0.85, 0.5, 0.08);
const chestPlate = new THREE.Mesh(chestPlateGeo, ceramicMat);
chestPlate.position.set(0, 0.2, 0.26);
torso.add(chestPlate);

const chestPlate2 = new THREE.Mesh(chestPlateGeo, ceramicMat);
chestPlate2.position.set(0, -0.2, 0.26);
torso.add(chestPlate2);

// Chest opening
const chestOpenGeo = new THREE.BoxGeometry(0.55, 0.55, 0.12);
const chestOpen = new THREE.Mesh(chestOpenGeo, new THREE.MeshStandardMaterial({
  color: 0x050510, emissive: 0x2244aa, emissiveIntensity: 0.3
}));
chestOpen.position.set(0, 0, 0.28);
torso.add(chestOpen);

// ─── AI Core ───
const coreGroup = new THREE.Group();
coreGroup.position.set(0, 0, 0.32);

const coreGeo = new THREE.OctahedronGeometry(0.15, 2);
const core = new THREE.Mesh(coreGeo, coreMat);
coreGroup.add(core);

// Core rings
for(let i = 0; i < 3; i++) {
  const rGeo = new THREE.TorusGeometry(0.18 + i * 0.06, 0.015, 8, 32);
  const rMat = new THREE.MeshStandardMaterial({
    color: i % 2 === 0 ? 0x4488ff : 0x8844ff,
    emissive: i % 2 === 0 ? 0x4488ff : 0x8844ff,
    emissiveIntensity: 2, metalness: 0.8, roughness: 0.2
  });
  const ring = new THREE.Mesh(rGeo, rMat);
  ring.rotation.x = Math.PI / 2 + i * 0.3;
  ring.rotation.y = i * 0.5;
  coreGroup.add(ring);
}

torso.add(coreGroup);

// ─── MoE Modules ───
const moeModules = [];
function createMoE(x, y, z, pulseSpeed) {
  const mod = new THREE.Group();
  const boxGeo = new THREE.BoxGeometry(0.12, 0.18, 0.08);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x3322aa, emissive: 0x6633ff, emissiveIntensity: 1.5, metalness: 0.7, roughness: 0.2
  });
  const box = new THREE.Mesh(boxGeo, mat);
  mod.add(box);
  
  const glowGeo = new THREE.BoxGeometry(0.14, 0.02, 0.1);
  const glow = new THREE.Mesh(glowGeo, emissiveViolet);
  glow.position.y = 0.1;
  mod.add(glow);
  
  const glow2 = new THREE.Mesh(glowGeo, emissiveBlue);
  glow2.position.y = -0.1;
  mod.add(glow2);
  
  mod.position.set(x, y, z);
  mod.material = mat;
  mod.baseIntensity = 0.5 + Math.random() * 1.5;
  mod.pulseSpeed = pulseSpeed;
  mod.phase = Math.random() * Math.PI * 2;
  moeModules.push(mod);
  return mod;
}

const mod1 = createMoE(-0.55, 0.3, 0.2, 1.5);
const mod2 = createMoE(0.55, 0.3, 0.2, 2.0);
const mod3 = createMoE(-0.5, -0.1, 0.22, 1.2);
const mod4 = createMoE(0.5, -0.1, 0.22, 1.8);
const mod5 = createMoE(-0.3, 0.55, 0.25, 2.3);
const mod6 = createMoE(0.3, 0.55, 0.25, 1.7);
torso.add(mod1, mod2, mod3, mod4, mod5, mod6);

// ─── Shoulders ───
function createShoulder(side) {
  const s = side === 'left' ? 1 : -1;
  const shoulder = new THREE.Group();
  
  const ballGeo = new THREE.SphereGeometry(0.18, 16, 16);
  const ball = new THREE.Mesh(ballGeo, darkCeramicMat);
  shoulder.add(ball);
  
  const plateGeo = new THREE.BoxGeometry(0.35, 0.12, 0.25);
  const plate = new THREE.Mesh(plateGeo, ceramicMat);
  plate.position.set(s * 0.15, 0, 0);
  plate.castShadow = true;
  shoulder.add(plate);
  
  const accentGeo = new THREE.BoxGeometry(0.03, 0.14, 0.26);
  const accent = new THREE.Mesh(accentGeo, emissiveViolet);
  accent.position.set(s * 0.32, 0, 0);
  shoulder.add(accent);
  
  shoulder.position.set(s * 0.55, 0.45, 0);
  return shoulder;
}
const leftShoulder = createShoulder('left');
const rightShoulder = createShoulder('right');
torso.add(leftShoulder, rightShoulder);

// ─── Arms ───
function createArm(side) {
  const s = side === 'left' ? 1 : -1;
  const arm = new THREE.Group();
  
  // Upper arm
  const upperGeo = new THREE.BoxGeometry(0.16, 0.55, 0.18);
  const upper = new THREE.Mesh(upperGeo, graphiteMat);
  upper.position.y = -0.28;
  upper.castShadow = true;
  arm.add(upper);
  
  // Elbow
  const elbowGeo = new THREE.SphereGeometry(0.1, 12, 12);
  const elbow = new THREE.Mesh(elbowGeo, darkCeramicMat);
  elbow.position.y = -0.56;
  arm.add(elbow);
  
  // Lower arm
  const lowerGeo = new THREE.BoxGeometry(0.14, 0.5, 0.15);
  const lower = new THREE.Mesh(lowerGeo, graphiteMat);
  lower.position.y = -0.82;
  lower.castShadow = true;
  arm.add(lower);
  
  // Hand
  const handGeo = new THREE.BoxGeometry(0.12, 0.15, 0.1);
  const hand = new THREE.Mesh(handGeo, ceramicMat);
  hand.position.y = -1.1;
  arm.add(hand);
  
  // Fingers
  for(let i = 0; i < 3; i++) {
    const fGeo = new THREE.BoxGeometry(0.03, 0.1, 0.06);
    const f = new THREE.Mesh(fGeo, ceramicMat);
    f.position.set(-0.04 + i * 0.04, -1.22, 0);
    arm.add(f);
  }
  
  // Glow line
  const lineGeo = new THREE.BoxGeometry(0.02, 0.4, 0.16);
  const line = new THREE.Mesh(lineGeo, emissiveCyan);
  line.position.set(s * 0.08, -0.55, 0);
  arm.add(line);
  
  arm.position.set(s * 0.65, 0.35, 0);
  return arm;
}
const leftArm = createArm('left');
const rightArm = createArm('right');
torso.add(leftArm, rightArm);

// ─── Neck ───
const neck = new THREE.Group();
neck.position.y = 0.6;

const neckGeo = new THREE.CylinderGeometry(0.1, 0.13, 0.2, 12);
const neckMesh = new THREE.Mesh(neckGeo, darkCeramicMat);
neck.add(neckMesh);

const neckRingGeo = new THREE.TorusGeometry(0.12, 0.02, 8, 24);
const neckRing = new THREE.Mesh(neckRingGeo, emissiveBlue);
neckRing.rotation.x = Math.PI / 2;
neckRing.position.y = 0.1;
neck.add(neckRing);

torso.add(neck);

// ─── Head ───
const head = new THREE.Group();
head.position.y = 0.85;

// Main head shape - angular
const headGeo = new THREE.BoxGeometry(0.55, 0.45, 0.5);
const headMesh = new THREE.Mesh(headGeo, ceramicMat);
headMesh.castShadow = true;
head.add(headMesh);

// Top cap
const capGeo = new THREE.BoxGeometry(0.5, 0.15, 0.45);
const cap = new THREE.Mesh(capGeo, graphiteMat);
cap.position.y = 0.3;
head.add(cap);

// Visor
const visorGeo = new THREE.BoxGeometry(0.45, 0.12, 0.08);
const visorMat = new THREE.MeshStandardMaterial({
  color: 0x1100aa, emissive: 0x4488ff, emissiveIntensity: 3, metalness: 0.9, roughness: 0.1
});
const visor = new THREE.Mesh(visorGeo, visorMat);
visor.position.set(0, 0, 0.26);
head.add(visor);

// Visor glow line
const vLineGeo = new THREE.BoxGeometry(0.35, 0.02, 0.09);
const vLine = new THREE.Mesh(vLineGeo, emissiveCyan);
vLine.position.set(0, 0, 0.27);
head.add(vLine);

// Antenna
const antGeo = new THREE.CylinderGeometry(0.015, 0.02, 0.2, 8);
const ant = new THREE.Mesh(antGeo, darkCeramicMat);
ant.position.y = 0.4;
head.add(ant);

const antTipGeo = new THREE.SphereGeometry(0.03, 8, 8);
const antTip = new THREE.Mesh(antTipGeo, emissiveViolet);
antTip.position.y = 0.52;
head.add(antTip);

// Side details
for(let s of [-1, 1]) {
  const sideGeo = new THREE.BoxGeometry(0.06, 0.2, 0.3);
  const side = new THREE.Mesh(sideGeo, graphiteMat);
  side.position.set(s * 0.3, 0, 0);
  head.add(side);
  
  const sGlow = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.15, 0.25), emissiveBlue);
  sGlow.position.set(s * 0.33, 0, 0);
  head.add(sGlow);
}

torso.add(head);

// ─── Data Light Paths ───
const dataLights = [];
function createDataLight(start, end, color) {
  const points = [start, end];
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({color, transparent: true, opacity: 0});
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  
  const dotGeo = new THREE.SphereGeometry(0.02, 8, 8);
  const dotMat = new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0});
  const dot = new THREE.Mesh(dotGeo, dotMat);
  scene.add(dot);
  
  dataLights.push({line, dot, start: new THREE.Vector3().copy(start), end: new THREE.Vector3().copy(end), progress: 0, speed: 0.3 + Math.random() * 0.4, mat, dotMat});
  return line;
}

// Head to chest
createDataLight(new THREE.Vector3(0, 2.9, 0.3), new THREE.Vector3(0, 2.35, 0.4), 0x4488ff);
// Chest to left arm
createDataLight(new THREE.Vector3(-0.3, 2.35, 0.4), new THREE.Vector3(-0.65, 1.5, 0.3), 0x8844ff);
// Chest to right arm
createDataLight(new THREE.Vector3(0.3, 2.35, 0.4), new THREE.Vector3(0.65, 1.5, 0.3), 0x44eeff);
// Chest to MoE modules
createDataLight(new THREE.Vector3(0, 2.35, 0.4), new THREE.Vector3(-0.55, 2.35, 0.5), 0x6633ff);
createDataLight(new THREE.Vector3(0, 2.35, 0.4), new THREE.Vector3(0.55, 2.35, 0.5), 0x6633ff);

// ─── Holographic Interface ───
const holoGroup = new THREE.Group();
holoGroup.position.set(-1.2, 2.5, 0.8);
scene.add(holoGroup);

// Holo panels
function createHoloPanel(w, h, x, y, z, rotY) {
  const panel = new THREE.Group();
  const geo = new THREE.PlaneGeometry(w, h);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x2266ff, transparent: true, opacity: 0.15, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  panel.add(mesh);
  
  // Border
  const edges = new THREE.EdgesGeometry(geo);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color: 0x4488ff, transparent: true, opacity: 0.6}));
  panel.add(line);
  
  panel.position.set(x, y, z);
  panel.rotation.y = rotY;
  return panel;
}

const panels = [];
panels.push(createHoloPanel(0.8, 0.5, 0, 0, 0, 0.3));
panels.push(createHoloPanel(0.6, 0.35, 0.5, -0.4, 0.1, 0.1));
panels.push(createHoloPanel(0.5, 0.6, -0.4, 0.3, -0.1, 0.5));
panels.push(createHoloPanel(0.7, 0.25, 0.1, 0.5, 0.15, -0.2));
holoGroup.add(...panels);

// Holo data lines
const holoLines = [];
for(let i = 0; i < 8; i++) {
  const pts = [];
  const y = (Math.random() - 0.5) * 0.4;
  for(let j = 0; j < 6; j++) {
    pts.push(new THREE.Vector3((j / 5 - 0.5) * 0.7, y, 0));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({color: 0x4488ff, transparent: true, opacity: 0.4});
  const line = new THREE.Line(geo, mat);
  holoGroup.add(line);
  holoLines.push({line, mat, baseOpacity: 0.4, phase: Math.random() * Math.PI * 2});
}

// Holo circles
for(let i = 0; i < 3; i++) {
  const cGeo = new THREE.RingGeometry(0.08 + i * 0.05, 0.09 + i * 0.05, 32);
  const cMat = new THREE.MeshBasicMaterial({color: 0x44eeff, transparent: true, opacity: 0.3, side: THREE.DoubleSide});
  const c = new THREE.Mesh(cGeo, cMat);
  c.position.set(0.3, -0.1, 0.05);
  c.rotation.x = Math.PI / 2;
  holoGroup.add(c);
  holoLines.push({ring: c, mat: cMat, baseOpacity: 0.3, phase: i * 1.2});
}

// Floating text-like particles in holo
const holoParticles = [];
const pGeo = new THREE.SphereGeometry(0.008, 4, 4);
for(let i = 0; i < 30; i++) {
  const pMat = new THREE.MeshBasicMaterial({color: 0x4488ff, transparent: true, opacity: 0.5 + Math.random() * 0.5});
  const p = new THREE.Mesh(pGeo, pMat);
  p.position.set((Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.7, (Math.random() - 0.5) * 0.3);
  holoGroup.add(p);
  holoParticles.push({mesh: p, mat: pMat, speed: 0.2 + Math.random() * 0.5, offset: Math.random() * Math.PI * 2, yBase: p.position.y});
}

// ─── Particles Environment ───
const particleCount = 500;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
for(let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 20;
  positions[i * 3 + 1] = Math.random() * 10;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({color: 0x4488ff, size: 0.02, transparent: true, opacity: 0.4});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ─── Animation State ───
let paused = false;
let time = 0;
const clock = new THREE.Clock();

// ─── UI ───
const btnPause = document.getElementById('btnPause');
const btnReset = document.getElementById('btnReset');
const statusEl = document.getElementById('status');

btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.textContent = paused ? '▶ Resume' : '⏸ Pause';
  controls.autoRotate = !paused;
});

btnReset.addEventListener('click', () => {
  camera.position.set(4, 3.5, 6);
  controls.target.set(0, 1.8, 0);
  controls.update();
});

// ─── Status Text ───
const statusLines = [
  'TOKEN_RATE: 12,847/s',
  'ACTIVE_EXPERTS: 7/8',
  'CORE_TEMP: 42.3°C',
  'LATENCY: 12ms',
  'CONTEXT: 128K',
  'ROUTING: OPTIMAL'
];

// ─── Animation Loop ───
function animate() {
  requestAnimationFrame(animate);
  
  const dt = clock.getDelta();
  if(!paused) time += dt;
  
  // Core rotation
  core.rotation.y = time * 2;
  core.rotation.x = Math.sin(time * 0.7) * 0.3;
  coreGroup.children.forEach((child, i) => {
    if(i > 0) {
      child.rotation.z = time * (1.5 + i * 0.5) * (i % 2 === 0 ? 1 : -1);
      child.rotation.x += dt * 0.5 * (i % 2 === 0 ? 1 : -1);
    }
  });
  
  // Core pulse
  const corePulse = 3 + Math.sin(time * 3) * 1.5;
  coreMat.emissiveIntensity = corePulse;
  chestGlow.intensity = 2 + Math.sin(time * 2.5) * 1;
  
  // MoE module pulsing
  moeModules.forEach(mod => {
    const pulse = Math.sin(time * mod.pulseSpeed + mod.phase);
    const intensity = mod.baseIntensity + pulse * 1.2;
    mod.children[0].material.emissiveIntensity = Math.max(0.3, intensity);
    if(mod.children[1]) mod.children[1].material.emissiveIntensity = Math.max(0.2, intensity * 0.7);
  });
  
  // Head movement
  head.rotation.y = Math.sin(time * 0.5) * 0.15;
  head.rotation.x = Math.sin(time * 0.3) * 0.05;
  neck.rotation.y = Math.sin(time * 0.4) * 0.1;
  
  // Visor pulse
  visorMat.emissiveIntensity = 2.5 + Math.sin(time * 2) * 1;
  vLine.material.emissiveIntensity = 2 + Math.sin(time * 3 + 1) * 1;
  
  // Antenna tip
  antTip.material.emissiveIntensity = 1.5 + Math.sin(time * 4) * 1;
  
  // Arm idle motion
  leftArm.rotation.z = Math.sin(time * 0.8) * 0.05;
  rightArm.rotation.z = -Math.sin(time * 0.8 + 0.5) * 0.05;
  leftArm.rotation.x = Math.sin(time * 0.6) * 0.03;
  rightArm.rotation.x = Math.sin(time * 0.6 + 1) * 0.03;
  
  // Right arm reaching toward holo
  rightArm.rotation.x = -0.6 + Math.sin(time * 0.4) * 0.1;
  rightArm.rotation.z = -0.3 + Math.sin(time * 0.5) * 0.05;
  
  // Shoulder movement
  leftShoulder.rotation.z = Math.sin(time * 0.7) * 0.05;
  rightShoulder.rotation.z = -Math.sin(time * 0.7) * 0.05;
  
  // Holographic interface
  holoGroup.rotation.y = Math.sin(time * 0.3) * 0.1;
  panels.forEach((p, i) => {
    p.children[0].material.opacity = 0.1 + Math.sin(time * 2 + i) * 0.05;
    p.children[1].material.opacity = 0.4 + Math.sin(time * 1.5 + i * 0.5) * 0.2;
  });
  
  holoLines.forEach((hl, i) => {
    if(hl.line) {
      hl.mat.opacity = hl.baseOpacity * (0.5 + Math.sin(time * 2 + hl.phase) * 0.5);
    }
    if(hl.ring) {
      hl.ring.rotation.z = time * (0.5 + i * 0.3);
      hl.mat.opacity = hl.baseOpacity * (0.4 + Math.sin(time * 3 + hl.phase) * 0.4);
    }
  });
  
  holoParticles.forEach(p => {
    p.mesh.position.y = p.yBase + Math.sin(time * p.speed + p.offset) * 0.15;
    p.mat.opacity = 0.3 + Math.sin(time * p.speed * 2 + p.offset) * 0.4;
  });
  
  // Data lights
  dataLights.forEach(dl => {
    dl.progress += dl.speed * dt;
    if(dl.progress > 1) dl.progress = 0;
    
    const t = dl.progress;
    dl.dot.position.lerpVectors(dl.start, dl.end, t);
    dl.mat.opacity = Math.sin(t * Math.PI) * 0.8;
    dl.dotMat.opacity = Math.sin(t * Math.PI) * 1;
  });
  
  // Platform rings
  ring1.rotation.z = time * 0.2;
  ring2.rotation.z = -time * 0.15;
  
  // Particles drift
  particles.rotation.y = time * 0.01;
  const posArr = particles.geometry.attributes.position.array;
  for(let i = 0; i < particleCount; i++) {
    posArr[i * 3 + 1] -= dt * 0.05;
    if(posArr[i * 3 + 1] < 0) posArr[i * 3 + 1] = 10;
  }
  particles.geometry.attributes.position.needsUpdate = true;
  
  // Status update
  if(Math.floor(time * 2) % 3 === 0) {
    const idx = Math.floor(time) % statusLines.length;
    statusEl.innerHTML = statusLines.map((l, i) => 
      `<div style="opacity:${i === idx ? 1 : 0.4}">${l}</div>`
    ).join('');
  }
  
  controls.update();
  renderer.render(scene, camera);
}

animate();

// ─── Resize ───
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
