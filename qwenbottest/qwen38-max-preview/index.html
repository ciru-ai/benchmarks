<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QWEN · AGENT UNIT-01 — Embodied LLM Runtime</title>
<style>
  :root{ --cyan:#6fe3ff; --violet:#a06bff; --ink:#04060c; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);
    font-family:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;}
  canvas{display:block;position:fixed;inset:0;}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;color:#bfe9ff;}
  #title{position:absolute;top:22px;left:26px;}
  #t1{font-size:19px;font-weight:700;letter-spacing:.32em;color:#e8faff;
    text-shadow:0 0 14px rgba(111,227,255,.55);}
  #t1 span{color:var(--cyan);font-weight:400;}
  #t2{margin-top:7px;font-size:10px;letter-spacing:.26em;color:#7fa8c9;}
  #t2::after{content:"▌";margin-left:6px;color:var(--cyan);animation:blink 1.1s steps(2) infinite;}
  @keyframes blink{50%{opacity:0;}}
  #live{position:absolute;top:24px;right:26px;display:flex;align-items:center;gap:8px;
    font-size:10px;letter-spacing:.28em;color:#9fd8ef;
    border:1px solid rgba(111,227,255,.25);padding:7px 12px;border-radius:3px;
    background:rgba(8,14,26,.45);backdrop-filter:blur(6px);}
  #live .dot{width:7px;height:7px;border-radius:50%;background:#43ffb0;
    box-shadow:0 0 10px #43ffb0;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35;transform:scale(.75);}}
  #controlsBar{position:absolute;left:26px;bottom:24px;display:flex;gap:10px;pointer-events:auto;}
  #controlsBar button{
    font-family:inherit;font-size:11px;letter-spacing:.22em;color:#bfe9ff;
    background:rgba(10,18,32,.55);border:1px solid rgba(111,227,255,.35);
    padding:10px 16px;border-radius:4px;cursor:pointer;backdrop-filter:blur(8px);
    transition:all .18s ease;text-shadow:0 0 8px rgba(111,227,255,.4);}
  #controlsBar button:hover{background:rgba(28,52,84,.75);border-color:var(--cyan);
    box-shadow:0 0 18px rgba(111,227,255,.35), inset 0 0 12px rgba(111,227,255,.12);}
  #telemetry{position:absolute;right:26px;bottom:24px;min-width:215px;
    border:1px solid rgba(111,227,255,.22);border-radius:4px;
    background:rgba(8,14,26,.5);backdrop-filter:blur(8px);padding:12px 14px;font-size:10px;}
  #telemetry .thead{letter-spacing:.3em;color:#7fa8c9;margin-bottom:8px;font-size:9px;}
  .trow{display:flex;justify-content:space-between;gap:18px;padding:3px 0;
    border-bottom:1px dashed rgba(111,227,255,.1);}
  .trow:last-child{border-bottom:none;}
  .trow span{color:#6d90ad;letter-spacing:.14em;}
  .trow b{color:#dff6ff;font-weight:600;text-shadow:0 0 8px rgba(111,227,255,.35);}
  #hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    font-size:10px;letter-spacing:.3em;color:#5f83a3;white-space:nowrap;
    animation:hintFade 2s ease 7s forwards;}
  @keyframes hintFade{to{opacity:0;}}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(2,4,10,.62) 100%);}
  @media (max-width:760px){ #telemetry{display:none;} #hint{display:none;} }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

  }
}
</script>

<div id="hud">
  <div id="vignette"></div>
  <div id="title">
    <div id="t1">QWEN · AGENT <span>UNIT-01</span></div>
    <div id="t2">EMBODIED LLM RUNTIME // MIXTURE-OF-EXPERTS ONLINE</div>
  </div>
  <div id="live"><span class="dot"></span>LIVE TELEMETRY</div>
  <div id="controlsBar">
    <button id="btnPause">⏸ PAUSE</button>
    <button id="btnReset">⟲ RESET VIEW</button>
  </div>
  <div id="telemetry">
    <div class="thead">CORE TELEMETRY</div>
    <div class="trow"><span>TOKENS / S</span><b id="tTok">—</b></div>
    <div class="trow"><span>EXPERTS</span><b id="tExp">—</b></div>
    <div class="trow"><span>CORE TEMP</span><b id="tTemp">—</b></div>
    <div class="trow"><span>LATENCY</span><b id="tLat">—</b></div>
    <div class="trow"><span>CONTEXT</span><b id="tCtx">—</b></div>
    <div class="trow"><span>UPTIME</span><b id="tUp">—</b></div>
  </div>
  <div id="hint">DRAG TO ORBIT · SCROLL TO ZOOM · AUTO-ROTATES WHEN IDLE</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= palette ================= */
const C_CYAN = 0x3fd6ff, C_BLUE = 0x3f7bff, C_VIOLET = 0x8b5cff, C_WHITE = 0xdff6ff;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* ================= renderer / scene / camera ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c);
scene.fog = new THREE.FogExp2(0x04060c, 0.036);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 120);
const CAM0 = new THREE.Vector3(4.7, 2.75, 5.5), TGT0 = new THREE.Vector3(0, 1.7, 0);
camera.position.copy(CAM0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TGT0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 2.4; controls.maxDistance = 14;
controls.minPolarAngle = 0.12; controls.maxPolarAngle = 1.52;
controls.autoRotateSpeed = 0.6; controls.autoRotate = true;

/* ============ procedural environment map (PMREM) ============ */
{
  const env = new THREE.Scene();
  const card = (r, g, b, w, h, px, py, pz, rx, ry) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b) }));
    m.position.set(px, py, pz); m.rotation.set(rx, ry, 0); env.add(m);
  };
  card(0.55, 0.75, 1.15, 14, 14, 0, 9, 0, Math.PI / 2, 0);   // cool sky softbox
  card(1.1, 0.5, 2.4,   9, 5, -9, 3, 0, 0, Math.PI / 2);     // violet card
  card(0.35, 1.7, 2.3,  9, 5,  9, 3, 0, 0, -Math.PI / 2);    // cyan card
  card(0.09, 0.11, 0.17, 14, 6, 0, 3, -9, 0, 0);
  card(0.12, 0.15, 0.22, 14, 6, 0, 3, 9, 0, Math.PI);
  card(0.03, 0.035, 0.05, 14, 14, 0, -2, 0, -Math.PI / 2, 0);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.05).texture;
  pm.dispose();
}

/* ================= lights ================= */
scene.add(new THREE.HemisphereLight(0x28324a, 0x0a0c12, 0.55));
const key = new THREE.DirectionalLight(0xcfe2ff, 2.4);
key.position.set(4.5, 6.5, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 6; key.shadow.camera.bottom = -2;
key.shadow.camera.near = 1; key.shadow.camera.far = 20;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
scene.add(key);
const rim = new THREE.DirectionalLight(0x7a4dff, 1.8);
rim.position.set(-5, 3.5, -4.5); scene.add(rim);
const fill = new THREE.PointLight(0x37b9ff, 26, 14, 2);
fill.position.set(2.2, 1.6, 3.6); scene.add(fill);
const back = new THREE.PointLight(0x8b5cff, 22, 12, 2);
back.position.set(-2.5, 2.8, -3.2); scene.add(back);

/* ================= textures / materials ================= */
function makeGlowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.25, 'rgba(255,255,255,0.85)');
  gr.addColorStop(0.6, 'rgba(255,255,255,0.25)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
function radialTex(inner, outer, size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, inner); gr.addColorStop(1, outer);
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTex();
const softTex = radialTex('rgba(255,255,255,1)', 'rgba(255,255,255,0)', 64);
const shadowTex = radialTex('rgba(0,0,0,0.55)', 'rgba(0,0,0,0)', 256);

const MAT = {
  graphite: new THREE.MeshStandardMaterial({ color: 0x1c2029, metalness: 0.85, roughness: 0.38, envMapIntensity: 0.9 }),
  steel:    new THREE.MeshStandardMaterial({ color: 0x0e1016, metalness: 0.92, roughness: 0.5,  envMapIntensity: 0.7 }),
  ceramic:  new THREE.MeshPhysicalMaterial({ color: 0xe9edf4, metalness: 0.04, roughness: 0.3,
             clearcoat: 0.9, clearcoatRoughness: 0.28, envMapIntensity: 0.85 }),
  rubber:   new THREE.MeshStandardMaterial({ color: 0x101117, metalness: 0.2, roughness: 0.85 }),
  cable:    new THREE.MeshStandardMaterial({ color: 0x12141c, metalness: 0.45, roughness: 0.55 }),
  cableGlow:new THREE.MeshStandardMaterial({ color: 0x0c0a18, emissive: 0x5b2fd4, emissiveIntensity: 0.7, metalness: 0.4, roughness: 0.5 }),
  glass:    new THREE.MeshPhysicalMaterial({ color: 0xbfe8ff, metalness: 0, roughness: 0.06,
             transmission: 0.92, thickness: 0.25, ior: 1.45, envMapIntensity: 1.2 }),
};
function glowMat(hex, int = 2) {
  return new THREE.MeshStandardMaterial({ color: 0x05060a, emissive: hex, emissiveIntensity: int, roughness: 0.5, metalness: 0 });
}

/* ================= geometry helpers ================= */
function mesh(g, m, p, r) {
  const o = new THREE.Mesh(g, m);
  if (p) o.position.set(p[0], p[1], p[2]);
  if (r) o.rotation.set(r[0], r[1], r[2]);
  return o;
}
const box = (w, h, d, m, p, r) => mesh(new THREE.BoxGeometry(w, h, d), m, p, r);
const cyl = (rt, rb, h, m, p, seg = 20, r) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m, p, r);
const sph = (r, m, p, ws = 20, hs = 14) => mesh(new THREE.SphereGeometry(r, ws, hs), m, p);
const tor = (r, t, m, p, seg = 48) => mesh(new THREE.TorusGeometry(r, t, 10, seg), m, p);
const glowBox = (w, h, d, hex, int, p, r) => box(w, h, d, glowMat(hex, int), p, r);

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function trapezoid(wT, wB, h) {
  const s = new THREE.Shape();
  s.moveTo(-wB / 2, -h / 2); s.lineTo(wB / 2, -h / 2);
  s.lineTo(wT / 2, h / 2); s.lineTo(-wT / 2, h / 2); s.closePath();
  return s;
}
function extrudeMesh(shape, depth, mat, bevel = 0.02, bevelSeg = 2) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, steps: 1, bevelEnabled: true,
    bevelThickness: bevel, bevelSize: bevel, bevelSegments: bevelSeg });
  g.translate(0, 0, -depth / 2);
  return new THREE.Mesh(g, mat);
}
function glowSprite(color, scale, opacity = 1) {
  const m = new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
  const s = new THREE.Sprite(m); s.scale.setScalar(scale); return s;
}
function circleLine(r, hex, op) {
  const pts = [];
  for (let i = 0; i < 64; i++) { const a = i / 64 * Math.PI * 2; pts.push(V3(Math.cos(a) * r, Math.sin(a) * r, 0)); }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color: hex, transparent: true, opacity: op,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
}

/* ================= environment: ground / platform / pillars ================= */
const ground = mesh(new THREE.CircleGeometry(40, 64),
  new THREE.MeshStandardMaterial({ color: 0x05070d, roughness: 0.9, metalness: 0.3 }), [0, -0.32, 0], [-Math.PI / 2, 0, 0]);
ground.receiveShadow = true; scene.add(ground);

[[5.5, 0x1a3a55, 0.5], [8, 0x2a2350, 0.4], [11, 0x12303f, 0.3]].forEach(([r, c, o]) => {
  const rg = mesh(new THREE.RingGeometry(r, r + 0.04, 128),
    new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, side: THREE.DoubleSide }),
    [0, -0.31, 0], [-Math.PI / 2, 0, 0]);
  scene.add(rg);
});

const plat = mesh(new THREE.CylinderGeometry(3.0, 3.2, 0.32, 64),
  new THREE.MeshStandardMaterial({ color: 0x141821, metalness: 0.8, roughness: 0.45 }), [0, -0.16, 0]);
plat.receiveShadow = true; scene.add(plat);

const reflector = new Reflector(new THREE.CircleGeometry(2.9, 72),
  { clipBias: 0.003, textureWidth: 1024, textureHeight: 1024, color: 0x8899aa });
reflector.rotation.x = -Math.PI / 2; reflector.position.y = 0.002; scene.add(reflector);

const overlay = mesh(new THREE.CircleGeometry(2.9, 72),
  new THREE.MeshBasicMaterial({ color: 0x0a0e18, transparent: true, opacity: 0.62, depthWrite: false }),
  [0, 0.008, 0], [-Math.PI / 2, 0, 0]);
overlay.renderOrder = 1; scene.add(overlay);

const edgeRing = mesh(new THREE.TorusGeometry(2.99, 0.02, 10, 128), glowMat(C_CYAN, 1.8), [0, 0.006, 0], [Math.PI / 2, 0, 0]);
scene.add(edgeRing);
[[1.35, 1.39, C_VIOLET, 0.5, 0.014], [2.0, 2.03, C_CYAN, 0.35, 0.016]].forEach(([a, b, c, o, y]) => {
  const r = mesh(new THREE.RingGeometry(a, b, 96),
    new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending,
      depthWrite: false, side: THREE.DoubleSide, toneMapped: false }),
    [0, y, 0], [-Math.PI / 2, 0, 0]);
  scene.add(r);
});
// fake contact shadow under the bot
const cShadow = mesh(new THREE.CircleGeometry(1.15, 48),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }),
  [0, 0.013, 0], [-Math.PI / 2, 0, 0]);
scene.add(cShadow);

for (let i = 0; i < 8; i++) {
  const a = i / 8 * Math.PI * 2 + 0.39;
  const p = box(0.09, 0.14, 0.09, MAT.graphite, [Math.cos(a) * 2.55, 0.07, Math.sin(a) * 2.55]);
  p.castShadow = true; scene.add(p);
  scene.add(sph(0.013, glowMat(C_CYAN, 2.4), [Math.cos(a) * 2.55, 0.155, Math.sin(a) * 2.55], 10, 8));
}

// distant monolith pillars
for (let i = 0; i < 12; i++) {
  const a = i / 12 * Math.PI * 2 + Math.random() * 0.4;
  const r = 11 + Math.random() * 6, h = 3 + Math.random() * 5;
  const p = box(0.6 + Math.random() * 0.8, h, 0.5,
    new THREE.MeshStandardMaterial({ color: 0x0a0d15, roughness: 0.8, metalness: 0.5 }),
    [Math.cos(a) * r, h / 2 - 0.32, Math.sin(a) * r], [0, Math.random() * Math.PI, 0]);
  scene.add(p);
  const strip = box(0.05, h * 0.62, 0.05,
    glowMat(Math.random() < 0.5 ? 0x2fd4ff : 0x8b5cff, 1.4), [0.33, 0, 0]);
  p.add(strip);
}
// containment halos
const halo1 = mesh(new THREE.TorusGeometry(8.5, 0.018, 8, 160),
  new THREE.MeshBasicMaterial({ color: 0x6a48e0, transparent: true, opacity: 0.3,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }),
  [0, 2.6, 0], [Math.PI / 2 + 0.06, 0, 0]);
scene.add(halo1);
const halo2 = mesh(new THREE.TorusGeometry(9.8, 0.014, 8, 160),
  new THREE.MeshBasicMaterial({ color: 0x2fd4ff, transparent: true, opacity: 0.16,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }),
  [0, 1.0, 0], [Math.PI / 2 - 0.04, 0, 0]);
scene.add(halo2);

/* ================= ambient particles ================= */
const P_N = 380;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(P_N * 3), pCol = new Float32Array(P_N * 3);
const pBaseX = [], pBaseZ = [], pSpd = [];
const palette = [0x59d8ff, 0x8f6bff, 0xdfe9ff];
for (let i = 0; i < P_N; i++) {
  const r = Math.pow(Math.random(), 0.6) * 7.5, a = Math.random() * Math.PI * 2;
  pBaseX.push(Math.cos(a) * r); pBaseZ.push(Math.sin(a) * r);
  pSpd.push(0.08 + Math.random() * 0.25);
  pPos[i * 3] = pBaseX[i]; pPos[i * 3 + 1] = Math.random() * 5.5; pPos[i * 3 + 2] = pBaseZ[i];
  const c = new THREE.Color(palette[(Math.random() * 3) | 0]);
  pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.05, map: softTex, transparent: true, opacity: 0.75, vertexColors: true,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true }));
scene.add(particles);

/* ================================================================
   THE BOT
================================================================ */
const bot = new THREE.Group();
scene.add(bot);
const rig = {};

function cable(points, r, mat = MAT.cable) {
  const cu = new THREE.CatmullRomCurve3(points.map(a => V3(a[0], a[1], a[2])));
  const o = new THREE.Mesh(new THREE.TubeGeometry(cu, 40, r, 8), mat);
  bot.add(o); return o;
}

/* ---------- pelvis & waist ---------- */
const pelvis = new THREE.Group(); pelvis.position.y = 1.5; bot.add(pelvis);
pelvis.add(box(0.34, 0.2, 0.24, MAT.graphite, [0, 0.02, 0]));
const pelvFront = extrudeMesh(roundedRect(0.24, 0.17, 0.05), 0.035, MAT.ceramic, 0.012);
pelvFront.position.set(0, -0.01, 0.13); pelvis.add(pelvFront);
const pelvBack = extrudeMesh(roundedRect(0.2, 0.15, 0.05), 0.03, MAT.graphite, 0.01);
pelvBack.rotation.y = Math.PI; pelvBack.position.set(0, 0.01, -0.125); pelvis.add(pelvBack);
pelvis.add(glowBox(0.37, 0.018, 0.26, C_CYAN, 1.6, [0, 0.13, 0]));
pelvis.add(sph(0.075, MAT.steel, [0.17, -0.04, 0]));
pelvis.add(sph(0.075, MAT.steel, [-0.17, -0.04, 0]));

/* ---------- legs ---------- */
function makeLeg(s) {
  const hip = new THREE.Group();
  hip.position.set(s * 0.17, 1.46, 0);
  hip.rotation.z = s * 0.05; hip.rotation.y = s * 0.1;
  bot.add(hip);
  hip.add(cyl(0.085, 0.068, 0.6, MAT.graphite, [0, -0.34, 0]));
  const tp = extrudeMesh(roundedRect(0.15, 0.4, 0.045), 0.045, MAT.ceramic, 0.012);
  tp.position.set(0, -0.32, 0.075); tp.rotation.x = 0.06; hip.add(tp);
  hip.add(glowBox(0.008, 0.3, 0.012, C_CYAN, 1.4, [s * 0.078, -0.33, 0.062]));

  const knee = new THREE.Group(); knee.position.y = -0.68; hip.add(knee);
  knee.add(sph(0.07, MAT.steel));
  knee.add(box(0.09, 0.1, 0.05, MAT.ceramic, [0, 0, 0.055]));
  const kc1 = cyl(0.05, 0.05, 0.035, MAT.graphite, [s * 0.078, 0, 0], 12); kc1.rotation.z = Math.PI / 2; knee.add(kc1);
  const kc2 = cyl(0.05, 0.05, 0.035, MAT.graphite, [-s * 0.078, 0, 0], 12); kc2.rotation.z = Math.PI / 2; knee.add(kc2);
  knee.add(sph(0.012, glowMat(C_CYAN, 2.5), [0, 0.012, 0.092], 10, 8));

class Stream {
  constructor(points, color, count, speed, scale = 0.11) {
    this.curve = new THREE.CatmullRomCurve3(points);
    this.packets = [];
    for (let i = 0; i < count; i++) {
      const m = new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
      const s = new THREE.Sprite(m); s.scale.setScalar(scale); scene.add(s);
      this.packets.push({ s, t: Math.random(), speed: speed * (0.85 + Math.random() * 0.3),
        dir: Math.random() < 0.5 ? 1 : -1 });
    }
  }
  update(dt, level, oneWay) {
    for (const p of this.packets) {
      p.t += p.speed * (oneWay ? 1 : p.dir) * dt;
      if (p.t > 1) p.t -= 1; if (p.t < 0) p.t += 1;
      const v = Math.sin(Math.PI * p.t) * level;
      p.s.material.opacity = v;
      p.s.visible = v > 0.02;
      if (p.s.visible) p.s.position.copy(this.curve.getPoint(p.t));
    }
  }
}

function makeSideTex(title, seed) {
  const c = document.createElement('canvas'); c.width = 160; c.height = 240;
  const g = c.getContext('2d');
  g.strokeStyle = 'rgba(111,227,255,0.8)'; g.lineWidth = 2; g.strokeRect(6, 6, 148, 228);
  g.fillStyle = 'rgba(140,235,255,0.9)'; g.font = 'bold 13px monospace'; g.fillText(title, 14, 26);
  g.strokeStyle = 'rgba(111,227,255,0.25)'; g.beginPath(); g.moveTo(10, 36); g.lineTo(150, 36); g.stroke();
  let s = seed; const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 7; i++) {
    g.fillStyle = `rgba(120,220,255,${(0.25 + rnd() * 0.5).toFixed(2)})`;
    g.fillRect(14, 50 + i * 22, 20 + rnd() * 100, 10);
  }
  g.fillStyle = 'rgba(160,120,255,0.8)';
  for (let i = 0; i < 40; i++) g.fillRect(14 + rnd() * 120, 208 + ((i * 7) % 18), 2, 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

const ringA = circleLine(0.6, C_CYAN, 0.4); ringA.position.z = -0.06; holo.add(ringA);
const ringB = circleLine(0.68, C_VIOLET, 0.28); ringB.position.z = -0.08; holo.add(ringB);
const hexPts = [];
for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; hexPts.push(V3(Math.cos(a) * 0.09, Math.sin(a) * 0.09, 0)); }
const hexL = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(hexPts),
  new THREE.LineBasicMaterial({ color: C_CYAN, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
hexL.position.set(-0.27, 0.35, 0.02); holo.add(hexL);
const ripple = circleLine(0.1, 0x8ff0ff, 0.8);
ripple.position.set(0.02, -0.4, 0.05); holo.add(ripple);
const orbitDots = [];
for (let i = 0; i < 3; i++) { const d = glowSprite(0x8ff0ff, 0.055, 0.9); holo.add(d); orbitDots.push(d); }
// holo dust
const hdN = 30, hdGeo = new THREE.BufferGeometry(), hdPos = new Float32Array(hdN * 3);
for (let i = 0; i < hdN; i++) {
  hdPos[i * 3] = (Math.random() - 0.5) * 0.95;
  hdPos[i * 3 + 1] = (Math.random() - 0.5) * 1.1;
  hdPos[i * 3 + 2] = (Math.random() - 0.5) * 0.15;
}
hdGeo.setAttribute('position', new THREE.BufferAttribute(hdPos, 3));
const holoDust = new THREE.Points(hdGeo, new THREE.PointsMaterial({ size: 0.02, map: softTex,
  color: 0x9feaff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false }));
holo.add(holoDust);

// light beam: fingertip → panel
const UP = new THREE.Vector3(0, 1, 0);
const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.005, 1, 10, 1, true),
  new THREE.MeshBasicMaterial({ color: 0x55e0ff, transparent: true, opacity: 0.12,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
scene.add(beam);
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _dir = new THREE.Vector3();

/* ---------- holo canvas renderer ---------- */
const GLYPH = '▚▞▟◇◆∆∇λπΣΦΨΩ§¤0123456789ABCDEF';
const WORDS = ['attn', 'moe', 'gate', 'ffn', 'kv', 'rope', 'ctx', 'logit', 'softmax', 'top-k', 'embed', 'rms', 'qkv', 'router', 'cache', 'tok'];
function rndToken() {
  const r = Math.random();
  if (r < 0.55) {
    let n = 2 + ((Math.random() * 4) | 0), s = '';
    for (let i = 0; i < n; i++) s += GLYPH[(Math.random() * GLYPH.length) | 0];
    return s;
  }
  if (r < 0.8) return '0x' + Math.floor(Math.random() * 65536).toString(16).padStart(2, '0').toUpperCase();
  return WORDS[(Math.random() * WORDS.length) | 0];
}
const tokenRows = [];
let lastTok = 0;
let activeSet = new Set([0, 3, 5]);

function drawHoloCanvas(t) {
  if (t - lastTok > 0.1) {
    lastTok = t;
    const arr = [...activeSet];
    tokenRows.push({ txt: rndToken(), tag: Math.random() < 0.35 ? arr[(Math.random() * arr.length) | 0] : -1, a: 1 });
    if (tokenRows.length > 8) tokenRows.shift();
  }
  tokenRows.forEach(r => r.a *= 0.996);

  hx.clearRect(0, 0, 512, 640);
  hx.fillStyle = 'rgba(18,44,72,0.16)'; hx.fillRect(10, 10, 492, 620);
  hx.strokeStyle = 'rgba(90,220,255,0.85)'; hx.lineWidth = 2; hx.strokeRect(10, 10, 492, 620);
  hx.lineWidth = 3; hx.strokeStyle = 'rgba(160,240,255,0.95)';
  [[10, 10, 1, 1], [502, 10, -1, 1], [10, 630, 1, -1], [502, 630, -1, -1]].forEach(([x, y, dx, dy]) => {
    hx.beginPath(); hx.moveTo(x + dx * 22, y); hx.lineTo(x, y); hx.lineTo(x, y + dy * 22); hx.stroke();
  });
  // header
  hx.fillStyle = '#8ff0ff'; hx.font = 'bold 26px monospace'; hx.textAlign = 'left';
  hx.fillText('QWEN // AGENT CONSOLE', 24, 44);
  hx.textAlign = 'right'; hx.font = 'bold 16px monospace';
  hx.fillStyle = Math.sin(t * 6) > 0 ? '#5cff9d' : 'rgba(92,255,157,0.35)';
  hx.fillText('LIVE', 486, 42);
  hx.beginPath(); hx.arc(428, 37, 5, 0, Math.PI * 2); hx.fill();
  hx.textAlign = 'left';
  hx.strokeStyle = 'rgba(90,220,255,0.3)'; hx.lineWidth = 1;
  hx.beginPath(); hx.moveTo(20, 58); hx.lineTo(492, 58); hx.stroke();
  // token stream
  hx.font = '19px monospace';
  tokenRows.forEach((r, i) => {
    const y = 86 + i * 22;
    if (r.tag >= 0) {
      hx.fillStyle = `rgba(190,140,255,${(r.a * 0.95).toFixed(2)})`;
      hx.fillText('E' + r.tag + ' ▸ ' + r.txt, 26, y);
    } else {
      hx.fillStyle = `rgba(120,230,255,${(r.a * 0.8).toFixed(2)})`;
      hx.fillText('·  ' + r.txt, 26, y);
    }
  });
  // waveform
  hx.strokeStyle = 'rgba(120,235,255,0.9)'; hx.lineWidth = 2; hx.beginPath();
  for (let x = 20; x <= 492; x += 4) {
    const y = 300 + Math.sin(x * 0.05 + t * 3) * 13 + Math.sin(x * 0.013 - t * 1.7) * 8;
    x === 20 ? hx.moveTo(x, y) : hx.lineTo(x, y);
  }
  hx.stroke();
  hx.strokeStyle = 'rgba(160,110,255,0.5)'; hx.beginPath();
  for (let x = 20; x <= 492; x += 4) {
    const y = 300 + Math.sin(x * 0.04 - t * 2.2 + 1) * 10;
    x === 20 ? hx.moveTo(x, y) : hx.lineTo(x, y);
  }
  hx.stroke();
  // expert bars
  hx.fillStyle = '#7fa8c9'; hx.font = '13px monospace';
  hx.fillText('EXPERT ROUTING — TOP-3 GATE', 24, 350);
  for (let i = 0; i < 8; i++) {
    const lv = experts[i].level, x = 30 + i * 58, hgt = 14 + lv * 122;
    const act = activeSet.has(i);
    if (act) { hx.shadowColor = '#a06bff'; hx.shadowBlur = 14; }
    const gr = hx.createLinearGradient(0, 500 - hgt, 0, 500);
    gr.addColorStop(0, act ? 'rgba(190,140,255,0.95)' : 'rgba(80,140,200,0.5)');
    gr.addColorStop(1, act ? 'rgba(110,70,220,0.7)' : 'rgba(40,70,110,0.3)');
    hx.fillStyle = gr; hx.fillRect(x, 500 - hgt, 36, hgt);
    hx.shadowBlur = 0;
    hx.fillStyle = act ? 'rgba(230,210,255,1)' : 'rgba(140,220,255,0.7)';
    hx.fillRect(x, 500 - hgt - 3, 36, 3);
    hx.fillStyle = '#7fa8c9'; hx.font = '12px monospace';
    hx.fillText('E' + i, x + 9, 520);
  }
  // gauges
  const gauge = (x, frac, label, txt, color) => {
    hx.lineWidth = 5;
    hx.strokeStyle = 'rgba(70,110,150,0.4)';
    hx.beginPath(); hx.arc(x, 576, 24, Math.PI * 0.75, Math.PI * 2.25); hx.stroke();
    hx.strokeStyle = color; hx.shadowColor = color; hx.shadowBlur = 8;
    hx.beginPath(); hx.arc(x, 576, 24, Math.PI * 0.75, Math.PI * (0.75 + 1.5 * Math.min(1, frac))); hx.stroke();
    hx.shadowBlur = 0;
    hx.fillStyle = '#dff6ff'; hx.font = 'bold 13px monospace'; hx.textAlign = 'center';
    hx.fillText(txt, x, 581);
    hx.fillStyle = '#7fa8c9'; hx.font = '10px monospace';
    hx.fillText(label, x, 614);
    hx.textAlign = 'left';
  };
  gauge(70, ctxTok / 131072, 'CONTEXT', Math.round(ctxTok / 1024) + 'K', '#6fe3ff');
  gauge(150, (tempVal - 35) / 15, 'CORE °C', tempVal.toFixed(1), '#a06bff');
  // footer status
  hx.fillStyle = 'rgba(140,235,255,0.85)'; hx.font = '14px monospace'; hx.textAlign = 'right';
  hx.fillText('ROUTING TOP-3 OF 8 · GATE SYNC OK · PWR NOMINAL', 488, 585);
  hx.textAlign = 'left';
  // scan sweep
  const sy = (t * 90) % 640;
  hx.fillStyle = 'rgba(140,240,255,0.07)'; hx.fillRect(10, sy, 492, 4);
  texHolo.needsUpdate = true;
}

/* ================================================================
   EXPERT ROUTER + TELEMETRY STATE
================================================================ */
let routerT = 2.0, coreFlash = 0;
let tempVal = 42, ctxTok = 94210, tokRate = 160;
function pickExperts() {
  const next = new Set();
  while (next.size < 3) next.add((Math.random() * 8) | 0);
  activeSet = next;
}

/* ================================================================
   UI
================================================================ */
const $ = id => document.getElementById(id);
const tTok = $('tTok'), tExp = $('tExp'), tTemp = $('tTemp'), tLat = $('tLat'), tCtx = $('tCtx'), tUp = $('tUp');
let paused = false;
$('btnPause').addEventListener('click', () => {
  paused = !paused;
  $('btnPause').textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
});
let camTween = null;
$('btnReset').addEventListener('click', () => {
  camTween = { k: 0, p0: camera.position.clone(), t0: controls.target.clone() };
  controls.enabled = false;
});
const easeIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

let userActive = false, lastEnd = -99;
controls.addEventListener('start', () => { userActive = true; controls.autoRotate = false; });
controls.addEventListener('end', () => { userActive = false; lastEnd = performance.now() / 1000; });

let telAcc = 0;
const up0 = performance.now();
function fmtUp(s) {
  const h = (s / 3600) | 0, m = ((s / 60) | 0) % 60, ss = (s | 0) % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}
function updateTelemetry(t, dt) {
  telAcc += dt; if (telAcc < 0.25) return; telAcc = 0;
  tokRate = 148 + 26 * Math.sin(t * 0.6) + Math.random() * 14 + activeSet.size * 3;
  ctxTok += tokRate * 0.25; if (ctxTok > 131072) ctxTok -= 131072;
  tempVal = 41.6 + 2.1 * Math.sin(t * 0.12) + 0.4 * Math.sin(t * 1.7);
  tTok.textContent = Math.round(tokRate);
  tExp.textContent = activeSet.size + ' / 8';
  tTemp.textContent = tempVal.toFixed(1) + '°C';
  tLat.textContent = (9.5 + 2.6 * Math.sin(t * 0.9 + 1) + Math.random() * 1.2).toFixed(1) + ' ms';
  tCtx.textContent = (ctxTok / 1024).toFixed(1) + 'K / 128K';
  tUp.textContent = fmtUp((performance.now() - up0) / 1000);
}

/* ================================================================
   ANIMATION
================================================================ */
function updateBot(t) {
  bot.position.y = 0.012 * Math.sin(t * 1.4);
  torso.rotation.y = 0.045 * Math.sin(t * 0.31);
  torso.rotation.z = 0.012 * Math.sin(t * 0.44 + 1);
  chest.rotation.x = 0.015 * Math.sin(t * 0.5);
  // head — alert, glancing toward the interface
  head.rotation.y = 0.4 + 0.2 * Math.sin(t * 0.37) + 0.05 * Math.sin(t * 1.3);
  head.rotation.x = 0.05 + 0.03 * Math.sin(t * 0.53 + 1.2);
  head.rotation.z = 0.02 * Math.sin(t * 0.29);
  // core rings
  rig.r1.rotation.y = t * 1.25;
  rig.r2.rotation.x = t * 0.85;
  rig.r3.rotation.y = -t * 2.0;
  const pulse = 1 + 0.055 * Math.sin(t * 2.7);
  rig.coreBall.scale.setScalar(pulse);
  rig.coreLight.intensity = 9 + 2.5 * Math.sin(t * 2.7) + coreFlash * 16;
  visorMat.emissiveIntensity = 3 + 0.5 * Math.sin(t * 2.2) + coreFlash * 1.5;
  scanner.position.x = 0.085 * Math.sin(t * 1.9);
  antTipMat.emissiveIntensity = 2 + 1.8 * Math.sin(t * 5.2);
  // idle arm micro-motion
  rig.pitchL.rotation.x = -1.02 + 0.045 * Math.sin(t * 1.25);
  rig.liftL.rotation.z = 0.26 + 0.02 * Math.sin(t * 0.9 + 0.5);
  rig.wristL.rotation.x = 0.42 + 0.1 * Math.sin(t * 2.6);
  rig.pitchR.rotation.x = 0.08 + 0.03 * Math.sin(t * 1.05 + 2);
  rig.liftR.rotation.z = -0.14 + 0.015 * Math.sin(t * 0.8 + 1);
}

function updateExperts(t, dt) {
  routerT -= dt;
  if (routerT <= 0) { pickExperts(); routerT = 2.0 + Math.random() * 1.6; coreFlash = 1; }
  coreFlash = Math.max(0, coreFlash - dt * 2.2);
  experts.forEach((e, i) => {
    const target = activeSet.has(i) ? 1 : 0;
    e.level += (target - e.level) * Math.min(1, dt * 3.2);
    const lv = e.level;
    e.lens.emissiveIntensity = 0.3 + lv * (2.4 + 1.4 * Math.sin(t * 5 + e.phase));
    e.spr.material.opacity = 0.1 + lv * (0.45 + 0.2 * Math.sin(t * 5 + e.phase));
  });
}

function updateHolo(t, dt) {
  holo.position.y = holoBaseY + 0.02 * Math.sin(t * 1.1);
  holo.rotation.y = holoBaseRotY + 0.025 * Math.sin(t * 0.7);
  const glitch = (t % 4.7) < 0.12 && Math.sin(t * 80) > 0 ? 0.45 : 0;
  holoMat.opacity = 0.88 + 0.07 * Math.sin(t * 8.3) * Math.sin(t * 2.1) - glitch;
  ringA.rotation.z += dt * 0.5;
  ringB.rotation.z -= dt * 0.33;
  hexL.rotation.z += dt * 0.9;
  holoDust.rotation.z += dt * 0.05;
  orbitDots.forEach((d, i) => {
    const a = t * 1.2 + i * 2.094;
    d.position.set(Math.cos(a) * 0.62, Math.sin(a) * 0.62, 0.01);
  });
  const ph = (t % 2.2) / 2.2;
  if (ph < 0.35) {
    const k = ph / 0.35;
    ripple.visible = true;
    ripple.scale.setScalar(0.15 + 1.4 * k);
    ripple.material.opacity = 0.75 * (1 - k);
  } else ripple.visible = false;
  // beam fingertip → panel ripple point
  rig.tipL.getWorldPosition(_v1);
  ripple.getWorldPosition(_v2);
  _dir.subVectors(_v2, _v1);
  const len = _dir.length();
  beam.position.copy(_v1).addScaledVector(_dir, 0.5);
  beam.quaternion.setFromUnitVectors(UP, _dir.normalize());
  beam.scale.set(1, len, 1);
  beam.material.opacity = 0.1 + (ph < 0.35 ? 0.22 * (1 - ph / 0.35) : 0);
}

function updateParticles(t, dt) {
  const arr = pGeo.attributes.position.array;
  for (let i = 0; i < P_N; i++) {
    arr[i * 3 + 1] += pSpd[i] * dt;
    if (arr[i * 3 + 1] > 5.6) arr[i * 3 + 1] = 0.05;
    arr[i * 3] = pBaseX[i] + 0.2 * Math.sin(t * 0.25 + i * 0.37);
  }
  pGeo.attributes.position.needsUpdate = true;
}

/* ---------- post-processing ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
let simT = 0, lastCanvasDraw = -1;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now() / 1000;

  if (camTween) {
    camTween.k += dt / 1.4;
    const e = easeIO(Math.min(1, camTween.k));
    camera.position.lerpVectors(camTween.p0, CAM0, e);
    controls.target.lerpVectors(camTween.t0, TGT0, e);
    if (camTween.k >= 1) { camTween = null; controls.enabled = true; }
  }
  if (!userActive && !camTween && now - lastEnd > 4) controls.autoRotate = true;
  controls.update();

  if (!paused) {
    simT += dt;
    updateBot(simT);
    updateExperts(simT, dt);
    streamHead.update(dt, 0.9);
    streamArm.update(dt, 0.85, true);
    streamExperts.forEach((s, i) => s.update(dt, experts[i].level, true));
    updateHolo(simT, dt);
    updateParticles(simT, dt);
    updateTelemetry(simT, dt);
    if (simT - lastCanvasDraw > 0.066) { drawHoloCanvas(simT); lastCanvasDraw = simT; }
  }
  composer.render();
}
animate();
</script>
