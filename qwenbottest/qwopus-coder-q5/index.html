<script type="module">

// ─── Materials ─────────────────────────────────────────────────
const matGraphite = new THREE.MeshPhysicalMaterial({color:0x1a1a2e,metalness:0.9,roughness:0.35,clearcoat:0.4,clearcoatRoughness:0.3});

const matCore = new THREE.MeshPhysicalMaterial({color:0x00ffff,emissive:0x00aaff,emissiveIntensity:2.5,metalness:0.1,roughness:0.1,transmission:0.5,thickness:1.5});
const matCoreRing = new THREE.MeshPhysicalMaterial({color:0x00ccff,emissive:0x00ccff,emissiveIntensity:1.8,metalness:0.3,roughness:0.2});
const matExpert = new THREE.MeshPhysicalMaterial({color:0x4400ff,emissive:0x4400ff,emissiveIntensity:0.8,metalness:0.5,roughness:0.3});
const matExpertBright = new THREE.MeshPhysicalMaterial({color:0x8800ff,emissive:0x8800ff,emissiveIntensity:2.5,metalness:0.5,roughness:0.2});
const matExpertDim = new THREE.MeshPhysicalMaterial({color:0x2200aa,emissive:0x2200aa,emissiveIntensity:0.3,metalness:0.5,roughness:0.3});
const matGlowViolet = new THREE.MeshPhysicalMaterial({color:0x6600ff,emissive:0x6600ff,emissiveIntensity:3,metalness:0.1,roughness:0.1,transparent:true,opacity:0.85});
const matGlowCyan = new THREE.MeshPhysicalMaterial({color:0x00ffff,emissive:0x00ffff,emissiveIntensity:3,metalness:0.1,roughness:0.1,transparent:true,opacity:0.85});
const matGlowBlue = new THREE.MeshPhysicalMaterial({color:0x0066ff,emissive:0x0066ff,emissiveIntensity:3,metalness:0.1,roughness:0.1,transparent:true,opacity:0.85});
const matDataLine = new THREE.MeshPhysicalMaterial({color:0x00ffff,emissive:0x00ffff,emissiveIntensity:2.5,metalness:0.1,roughness:0.1,transparent:true,opacity:0.7});

// ─── Helpers ───────────────────────────────────────────────────
function mergeGeometries(geos){
  const merged = new THREE.BufferGeometry();
  const positions=[],normals=[],indices=[];
  let idx=0;
  for(const g of geos){
    const pos=g.attributes.position.array;
    const nor=g.attributes.normal.array;
    positions.push(...pos);normals.push(...nor);
    if(g.index){for(let i=0;i<g.index.array.length;i++)indices.push(g.index.array[i]+idx)}
    else{for(let i=0;i<pos.length/3;i++)indices.push(i+idx)}
    idx+=pos.length/3;
  }
  merged.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  merged.setAttribute('normal',new THREE.Float32BufferAttribute(normals,3));
  merged.setIndex(indices);
  merged.computeVertexNormals();
  return merged;
}

function makeRoundedBox(w,h,d,r,ws,hs,ds){
  const geo=new THREE.BoxGeometry(w,h,d,ws,hs,ds);
  const pos=geo.attributes.position;
  const v=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i);
    const x=Math.abs(v.x),y=Math.abs(v.y),z=Math.abs(v.z);
    const hw=w/2-r,hh=h/2-r,hd=d/2-r;
    const dx=Math.max(x-hw,0),dy=Math.max(y-hh,0),dz=Math.max(z-hd,0);
    const len=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(len>r){
      const nx=dx/len,ny=dy/len,nz=dz/len;
      v.x=Math.sign(v.x)*(x>0?hw:nw);
      v.y=Math.sign(v.y)*(y>0?hh:nh);
      v.z=Math.sign(v.z)*(z>0?hd:nd);
    }
  }
  geo.computeVertexNormals();
  return geo;
}

// ─── Scene Setup ───────────────────────────────────────────────
scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.FogExp2(0x050510, 0.04);

camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(5, 3.5, 6);

renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 3;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.55;
controls.target.set(0, 1.5, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

// ─── Lighting ──────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x111122, 0.6);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0x4466aa, 1.2);
keyLight.position.set(4, 6, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048,2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.001;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x6644aa, 0.5);
fillLight.position.set(-3, 4, -2);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0x8800ff, 3, 12);
rimLight.position.set(0, 4, -4);
scene.add(rimLight);

const chestGlow = new THREE.PointLight(0x00ccff, 4, 6);
chestGlow.position.set(0, 1.7, 0);
scene.add(chestGlow);

const visorGlow = new THREE.PointLight(0x8800ff, 2, 3);
visorGlow.position.set(0, 2.45, 0.5);
scene.add(visorGlow);

const bottomLight = new THREE.PointLight(0x0066ff, 2, 8);
bottomLight.position.set(0, -1, 3);
scene.add(bottomLight);

// ─── Platform ──────────────────────────────────────────────────
function createPlatform(){
  const group = new THREE.Group();
  // Main platform disc
  const discGeo = new THREE.CylinderGeometry(2.5, 2.8, 0.15, 64);
  const disc = new THREE.Mesh(discGeo, matPlatform);
  disc.position.y = -0.075;
  disc.receiveShadow = true;
  group.add(disc);

  // Inner ring
  const ringGeo = new THREE.TorusGeometry(1.8, 0.04, 16, 64);
  const ring = new THREE.Mesh(ringGeo, matGlowCyan);
  ring.position.y = 0.01;
  ring.rotation.x = -Math.PI/2;
  group.add(ring);

  // Outer ring
  const ring2Geo = new THREE.TorusGeometry(2.2, 0.03, 16, 64);
  const ring2 = new THREE.Mesh(ring2Geo, new THREE.MeshPhysicalMaterial({color:0x004488,emissive:0x004488,emissiveIntensity:0.8}));
  ring2.position.y = 0.01;
  ring2.rotation.x = -Math.PI/2;
  group.add(ring2);

  // Grid lines on platform
  for(let i=0;i<8;i++){
    const angle = (i/8)*Math.PI*2;
    const lineGeo = new THREE.BoxGeometry(0.005, 0.01, 2.4);
    const line = new THREE.Mesh(lineGeo, new THREE.MeshPhysicalMaterial({color:0x003355,emissive:0x003355,emissiveIntensity:0.5}));
    line.position.y = 0.005;
    line.position.x = Math.cos(angle)*1.2;
    line.position.z = Math.sin(angle)*1.2;
    line.rotation.y = angle;
    group.add(line);
  }

  // Concentric circle lines
  for(let r=0.5;r<2.5;r+=0.5){
    const cGeo = new THREE.TorusGeometry(r, 0.005, 8, 64);
    const c = new THREE.Mesh(cGeo, new THREE.MeshPhysicalMaterial({color:0x002244,emissive:0x002244,emissiveIntensity:0.3}));
    c.position.y = 0.005;
    c.rotation.x = -Math.PI/2;
    group.add(c);
  }

  scene.add(group);
}

// ─── Robot Parts ───────────────────────────────────────────────
const robotParts = {};
const dataFlowLines = [];
const expertModules = [];
const coreRings = [];
const holographicElements = [];
const ventElements = [];

function createHead(){
  const group = new THREE.Group();
  group.position.y = 2.5;

  // Main head shell - angular sci-fi shape
  const headGeo = mergeGeometries([
    // Top dome
    new THREE.SphereGeometry(0.42, 16, 12, 0, Math.PI*2, 0, Math.PI*0.55),
    // Front face - angled forward
    new THREE.BoxGeometry(0.65, 0.45, 0.35),
    // Chin
    new THREE.SphereGeometry(0.18, 8, 8, 0, Math.PI*2, 0, Math.PI*0.5),
  ]);

  // Apply slight angle to head
  headGeo.rotateX(-0.08);

  const headMesh = new THREE.Mesh(headGeo, matCeramic);
  headMesh.castShadow = true;
  group.add(headMesh);

  // Visor - glowing purple strip
  const visorGeo = new THREE.BoxGeometry(0.55, 0.08, 0.15);
  const visor = new THREE.Mesh(visorGeo, matVisor);
  visor.position.set(0, 0.08, 0.2);
  visor.rotation.x = -0.05;
  group.add(visor);

  // Visor glow
  const visorGlowGeo = new THREE.BoxGeometry(0.58, 0.04, 0.05);
  const visorGlow = new THREE.Mesh(visorGlowGeo, matGlowViolet);
  visorGlow.position.set(0, 0.08, 0.28);
  visorGlow.rotation.x = -0.05;
  group.add(visorGlow);

  // Side panels (ceramic armor)
  for(let side of [-1,1]){
    const sideGeo = mergeGeometries([
      new THREE.BoxGeometry(0.08, 0.25, 0.3),
      new THREE.BoxGeometry(0.04, 0.15, 0.2),
    ]);
    const sideMesh = new THREE.Mesh(sideGeo, matCeramic);
    sideMesh.position.set(side*0.32, 0.02, -0.05);
    sideMesh.castShadow = true;
    group.add(sideMesh);

    // Side accent light
    const accentGeo = new THREE.BoxGeometry(0.01, 0.12, 0.15);
    const accent = new THREE.Mesh(accentGeo, matGlowCyan);
    accent.position.set(side*0.36, 0.02, -0.05);
    group.add(accent);
  }

  // Neck joint
  const neckGeo = mergeGeometries([
    new THREE.CylinderGeometry(0.14, 0.18, 0.2, 12),
    new THREE.CylinderGeometry(0.18, 0.22, 0.08, 12),
  ]);
  const neck = new THREE.Mesh(neckGeo, matGraphite);
  neck.position.y = -0.35;
  group.add(neck);

  // Neck vents
  for(let i=0;i<4;i++){
    const vGeo = new THREE.BoxGeometry(0.06, 0.008, 0.08);
    const v = new THREE.Mesh(vGeo, matVent);
    const angle = (i/4)*Math.PI*2;
    v.position.set(Math.cos(angle)*0.17, -0.38, Math.sin(angle)*0.17);
    v.rotation.y = angle;
    group.add(v);
  }

  group.userData.head = group;
  return group;
}

function createTorso(){
  const group = new THREE.Group();
  group.position.y = 1.35;

  // Upper torso - chest plate
  const chestGeo = mergeGeometries([
    new THREE.BoxGeometry(0.75, 0.5, 0.3),
    new THREE.BoxGeometry(0.65, 0.35, 0.25),
  ]);
  const chest = new THREE.Mesh(chestGeo, matCeramic);
  chest.castShadow = true;
  group.add(chest);

  // Shoulder pads
  for(let side of [-1,1]){
    const shoulderGeo = mergeGeometries([
      new THREE.BoxGeometry(0.2, 0.12, 0.3),
      new THREE.BoxGeometry(0.15, 0.08, 0.35),
    ]);
    const shoulder = new THREE.Mesh(shoulderGeo, matCeramic);
    shoulder.position.set(side*0.42, 0.22, -0.05);
    shoulder.castShadow = true;
    group.add(shoulder);

    // Shoulder joint
    const jointGeo = new THREE.SphereGeometry(0.1, 8, 8);
    const joint = new THREE.Mesh(jointGeo, matGraphite);
    joint.position.set(side*0.35, 0.1, 0);
    joint.castShadow = true;
    group.add(joint);
  }

  // Chest opening - cavity for AI core
  const cavityGeo = new THREE.BoxGeometry(0.4, 0.3, 0.15);
  const cavity = new THREE.Mesh(cavityGeo, matDarkCeramic);
  cavity.position.set(0, 0.02, 0.1);
  group.add(cavity);

  // AI Core - luminous center
  const coreGeo = new THREE.SphereGeometry(0.12, 16, 16);
  const core = new THREE.Mesh(coreGeo, matCore);
  core.position.set(0, 0.02, 0.18);
  group.add(core);

  // Core glow sphere
  const coreGlowGeo = new THREE.SphereGeometry(0.18, 16, 16);
  const coreGlow = new THREE.Mesh(coreGlowGeo, new THREE.MeshPhysicalMaterial({color:0x00ccff,emissive:0x00ccff,emissiveIntensity:2,transparent:true,opacity:0.15}));
  coreGlow.position.set(0, 0.02, 0.18);
  group.add(coreGlow);

  // Core rotating rings
  for(let i=0;i<3;i++){
    const ringGeo = new THREE.TorusGeometry(0.15+i*0.04, 0.012, 8, 32);
    const ring = new THREE.Mesh(ringGeo, matCoreRing);
    ring.position.set(0, 0.02, 0.18);
    ring.rotation.x = Math.PI/2 + i*0.3;
    ring.rotation.y = i*0.5;
    coreRings.push({mesh:ring, speed:0.5+i*0.3, tilt:i*0.3, phase:i*0.7});
    group.add(ring);
  }

  // Core frame
  const frameGeo = mergeGeometries([
    new THREE.TorusGeometry(0.22, 0.02, 8, 32),
    new THREE.TorusGeometry(0.25, 0.015, 8, 32),
  ]);
  const frame = new THREE.Mesh(frameGeo, matGraphite);
  frame.position.set(0, 0.02, 0.15);
  group.add(frame);

  // Lower torso
  const lowerGeo = new THREE.BoxGeometry(0.6, 0.35, 0.25);
  const lower = new THREE.Mesh(lowerGeo, matCeramic);
  lower.position.y = -0.45;
  lower.castShadow = true;
  group.add(lower);

  // Pelvis
  const pelvisGeo = new THREE.BoxGeometry(0.55, 0.15, 0.28);
  const pelvis = new THREE.Mesh(pelvisGeo, matGraphite);
  pelvis.position.y = -0.7;
  pelvis.castShadow = true;
  group.add(pelvis);

  // Belt detail
  const beltGeo = new THREE.BoxGeometry(0.58, 0.06, 0.3);
  const belt = new THREE.Mesh(beltGeo, matGraphite);
  belt.position.y = -0.55;
  group.add(belt);

  // Belt accent
  const beltAccentGeo = new THREE.BoxGeometry(0.12, 0.08, 0.32);
  const beltAccent = new THREE.Mesh(beltAccentGeo, matGlowBlue);
  beltAccent.position.set(0, -0.55, 0.02);
  group.add(beltAccent);

  // Cooling vents on sides
  for(let side of [-1,1]){
    for(let i=0;i<3;i++){
      const ventGeo = new THREE.BoxGeometry(0.01, 0.08, 0.25);
      const vent = new THREE.Mesh(ventGeo, matVent);
      vent.position.set(side*0.38, -0.1 - i*0.15, -0.02);
      ventElements.push({mesh:vent, side:side, phase:i*0.8});
      group.add(vent);
    }
  }

  // Data flow lines on torso
  for(let i=0;i<5;i++){
    const lineGeo = new THREE.BoxGeometry(0.008, 0.6, 0.008);
    const line = new THREE.Mesh(lineGeo, matDataLine);
    line.position.set(-0.15+i*0.075, -0.1, 0.16);
    line.userData.phase = i*0.4;
    dataFlowLines.push(line);
    group.add(line);
  }

  group.userData.torso = group;
  return group;
}

function createArms(){
  const group = new THREE.Group();

  // Left arm
  for(let side of [-1,1]){
    const armGroup = new THREE.Group();

    // Upper arm
    const upperGeo = mergeGeometries([
      new THREE.CylinderGeometry(0.06, 0.055, 0.45, 8),
      new THREE.SphereGeometry(0.06, 8, 8),
    ]);
    const upper = new THREE.Mesh(upperGeo, matCeramic);
    upper.position.y = -0.225;
    upper.castShadow = true;
    armGroup.add(upper);

    // Elbow joint
    const elbowGeo = new THREE.SphereGeometry(0.07, 8, 8);
    const elbow = new THREE.Mesh(elbowGeo, matGraphite);
    elbow.position.y = -0.45;
    elbow.castShadow = true;
    armGroup.add(elbow);

    // Lower arm
    const lowerGeo = mergeGeometries([
      new THREE.CylinderGeometry(0.055, 0.045, 0.4, 8),
      new THREE.CylinderGeometry(0.05, 0.045, 0.1, 8),
    ]);
    const lower = new THREE.Mesh(lowerGeo, matCeramic);
    lower.position.y = -0.675;
    lower.castShadow = true;
    armGroup.add(lower);

    // Hand
    const handGeo = mergeGeometries([
      new THREE.BoxGeometry(0.08, 0.1, 0.06),
      new THREE.BoxGeometry(0.02, 0.08, 0.02),
      new THREE.BoxGeometry(0.02, 0.08, 0.02),
      new THREE.BoxGeometry(0.02, 0.08, 0.02),
    ]);
    const hand = new THREE.Mesh(handGeo, matCeramic);
    hand.position.y = -0.92;
    hand.castShadow = true;
    armGroup.add(hand);

    // Finger glow tips
    for(let f=0;f<3;f++){
      const tipGeo = new THREE.SphereGeometry(0.012, 6, 6);
      const tip = new THREE.Mesh(tipGeo, f===0 ? matGlowCyan : matGlowViolet);
      tip.position.set(-0.03+f*0.03, -0.98, 0);
      armGroup.add(tip);
    }

    // Arm data lines
    const armDataGeo = new THREE.BoxGeometry(0.005, 0.5, 0.005);
    const armData = new THREE.Mesh(armDataGeo, matDataLine);
    armData.position.y = -0.5;
    armData.userData.phase = side === -1 ? 0 : 1;
    dataFlowLines.push(armData);
    armGroup.add(armData);

    armGroup.position.set(side*0.48, 0.2, 0);
    armGroup.rotation.z = side * -0.15;
    group.add(armGroup);
  }

  group.userData.arms = group;
  return group;
}

function createLegs(){
  const group = new THREE.Group();

  // Left leg
  for(let side of [-1,1]){
    const legGroup = new THREE.Group();

    // Hip joint
    const hipGeo = new THREE.SphereGeometry(0.09, 8, 8);
    const hip = new THREE.Mesh(hipGeo, matGraphite);
    hip.castShadow = true;
    legGroup.add(hip);

    // Upper leg
    const upperGeo = mergeGeometries([
      new THREE.CylinderGeometry(0.07, 0.06, 0.5, 8),
      new THREE.BoxGeometry(0.14, 0.06, 0.12),
    ]);
    const upper = new THREE.Mesh(upperGeo, matCeramic);
    upper.position.y = -0.25;
    upper.castShadow = true;
    legGroup.add(upper);

    // Knee joint
    const kneeGeo = mergeGeometries([
      new THREE.SphereGeometry(0.08, 8, 8),
      new THREE.CylinderGeometry(0.06, 0.05, 0.08, 8),
    ]);
    const knee = new THREE.Mesh(kneeGeo, matGraphite);
    knee.position.y = -0.5;
    knee.castShadow = true;
    legGroup.add(knee);

    // Lower leg
    const lowerGeo = mergeGeometries([
      new THREE.CylinderGeometry(0.06, 0.05, 0.5, 8),
      new THREE.CylinderGeometry(0.055, 0.045, 0.1, 8),
    ]);
    const lower = new THREE.Mesh(lowerGeo, matCeramic);
    lower.position.y = -0.75;
    lower.castShadow = true;
    legGroup.add(lower);

    // Foot
    const footGeo = mergeGeometries([
      new THREE.BoxGeometry(0.12, 0.06, 0.22),
      new THREE.BoxGeometry(0.1, 0.03, 0.1),
    ]);
    const foot = new THREE.Mesh(footGeo, matGraphite);
    foot.position.y = -1.05;
    foot.castShadow = true;
    foot.receiveShadow = true;
    legGroup.add(foot);

    // Foot accent
    const footAccentGeo = new THREE.BoxGeometry(0.14, 0.01, 0.24);
    const footAccent = new THREE.Mesh(footAccentGeo, matGlowBlue);
    footAccent.position.set(0, -1.08, 0.02);
    legGroup.add(footAccent);

    // Leg data lines
    const legDataGeo = new THREE.BoxGeometry(0.004, 0.7, 0.004);
    const legData = new THREE.Mesh(legDataGeo, matDataLine);
    legData.position.y = -0.5;
    legData.userData.phase = side === -1 ? 2 : 3;
    dataFlowLines.push(legData);
    legGroup.add(legData);

    legGroup.position.set(side*0.16, -0.75, 0);
    group.add(legGroup);
  }

  group.userData.legs = group;
  return group;
}

function createMoeModules(){
  const modules = [];

  // Chest modules
  const chestModulePositions = [
    {pos:[-0.3,0.15,0.15], scale:0.6, phase:0, bright:false},
    {pos:[0.3,0.15,0.15], scale:0.6, phase:0.5, bright:true},
    {pos:[-0.3,-0.1,0.15], scale:0.5, phase:1, bright:false},
    {pos:[0.3,-0.1,0.15], scale:0.5, phase:1.5, bright:false},
  ];

  // Shoulder modules
  const shoulderModulePositions = [
    {pos:[-0.55,0.4,0.15], scale:0.45, phase:0.3, bright:true},
    {pos:[0.55,0.4,0.15], scale:0.45, phase:0.8, bright:false},
  ];

  // Upper back modules
  const backModulePositions = [
    {pos:[-0.15,0.5,-0.22], scale:0.35, phase:0.15, bright:false},
    {pos:[0.15,0.5,-0.22], scale:0.35, phase:0.65, bright:true},
    {pos:[0,0.65,-0.25], scale:0.4, phase:1.1, bright:false},
  ];

  const allPositions = [...chestModulePositions, ...shoulderModulePositions, ...backModulePositions];

  for(const cfg of allPositions){
    const moduleGroup = new THREE.Group();

    // Module base
    const baseGeo = mergeGeometries([
      new THREE.BoxGeometry(0.12*cfg.scale, 0.08*cfg.scale, 0.06*cfg.scale),
      new THREE.BoxGeometry(0.14*cfg.scale, 0.04*cfg.scale, 0.08*cfg.scale),
    ]);
    const base = new THREE.Mesh(baseGeo, matGraphite);
    moduleGroup.add(base);

    // Module core
    const coreGeo = new THREE.BoxGeometry(0.08*cfg.scale, 0.06*cfg.scale, 0.04*cfg.scale);
    const mat = cfg.bright ? matExpertBright : matExpertDim;
    const core = new THREE.Mesh(coreGeo, mat);
    core.position.z = 0.02*cfg.scale;
    moduleGroup.add(core);

    // Module glow
    const glowGeo = new THREE.BoxGeometry(0.12*cfg.scale, 0.08*cfg.scale, 0.06*cfg.scale);
    const glow = new THREE.Mesh(glowGeo, new THREE.MeshPhysicalMaterial({
      color: cfg.bright ? 0x8800ff : 0x2200aa,
      emissive: cfg.bright ? 0x8800ff : 0x2200aa,
      emissiveIntensity: cfg.bright ? 1.5 : 0.3,
      transparent: true,
      opacity: 0.2
    }));
    moduleGroup.add(glow);

    // Small accent light
    const accentGeo = new THREE.SphereGeometry(0.015*cfg.scale, 6, 6);
    const accent = new THREE.Mesh(accentGeo, cfg.bright ? matGlowCyan : matGlowBlue);
    accent.position.set(0, 0, 0.04*cfg.scale);
    moduleGroup.add(accent);

    moduleGroup.position.set(...cfg.pos);
    moduleGroup.userData = {phase:cfg.phase, bright:cfg.bright, baseScale:cfg.scale};
    expertModules.push(moduleGroup);
    scene.add(moduleGroup);
  }

  return modules;
}

function createDataFlowArrows(){
  const arrows = [];

  // Arrow from head to chest core
  const headChestPath = [];
  for(let i=0;i<=20;i++){
    const t = i/20;
    const pos = new THREE.Vector3(
      0,
      2.15 - t*0.45,
      0.1 + t*0.08
    );
    headChestPath.push(pos);
  }

  const arrowPoints = headChestPath;
  const arrowGeo = new THREE.BufferGeometry().setFromPoints(arrowPoints);
  const arrowLine = new THREE.Line(arrowGeo, new THREE.LineBasicMaterial({color:0x8800ff,transparent:true,opacity:0.4}));
  scene.add(arrowLine);

  // Moving dot on path
  const dotGeo = new THREE.SphereGeometry(0.02, 8, 8);
  const dot = new THREE.Mesh(dotGeo, matGlowViolet);
  dot.userData.path = arrowPoints;
  dot.userData.speed = 0.003;
  dot.userData.progress = 0;
  arrows.push(dot);
  scene.add(dot);

  // Chest to shoulder arrows
  for(let side of [-1,1]){
    const path = [];
    for(let i=0;i<=15;i++){
      const t = i/15;
      path.push(new THREE.Vector3(
        side*0.2*t,
        1.5 - t*0.1,
        0.2 - t*0.05
      ));
    }
    const pathGeo = new THREE.BufferGeometry().setFromPoints(path);
    const pathLine = new THREE.Line(pathGeo, new THREE.LineBasicMaterial({color:0x00ccff,transparent:true,opacity:0.3}));
    scene.add(pathLine);

    const dot2 = new THREE.Mesh(dotGeo, matGlowCyan);
    dot2.userData.path = path;
    dot2.userData.speed = 0.004;
    dot2.userData.progress = side === -1 ? 0.3 : 0.7;
    arrows.push(dot2);
    scene.add(dot2);
  }

  return arrows;
}

function createHolographicUI(){
  const ui = new THREE.Group();
  ui.position.set(1.2, 2.2, 0.3);
  ui.rotation.y = -0.3;

  // Main holographic panel
  const panelGeo = new THREE.BoxGeometry(0.8, 0.5, 0.02);
  const panelMat = new THREE.MeshPhysicalMaterial({
    color:0x0088ff,
    emissive:0x0066ff,
    emissiveIntensity:1.5,
    transparent:true,
    opacity:0.15,
    metalness:0.1,
    roughness:0.3,
    side:THREE.DoubleSide
  });
  const panel = new THREE.Mesh(panelGeo, panelMat);
  ui.add(panel);

  // Panel border
  const borderGeo = new THREE.EdgesGeometry(panelGeo);
  const border = new THREE.LineSegments(borderGeo, new THREE.LineBasicMaterial({color:0x00ccff,transparent:true,opacity:0.6}));
  ui.add(border);

  // Token stream - horizontal bars
  for(let i=0;i<8;i++){
    const barGeo = new THREE.BoxGeometry(0.02 + Math.random()*0.5, 0.015, 0.01);
    const bar = new THREE.Mesh(barGeo, new THREE.MeshPhysicalMaterial({
      color:0x00ccff,
      emissive:0x00ccff,
      emissiveIntensity:1.5 + Math.random(),
      transparent:true,
      opacity:0.5 + Math.random()*0.5
    }));
    bar.position.set(-0.35 + Math.random()*0.7, -0.15 + i*0.05, 0.02);
    bar.userData.baseY = bar.position.y;
    bar.userData.phase = Math.random()*Math.PI*2;
    bar.userData.speed = 0.5 + Math.random()*2;
    holographicElements.push(bar);
    ui.add(bar);
  }

  // Expert activation - circular nodes
  for(let i=0;i<6;i++){
    const angle = (i/6)*Math.PI*2;
    const nodeGeo = new THREE.SphereGeometry(0.025, 8, 8);
    const node = new THREE.Mesh(nodeGeo, i%2===0 ? matGlowCyan : matGlowViolet);
    node.position.set(Math.cos(angle)*0.25, Math.sin(angle)*0.15, 0.03);
    node.userData.phase = i*0.5;
    node.userData.speed = 1 + Math.random();
    holographicElements.push(node);
    ui.add(node);
  }

  // Connection lines between nodes
  const lines = [];
  for(let i=0;i<6;i++){
    const angle1 = (i/6)*Math.PI*2;
    const angle2 = ((i+1)%6/6)*Math.PI*2;
    const p1 = new THREE.Vector3(Math.cos(angle1)*0.25, Math.sin(angle1)*0.15, 0.03);
    const p2 = new THREE.Vector3(Math.cos(angle2)*0.25, Math.sin(angle2)*0.15, 0.03);
    const lineGeo = new THREE.BufferGeometry().setFromPoints([p1,p2]);
    const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({color:0x0088ff,transparent:true,opacity:0.3}));
    holographicElements.push(line);
    ui.add(line);
  }

  // System status indicators
  for(let i=0;i<4;i++){
    const indGeo = new THREE.BoxGeometry(0.08, 0.015, 0.008);
    const ind = new THREE.Mesh(indGeo, i<2 ? matGlowCyan : matGlowViolet);
    ind.position.set(-0.3 + i*0.12, -0.25, 0.02);
    ind.userData.phase = i*0.3;
    ind.userData.speed = 2 + i;
    holographicElements.push(ind);
    ui.add(ind);
  }

  // Right arm hand interaction glow
  const handGlowGeo = new THREE.SphereGeometry(0.06, 8, 8);
  const handGlow = new THREE.Mesh(handGlowGeo, new THREE.MeshPhysicalMaterial({
    color:0x00ffff,
    emissive:0x00ffff,
    emissiveIntensity:2,
    transparent:true,
    opacity:0.3
  }));
  handGlow.position.set(0.48, 1.1, 0.8);
  handGlow.userData.phase = 0;
  holographicElements.push(handGlow);
  ui.add(handGlow);

  return ui;
}

function createParticles(){
  const count = 200;
  const positions = new Float32Array(count*3);
  const colors = new Float32Array(count*3);

  for(let i=0;i<count;i++){
    positions[i*3] = (Math.random()-0.5)*10;
    positions[i*3+1] = Math.random()*5;
    positions[i*3+2] = (Math.random()-0.5)*10;

    const c = Math.random();
    if(c<0.4){
      colors[i*3]=0; colors[i*3+1]=0.5+Math.random()*0.5; colors[i*3+2]=1;
    } else if(c<0.7){
      colors[i*3]=0.4+Math.random()*0.3; colors[i*3+1]=0; colors[i*3+2]=0.8+Math.random()*0.2;
    } else {
      colors[i*3]=0; colors[i*3+1]=0.8+Math.random()*0.2; colors[i*3+2]=0.8+Math.random()*0.2;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));

  const mat = new THREE.PointsMaterial({
    size:0.025,
    transparent:true,
    opacity:0.6,
    vertexColors:true,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });

  const points = new THREE.Points(geo, mat);
  points.userData.positions = positions;
  return points;
}

// ─── Build Robot ───────────────────────────────────────────────
function buildRobot(){
  const robotGroup = new THREE.Group();

  const head = createHead();
  robotGroup.add(head);

  const torso = createTorso();
  robotGroup.add(torso);

  const arms = createArms();
  robotGroup.add(arms);

  const legs = createLegs();
  robotGroup.add(legs);

  robotGroup.position.y = 1.05;
  scene.add(robotGroup);

  // Mixture-of-Experts modules
  createMoeModules();

  // Data flow arrows
  createDataFlowArrows();

  // Holographic UI
  const holographicUI = createHolographicUI();
  scene.add(holographicUI);

  // Particles
  const particles = createParticles();
  scene.add(particles);

  // Platform
  createPlatform();
}

buildRobot();

// ─── Animation ─────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);

  if(!animating){
    controls.update();
    renderer.render(scene, camera);
    return;
  }

  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // ── Head subtle movement ──
  const headGroup = scene.children.find(c => c.userData && c.userData.head);
  if(headGroup){
    headGroup.rotation.y = Math.sin(t*0.4)*0.08;
    headGroup.rotation.z = Math.sin(t*0.3)*0.03;
    headGroup.position.y = 2.5 + Math.sin(t*0.5)*0.02;
  }

  // ── Core rotating rings ──
  for(const ring of coreRings){
    ring.mesh.rotation.z += ring.speed * 0.01;
    ring.mesh.rotation.x = Math.PI/2 + Math.sin(t*ring.speed + ring.phase)*ring.tilt;
    ring.mesh.rotation.y += ring.speed * 0.005;
  }

  // ── Core glow pulse ──
  const chestCore = scene.children.find(c => {
    if(!c.children) return false;
    for(const child of c.children){
      if(child.material && child.material.emissive && child.material.emissive.getHex() === 0x00ffff && child.geometry.type === 'SphereGeometry'){
        return true;
      }
    }
    return false;
  });
  if(chestCore){
    chestCore.material.emissiveIntensity = 2.5 + Math.sin(t*2)*0.8;
    chestCore.scale.setScalar(1 + Math.sin(t*2)*0.05);
  }

  // ── Chest glow light pulse ──
  chestGlow.intensity = 4 + Math.sin(t*2.5)*1.5;

  // ── Expert modules pulse ──
  for(const module of expertModules){
    const {phase, bright, baseScale} = module.userData;
    const pulse = Math.sin(t*1.5 + phase);
    const intensity = bright ? 2.5 + pulse*0.8 : 0.3 + pulse*0.2;
    module.children.forEach(child => {
      if(child.material && child.material.emissive){
        child.material.emissiveIntensity = intensity;
      }
    });
    // Scale pulse for bright ones
    if(bright){
      const s = 1 + pulse * 0.05;
      module.scale.setScalar(s);
    }
  }

  // ── Visor pulse ──
  const visor = scene.children.find(c => {
    if(!c.children) return false;
    for(const child of c.children){
      if(child.material && child.material.emissive && child.material.emissive.getHex() === 0x8800ff && child.geometry.type === 'BoxGeometry'){
        return true;
      }
    }
    return false;
  });
  if(visor){
    visor.material.emissiveIntensity = 1.5 + Math.sin(t*1.8)*0.5;
  }
  visorGlow.intensity = 2 + Math.sin(t*1.8)*0.8;

  // ── Data flow lines pulse ──
  for(const line of dataFlowLines){
    const phase = line.userData.phase || 0;
    const pulse = Math.sin(t*2 + phase);
    if(line.material){
      line.material.emissiveIntensity = 1.5 + pulse;
      line.material.opacity = 0.4 + pulse * 0.3;
    }
  }

  // ── Vent elements pulse ──
  for(const vent of ventElements){
    const pulse = Math.sin(t*1.5 + vent.phase);
    vent.mesh.material.emissiveIntensity = 0.2 + pulse * 0.15;
  }

  // ── Holographic UI animation ──
  for(const el of holographicElements){
    if(el.userData && el.userData.phase !== undefined && el.userData.speed){
      const pulse = Math.sin(t * el.userData.speed + el.userData.phase);
      if(el.material && el.material.emissive){
        el.material.emissiveIntensity = 1 + pulse;
      }
      if(el.userData.baseY !== undefined){
        el.position.y = el.userData.baseY + pulse * 0.01;
      }
      if(el.userData.baseX !== undefined){
        el.position.x = el.userData.baseX + pulse * 0.01;
      }
    }
  }

  // ── Particles drift ──
  const particles = scene.children.find(c => c.type === 'Points');
  if(particles){
    const pos = particles.userData.positions;
    for(let i=0;i<pos.length;i+=3){
      pos[i+1] += Math.sin(t*0.3 + i)*0.001;
      if(pos[i+1] > 5) pos[i+1] = 0;
      if(pos[i+1] < 0) pos[i+1] = 5;
    }
    particles.geometry.attributes.position.needsUpdate = true;
    particles.rotation.y = t * 0.02;
  }

  // ── Data flow arrows (moving dots) ──
  for(const dot of scene.children){
    if(dot.type === 'Mesh' && dot.userData.path){
      dot.userData.progress += dot.userData.speed;
      if(dot.userData.progress > 1) dot.userData.progress -= 1;
      const path = dot.userData.path;
      const idx = Math.floor(dot.userData.progress * (path.length-1));
      const t2 = (dot.userData.progress * (path.length-1)) - idx;
      const p1 = path[Math.min(idx, path.length-1)];
      const p2 = path[Math.min(idx+1, path.length-1)];
      dot.position.lerpVectors(p1, p2, t2);
    }
  }

  // ── Rim light subtle movement ──
  rimLight.position.x = Math.sin(t*0.2)*0.5;
  rimLight.position.z = -4 + Math.cos(t*0.15)*0.3;

  // ── Auto-rotate camera when idle ──
  if(Date.now() - lastMouseMove > 3000){
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;
  } else {
    controls.autoRotate = false;
  }

  controls.update();
  renderer.render(scene, camera);
}

// ─── Mouse idle detection ──────────────────────────────────────
renderer.domElement.addEventListener('mousemove', () => {
  lastMouseMove = Date.now();
});
renderer.domElement.addEventListener('mousedown', () => {
  lastMouseMove = Date.now();
});
renderer.domElement.addEventListener('wheel', () => {
  lastMouseMove = Date.now();
});

// ─── UI Buttons ────────────────────────────────────────────────
document.getElementById('btnPause').addEventListener('click', () => {
  animating = !animating;
  document.getElementById('btnPause').textContent = animating ? '⏸ Pause' : '▶ Resume';
});

document.getElementById('btnReset').addEventListener('click', () => {
  camera.position.set(5, 3.5, 6);
  controls.target.set(0, 1.5, 0);
  controls.update();
  lastMouseMove = Date.now();
});

// ─── Resize ────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Start ─────────────────────────────────────────────────────
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
  setTimeout(() => document.getElementById('loading').remove(), 800);
}, 1500);

animate();

</script>
