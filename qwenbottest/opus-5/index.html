<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Qwen Agent Bot — Real-time LLM Runtime</title>
<style>
  :root {
    --cyan: #66e6ff;
    --violet: #b58cff;
    --blue: #5a8cff;
    --ink: #05070c;
    --panel: rgba(10, 16, 28, 0.55);
    --edge: rgba(120, 180, 255, 0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--ink);
    overflow: hidden;
    font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    color: #cfe6ff;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  .hud { position: fixed; pointer-events: none; user-select: none; z-index: 10; }

  #brand { top: 22px; left: 24px; }
  #brand h1 {
    margin: 0;
    font-size: 15px;
    letter-spacing: 0.34em;
    font-weight: 600;
    color: #eaf5ff;
    text-shadow: 0 0 18px rgba(102, 230, 255, 0.55);
  }
  #brand .sub {
    margin-top: 7px;
    font-size: 10.5px;
    letter-spacing: 0.22em;
    color: rgba(160, 200, 240, 0.62);
  }
  #brand .rule {
    margin-top: 12px; width: 168px; height: 1px;
    background: linear-gradient(90deg, rgba(102,230,255,0.85), rgba(181,140,255,0.35), transparent);
  }

  #stats {
    top: 22px; right: 24px;
    min-width: 216px;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 10px;
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    font-size: 10.5px;
    letter-spacing: 0.1em;
  }
  #stats .row { display: flex; justify-content: space-between; gap: 18px; padding: 3px 0; }
  #stats .k { color: rgba(150, 190, 230, 0.66); }
  #stats .v { color: var(--cyan); text-shadow: 0 0 10px rgba(102,230,255,0.5); }
  #stats .v.violet { color: var(--violet); text-shadow: 0 0 10px rgba(181,140,255,0.5); }
  #stats .bar {
    margin-top: 9px; height: 3px; border-radius: 3px; overflow: hidden;
    background: rgba(120, 170, 220, 0.14);
  }
  #stats .bar > i {
    display: block; height: 100%; width: 42%;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    box-shadow: 0 0 12px rgba(102,230,255,0.8);
    transition: width 0.25s ease-out;
  }

  #controls {
    bottom: 24px; left: 24px;
    display: flex; gap: 9px; align-items: center;
    pointer-events: auto;
  }
  button.ui {
    pointer-events: auto;
    appearance: none;
    font: inherit;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #bfe3ff;
    padding: 9px 15px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 8px;
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    cursor: pointer;
    transition: border-color .18s, color .18s, box-shadow .18s, transform .1s;
  }
  button.ui:hover {
    color: #fff;
    border-color: rgba(102, 230, 255, 0.6);
    box-shadow: 0 0 22px rgba(70, 170, 255, 0.28), inset 0 0 18px rgba(70, 170, 255, 0.08);
  }
  button.ui:active { transform: translateY(1px); }
  button.ui .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 9px var(--cyan);
    margin-right: 8px; vertical-align: middle;
    transition: background .2s, box-shadow .2s;
  }
  button.ui.paused .dot { background: #ff9a5b; box-shadow: 0 0 9px #ff9a5b; }

  #hint {
    bottom: 27px; right: 24px;
    font-size: 10px; letter-spacing: 0.16em;
    color: rgba(150, 190, 230, 0.4);
  }

  #loader {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    background: radial-gradient(ellipse at 50% 55%, #0a1222 0%, #04060c 70%);
    transition: opacity .9s ease .15s;
    font-size: 11px; letter-spacing: 0.3em; color: rgba(160, 210, 255, 0.75);
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader .ring {
    width: 46px; height: 46px; margin-bottom: 20px;
    border: 1px solid rgba(102,230,255,0.18);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 1.05s linear infinite;
    box-shadow: 0 0 26px rgba(70,170,255,0.25);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #err {
    position: fixed; inset: auto 24px 24px 24px; z-index: 60;
    display: none; padding: 12px 14px; border-radius: 8px;
    background: rgba(40, 10, 14, 0.85); border: 1px solid rgba(255,120,120,0.35);
    color: #ffd9d9; font-size: 11px; letter-spacing: 0.08em;
  }

  @media (max-width: 720px) {
    #stats { display: none; }
    #brand h1 { font-size: 12px; letter-spacing: 0.24em; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud" id="brand">
  <h1>QWEN AGENT</h1>
  <div class="sub">MIXTURE-OF-EXPERTS EMBODIMENT · UNIT 07</div>
  <div class="rule"></div>
</div>

<div class="hud" id="stats">
  <div class="row"><span class="k">STATE</span><span class="v" id="s-state">REASONING</span></div>
  <div class="row"><span class="k">TOK / S</span><span class="v" id="s-tok">0</span></div>
  <div class="row"><span class="k">EXPERTS</span><span class="v violet" id="s-exp">0 / 12</span></div>
  <div class="row"><span class="k">CONTEXT</span><span class="v" id="s-ctx">128K</span></div>
  <div class="row"><span class="k">CORE TEMP</span><span class="v" id="s-tmp">41.0°C</span></div>
  <div class="bar"><i id="s-load"></i></div>
</div>

<div class="hud" id="controls">
  <button class="ui" id="btn-pause"><span class="dot"></span>Pause</button>
  <button class="ui" id="btn-reset">Reset View</button>
</div>

<div class="hud" id="hint">DRAG TO ORBIT · SCROLL TO ZOOM</div>

<div id="loader"><div class="ring"></div><span>INITIALISING RUNTIME</span></div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =========================================================================
   0.  Bootstrap
   ========================================================================= */
const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.90;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04070e, 0.072);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 120);
const CAM_HOME = new THREE.Vector3(1.92, 1.44, 3.24);
const TARGET_HOME = new THREE.Vector3(0.06, 1.10, 0);
camera.position.copy(CAM_HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET_HOME);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 1.5;
controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.51;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.update();

// PBR environment: a dark studio built from HDR panels, so metals pick up
// violet/cyan reflections instead of a flat white room. Background stays custom.
const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = (() => {
  const s = new THREE.Scene();
  const lit = (hex, mul) => new THREE.MeshBasicMaterial({
    color: new THREE.Color(hex).multiplyScalar(mul), side: THREE.DoubleSide
  });
  const shell = new THREE.Mesh(new THREE.BoxGeometry(14, 9, 14), lit(0x070a12, 1));
  shell.material.side = THREE.BackSide;
  s.add(shell);
  const panel = (w, h, hex, mul, pos, rot) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), lit(hex, mul));
    m.position.fromArray(pos); m.rotation.fromArray(rot); s.add(m);
  };
  panel(6.5, 3.4, 0xdfe9ff, 4.2, [ 4.0,  3.0,  3.0], [0, -0.80, 0]);   // key softbox
  panel(5.5, 4.5, 0x8b5cff, 1.3, [-4.6,  1.6, -2.6], [0,  0.95, 0]);   // violet wall
  panel(4.5, 3.2, 0x39d8ff, 1.5, [ 4.2,  1.2, -3.6], [0, -1.05, 0]);   // cyan kicker
  panel(11, 11,  0x0a111c, 1.0, [0, -3.9, 0], [-Math.PI / 2, 0, 0]);   // floor
  panel(11, 11,  0x121c2e, 1.1, [0,  4.2, 0], [ Math.PI / 2, 0, 0]);   // ceiling
  const rt = pmrem.fromScene(s, 0.02);
  s.traverse(o => { o.geometry?.dispose(); o.material?.dispose(); });
  return rt;
})();
scene.environment = envRT.texture;
pmrem.dispose();

/* =========================================================================
   1.  Palette / material library
   ========================================================================= */
const C = {
  cyan:    new THREE.Color(0x5fe4ff),
  ice:     new THREE.Color(0xa9f2ff),
  blue:    new THREE.Color(0x3f7cff),
  violet:  new THREE.Color(0x9b5cff),
  magenta: new THREE.Color(0xd06bff)
};

const ENV_I = 0.85;

const MAT = {
  ceramic: new THREE.MeshPhysicalMaterial({
    color: 0xbcc6d6, metalness: 0.04, roughness: 0.38,
    clearcoat: 1.0, clearcoatRoughness: 0.10, envMapIntensity: ENV_I * 1.5
  }),
  ceramicDim: new THREE.MeshPhysicalMaterial({
    color: 0x79838f, metalness: 0.06, roughness: 0.50,
    clearcoat: 0.7, clearcoatRoughness: 0.25, envMapIntensity: ENV_I
  }),
  graphite: new THREE.MeshStandardMaterial({
    color: 0x1a1e26, metalness: 0.88, roughness: 0.44, envMapIntensity: ENV_I
  }),
  graphiteDark: new THREE.MeshStandardMaterial({
    color: 0x0b0d12, metalness: 0.75, roughness: 0.58, envMapIntensity: ENV_I * 0.7
  }),
  steel: new THREE.MeshStandardMaterial({
    color: 0x7d8794, metalness: 1.0, roughness: 0.26, envMapIntensity: ENV_I * 1.6
  }),
  chrome: new THREE.MeshStandardMaterial({
    color: 0xc8d2de, metalness: 1.0, roughness: 0.12, envMapIntensity: ENV_I * 2.0
  }),
  rubber: new THREE.MeshStandardMaterial({
    color: 0x0e1015, metalness: 0.0, roughness: 0.94, envMapIntensity: 0.15
  }),
  cavity: new THREE.MeshStandardMaterial({
    color: 0x0a0d16, metalness: 0.35, roughness: 0.8,
    emissive: 0x2b1b5e, emissiveIntensity: 0.55, envMapIntensity: 0.12, side: THREE.DoubleSide
  }),
  domeGlass: new THREE.MeshPhysicalMaterial({
    color: 0x9fd8ff, metalness: 0.0, roughness: 0.05,
    transparent: true, opacity: 0.13, side: THREE.DoubleSide,
    clearcoat: 1, envMapIntensity: ENV_I * 2.4, depthWrite: false
  })
};

const EMIT = 0.42;    // global emissive scale — keeps glows coloured rather than clipped white
function emissive(color, intensity = 2.4, opacity = 1) {
  return new THREE.MeshStandardMaterial({
    color: 0x02040a,
    emissive: color, emissiveIntensity: intensity * EMIT,
    metalness: 0, roughness: 0.5,
    transparent: opacity < 1, opacity
  });
}
function additive(color, opacity = 1) {
  return new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
}

/* soft radial sprite used for every halo / packet glow */
const GLOW_TEX = (() => {
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grad.addColorStop(0.00, 'rgba(255,255,255,1)');
  grad.addColorStop(0.18, 'rgba(255,255,255,0.75)');
  grad.addColorStop(0.45, 'rgba(255,255,255,0.20)');
  grad.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

function halo(color, size = 0.3, opacity = 0.9) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: GLOW_TEX, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true
  }));
  s.scale.set(size, size, size);
  return s;
}

/* =========================================================================
   2.  Geometry helpers
   ========================================================================= */
const BEVEL = 0.55;   // global bevel scale — lower = harder, more angular surfaces
const rbox = (w, h, d, r = 0.02, s = 3) =>
  new RoundedBoxGeometry(w, h, d, s, Math.min(r * BEVEL, Math.min(w, h, d) / 2 - 0.001));

function part(geo, mat, parent, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function group(parent, x = 0, y = 0, z = 0) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}
/* stack of thin fins → cooling vent */
function vent(parent, count, w, h, d, gap, mat = MAT.graphiteDark) {
  const g = group(parent);
  const geo = rbox(w, h, d, Math.min(h, d) * 0.35);
  for (let i = 0; i < count; i++) {
    part(geo, mat, g, 0, (i - (count - 1) / 2) * gap, 0);
  }
  return g;
}
/* short flexible-looking cable between two local points */
function cable(parent, a, b, sag = 0.05, radius = 0.008, mat = MAT.rubber) {
  const mid = a.clone().add(b).multiplyScalar(0.5).add(new THREE.Vector3(0, -sag, sag * 0.35));
  const curve = new THREE.CatmullRomCurve3([a, mid, b]);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, radius, 6, false), mat);
  m.castShadow = true;
  parent.add(m);
  return m;
}

/* =========================================================================
   3.  Environment: backdrop, floor, particles, lights
   ========================================================================= */
// gradient dome
{
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top:    { value: new THREE.Color(0x0a1426) },
      bottom: { value: new THREE.Color(0x020307) },
      accent: { value: new THREE.Color(0x241a4d) }
    },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      varying vec3 vP;
      uniform vec3 top, bottom, accent;
      void main(){
        vec3 n = normalize(vP);
        float h = clamp(n.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 col = mix(bottom, top, pow(h, 1.35));
        // violet bloom low on the horizon behind the subject
        float glow = pow(max(0.0, 1.0 - abs(n.y - 0.02) * 4.4), 3.0) * smoothstep(-0.6, 0.9, -n.z);
        col += accent * glow * 0.85;
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(48, 32, 20), mat));
}

// reflective platform
const platform = group(scene, 0, 0, 0);
{
  const base = part(new THREE.CylinderGeometry(2.55, 2.75, 0.16, 96, 1), new THREE.MeshStandardMaterial({
    color: 0x090c12, metalness: 1.0, roughness: 0.38, envMapIntensity: 0.12
  }), platform, 0, -0.08, 0);
  base.receiveShadow = true;

  // polished inner disc (mirror-ish via low roughness metal)
  const disc = part(new THREE.CylinderGeometry(2.30, 2.30, 0.02, 96), new THREE.MeshStandardMaterial({
    color: 0x0c1119, metalness: 1.0, roughness: 0.30, envMapIntensity: 0.13
  }), platform, 0, 0.005, 0);
  disc.receiveShadow = true;

  // emissive edge rings
  const ringA = part(new THREE.TorusGeometry(2.34, 0.012, 8, 128), emissive(C.cyan, 2.2), platform, 0, 0.02, 0);
  ringA.rotation.x = Math.PI / 2;
  const ringB = part(new THREE.TorusGeometry(1.62, 0.007, 8, 128), emissive(C.violet, 2.4), platform, 0, 0.02, 0);
  ringB.rotation.x = Math.PI / 2;
  const ringC = part(new THREE.TorusGeometry(2.63, 0.02, 8, 128), emissive(C.blue, 1.5), platform, 0, -0.05, 0);
  ringC.rotation.x = Math.PI / 2;

  // radial notch marks around the rim
  const notch = rbox(0.02, 0.006, 0.16, 0.003);
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2;
    const m = part(notch, i % 4 === 0 ? emissive(C.cyan, 2.0) : MAT.steel, platform,
      Math.cos(a) * 2.06, 0.02, Math.sin(a) * 2.06);
    m.rotation.y = -a;
  }

  // soft light pool grounding the figure
  const pool = new THREE.Mesh(new THREE.CircleGeometry(1.35, 64), new THREE.MeshBasicMaterial({
    map: GLOW_TEX, color: 0x4a7fd8, transparent: true, opacity: 0.28,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  pool.rotation.x = -Math.PI / 2;
  pool.position.y = 0.019;
  platform.add(pool);

  // faint concentric ground grid
  const gridMat = additive(0x2a5f8f, 0.30);
  for (let i = 1; i <= 5; i++) {
    const t = new THREE.Mesh(new THREE.TorusGeometry(0.35 + i * 0.36, 0.0022, 6, 120), gridMat);
    t.rotation.x = Math.PI / 2; t.position.y = 0.022;
    platform.add(t);
  }
  const spokeGeo = rbox(0.0025, 0.0025, 1.9, 0.001);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const m = new THREE.Mesh(spokeGeo, gridMat);
    m.position.set(Math.cos(a) * 1.15, 0.022, Math.sin(a) * 1.15);
    m.rotation.y = -a + Math.PI / 2;
    platform.add(m);
  }
}

// floating dust
const dust = (() => {
  const N = 1400;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const spd = new Float32Array(N);
  const tmp = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const r = 0.6 + Math.pow(Math.random(), 0.6) * 6.5;
    const a = Math.random() * Math.PI * 2;
    pos[i * 3]     = Math.cos(a) * r;
    pos[i * 3 + 1] = Math.random() * 5.2 - 0.1;
    pos[i * 3 + 2] = Math.sin(a) * r;
    tmp.copy(Math.random() < 0.28 ? C.violet : (Math.random() < 0.55 ? C.cyan : C.blue))
       .multiplyScalar(0.35 + Math.random() * 0.65);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
    spd[i] = 0.02 + Math.random() * 0.07;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.022, vertexColors: true, transparent: true, opacity: 0.85,
    map: GLOW_TEX, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  const p = new THREE.Points(geo, mat);
  scene.add(p);
  return { points: p, speeds: spd, count: N };
})();

// lighting rig
scene.add(new THREE.AmbientLight(0x22334d, 0.16));

const keyLight = new THREE.SpotLight(0xcfe4ff, 58, 20, 0.52, 0.42, 1.6);
keyLight.position.set(3.0, 5.4, 3.4);
keyLight.target.position.set(0, 1.0, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0012;
keyLight.shadow.normalBias = 0.022;
keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 16;
scene.add(keyLight, keyLight.target);

const rimViolet = new THREE.SpotLight(0x9b5cff, 26, 16, 0.75, 0.7, 1.4);
rimViolet.position.set(-3.6, 3.2, -2.9);
rimViolet.target.position.set(0, 1.1, 0);
scene.add(rimViolet, rimViolet.target);

const rimCyan = new THREE.SpotLight(0x4fd8ff, 20, 16, 0.8, 0.8, 1.4);
rimCyan.position.set(3.1, 2.0, -3.4);
rimCyan.target.position.set(0, 1.2, 0);
scene.add(rimCyan, rimCyan.target);

const fill = new THREE.DirectionalLight(0x6a90d8, 0.55);
fill.position.set(-2.4, 1.6, 3.2);
scene.add(fill);

const bounce = new THREE.PointLight(0x2f6bd6, 0.8, 6, 2);
bounce.position.set(0, 0.18, 0.9);
scene.add(bounce);

/* =========================================================================
   4.  The bot
   ========================================================================= */
const bot = group(scene, 0, 0, 0);
bot.rotation.y = -0.20;
bot.position.y = -0.016;              // three-quarter presentation
const anim = [];                     // per-frame animator callbacks

// ---- pelvis / spine -------------------------------------------------------
const pelvis = group(bot, 0, 0.92, 0);
{
  part(rbox(0.30, 0.21, 0.25, 0.05), MAT.graphite, pelvis, 0, 0, 0);            // narrow hip block
  part(rbox(0.19, 0.10, 0.22, 0.03), MAT.graphiteDark, pelvis, 0, 0.10, 0);     // waist mount
  part(rbox(0.20, 0.11, 0.07, 0.025), MAT.steel, pelvis, 0, -0.03, -0.135);     // rear coupling
  // hip guards + ball joints
  for (const s of [-1, 1]) {

const experts = [];
function expertModule(parent, pos, rot, scale = 1, idx = 0) {
  const g = group(parent, pos.x, pos.y, pos.z);
  g.rotation.set(rot.x, rot.y, rot.z);
  g.scale.setScalar(scale);

  part(new THREE.CylinderGeometry(0.058, 0.062, 0.042, 6), MAT.graphite, g).rotation.x = Math.PI / 2;
  part(new THREE.CylinderGeometry(0.064, 0.064, 0.010, 6), MAT.steel, g, 0, 0, -0.018).rotation.x = Math.PI / 2;

  const faceMat = emissive(C.cyan, 1.0);
  const face = part(new THREE.CylinderGeometry(0.040, 0.040, 0.012, 6), faceMat, g, 0, 0, 0.026);
  face.rotation.x = Math.PI / 2;

  const ringMat = emissive(C.violet, 1.2);
  const ring = part(new THREE.TorusGeometry(0.050, 0.005, 6, 24), ringMat, g, 0, 0, 0.024);

  const h = halo(C.cyan, 0.22, 0.6); h.position.z = 0.05; g.add(h);

  const rec = {
    g, faceMat, ringMat, halo: h, face,
    phase: idx * 0.83 + Math.random() * 2.0,
    rate: 0.55 + Math.random() * 0.9,
    active: 0, target: Math.random() < 0.34 ? 1 : 0,
    worldPos: new THREE.Vector3()
  };
  experts.push(rec);
  return rec;
}

function drawHUD(t) {
  const g = hx;
  g.clearRect(0, 0, HUD_W, HUD_H);

  // frame
  g.strokeStyle = 'rgba(120,225,255,0.55)';
  g.lineWidth = 3;
  g.shadowColor = 'rgba(90,210,255,0.9)';
  g.shadowBlur = 18;
  g.beginPath();
  g.roundRect(14, 14, HUD_W - 28, HUD_H - 28, 22);
  g.stroke();

  // corner brackets
  g.lineWidth = 5;
  const cb = 56;
  [[26, 26, 1, 1], [HUD_W - 26, 26, -1, 1], [26, HUD_H - 26, 1, -1], [HUD_W - 26, HUD_H - 26, -1, -1]]
    .forEach(([x, y, sx, sy]) => {
      g.beginPath();
      g.moveTo(x + sx * cb, y); g.lineTo(x, y); g.lineTo(x, y + sy * cb);
      g.stroke();
    });

  g.shadowBlur = 12;

  // header
  g.fillStyle = 'rgba(190,245,255,0.96)';
  g.font = '600 30px ui-monospace, Menlo, Consolas, monospace';
  g.fillText('QWEN · AGENT RUNTIME', 48, 78);
  g.font = '400 18px ui-monospace, Menlo, Consolas, monospace';
  g.fillStyle = 'rgba(150,205,235,0.72)';
  g.fillText('MoE  ·  12 EXPERTS  ·  TOP-2 ROUTING', 48, 108);

  const blink = (Math.sin(t * 4.0) > -0.2);
  g.fillStyle = blink ? 'rgba(210,150,255,0.95)' : 'rgba(210,150,255,0.28)';
  g.font = '600 20px ui-monospace, Menlo, Consolas, monospace';
  g.fillText('● REASONING', HUD_W - 250, 78);
  g.fillStyle = 'rgba(150,205,235,0.7)';
  g.font = '400 16px ui-monospace, Menlo, Consolas, monospace';
  g.fillText('step ' + (Math.floor(t * 1.7) % 999).toString().padStart(3, '0') + ' / 999', HUD_W - 250, 106);

  // divider
  g.strokeStyle = 'rgba(110,200,255,0.35)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(48, 128); g.lineTo(HUD_W - 48, 128); g.stroke();

  // -- token stream bars
  g.fillStyle = 'rgba(150,205,235,0.68)';
  g.font = '400 16px ui-monospace, Menlo, Consolas, monospace';
  g.fillText('TOKEN STREAM', 48, 168);
  const bw = 22, bgap = 8, bx = 48, by = 300;
  holoState.stream.forEach((v, i) => {
    const h = 18 + v * 108;
    const grd = g.createLinearGradient(0, by - h, 0, by);
    grd.addColorStop(0, 'rgba(150,235,255,0.95)');
    grd.addColorStop(1, 'rgba(60,120,255,0.20)');
    g.fillStyle = grd;
    g.shadowColor = 'rgba(90,200,255,0.8)'; g.shadowBlur = 10;
    g.fillRect(bx + i * (bw + bgap), by - h, bw, h);
  });

  // -- expert activation grid
  g.shadowBlur = 10;
  g.fillStyle = 'rgba(150,205,235,0.68)';
  g.fillText('EXPERT ACTIVATION', 48, 360);
  experts.slice(0, 12).forEach((e, i) => {
    const cx = 56 + (i % 6) * 66, cy = 392 + Math.floor(i / 6) * 62;
    const a = e.active;
    g.strokeStyle = `rgba(190,140,255,${0.25 + a * 0.7})`;
    g.lineWidth = 3;
    g.beginPath();
    for (let k = 0; k < 6; k++) {
      const ang = (k / 6) * Math.PI * 2 - Math.PI / 2;
      const px = cx + Math.cos(ang) * 24, py = cy + Math.sin(ang) * 24;
      k ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath();
    g.shadowColor = 'rgba(190,140,255,0.9)';
    g.stroke();
    g.fillStyle = `rgba(180,120,255,${0.10 + a * 0.55})`;
    g.fill();
  });

  // -- latency / throughput graph
  g.fillStyle = 'rgba(150,205,235,0.68)';
  g.fillText('THROUGHPUT', HUD_W - 470, 168);
  const gx = HUD_W - 470, gy = 200, gw = 420, gh = 130;
  g.strokeStyle = 'rgba(110,200,255,0.18)'; g.lineWidth = 1; g.shadowBlur = 0;
  for (let i = 0; i <= 4; i++) {
    g.beginPath(); g.moveTo(gx, gy + (i / 4) * gh); g.lineTo(gx + gw, gy + (i / 4) * gh); g.stroke();
  }
  g.beginPath();
  holoState.graph.forEach((v, i) => {
    const px = gx + (i / (holoState.graph.length - 1)) * gw;
    const py = gy + gh - v * gh;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  });
  g.strokeStyle = 'rgba(150,240,255,0.95)'; g.lineWidth = 3;
  g.shadowColor = 'rgba(90,210,255,0.95)'; g.shadowBlur = 14;
  g.stroke();
  g.lineTo(gx + gw, gy + gh); g.lineTo(gx, gy + gh); g.closePath();
  g.fillStyle = 'rgba(80,190,255,0.12)'; g.shadowBlur = 0; g.fill();

  // -- glyph matrix (context window)
  g.shadowBlur = 8;
  g.fillStyle = 'rgba(150,205,235,0.68)';
  g.fillText('CONTEXT MAP', HUD_W - 470, 380);
  holoState.glyphs.forEach((row, r) => {
    row.forEach((v, c) => {
      g.fillStyle = v ? 'rgba(150,235,255,0.85)' : 'rgba(90,150,200,0.16)';
      g.fillRect(HUD_W - 466 + c * 19, 398 + r * 15, 13, 7);
    });
  });

  // -- footer readouts
  g.shadowBlur = 10;
  g.strokeStyle = 'rgba(110,200,255,0.35)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(48, HUD_H - 92); g.lineTo(HUD_W - 48, HUD_H - 92); g.stroke();
  g.font = '400 19px ui-monospace, Menlo, Consolas, monospace';
  const readouts = [
    ['TOK/S', Math.round(holoState.tps)],
    ['CTX', '128K'],
    ['KV', (62 + Math.sin(t * 0.7) * 8).toFixed(0) + '%'],
    ['TEMP', holoState.temp.toFixed(1) + '°C'],
    ['LAT', (18 + Math.sin(t * 1.3) * 5).toFixed(0) + 'ms']
  ];
  readouts.forEach(([k, v], i) => {
    const x = 48 + i * 188;
    g.fillStyle = 'rgba(140,195,230,0.6)'; g.fillText(k, x, HUD_H - 58);
    g.fillStyle = 'rgba(190,245,255,0.95)'; g.fillText(String(v), x, HUD_H - 30);
  });

  hudTex.needsUpdate = true;
}

const routeGroup = new THREE.Group();

const _v = new THREE.Vector3();
function localOf(obj, offset) {
  obj.updateWorldMatrix(true, false);
  _v.set(offset ? offset.x : 0, offset ? offset.y : 0, offset ? offset.z : 0);
  obj.localToWorld(_v);
  return bot.worldToLocal(_v.clone());
}

bot.updateWorldMatrix(true, true);

const CORE_P = localOf(coreRig, new THREE.Vector3(0, 0, 0.02));
const HEAD_P = localOf(head, new THREE.Vector3(0, 0.02, 0.05));

const routes = [];
function addRoute(points, color, opts = {}) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.35);
  const pts = curve.getPoints(50);
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: opts.lineOpacity ?? 0.16,
      blending: THREE.AdditiveBlending, depthWrite: false })
  );
  routeGroup.add(line);
  routes.push({ curve, color, line, expert: opts.expert ?? null });
  return routes[routes.length - 1];
}

anim.push((t, dt) => {
  packets.forEach(p => {
    if (p.wait > 0) { p.wait -= dt; p.m.visible = false; return; }
    p.m.visible = true;
    p.t += dt * p.speed;
    if (p.t >= 1) {
      p.t = 0;
      p.wait = Math.random() * 1.6;
      // re-assign to a route, preferring active experts
      const active = routes.filter(r => r.expert && r.expert.active > 0.55);
      p.route = (active.length && Math.random() < 0.7) ? active[(Math.random() * active.length) | 0]
                                                       : routes[(Math.random() * routes.length) | 0];
      p.m.material.color.copy(p.route.color);
      p.h.material.color.copy(p.route.color);
    }
    p.route.curve.getPoint(p.t, p.m.position);
    const fade = Math.sin(Math.PI * Math.min(1, p.t)) ;
    p.m.material.opacity = 0.25 + fade * 0.75;
    p.h.material.opacity = 0.2 + fade * 0.8;
    p.m.scale.setScalar(0.6 + fade * 0.7);
  });
});

// experts pulse: a few "hot", the rest idle — with occasional re-routing
anim.push((t, dt) => {
  experts.forEach((e, i) => {
    // periodically decide whether this expert is selected
    if (Math.random() < dt * 0.35) e.target = Math.random() < 0.32 ? 1 : 0;
    const beat = 0.5 + 0.5 * Math.sin(t * (2.2 + e.rate) + e.phase);
    const want = e.target ? 0.55 + beat * 0.45 : 0.05 + beat * 0.10;
    e.active += (want - e.active) * Math.min(1, dt * 4.0);
    e.faceMat.emissiveIntensity = (0.25 + e.active * 4.2) * EMIT;
    e.ringMat.emissiveIntensity = (0.35 + e.active * 3.0) * EMIT;
    e.halo.material.opacity = 0.10 + e.active * 0.85;
    e.halo.scale.setScalar(0.16 + e.active * 0.20);
    e.face.scale.setScalar(1 + e.active * 0.10);
    const hot = e.active > 0.6;
    e.faceMat.emissive.copy(hot ? C.ice : C.cyan);
    e.ringMat.emissive.copy(hot ? C.magenta : C.violet);
  });
});

  scanBand.position.y = 0.005 + Math.sin(t * 0.9) * 0.038;
  scanBand.material.opacity = 0.30 + 0.55 * (0.5 + 0.5 * Math.sin(t * 3.1));
  const blink = Math.sin(t * 0.8) > 0.985 ? 0.1 : 1;
  eyeL.material.opacity = eyeR.material.opacity = (0.7 + b * 0.3) * blink;

  // head tracks the hologram with idle drift
  head.rotation.y = 0.30 + Math.sin(t * 0.43) * 0.09 + Math.sin(t * 1.9) * 0.012;
  head.rotation.x = -0.10 + Math.sin(t * 0.61 + 1.2) * 0.045;
  head.rotation.z = Math.sin(t * 0.37) * 0.028;
  neck.rotation.y = Math.sin(t * 0.43) * 0.05;
  neck.rotation.x = 0.04 + Math.sin(t * 0.55) * 0.02;
});

// idle body motion — breathing, weight shift, arm sway
const baseTorsoY = torso.position.y;
const baseArmR = armR.shoulder.rotation.clone();
const baseArmL = armL.shoulder.rotation.clone();
const baseElbowL = armL.elbow.rotation.x;
const baseWristR = armR.wrist.rotation.clone();
anim.push((t, dt) => {
  const breathe = Math.sin(t * 1.05);
  torso.position.y = baseTorsoY + breathe * 0.007;
  torso.rotation.y = Math.sin(t * 0.31) * 0.045;
  torso.rotation.z = Math.sin(t * 0.47) * 0.012;
  chest.scale.set(1 + breathe * 0.006, 1 + breathe * 0.004, 1 + breathe * 0.008);

  pelvis.position.y = 0.92 + Math.sin(t * 0.62) * 0.006;
  pelvis.rotation.y = Math.sin(t * 0.31) * -0.03;

  // interacting arm: micro-adjustments, as if manipulating the panel
  armR.shoulder.rotation.x = baseArmR.x + Math.sin(t * 0.72) * 0.030;
  armR.shoulder.rotation.z = baseArmR.z + Math.sin(t * 0.55 + 1) * 0.022;
  armR.wrist.rotation.z = baseWristR.z + Math.sin(t * 1.25) * 0.05;
  armR.fingers.forEach((f, i) => {
    if (i === 1) f.root.rotation.x = -0.06 + Math.sin(t * 1.6) * 0.05;
    else f.root.rotation.x = -(0.32 + i * 0.10) + Math.sin(t * 0.9 + i) * 0.03;
  });
  armR.palmGlow.material.emissiveIntensity = (1.8 + 2.4 * (0.5 + 0.5 * Math.sin(t * 3.2))) * EMIT;
  armR.palmHalo.material.opacity = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 3.2));

  // relaxed arm: gentle sway
  armL.shoulder.rotation.x = baseArmL.x + Math.sin(t * 0.68 + 0.6) * 0.045;
  armL.shoulder.rotation.z = baseArmL.z + Math.sin(t * 0.51) * 0.020;
  armL.elbow.rotation.x = baseElbowL + Math.sin(t * 0.68 + 1.4) * 0.05;
  armL.palmGlow.material.emissiveIntensity = (1.2 + 1.0 * (0.5 + 0.5 * Math.sin(t * 1.7))) * EMIT;

  // pauldrons counter-rotate slightly to stay level
  armR.pauldron.rotation.x = -armR.shoulder.rotation.x * 0.55;
  armR.pauldron.rotation.z = -armR.shoulder.rotation.z * 0.45;
  armL.pauldron.rotation.x = -armL.shoulder.rotation.x * 0.55;
  armL.pauldron.rotation.z = -armL.shoulder.rotation.z * 0.45;
});

// hologram follows the hand, floating with a gentle bob
const handWorld = new THREE.Vector3();
const holoTarget = new THREE.Vector3();
let holoInit = false;
anim.push((t, dt) => {
  armR.hand.getWorldPosition(handWorld);
  holoTarget.copy(handWorld).add(new THREE.Vector3(0.56, -0.02, 0.16));
  holoTarget.y += Math.sin(t * 0.8) * 0.012;
  if (!holoInit) { holo.position.copy(holoTarget); holoInit = true; }
  else holo.position.lerp(holoTarget, Math.min(1, dt * 3.0));
  holo.rotation.y = -0.34 + Math.sin(t * 0.4) * 0.03;
  holo.rotation.x = 0.05 + Math.sin(t * 0.53) * 0.015;
  holo.rotation.z = Math.sin(t * 0.31) * 0.012;
});

// hologram data + on-screen stats
let hudAccum = 0, statAccum = 0;
anim.push((t, dt) => {
  hudAccum += dt;
  holoState.tps += (340 + Math.sin(t * 0.7) * 120 + (Math.random() - 0.5) * 90 - holoState.tps) * Math.min(1, dt * 1.6);
  holoState.temp += ((39 + corePulse * 8) - holoState.temp) * Math.min(1, dt * 0.6);
  holoState.load = THREE.MathUtils.clamp(0.32 + corePulse * 0.55, 0, 1);

  if (hudAccum > 1 / 24) {
    hudAccum = 0;
    holoState.stream.shift();
    holoState.stream.push(Math.abs(Math.sin(t * 3.1)) * 0.5 + Math.random() * 0.5);
    holoState.graph.shift();
    holoState.graph.push(THREE.MathUtils.clamp(0.25 + holoState.tps / 900 + (Math.random() - 0.5) * 0.12, 0.05, 0.98));
    if (Math.random() < 0.5) {
      const r = (Math.random() * holoState.glyphs.length) | 0;
      holoState.glyphs[r] = holoState.glyphs[r].map(v => Math.random() < 0.12 ? (v ? 0 : 1) : v);
    }
    drawHUD(t);
  }

  statAccum += dt;
  if (statAccum > 0.22) {
    statAccum = 0;
    const nActive = experts.filter(e => e.active > 0.55).length;
    document.getElementById('s-tok').textContent = Math.round(holoState.tps);
    document.getElementById('s-exp').textContent = nActive + ' / ' + experts.length;
    document.getElementById('s-tmp').textContent = holoState.temp.toFixed(1) + '°C';
    document.getElementById('s-load').style.width = Math.round(holoState.load * 100) + '%';
    document.getElementById('s-state').textContent =
      corePulse > 0.72 ? 'GENERATING' : corePulse > 0.32 ? 'REASONING' : 'ROUTING';
  }
});

// dust drift
anim.push((t, dt) => {
  const pos = dust.points.geometry.attributes.position;
  const arr = pos.array;
  for (let i = 0; i < dust.count; i++) {
    arr[i * 3 + 1] += dust.speeds[i] * dt;
    if (arr[i * 3 + 1] > 5.1) arr[i * 3 + 1] = -0.15;
  }
  pos.needsUpdate = true;
  dust.points.rotation.y += dt * 0.012;
});

// ambient light breathing
anim.push(t => {
  rimViolet.intensity = 26 + Math.sin(t * 0.5) * 6;
  rimCyan.intensity = 20 + Math.sin(t * 0.7 + 2) * 5;
  bounce.intensity = 0.6 + corePulse * 0.5;
});

/* =========================================================================
   8.  UI wiring
   ========================================================================= */
let paused = false;
let idleTimer = 0;
const IDLE_DELAY = 3.2;

const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.classList.toggle('paused', paused);
  btnPause.innerHTML = '<span class="dot"></span>' + (paused ? 'Resume' : 'Pause');
});

let resetting = 0;
const resetFrom = new THREE.Vector3(), resetFromT = new THREE.Vector3();
document.getElementById('btn-reset').addEventListener('click', () => {
  resetFrom.copy(camera.position);
  resetFromT.copy(controls.target);
  resetting = 1e-4;
});

controls.addEventListener('start', () => { controls.autoRotate = false; idleTimer = 0; resetting = 0; });
controls.addEventListener('end', () => { idleTimer = 0; });
renderer.domElement.addEventListener('wheel', () => { controls.autoRotate = false; idleTimer = 0; }, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});

/* =========================================================================
   9.  Post-processing (bloom) — degrades gracefully if unavailable
   ========================================================================= */
let composer = null;
try {
  const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/OutputPass.js')
  ]);
  composer = new EffectComposer(renderer);
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.62, 0.48, 1.55));
  composer.addPass(new OutputPass());
} catch (e) {
  console.warn('Post-processing unavailable, falling back to direct render.', e);
}

/* =========================================================================
   10. Main loop
   ========================================================================= */
const clock = new THREE.Clock();
let t = 0;

drawHUD(0);

function frame() {
  requestAnimationFrame(frame);
  const rawDt = Math.min(clock.getDelta(), 0.25);   // real elapsed time (camera)
  const dt = Math.min(rawDt, 0.05);                // clamped step (simulation)

  if (!paused) {
    t += dt;
    for (let i = 0; i < anim.length; i++) anim[i](t, dt);
  }

  // camera reset tween
  if (resetting > 0) {
    resetting = Math.min(1, resetting + rawDt * 1.6);
    const k = 1 - Math.pow(1 - resetting, 3);
    camera.position.lerpVectors(resetFrom, CAM_HOME, k);
    controls.target.lerpVectors(resetFromT, TARGET_HOME, k);
    if (resetting >= 1) { resetting = 0; controls.autoRotate = true; idleTimer = IDLE_DELAY; }
  } else if (!controls.autoRotate) {
    idleTimer += rawDt;
    if (idleTimer > IDLE_DELAY) controls.autoRotate = true;
  }

  controls.update(rawDt);   // deltaTime keeps auto-rotation frame-rate independent

  if (composer) composer.render(dt);
  else renderer.render(scene, camera);
}

frame();

// reveal (the timeout also guarantees removal if the CSS transition never ticks)
requestAnimationFrame(() => {
  const el = document.getElementById('loader');
  setTimeout(() => el.classList.add('hide'), 260);
  setTimeout(() => el.remove(), 1600);
});

addEventListener('error', ev => {
  const box = document.getElementById('err');
  box.style.display = 'block';
  box.textContent = 'RUNTIME ERROR: ' + (ev.message || ev.error);
});
</script>
</body>
</html>
