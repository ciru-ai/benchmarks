<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Pagoda Garden</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#info {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  color: #fff; background: rgba(0,0,0,0.55); padding: 10px 24px;
  border-radius: 20px; font-size: 14px; pointer-events: none;
  backdrop-filter: blur(8px); letter-spacing: 0.5px;
}
#controls {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  color: #fff; background: rgba(0,0,0,0.45); padding: 8px 20px;
  border-radius: 16px; font-size: 12px; pointer-events: none;
  backdrop-filter: blur(6px);
}
</style>
</head>
<body>
<div id="info">🏯 Voxel Pagoda Garden — Scroll to zoom, drag to orbit</div>
<div id="controls">Click & drag to rotate · Right-drag to pan · Scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── SCENE SETUP ────────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(45, 35, 50);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 8, 0);
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 15;
controls.maxDistance = 100;
controls.update();

// ─── SKY GRADIENT ──────────────────────────────────────────────
function createSky() {
  const skyGeo = new THREE.SphereGeometry(200, 32, 32);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor:    { value: new THREE.Color(0x3a7bd5) },
      bottomColor: { value: new THREE.Color(0xf0c27f) },
      offset:      { value: 10 },
      exponent:    { value: 0.5 }
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 bottomColor;
      uniform float offset;
      uniform float exponent;
      varying vec3 vWorldPos;
      void main() {
        float h = normalize(vWorldPos + offset).y;
        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
}
createSky();

// ─── LIGHTING ──────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff4e0, 1.6);
sunLight.position.set(30, 50, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 120;
sunLight.shadow.bias = -0.001;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x8ec5fc, 0.35);
fillLight.position.set(-20, 15, -10);
scene.add(fillLight);

// warm point lights for atmosphere
const warmLight = new THREE.PointLight(0xffaa44, 0.6, 20);
warmLight.position.set(0, 6, 0);
scene.add(warmLight);

// ─── VOXEL ENGINE ──────────────────────────────────────────────
const voxelSize = 0.8;
const geometry = new THREE.BoxGeometry(voxelSize, voxelSize, voxelSize);
const instancedMeshes = {};

function getInstancedMesh(color, castShadow = true, receiveShadow = true) {
  // Share one color-enabled instance batch per shadow mode. The generated
  // version created a 50,000-instance GPU allocation for every random color,
  // exhausting memory before the first frame could render.
  const key = `${castShadow}:${receiveShadow}`;
  if (instancedMeshes[key]) return instancedMeshes[key];

  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.75,
    metalness: 0.05,
  });
  const mesh = new THREE.InstancedMesh(geometry, mat, 50000);
  mesh.castShadow = castShadow;
  mesh.receiveShadow = receiveShadow;
  mesh.count = 0;
  scene.add(mesh);
  instancedMeshes[key] = mesh;
  return mesh;
}

let totalVoxels = 0;

function placeVoxel(x, y, z, color, castShadow = true, receiveShadow = true) {
  const mesh = getInstancedMesh(color, castShadow, receiveShadow);
  const matrix = new THREE.Matrix4();
  matrix.setPosition(x * voxelSize, y * voxelSize, z * voxelSize);
  const instanceIndex = mesh.count;
  mesh.setMatrixAt(instanceIndex, matrix);
  mesh.setColorAt(instanceIndex, new THREE.Color(color));
  totalVoxels++;
  mesh.count = instanceIndex + 1;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
}

// ─── GROUND ────────────────────────────────────────────────────
function buildGround() {
  // Main grass area
  for (let x = -30; x <= 30; x++) {
    for (let z = -30; z <= 30; z++) {
      const dist = Math.sqrt(x*x + z*z);
      if (dist > 28) continue;

      let y = 0;
      // Gentle rolling terrain
      y += Math.sin(x * 0.15) * 0.3;
      y += Math.cos(z * 0.12) * 0.3;
      y = Math.round(y);

      // Grass colors with variation
      const green = 0x3d8b37 + Math.floor(Math.random() * 0x101010 - 0x080808);
      placeVoxel(x, y, z, green, true, false);

      // Occasional wildflowers
      if (Math.random() < 0.02 && dist < 25) {
        const flowers = [0xff6b9d, 0xffd93d, 0xc084fc, 0xfb923c, 0x38bdf8, 0xf472b6];
        const fc = flowers[Math.floor(Math.random() * flowers.length)];
        placeVoxel(x, y + 1, z, fc, true);
      }
    }
  }

  // Path stones
  buildStonePath(-15, 0, 0, 35, 'z');
  buildStonePath(0, 0, -15, 35, 'x');

  // Curved path around pagoda
  buildCurvedPath();

  // Pond
  buildPond();
}

function buildStonePath(start, y, startZ, length, dir) {
  for (let i = 0; i < length; i++) {
    const x = dir === 'z' ? i - length/2 : start;
    const z = dir === 'x' ? startZ : i - length/2;
    const stoneColors = [0x7a7a7a, 0x8a8a80, 0x6a6a6a, 0x909090];
    for (let dx = -1; dx <= 1; dx++) {
      for (let dz = -1; dz <= 1; dz++) {
        if (Math.random() < 0.5) continue;
        const sx = dir === 'z' ? x + dx : x;
        const sz = dir === 'x' ? z : z + dz;
        if (Math.random() < 0.35) continue;
        const c = stoneColors[Math.floor(Math.random() * stoneColors.length)];
        placeVoxel(sx, y + 1, sz, c, true, false);
      }
    }
  }
}

function buildCurvedPath() {
  // Circular gravel path around pagoda
  for (let a = 0; a < Math.PI * 2; a += 0.15) {
    const r = 8 + Math.sin(a * 3) * 1.5;
    const px = Math.cos(a) * r;
    const pz = Math.sin(a) * r;
    for (let dx = -1; dx <= 1; dx++) {
      for (let dz = -1; dz <= 1; dz++) {
        if (Math.random() < 0.4) continue;
        const c = [0x888878, 0x909088, 0x7a7a70, 0xa0a098][Math.floor(Math.random()*4)];
        placeVoxel(Math.round(px) + dx, 1, Math.round(pz) + dz, c, true, false);
      }
    }
  }
}

function buildPond() {
  // Koi pond
  for (let x = -5; x <= 5; x++) {
    for (let z = -4; z <= 4; z++) {
      const dist = Math.sqrt((x/5)**2 + (z/4)**2);
      if (dist > 1.0) continue;
      const edge = dist > 0.85;
      if (edge) {
        // Rocks around pond
        const rockColors = [0x5a5a5a, 0x6a6a60, 0x4a4a4a, 0x707070];
        placeVoxel(x, 1, z, rockColors[Math.floor(Math.random()*4)], true, false);
      } else {
        // Water
        const depth = 1 - dist;
        const waterColor = 0x1a6b8a + Math.floor(Math.random() * 0x050510 - 0x020208);
        placeVoxel(x, 1, z, waterColor, true, false);
        // Shallow edge
        if (dist > 0.6) {
          placeVoxel(x, 2, z, 0x4a9aaa, true, false);
        }
      }
    }
  }

  // Koi fish (colorful voxels in pond)
  const koiColors = [0xff6633, 0xffffff, 0xffcc00, 0xff3366];
  const koiPositions = [[1,0,1], [-2,0,0], [3,0,-1], [-1,0,2], [0,0,-2]];
  koiPositions.forEach(([x,,z], i) => {
    for (let j = -1; j <= 1; j++) {
      placeVoxel(x+j, 1, z + (j===0 ? 0 : (i%2===0?1:-1)), koiColors[i % koiColors.length], true);
    }
  });

  // Lily pads
  [[2,2], [-3,-1], [0,3], [-2,2]].forEach(([x,z]) => {
    placeVoxel(x, 2, z, 0x2d8a3d, true);
    placeVoxel(x, 2, z, 0xff85b3, true); // small flower
  });
}

// ─── PAGODA ────────────────────────────────────────────────────
function buildPagoda() {
  const tiers = 5;
  const baseX = 0, baseZ = 0;

  // Foundation platform
  for (let x = -6; x <= 6; x++) {
    for (let z = -6; z <= 6; z++) {
      for (let y = 0; y <= 1; y++) {
        placeVoxel(x, y, z, 0x6a6a6a, true, false);
      }
  }}
  // Upper platform
  for (let x = -5; x <= 5; x++) {
    for (let z = -5; z <= 5; z++) {
      placeVoxel(x, 2, z, 0x7a7a7a, true, false);
    }
  }

  // Steps on south side
  for (let y = 0; y <= 1; y++) {
    for (let x = -2; x <= 2; x++) {
      placeVoxel(x, y, 6 + y, 0x808080, true, false);
    }
  }

  // Door (south side)
  for (let y = 3; y <= 5; y++) {
    placeVoxel(0, y, 6, 0x5a2d0c, true); // dark wood frame
    if (y < 5) placeVoxel(0, y, 7, 0x3d1a04, true); // door panel
  }
  // Door arch
  placeVoxel(0, 6, 6, 0x5a2d0c, true);
  placeVoxel(-1, 6, 6, 0x5a2d0c, true);
  placeVoxel(1, 6, 6, 0x5a2d0c, true);

  for (let t = 0; t < tiers; t++) {
    const floorY = 3 + t * 5;
    const halfW = 5 - t;

    // Floor/walls
    for (let x = -halfW; x <= halfW; x++) {
      for (let z = -halfW; z <= halfW; z++) {
        const isEdge = x === -halfW || x === halfW || z === -halfW || z === halfW;
        if (!isEdge) {
          // Interior fill
          if (t === 0 && Math.abs(x) <= 1 && Math.abs(z) <= 1) continue; // hollow
          if (t < 2) {
            // Red walls with window patterns
            if (isEdge) {
              if (t % 2 === 0) {
                // Red lacquered walls
                const shade = 0xb22222 + Math.floor(Math.random() * 0x0d0d0d);
                placeVoxel(x, floorY, z, shade, true);
                if (y === floorY + 1) continue;
                // Window/panel details
                if (Math.abs(x) === halfW && z % 3 === 1 && y === floorY + 2) {
                  placeVoxel(x, floorY + 2, z, 0xffd700, true); // gold window
                }
              } else {
                // White/cream walls
                placeVoxel(x, floorY, z, 0xfff5e6, true);
                // Paper window
                if (y === floorY + 2 && Math.abs(x) === halfW && z % 2 === 0) {
                  placeVoxel(x, floorY + 2, z, 0xfffff0, true);
                }
              }
            }
          } else {
            // Upper floors - more refined
            if (isEdge) {
              placeVoxel(x, floorY, z, t % 2 === 0 ? 0xd4a574 : 0xffeedd, true);
              if (y === floorY + 2 && Math.abs(x) === halfW) {
                placeVoxel(x, floorY + 2, z, 0xfff8e7, true); // window
              }
            }
          }
        }
      }
    }

    // Roof (eaves)
    const roofY = floorY + 4;
    const roofOverhang = halfW + 2;

    // Cone-shaped roof
    for (let ry = 0; ry <= 3; ry++) {
      const r = roofOverhang - Math.floor(ry * 0.9);
      if (r < 0) continue;
      for (let x = -r; x <= r; x++) {
        for (let z = -r; z <= r; z++) {
          const dist = Math.sqrt(x*x + z*z);
          if (dist > r + 0.5 && dist < r - 0.5) continue;
          if (dist > r + 0.5) continue;

          let color;
          if (ry === 0) {
            // Roof tiles - dark green/teal
            color = 0x1a5c3a + Math.floor(Math.random() * 0x0a0a0a);
            if (Math.random() < 0.15) color += 0x050505; // variation
          } else if (ry === 3) {
            color = 0x0d3d25; // peak
          } else {
            color = 0x2a7a4a + Math.floor(Math.random() * 0x0a0a0a);
          }

          placeVoxel(x, roofY + ry, z, color, true);
        }
      }
    }

    // Roof edge decorations (curved corners)
    for (let c = 0; c < 4; c++) {
      const cornerDir = c < 2 ? -1 : 1;
      const cornerZ = c % 2 === 0 ? -1 : 1;
      for (let i = 0; i < 3; i++) {
        placeVoxel(
          cornerDir * (roofOverhang - i),
          roofY + 1 - i,
          cornerZ * (roofOverhang - i),
          0x2a8a4a, true
        );
      }
    }

    // Gold finial between tiers
    if (t < tiers - 1) {
      for (let y = floorY + 5; y <= floorY + 6; y++) {
        placeVoxel(0, y, 0, 0xffd700, true);
      }
    }
  }

  // Spire / Finial
  const spireTop = 3 + tiers * 5;
  for (let y = spireTop; y <= spireTop + 5; y++) {
    placeVoxel(0, y, 0, 0xffd700, true);
    if (y === spireTop + 2 || y === spireTop + 4) {
      placeVoxel(1, y, 0, 0xffd700, true);
      placeVoxel(-1, y, 0, 0xffd700, true);
      placeVoxel(0, y, 1, 0xffd700, true);
      placeVoxel(0, y, -1, 0xffd700, true);
    }
  }
  placeVoxel(0, spireTop + 6, 0, 0xff6600, true); // top gem

  // Balconies on some tiers
  for (let t = 0; t < 3; t++) {
    const floorY = 3 + t * 5;
    const halfW = 5 - t;
    // Small balcony on south side
    for (let x = -2; x <= 2; x++) {
      placeVoxel(x, floorY - 1, halfW + 1, 0x8b4513, true);
      placeVoxel(x, floorY - 1, halfW + 2, 0x6b3508, true);
      // Railing
      if (Math.abs(x) <= 2) {
        placeVoxel(x, floorY + 0, halfW + 2, 0x8b4513, true);
      }
    }
  }
}

// ─── TREES ─────────────────────────────────────────────────────
function buildCherryTree(x, y, z, scale = 1, blossomColor = null) {
  const bc = blossomColor || [0xffb7c5, 0xff8fab, 0xffc0cb, 0xff69b4][Math.floor(Math.random() * 4)];
  const s = scale;

  // Trunk
  const trunkHeight = Math.floor(5 * s);
  for (let ty = 0; ty < trunkHeight; ty++) {
    const thick = ty < trunkHeight * 0.3 ? 2 : 1;
    for (let dx = -thick; dx <= thick; dx++) {
      for (let dz = -thick; dz <= thick; dz++) {
        if (dx === 0 && dz === 0 || (Math.abs(dx) === thick && Math.abs(dz) === thick && Math.random() < 0.4)) continue;
        const shade = 0x5c3a1e + Math.floor(Math.random() * 0x0a0a0a);
        placeVoxel(x + dx, y + ty, z + dz, shade, true);
      }
    }
  }

  // Branches
  const branchAngles = [
    { dx: 2, dz: 1, len: Math.floor(3*s) },
    { dx: -2, dz: -1, len: Math.floor(3*s) },
    { dx: 1, dz: 3, len: Math.floor(2*s) },
    { dx: -1, dz: -3, len: Math.floor(2.5*s) },
  ];
  branchAngles.forEach(b => {
    for (let i = 0; i < b.len; i++) {
      const bx = x + Math.round(b.dx * i / 3) + (Math.random() < 0.3 ? (Math.random()-0.5) : 0);
      const bz = z + Math.round(b.dz * i / 3) + (Math.random() < 0.3 ? (Math.random()-0.5) : 0);
      const by = y + trunkHeight - 2 + Math.floor(i * 0.5);
      placeVoxel(bx, by, bz, 0x6b3a1e, true);
    }
  });

  // Blossom canopy (multiple overlapping spheres)
  const canopyCenters = [
    { dx: 0, dz: 0, r: 4 },
    { dx: 2, dz: 1, r: 3 },
    { dx: -2, dz: -1, r: 3 },
    { dx: 1, dz: -2, r: 2.5 },
    { dx: -1, dz: 2, r: 2.5 },
    { dx: 0, dz: 3, r: 2 },
    { dx: 3, dz: -1, r: 2 },
  ];

  canopyCenters.forEach(cc => {
    for (let cx = -cc.r; cx <= cc.r; cx++) {
      for (let cy = -cc.r; cy <= cc.r; cy++) {
        for (let cz = -cc.r; cz <= cc.r; cz++) {
          const dist = Math.sqrt(cx*cx + cy*cy + cz*cz);
          if (dist > cc.r) continue;
          if (dist < cc.r - 1 && Math.random() < 0.3) continue; // hollow spots

          let color;
          const r = Math.random();
          if (r < 0.4) color = bc;
          else if (r < 0.65) color = 0xffe4e9; // very light pink
          else if (r < 0.8) color = 0xff69b4;  // hot pink
          else if (r < 0.9) color = 0xffffff;   // white
          else color = 0xffb3c6;

          placeVoxel(
            x + cc.dx + cx,
            y + trunkHeight + cy,
            z + cc.dz + cz,
            color, true
          );
        }
      }
    }
  });

  // Falling petals
  for (let i = 0; i < 12; i++) {
    const px = x + Math.floor((Math.random() - 0.5) * 10 * s);
    const py = y + Math.floor(Math.random() * trunkHeight);
    const pz = z + Math.floor((Math.random() - 0.5) * 10 * s);
    const petalColor = [0xffb7c5, 0xffc0cb, 0xff69b4, 0xffffff][Math.floor(Math.random() * 4)];
    placeVoxel(px, py, pz, petalColor, true);
  }
}

function buildPineTree(x, y, z, scale = 1) {
  const s = scale;
  const trunkH = Math.floor(4 * s);

  // Trunk
  for (let ty = 0; ty < trunkH; ty++) {
    for (let dx = -1; dx <= 1; dx++) {
      for (let dz = -1; dz <= 1; dz++) {
        if (Math.abs(dx) === 1 && Math.abs(dz) === 1 && Math.random() < 0.3) continue;
        placeVoxel(x + dx, y + ty, z + dz, 0x4a2e0a, true);
      }
    }
  }

  // Pine layers (conical)
  const layers = Math.floor(6 * s);
  for (let ly = 0; ly < layers; ly++) {
    const r = Math.floor((layers - ly) * 1.2 * s);
    const yBase = y + trunkH - 2 + ly * 1.5;
    for (let px = -r; px <= r; px++) {
      for (let pz = -r; pz <= r; pz++) {
        if (Math.sqrt(px*px + pz*pz) > r) continue;
        const shade = 0x1a5c2a + Math.floor(Math.random() * 0x0c0c1c - 0x060610);
        placeVoxel(x + px, yBase, z + pz, shade, true);
      }
    }
  }
  // Top
  placeVoxel(x, y + trunkH + layers - 2, z, 0x2a7a3a, true);

  // Snow/dew on top
  if (Math.random() < 0.4) {
    placeVoxel(x, y + trunkH + layers - 1, z, 0xdddddd, true);
    placeVoxel(x+1, y + trunkH + layers - 2, z, 0xdddddd, true);
  }
}

function buildBamboo(x, y, z) {
  const h = 4 + Math.floor(Math.random() * 4);
  for (let ty = 0; ty < h; ty++) {
    placeVoxel(x, y + ty, z, 0x4a8a2a, true);
    if (ty % 2 === 1) {
      placeVoxel(x+1, y + ty, z, 0x4a8a2a, true);
      placeVoxel(x-1, y + ty, z, 0x4a8a2a, true);
      placeVoxel(x, y + ty, z+1, 0x4a8a2a, true);
      placeVoxel(x, y + ty, z-1, 0x4a8a2a, true);
    }
    // Leaves at some segments
    if (ty > 2 && ty % 2 === 0) {
      placeVoxel(x+2, y + ty, z, 0x5aaa3a, true);
      placeVoxel(x-2, y + ty, z, 0x5aaa3a, true);
      placeVoxel(x, y + ty, z+2, 0x5aaa3a, true);
    }
  }
}

// ─── GARDEN FEATURES ───────────────────────────────────────────
function buildStoneLantern(x, y, z) {
  // Base
  for (let dx = -2; dx <= 2; dx++) {
    for (let dz = -2; dz <= 2; dz++) {
      if (Math.sqrt(dx*dx + dz*dz) > 2) continue;
      placeVoxel(x+dx, y, z+dz, 0x707070, true, false);
    }
  }
  // Pillar
  for (let ty = 1; ty <= 4; ty++) {
    placeVoxel(x, y + ty, z, 0x808080, true);
  }
  // Light box
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = 0; dy <= 1; dy++) {
      for (let dz = -1; dz <= 1; dz++) {
        if (dx === 0 && dy === 0 && dz === 0) continue;
        if (Math.abs(dx) === 1 && Math.abs(dz) === 1) continue;
        const color = (dy === 0 && Math.abs(dx) + Math.abs(dz) === 1) ? 0xffee88 : 0x888888;
        placeVoxel(x+dx, y+5+dy, z+dz, color, true);
      }
    }
  }
  // Roof
  for (let dx = -2; dx <= 2; dx++) {
    for (let dz = -2; dz <= 2; dz++) {
      if (Math.sqrt(dx*dx + dz*dz) > 2) continue;
      placeVoxel(x+dx, y+7, z+dz, 0x606060, true);
    }
  }
  // Pointed top
  placeVoxel(x, y+8, z, 0x505050, true);

  // Warm glow inside
  const glowLight = new THREE.PointLight(0xffcc44, 0.8, 8);
  glowLight.position.set(x * voxelSize, (y + 5) * voxelSize, z * voxelSize);
  scene.add(glowLight);
}

function buildBridge(x, y, z, rotZ = 0) {
  // Arched wooden bridge
  const archHeight = 3;
  for (let i = -4; i <= 4; i++) {
    const h = Math.floor(archHeight * (1 - (i/4) * (i/4)));
    for (let w = -1; w <= 1; w++) {
      placeVoxel(x + i, y + h, z + w, 0x8b5a2b, true);
      if (w === -1 || w === 1) {
        placeVoxel(x + i, y + h + 1, z + w, 0x6b4020, true);
      }
    }
  }
}

function buildRock(x, y, z, size = 1) {
  for (let dx = -size; dx <= size; dx++) {
    for (let dy = -size; dy <= size; dy++) {
      for (let dz = -size; dz <= size; dz++) {
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (dist > size + 0.3) continue;
        if (dist < size - 0.5 && Math.random() < 0.3) continue;
        const c = [0x6a6a6a, 0x7a7a70, 0x5a5a5a, 0x808078][Math.floor(Math.random() * 4)];
        placeVoxel(x+dx, y+dy, z+dz, c, true, false);
      }
    }
  }
}

function buildFlowerBed(cx, cy, cz, colors, radius = 3) {
  for (let x = -radius; x <= radius; x++) {
    for (let z = -radius; z <= radius; z++) {
      if (x*x + z*z > radius*radius) continue;
      if (Math.random() < 0.3) continue;
      const stemH = 1 + Math.floor(Math.random() * 2);
      for (let sy = 0; sy < stemH; sy++) {
        placeVoxel(cx+x, cy+sy, cz+z, 0x2a6a1a, true);
      }
      const fc = colors[Math.floor(Math.random() * colors.length)];
      placeVoxel(cx+x, cy+stemH, cz+z, fc, true);
    }
  }
}

function buildTorii(x, y, z) {
  const h = 7;
  // Two pillars
  for (let dy = 0; dy < h; dy++) {
    placeVoxel(x-2, y+dy, z, 0xcc2200, true);
    placeVoxel(x+2, y+dy, z, 0xcc2200, true);
    if (dy === 0 || dy === h-1) {
      placeVoxel(x-1, y+dy, z, 0xcc2200, true);
      placeVoxel(x+1, y+dy, z, 0xcc2200, true);
    }
  }
  // Top crossbeam
  for (let dx = -3; dx <= 3; dx++) {
    placeVoxel(x+dx, y+h-1, z, 0xbb1100, true);
    placeVoxel(x+dx, y+h-2, z, 0xaa1000, true);
  }
  // Upper beam
  for (let dx = -4; dx <= 4; dx++) {
    placeVoxel(x+dx, y+h+1, z, 0xcc2200, true);
  }
  // Curved top
  placeVoxel(x, y+h+2, z, 0xcc2200, true);
  placeVoxel(x, y+h+3, z, 0x222222, true);
}

// ─── BUILD THE WORLD ───────────────────────────────────────────

console.log(`Total voxels placed: ${totalVoxels}`);

// ─── FALLING CHERRY BLOSSOM PETALS (animated) ──────────────────
const petalCount = 200;
const petalGeo = new THREE.BoxGeometry(0.25, 0.1, 0.25);
const petalMat = new THREE.MeshStandardMaterial({
  color: 0xffb7c5,
  roughness: 0.6,
  side: THREE.DoubleSide,
});
const petals = new THREE.InstancedMesh(petalGeo, petalMat, petalCount);
const petalMatrices = [];
const petalData = [];

for (let i = 0; i < petalCount; i++) {
  const m = new THREE.Matrix4();
  const x = (Math.random() - 0.5) * 50;
  const y = 15 + Math.random() * 20;
  const z = (Math.random() - 0.5) * 50;
  m.setPosition(x, y, z);
  m.multiply(new THREE.Matrix4().makeRotationZ(Math.random() * Math.PI));
  petals.setMatrixAt(i, m);
  petalData.push({
    x, y, z,
    speed: 0.01 + Math.random() * 0.02,
    driftX: (Math.random() - 0.5) * 0.03,
    driftZ: (Math.random() - 0.5) * 0.03,
    rotSpeed: (Math.random() - 0.5) * 0.05,
    phase: Math.random() * Math.PI * 2,
  });
}
scene.add(petals);

// ─── ANIMATION LOOP ────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  controls.update();

  // Animate falling petals
  const dummy = new THREE.Object3D();
  for (let i = 0; i < petalCount; i++) {
    const d = petalData[i];
    d.y -= d.speed;
    d.x += d.driftX + Math.sin(t * 2 + d.phase) * 0.01;
    d.z += d.driftZ + Math.cos(t * 1.5 + d.phase) * 0.01;

    if (d.y < 0) {
      d.y = 25 + Math.random() * 10;
      d.x = (Math.random() - 0.5) * 50;
      d.z = (Math.random() - 0.5) * 50;
    }

    dummy.position.set(d.x, d.y, d.z);
    dummy.rotation.set(t * d.rotSpeed, t * d.rotSpeed * 0.7, t * d.rotSpeed * 0.5);
    dummy.scale.setScalar(0.6 + Math.random() * 0.4);
    dummy.updateMatrix();
    petals.setMatrixAt(i, dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate = true;

  // Subtle warm light flicker
  warmLight.intensity = 0.6 + Math.sin(t * 3) * 0.1;

  // Gentle sun movement
  sunLight.position.x = 30 * Math.cos(t * 0.05);
  sunLight.position.z = 20 * Math.sin(t * 0.05);

  renderer.render(scene, camera);
}
animate();

  renderer.setSize(innerWidth, innerHeight);
});
