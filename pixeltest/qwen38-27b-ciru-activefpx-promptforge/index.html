<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🏯 Voxel Pagoda Garden</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f1e; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #c { position: fixed; inset: 0; display: block; }
  .panel {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    background: rgba(14,18,34,0.62); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
    padding: 14px 16px; color: #f2f4ff; max-width: 300px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .panel h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: .3px;
    background: linear-gradient(90deg,#ffd36e,#ff8c5a,#ff5d8f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .panel .sub { font-size: 11.5px; color: #aab4d6; margin: 0 0 10px; line-height: 1.4; }
  .row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  button {
    cursor: pointer; border: 1px solid rgba(255,255,255,0.16); border-radius: 9px;
    background: rgba(255,255,255,0.07); color: #eef1ff; font-size: 12px;
    padding: 6px 10px; transition: all .15s ease;
  }
  button:hover { background: rgba(255,255,255,0.16); transform: translateY(-1px); }
  button.active { background: linear-gradient(90deg,#ff9a5a,#ff5d8f); border-color: transparent; }
  .toggle { display:flex; align-items:center; gap:8px; font-size:12px; color:#cdd5f5; margin-top:9px; cursor:pointer; user-select:none; }
  .toggle input { accent-color:#ff7a9a; }
  #stats { margin-top: 10px; font-size: 11px; color: #8b93b8; font-variant-numeric: tabular-nums; }
  #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: rgba(230,235,255,0.55); font-size: 11.5px; z-index: 10; text-align:center;
    background: rgba(14,18,34,0.4); padding: 6px 14px; border-radius: 20px; backdrop-filter: blur(6px); }
  #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0f1e; z-index: 20; color: #cdd5f5; font-size: 14px; transition: opacity .6s; }
  #loader .spin { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #ff7a9a; border-radius: 50%; animation: s 1s linear infinite; margin-right: 12px; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (max-width: 560px){ .panel{ max-width: calc(100vw - 28px); } }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="panel">
    <h1>Voxel Pagoda Garden</h1>
    <p class="sub">A five-tiered pagoda in a spring garden — cherry blossoms, a koi pond, a torii gate, a hedge maze &amp; drifting petals.</p>
    <div class="row">
      <button id="btnDay">🌸 Day</button>
      <button id="btnDusk">🌇 Dusk</button>
      <button id="btnNight">🌙 Night</button>
    </div>
    <label class="toggle"><input type="checkbox" id="chkAuto" checked /> Auto-orbit camera</label>
    <label class="toggle"><input type="checkbox" id="chkPetals" checked /> Petals &amp; fireflies</label>
    <div id="stats">Building…</div>
  </div>
  <div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
  <div id="loader"><div class="spin"></div>Building the garden…</div>

  <!-- Pinned, self-contained dependencies (module script) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

  /* ============================================================
     0.  Small helpers
  ============================================================ */
  const rand  = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const pick  = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp  = (a, b, t) => a + (b - a) * t;
  const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const hex   = (h) => new THREE.Color(h);
  const mixHex = (a, b, t) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), t).getHexString();
  const jitter = (h, amt) => mixHex(h, Math.random() < 0.5 ? '#000000' : '#ffffff', rand(0, amt));

  /* ============================================================
     1.  Renderer / Scene / Camera
  ============================================================ */
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.5, 2000);
  camera.position.set(78, 56, 92);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 20;
  controls.maxDistance = 420;
  controls.maxPolarAngle = Math.PI * 0.492;
  controls.target.set(0, 26, 0);
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;

  /* ============================================================
     2.  Voxel system  (instanced)
  ============================================================ */
  const unitBox = new THREE.BoxGeometry(1, 1, 1);
  const voxelMat = new THREE.MeshStandardMaterial({ roughness: 0.82, metalness: 0.04, flatShading: true });
  const voxelMesh = new THREE.InstancedMesh(unitBox, voxelMat);
  voxelMesh.castShadow = true;
  voxelMesh.receiveShadow = true;
  voxelMesh.frustumCulled = false;

  const _m = new THREE.Matrix4();
  const _q = new THREE.Quaternion();
  const _p = new THREE.Vector3();
  const _s = new THREE.Vector3();
  const _c = new THREE.Color();
  const _e = new THREE.Euler();
  let vox = 0;

  // x, z: centered on 0 ; y: bottom of the voxel at `y` (so voxel occupies [y, y+1))
  function V(x, y, z, color, sx = 1, sy = 1, sz = 1, ry = 0) {
    const c = (typeof color === 'string') ? new THREE.Color(color) : color.clone();
    _p.set(x + 0.5, y + sy / 2, z + 0.5);
    _s.set(sx, sy, sz);
    _e.set(0, ry, 0); _q.setFromEuler(_e);
    _m.compose(_p, _q, _s);
    voxelMesh.setMatrixAt(vox, _m);
    voxelMesh.setColorAt(vox, c);
    vox++;
  }

  // Fill an axis-aligned box [x0..x1] x [y0..y1] x [z0..z1] (inclusive)
  function box(x0, x1, y0, y1, z0, z1, color, opts = {}) {
    const { jitterAmt = 0.05, skip = null, prob = 1 } = opts;
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++)
        for (let x = x0; x <= x1; x++) {
          if (skip && skip(x, y, z)) continue;
          if (prob < 1 && Math.random() > prob) continue;
          let col = color;
          if (jitterAmt > 0) col = jitter(color, jitterAmt);
          V(x, y, z, col);
        }
  }

  // Hollow box: solid walls, empty interior
  function hbox(x0, x1, y0, y1, z0, z1, color, opts = {}) {
    box(x0, x1, y0, y1, z0, z1, color, opts);
  }

  function commitVoxels() {
    voxelMesh.count = vox;
    voxelMesh.instanceMatrix.needsUpdate = true;
    if (voxelMesh.instanceColor) voxelMesh.instanceColor.needsUpdate = true;
    voxelMesh.computeBoundingSphere();
    scene.add(voxelMesh);
  }

  /* ============================================================
     3.  Lighting
  ============================================================ */
  const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x5a4a3a, 0.9);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff2d6, 2.1);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera;
  sc.left = -130; sc.right = 130; sc.top = 130; sc.bottom = -130;
  sc.near = 1; sc.far = 460;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.03;
  scene.add(sun);
  scene.add(sun.target);

  const ambient = new THREE.AmbientLight(0xffffff, 0.18);
  scene.add(ambient);

  /* ============================================================
     4.  Sky (gradient dome)
  ============================================================ */
  const skyGeo = new THREE.SphereGeometry(800, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: { top: { value: new THREE.Color(0x6fb7ff) },
                mid: { value: new THREE.Color(0xbfe0ff) },
                bot: { value: new THREE.Color(0xfff0d8) } },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP; uniform vec3 top; uniform vec3 mid; uniform vec3 bot;
      void main(){ float h = clamp(vP.y,0.0,1.0);
        vec3 c = mix(bot, mid, smoothstep(0.0,0.35,h));
        c = mix(c, top, smoothstep(0.35,1.0,h));
        gl_FragColor = vec4(c,1.0); }`
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  /* ============================================================
     5.  Ground (large voxel field)
  ============================================================ */
  const GRASS = ['#4f9a3a', '#57a440', '#4a9134', '#5fae46', '#478b31'];
  const PATH  = ['#b9a06a', '#c3ab78', '#ab925d'];
  const DIRT  = ['#7a5a3a', '#6f5233'];

  // Path layout (in world x,z) — a central axis, a pond, and a winding maze path
  function onPath(x, z) {
    // main north-south walkway to the pagoda
    if (Math.abs(x) <= 2 && z >= -14 && z <= 40) return true;
    // east-west path crossing the garden
    if (Math.abs(z - 18) <= 1 && x >= -40 && x <= 40) return true;
    // diagonal to the torii (NW)
    if (x >= -46 && x <= -16 && Math.abs((z + 2) - (x + 30)) <= 2) return true;
    // path to the pond (SE)
    if (x >= 12 && x <= 46 && Math.abs((z - 10) - (x - 30)) <= 2) return true;
    // little loop around the rock garden (NE)
    const cx = 30, cz = -18, r = 12;
    const d = Math.hypot(x - cx, z - cz);
    if (Math.abs(d - r) <= 2) return true;
    return false;
  }

  const HEDGE = new Set();   // cells reserved by the maze
  const POND  = new Set();   // cells reserved by the pond
  const key = (x, z) => x + ',' + z;

  const GROUND_R = 66;
  for (let x = -GROUND_R; x < GROUND_R; x++) {
    for (let z = -GROUND_R; z < GROUND_R; z++) {
      const d = Math.hypot(x, z);
      if (d > GROUND_R) continue;
      if (HEDGE.has(key(x, z))) continue;
      if (POND.has(key(x, z))) continue;
      let col;
      if (onPath(x, z)) col = pick(PATH);
      else if (Math.random() < 0.06) col = pick(GRASS); // subtle variation
      else col = pick(GRASS);
      V(x, -1, z, col, 1, 1, 1);
    }
  }

  /* ============================================================
     6.  Trees
  ============================================================ */
  function trunk(x, z, h, col = '#6b4a2c') {
    box(x - 1, x + 1, 0, h - 1, z - 1, z + 1, col, { jitterAmt: 0.08 });
  }
  function blob(cx, cy, cz, r, color, opts = {}) {
    const { jitterAmt = 0.08, hollow = false, prob = 1 } = opts;
    for (let y = cy - r; y <= cy + r; y++)
      for (let z = cz - r; z <= cz + r; z++)
        for (let x = cx - r; x <= cx + r; x++) {
          const dd = Math.hypot(x - cx, (y - cy) * 1.15, z - cz);
          if (dd > r) continue;
          if (hollow && dd < r * 0.55 && Math.random() < 0.5) continue;
          if (prob < 1 && Math.random() > prob) continue;
          V(x, y, z, jitter(color, jitterAmt));
        }
  }

  // CHERRY BLOSSOM — the star of the show
  function cherryTree(x, z, s = 1) {
    trunk(x, z, 6 * s, '#7a5230');
    const pinks = ['#ffd7e8', '#ffc2dc', '#ffb0d4', '#fff0f6', '#ff9ec9', '#ffd0e4'];
    const base = 6 * s + 1;
    // big fluffy canopy of overlapping puffs
    blob(x, base + 2, z, 4 * s, pick(pinks), { jitterAmt: 0.05 });
    blob(x - 3 * s, base + 1, z + 2 * s, 3 * s, pick(pinks), { jitterAmt: 0.05 });
    blob(x + 3 * s, base + 1, z - 2 * s, 3 * s, pick(pinks), { jitterAmt: 0.05 });
    blob(x + 2 * s, base + 3, z + 2 * s, 2 * s, pick(pinks), { jitterAmt: 0.04 });
    blob(x - 2 * s, base + 4, z - 1 * s, 2 * s, pick(pinks), { jitterAmt: 0.04 });
    // scattered single blossoms to give a "petal burst" look
    for (let i = 0; i < 26 * s; i++) {
      const a = rand(0, Math.PI * 2), rr = rand(0, 5 * s);
      const px = Math.round(x + Math.cos(a) * rr), pz = Math.round(z + Math.sin(a) * rr);
      const py = Math.round(base + rand(0, 5 * s));
      if (Math.abs(px - x) <= 5 * s && Math.abs(pz - z) <= 5 * s)
        V(px, py, pz, pick(pinks));
    }
  }

  // WILLOW — drooping, long foliage
  function willowTree(x, z, s = 1) {
    trunk(x, z, 5 * s, '#6a4a2e');
    const greens = ['#7bc96a', '#8fd57a', '#6fb85c', '#a0e08a'];
    // crown
    blob(x, 5 * s + 1, z, 3 * s, pick(greens), { jitterAmt: 0.06 });
    // drooping strands
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      const dx = Math.round(Math.cos(a) * 3 * s), dz = Math.round(Math.sin(a) * 3 * s);
      const len = rand(4, 8) * s;
      for (let j = 0; j < len; j++)
        V(x + dx + (Math.random() < 0.3 ? 1 : 0), Math.round(5 * s + 1 - j), z + dz, pick(greens), { });
    }
  }

  // MAPLE — autumn red
  function mapleTree(x, z, s = 1) {
    trunk(x, z, 4 * s, '#5a3a24');
    const reds = ['#e0503a', '#d64530', '#ef6a4a', '#c23a2a', '#f07a55'];
    blob(x, 4 * s + 1, z, 3 * s, pick(reds), { jitterAmt: 0.08 });
    blob(x + 2 * s, 4 * s, z + 1 * s, 2 * s, pick(reds), { jitterAmt: 0.08 });
    blob(x - 2 * s, 4 * s + 1, z - 1 * s, 2 * s, pick(reds), { jitterAmt: 0.08 });
  }

  // PINE — tiered dark green cones
  function pineTree(x, z, s = 1) {
    trunk(x, z, 3 * s, '#4a3320');
    const greens = ['#2f6b3a', '#357743', '#2a5f34', '#3f8a4d'];
    let top = 3 * s + 1;
    for (let t = 0; t < 4; t++) {
      const r = (4 - t) * s;
      for (let y = top; y < top + 2 * s; y++) {
        for (let z2 = -r; z2 <= r; z2++)
          for (let x2 = -r; x2 <= r; x2++) {
            if (Math.hypot(x2, z2) > r) continue;
            V(x + x2, y, z + z2, pick(greens));
          }
      }
      top += 2 * s;
    }
  }

  // Place a varied tree line around the garden (avoiding the central path & pond)
  const treeSpots = [
    [-52, -40, 'cherry', 1.3], [-44, -48, 'maple', 1], [-58, -18, 'willow', 1.2],
    [-50, 6, 'cherry', 1], [-46, 30, 'pine', 1.2], [-56, 44, 'maple', 1],
    [52, -44, 'cherry', 1.3], [46, -50, 'pine', 1], [58, -20, 'maple', 1],
    [50, 4, 'cherry', 1], [44, 34, 'willow', 1.2], [56, 48, 'cherry', 1],
    [-24, -56, 'cherry', 1], [0, -58, 'willow', 1.2], [24, -56, 'maple', 1],
    [-30, 56, 'pine', 1], [-6, 58, 'cherry', 1.2], [20, 56, 'cherry', 1],
    [-34, -30, 'maple', 0.9], [34, 30, 'pine', 0.9],
  ];
  for (const [x, z, kind, s] of treeSpots) {
    if (onPath(x, z)) continue;
    ({ cherry: cherryTree, willow: willowTree, maple: mapleTree, pine: pineTree })[kind](x, z, s);
  }

  /* ============================================================
     7.  Koi pond + arched bridge
  ============================================================ */
  const POND_CX = 30, POND_CZ = 12, POND_R = 11;
  for (let x = POND_CX - POND_R; x <= POND_CX + POND_R; x++)
    for (let z = POND_CZ - POND_R; z <= POND_CZ + POND_R; z++) {
      if (Math.hypot(x - POND_CX, z - POND_CZ) <= POND_R) POND.add(key(x, z));
    }
  // water surface (a single flat, slightly translucent voxel layer)
  const waterMat = new THREE.MeshStandardMaterial({ color: 0x2f7f9e, roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.82 });
  const water = new THREE.Mesh(new THREE.BoxGeometry(POND_R * 2 + 1, 0.6, POND_R * 2 + 1), waterMat);
  water.position.set(POND_CX, 0.3, POND_CZ);
  water.receiveShadow = true;
  scene.add(water);
  // stone rim
  for (let x = POND_CX - POND_R - 1; x <= POND_CX + POND_R + 1; x++)
    for (let z = POND_CZ - POND_R - 1; z <= POND_CZ + POND_R + 1; z++) {
      const d = Math.hypot(x - POND_CX, z - POND_CZ);
      if (d > POND_R + 0.5 && d <= POND_R + 1.6) V(x, 0, z, pick(['#8b8b92', '#7d7d85', '#9a9aa2']));
    }
  // koi (small colorful blobs on the water)
  const koiCol = ['#ff5a3c', '#ffb03c', '#ff7a5a', '#ffd0d0', '#ffffff'];
  for (let i = 0; i < 5; i++) {
    const a = rand(0, Math.PI * 2), rr = rand(0, POND_R - 3);
    V(POND_CX + Math.round(Math.cos(a) * rr), 0.6, POND_CZ + Math.round(Math.sin(a) * rr), pick(koiCol), 1.6, 0.4, 1);
  }
  // lily pads
  for (let i = 0; i < 7; i++) {
    const a = rand(0, Math.PI * 2), rr = rand(2, POND_R - 2);
    V(POND_CX + Math.round(Math.cos(a) * rr), 0.5, POND_CZ + Math.round(Math.sin(a) * rr), pick(['#3f8a3a', '#4a9a44']), 1.4, 0.2, 1.4);
  }

  // Arched bridge over the pond (spans the SE path)
  function bridge() {
    const stones = ['#b9b9c2', '#a8a8b2', '#c7c7d0'];
    for (let i = -8; i <= 8; i++) {
      const arch = Math.round(4 - Math.abs(i) * 0.4);   // rises in the middle
      const bx = POND_CX - 8 + i * 1.4, bz = POND_CZ - 4;
      for (let y = 1; y <= arch; y++)
        V(Math.round(bx), y, Math.round(bz), pick(stones), 1.4, 1, 3);
      // handrail posts
      if (i % 2 === 0) V(Math.round(bx), arch + 1, Math.round(bz), pick(stones), 1, 1.4, 1);
    }
  }
  bridge();

  /* ============================================================
     8.  Torii gate (vermilion) at the NW entrance
  ============================================================ */
  function torii(x, z) {
    const red = '#e0432f', dark = '#b5321f', black = '#2a2a30';
    // two pillars
    box(x - 7, x - 6, 0, 16, z - 1, z, red, { jitterAmt: 0.04 });
    box(x + 6, x + 7, 0, 16, z - 1, z, red, { jitterAmt: 0.04 });
    // top beam (kasagi) — black cap + red beam, slightly upturned ends
    box(x - 9, x + 9, 16, 17, z - 1, z, red, { jitterAmt: 0.04 });
    box(x - 10, x + 10, 17, 18, z - 1, z, black, { jitterAmt: 0.04 });
    box(x - 11, x - 10, 18, 18, z - 1, z, black);   // upturn L
    box(x + 10, x + 11, 18, 18, z - 1, z, black);   // upturn R
    // second beam (nuki)
    box(x - 7, x + 7, 11, 12, z - 1, z, red, { jitterAmt: 0.04 });
    // central strut (gakuzuka)
    box(x - 1, x + 1, 12, 16, z - 1, z, red, { jitterAmt: 0.04 });
  }
  torii(-34, -2);

  /* ============================================================
     9.  Stone lanterns (tōrō)
  ============================================================ */
  function lantern(x, z) {
    const st = ['#b9b9c2', '#a8a8b2'];
    box(x - 2, x + 2, 0, 1, z - 2, z + 2, pick(st));          // base
    box(x - 1, x + 1, 2, 6, z - 1, z + 1, pick(st));          // pillar
    box(x - 2, x + 2, 7, 9, z - 2, z + 2, pick(st));          // light box
    box(x - 1, x + 1, 8, 8, z - 1, z + 1, 0xffe9a8);          // glowing core
    box(x - 3, x + 3, 10, 10, z - 3, z + 3, pick(st));        // roof
    box(x - 2, x + 2, 11, 11, z - 2, z + 2, pick(st));
    box(x, x, 12, 12, z, z, pick(st));                        // finial
  }
  [[-8, 22], [8, 22], [-14, 34], [14, 34], [-2, -12], [2, -12], [-40, 12], [40, 24]].forEach(([x, z]) => lantern(x, z));

  /* ============================================================
     10. Zen rock garden (NE)
  ============================================================ */
  function rockGarden() {
    const cx = 30, cz = -18, r = 11;
    for (let x = cx - r; x <= cx + r; x++)
      for (let z = cz - r; z <= cz + r; z++) {
        if (Math.hypot(x - cx, z - cz) > r) continue;
        if (Math.abs(Math.hypot(x - cx, z - cz) - r) <= 2) continue; // keep the path ring
        V(x, 0, z, pick(['#d8cfae', '#cfc6a4', '#e2d9bf'])); // raked sand
      }
    // a few smooth rocks
    const rocks = [[28, -18, 3], [34, -20, 2], [30, -14, 2], [26, -22, 1.5], [33, -15, 1.5]];
    for (const [rx, rz, rs] of rocks)
      blob(rx, Math.round(rs), rz, Math.round(rs), pick(['#7d7d85', '#6f6f78', '#8b8b92']), { jitterAmt: 0.06 });
  }
  rockGarden();

  /* ============================================================
     11. Flower beds & a hedge maze
  ============================================================ */
  function flowerBed(cx, cz, w) {
    const petals = ['#ff5d8f', '#ffd15c', '#8f7bff', '#ff7a5a', '#ffffff', '#ff9ec9', '#7ac9ff'];
    for (let x = cx - w; x <= cx + w; x++)
      for (let z = cz - w; z <= cz + w; z++) {
        if (Math.random() < 0.7) V(x, 0, z, pick(GRASS));
        V(x, 1, z, pick(petals));
        if (Math.random() < 0.25) V(x, 2, z, pick(petals));
      }
  }
  flowerBed(-20, 12, 4);
  flowerBed(20, 30, 4);
  flowerBed(-18, 44, 3);
  flowerBed(38, 40, 3);

  // Hedge maze (SW corner): a simple spiral-ish wall pattern
  function maze() {
    const hx0 = -44, hz0 = 34, hx1 = -14, hz1 = 56;
    const greens = ['#2f6b3a', '#357743', '#2a5f34'];
    // outer wall
    for (let x = hx0; x <= hx1; x++) { HEDGE.add(key(x, hz0)); HEDGE.add(key(x, hz1)); }
    for (let z = hz0; z <= hz1; z++) { HEDGE.add(key(hx0, z)); HEDGE.add(key(hx1, z)); }
    // inner spiral walls
    const inner = [
      [hx0 + 3, hz0 + 3, hx1 - 3, hz0 + 3],
      [hx0 + 3, hz0 + 3, hx0 + 3, hz1 - 3],
      [hx0 + 3, hz1 - 3, hx1 - 6, hz1 - 3],
      [hx1 - 6, hz0 + 6, hx1 - 6, hz1 - 3],
      [hx0 + 6, hz0 + 6, hx0 + 6, hz1 - 6],
      [hx0 + 6, hz1 - 6, hx1 - 9, hz1 - 6],
    ];
    for (const [a, b, c, d] of inner) {
      if (a <= c) for (let x = a; x <= c; x++) for (let z = b; z <= d; z++) HEDGE.add(key(x, z));
      else for (let z = b; z <= d; z++) HEDGE.add(key(a, z));
    }
    // build the hedge voxels (2 tall)
    for (const k of HEDGE) {
      const [x, z] = k.split(',').map(Number);
      if (x < hx0 - 1 || x > hx1 + 1 || z < hz0 - 1 || z > hz1 + 1) continue;
      V(x, 0, z, pick(greens));
      V(x, 1, z, pick(greens));
      if (Math.random() < 0.3) V(x, 2, z, pick(greens));
    }
  }
  maze();

  // A few standalone shrubs / bushes
  for (let i = 0; i < 14; i++) {
    const x = randi(-58, 58), z = randi(-58, 58);
    if (onPath(x, z) || POND.has(key(x, z)) || HEDGE.has(key(x, z))) continue;
    blob(x, 1, z, 2, pick(['#3f8a3a', '#4a9a44', '#57a440']), { jitterAmt: 0.06 });
  }

  /* ============================================================
     12. THE PAGODA  (five tiers, upturned eaves, gold spire)
  ============================================================ */
  const RED = '#b8382a', REDD = '#9a2c20', LACQ = '#c8452f';
  const GOLD = '#e8b84a', GOLDD = '#c99a34';
  const WOOD = '#3a2a1c', WOODL = '#4a3624';
  const CREAM = '#f2e6cf';

  function pagoda(cx, cz) {
    const tiers = 5;

    // Grand platform
    box(cx - 16, cx + 16, 0, 1, cz - 16, cz + 16, pick(['#cfc6a4', '#c3ba98']));
    box(cx - 18, cx + 18, 0, 0, cz - 18, cz + 18, pick(['#b3a988', '#a89e7e']));
    // steps (front, facing +z)
    for (let i = 0; i < 5; i++)
      box(cx - 4 + i, cx + 4 - i, 0, 0, cz + 16 + i, cz + 16 + i, pick(['#c3ba98', '#b3a988']));
    // railings around the platform
    for (let x = cx - 16; x <= cx + 16; x++) {
      V(x, 1, cz - 16, pick(['#d8cfae', '#cfc6a4']));
      V(x, 1, cz + 16, pick(['#d8cfae', '#cfc6a4']));
    }
    for (let z = cz - 16; z <= cz + 16; z++) {
      V(cx - 16, 1, z, pick(['#d8cfae', '#cfc6a4']));
      V(cx + 16, 1, z, pick(['#d8cfae', '#cfc6a4']));
    }

    let y = 2;          // current base height
    let half = 11;      // current half-width
    for (let t = 0; t < tiers; t++) {
      const h = 9 - t;              // wall height shrinks per tier
      const top = y + h;

      // ---- Wall: red lacquer, hollow, with cream windows ----
      // floor slab
      box(cx - half, cx + half, y, y, cz - half, cz + half, WOODL, { jitterAmt: 0.04 });
      // four walls (thickness 1), hollow interior
      // front & back walls
      for (let x = cx - half; x <= cx + half; x++)
        for (let yy = y + 1; yy <= top; yy++) {
          V(x, yy, cz - half, LACQ);
          V(x, yy, cz + half, LACQ);
        }
      for (let z = cz - half + 1; z <= cz + half - 1; z++)
        for (let yy = y + 1; yy <= top; yy++) {
          V(cx - half, yy, z, LACQ);
          V(cx + half, yy, z, LACQ);
        }
      // windows (cream) on the front of each tier
      for (let w = 0; w < 3; w++) {
        const wx = cx - 4 + w * 4;
        for (let yy = y + 3; yy <= y + 5; yy++)
          V(wx, yy, cz + half, CREAM, 1, 1, 1);
      }
      // door on ground tier
      if (t === 0)
        for (let yy = y + 1; yy <= y + 6; yy++)
          box(cx - 2, cx + 2, yy, yy, cz + half, cz + half, WOOD, { jitterAmt: 0.05 });

      // ---- Roof: upturned eaves (wider than the wall) ----
      const roofBase = top;
      const eave = half + 4;          // eaves stick out
      const roofT = 3;                // roof thickness
      for (let dy = 0; dy < roofT; dy++) {
        const r = eave - dy;          // taper inward as it rises
        const yv = roofBase + dy;
        for (let z = cz - r; z <= cz + r; z++)
          for (let x = cx - r; x <= cx + r; x++) {
            const d = Math.hypot(x - cx, z - cz);
            if (d > r) continue;
            // upturned corners: lift the four diagonal tips
            const corner = Math.max(Math.abs(x - cx), Math.abs(z - cz));
            const isTip = corner > r * 0.72 && dy === 0;
            let col = dy === 0 ? RED : (dy === roofT - 1 ? WOOD : RED);
            if (isTip) col = GOLD;     // gold tips at the upturned corners
            V(x, yv, z, col, 1, 1, 1);
          }
        // gold trim on the outer rim of the eave
        if (dy === 0)
          for (let z = cz - r; z <= cz + r; z++)
            for (let x = cx - r; x <= cx + r; x++) {
              const d = Math.hypot(x - cx, z - cz);
              if (Math.abs(d - r) < 0.7) V(x, yv, z, GOLD);
            }
      }
      // gold finial on this roof's peak
      V(cx, roofBase + roofT, cz, GOLD, 2, 1, 2);

      // next tier sits on top, smaller
      y = roofBase + roofT + 1;
      half = Math.max(3, half - 2);
    }

    // ---- Top spire (sorin) ----
    let sy = y;
    const spireBase = half + 1;
    box(cx - spireBase, cx + spireBase, sy, sy, cz - spireBase, cz + spireBase, WOOD, { jitterAmt: 0.04 });
    for (let i = 0; i < 6; i++) {
      const r = spireBase - i * 0.6;
      box(cx - Math.round(r), cx + Math.round(r), sy + 1 + i, sy + 1 + i, cz - Math.round(r), cz + Math.round(r), (i % 2 ? GOLD : WOOD), { jitterAmt: 0.03 });
    }
    // the golden jewel
    box(cx - 1, cx + 1, sy + 8, sy + 9, cz - 1, cz + 1, GOLD, { jitterAmt: 0.02 });
    V(cx, sy + 10, cz, GOLD, 1, 2, 1);
    V(cx, sy + 11, cz, 0xfff2c0, 0.6, 0.6, 0.6);

    // lanterns flanking the entrance
    lantern(cx - 6, cz + 14);
    lantern(cx + 6, cz + 14);
  }
  pagoda(0, 0);

  // commit all voxels to the GPU
  commitVoxels();

  /* ============================================================
     13. Particles: falling cherry petals + fireflies + clouds
  ============================================================ */
  const petalMat = new THREE.MeshBasicMaterial({ color: 0xffc2dc, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
  const petalGeo = new THREE.PlaneGeometry(0.5, 0.3);
  const PETALS = 220;
  const petals = [];
  const petalMesh = new THREE.InstancedMesh(petalGeo, petalMat, PETALS);
  petalMesh.frustumCulled = false;
  const petalData = [];
  for (let i = 0; i < PETALS; i++) {
    petalData.push({
      x: rand(-70, 70), y: rand(2, 60), z: rand(-70, 70),
      vx: rand(-0.02, 0.02), vy: -rand(0.02, 0.06), vz: rand(-0.02, 0.02),
      spin: rand(0, Math.PI * 2), sway: rand(0, Math.PI * 2)
    });
  }
  scene.add(petalMesh);

  // Fireflies (glowing points at night)
  const ffGeo = new THREE.BufferGeometry();
  const FF = 120;
  const ffPos = new Float32Array(FF * 3);
  const ffSeed = [];
  for (let i = 0; i < FF; i++) { ffPos[i*3] = rand(-60,60); ffPos[i*3+1] = rand(2,20); ffPos[i*3+2] = rand(-60,60); ffSeed.push(rand(0,100)); }
  ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
  const ffMat = new THREE.PointsMaterial({ color: 0xfff0a0, size: 0.7, transparent: true, opacity: 0.9, sizeAttenuation: true, depthWrite: false });
  const fireflies = new THREE.Points(ffGeo, ffMat);
  fireflies.visible = false;
  scene.add(fireflies);

  // Drifting clouds (soft white blobs, high up)
  const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.85, flatShading: true });
  const clouds = [];
  for (let i = 0; i < 10; i++) {
    const c = new THREE.Group();
    const n = randi(3, 6);
    for (let j = 0; j < n; j++) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(rand(6, 14), rand(2, 4), rand(6, 14)), cloudMat);
      b.position.set(rand(-8, 8), rand(-2, 2), rand(-8, 8));
      c.add(b);
    }
    c.position.set(rand(-140, 140), rand(70, 110), rand(-140, 140));
    c.userData.v = rand(0.02, 0.06);
    clouds.push(c); scene.add(c);
  }

  /* ============================================================
     14. Time-of-day presets
  ============================================================ */
  const PRESETS = {
    day: {
      skyTop: 0x6fb7ff, skyMid: 0xbfe0ff, skyBot: 0xfff0d8,
      sun: 0xfff2d6, sunI: 2.1, sunPos: [70, 120, 40],
      hemiS: 0xbfd8ff, hemiG: 0x5a4a3a, hemiI: 0.9,
      amb: 0.18, fog: 0xbfe0ff, fogNear: 160, fogFar: 520,
      fireflies: false, exposure: 1.05, petalOp: 0.9
    },
    dusk: {
      skyTop: 0x3a2a6a, skyMid: 0xff7a5a, skyBot: 0xffb060,
      sun: 0xff8a4a, sunI: 1.7, sunPos: [-90, 40, 30],
      hemiS: 0x7a5a9a, hemiG: 0x4a3a2a, hemiI: 0.7,
      amb: 0.22, fog: 0xff8a5a, fogNear: 120, fogFar: 460,
      fireflies: false, exposure: 1.1, petalOp: 0.9
    },
    night: {
      skyTop: 0x0a0f2e, skyMid: 0x141a4a, skyBot: 0x242a5a,
      sun: 0x9ab0ff, sunI: 0.5, sunPos: [-40, 80, -30],
      hemiS: 0x243a6a, hemiG: 0x1a1a2a, hemiI: 0.4,
      amb: 0.3, fog: 0x0e1430, fogNear: 90, fogFar: 380,
      fireflies: true, exposure: 1.0, petalOp: 0.7
    }
  };
  let current = 'day';
  let target = null, blend = 1;

  function applyPreset(name, instant = false) {
    current = name;
    const p = PRESETS[name];
    scene.fog = new THREE.Fog(p.fog, p.fogNear, p.fogFar);
    skyMat.uniforms.top.value.set(p.skyTop);
    skyMat.uniforms.mid.value.set(p.skyMid);
    skyMat.uniforms.bot.value.set(p.skyBot);
    sun.color.set(p.sun); sun.intensity = p.sunI;
    sun.position.set(p.sunPos[0], p.sunPos[1], p.sunPos[2]);
    hemi.color.set(p.hemiS); hemi.groundColor.set(p.hemiG); hemi.intensity = p.hemiI;
    ambient.intensity = p.amb;
    renderer.toneMappingExposure = p.exposure;
    fireflies.visible = p.fireflies;
    petalMat.opacity = p.petalOp;
    waterMat.color.set(name === 'night' ? 0x14324a : name === 'dusk' ? 0x4a3a5a : 0x2f7f9e);
  }
  applyPreset('day', true);

  // Day/night cycle (optional, slow)
  let cycle = false, cycleT = 0;
  const cycleOrder = ['day', 'dusk', 'night', 'dusk'];

  /* ============================================================
     15. UI
  ============================================================ */
  const btns = { day: document.getElementById('btnDay'), dusk: document.getElementById('btnDusk'), night: document.getElementById('btnNight') };
  function setActive(name) {
    Object.entries(btns).forEach(([k, b]) => b.classList.toggle('active', k === name));
  }
  btns.day.onclick = () => { applyPreset('day'); setActive('day'); };
  btns.dusk.onclick = () => { applyPreset('dusk'); setActive('dusk'); };
  btns.night.onclick = () => { applyPreset('night'); setActive('night'); };
  setActive('day');

  document.getElementById('chkAuto').onchange = (e) => controls.autoRotate = e.target.checked;
  document.getElementById('chkPetals').onchange = (e) => {
    petalMesh.visible = e.target.checked;
    if (e.target.checked && current === 'night') fireflies.visible = true;
  };

  document.getElementById('stats').textContent = `${vox.toLocaleString()} voxels · ${PETALS} petals · 5-tier pagoda`;

  /* ============================================================
     16. Resize + main loop
  ============================================================ */
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  const clock = new THREE.Clock();
  const _m2 = new THREE.Matrix4(), _q2 = new THREE.Quaternion(), _p2 = new THREE.Vector3(), _s2 = new THREE.Vector3(1, 1, 1), _e2 = new THREE.Euler();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // update petals
    if (petalMesh.visible) {
      for (let i = 0; i < PETALS; i++) {
        const d = petalData[i];
        d.sway += dt * 2;
        d.x += d.vx + Math.sin(d.sway) * 0.03;
        d.y += d.vy;
        d.z += d.vz + Math.cos(d.sway * 0.7) * 0.03;
        d.spin += dt * 2;
        if (d.y < 0.2) { d.y = rand(40, 60); d.x = rand(-70, 70); d.z = rand(-70, 70); }
        _p2.set(d.x, d.y, d.z); _e2.set(d.spin, d.spin * 0.6, d.spin * 0.3); _q2.setFromEuler(_e2);
        _m2.compose(_p2, _q2, _s2);
        petalMesh.setMatrixAt(i, _m2);
      }
      petalMesh.instanceMatrix.needsUpdate = true;
    }
    // fireflies
    if (fireflies.visible) {
      const arr = ffGeo.attributes.position.array;
      for (let i = 0; i < FF; i++) {
        arr[i*3]   += Math.sin(t * 0.6 + ffSeed[i]) * 0.03;
        arr[i*3+1] += Math.cos(t * 0.8 + ffSeed[i]) * 0.02;
        arr[i*3+2] += Math.sin(t * 0.5 + ffSeed[i] * 1.3) * 0.03;
      }
      ffGeo.attributes.position.needsUpdate = true;
      ffMat.opacity = 0.5 + 0.4 * Math.sin(t * 3);
    }
    // clouds drift
    for (const c of clouds) {
      c.position.x += c.userData.v;
      if (c.position.x > 160) c.position.x = -160;
    }

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // hide loader
  setTimeout(() => { const l = document.getElementById('loader'); l.style.opacity = 0; setTimeout(() => l.remove(), 700); }, 400);
  </script>
</body>
