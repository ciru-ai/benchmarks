<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garden of a Thousand Lanterns — Voxel Diorama</title>
<style>
  :root{--ink:#f8f0df;--muted:#c7bea9;--glass:rgba(16,21,30,.68);--line:rgba(255,245,218,.16);--gold:#ffc65c}
  *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#101823;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}
  .veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 38%,rgba(5,8,13,.46) 120%)}
  header{position:fixed;left:28px;top:24px;pointer-events:none;text-shadow:0 2px 16px #000}
  .eyebrow{font:600 10px/1.2 ui-monospace,monospace;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
  h1{font-weight:400;font-size:clamp(27px,3.5vw,54px);line-height:.92;letter-spacing:-.04em;margin:0;max-width:520px}
  .jp{display:block;font-size:.42em;letter-spacing:.18em;color:#ffdba0;margin-top:10px}
  .panel{position:fixed;right:24px;top:24px;width:218px;padding:14px 15px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 16px 50px rgba(0,0,0,.24)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:7px 0}.label{font:600 9px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  input[type=range]{width:110px;accent-color:var(--gold)}button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:600 10px ui-monospace,monospace;letter-spacing:.1em;padding:9px 11px;cursor:pointer;transition:background .15s,transform .12s}button:hover{background:rgba(255,198,92,.16)}button:active{transform:scale(.97)}
  footer{position:fixed;left:28px;bottom:22px;font:10px/1.5 ui-monospace,monospace;letter-spacing:.08em;color:rgba(255,255,255,.58);text-shadow:0 1px 8px #000;pointer-events:none}
  .legend{position:fixed;right:24px;bottom:22px;display:flex;gap:6px}.chip{background:var(--glass);border:1px solid var(--line);padding:7px 9px;font:9px ui-monospace,monospace;letter-spacing:.08em;color:var(--muted)}
  @media(max-width:650px){.panel{top:auto;bottom:16px;right:16px}.legend,footer{display:none}header{left:18px;top:18px}}
</style>
</head>
<body>
<canvas id="world" aria-label="Interactive isometric voxel garden with a pagoda"></canvas><div class="veil"></div>
<header><div class="eyebrow">Interactive voxel diorama · No. 08</div><h1>Garden of a Thousand Lanterns<span class="jp">千灯の庭</span></h1></header>
<section class="panel" aria-label="Scene controls">
  <div class="row"><span class="label">Time of day</span><input id="time" type="range" min="0" max="100" value="34" aria-label="Time of day"></div>
  <div class="row"><span class="label">Petals</span><button id="petals">ON</button></div>
  <div class="row"><span class="label">Camera</span><button id="reset">RESET</button></div>
</section>
<footer>DRAG TO ORBIT · WHEEL TO ZOOM · WATCH THE KOI</footer><div class="legend"><span class="chip">80×80 GARDEN</span><span class="chip">1,400+ VOXELS</span></div>
<script>
(()=>{
const c=document.querySelector('#world'),x=c.getContext('2d'),TAU=Math.PI*2;
let W,H,dpr=1,angle=-.78,zoom=1,drag=false,lastX=0,petalsOn=true,time=34,vox=[],particles=[],start=performance.now();
const C={grass:'#416b3e',grass2:'#527b48',soil:'#70513a',stone:'#a7a594',stone2:'#767b75',water:'#278da1',water2:'#49b5ba',wood:'#513427',red:'#a83b2d',red2:'#d7583b',cream:'#f2d39d',roof:'#183f47',roof2:'#275a5c',gold:'#e9a83d',pink:'#ef9daf',pink2:'#ffd0d5',trunk:'#64402e',leaf:'#3f7a46',leaf2:'#69a957',white:'#f5ead4',black:'#192326'};
function shade(hex,k){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return `rgb(${Math.max(0,Math.min(255,r*k))|0},${Math.max(0,Math.min(255,g*k))|0},${Math.max(0,Math.min(255,b*k))|0})`}
function add(X,Y,Z,col,s=1){vox.push({x:X,y:Y,z:Z,c:col,s})} function box(X,Y,Z,w,d,h,col){for(let i=0;i<w;i++)for(let j=0;j<d;j++)for(let k=0;k<h;k++)add(X+i,Y+j,Z+k,col)}
function tree(X,Y,cherry=false,scale=1){let h=8*scale|0; for(let z=1;z<h;z++)add(X,Y,z,C.trunk,1.15); let col=cherry?C.pink:C.leaf, col2=cherry?C.pink2:C.leaf2; for(let i=0;i<85*scale;i++){let a=Math.random()*TAU,r=Math.sqrt(Math.random())*5.2*scale,zz=h+Math.round((Math.random()-.45)*4*scale);add(X+Math.cos(a)*r,Y+Math.sin(a)*r,zz,Math.random()>.55?col:col2,1.05)} }
function lantern(X,Y,Z=2){add(X,Y,Z,C.red,1);add(X,Y,Z+1,C.gold,.82);add(X,Y,Z+2,C.red,.65)}
function pagoda(){let levels=[{z:2,w:17},{z:8,w:14},{z:14,w:11},{z:20,w:8}];box(-7,-7,1,15,15,1,C.stone2);levels.forEach((L,li)=>{let w=L.w,q=(w-2)/2;box(-q,-q,L.z,w-2,w-2,4,li%2?C.red2:C.red);for(let i=-q;i<=q;i+=3){box(i,-q-.1,L.z,1,1,4,C.wood);box(i,q-.1,L.z,1,1,4,C.wood)}for(let i=-w/2-1;i<=w/2+1;i++)for(let j=-w/2-1;j<=w/2+1;j++){let edge=Math.max(Math.abs(i),Math.abs(j));if(edge>w/2-2)add(i,j,L.z+4+(edge>w/2?0:.55),C.roof,1.12)}for(let k=-w/2-1;k<=w/2+1;k+=2){add(k,-w/2-1,L.z+4,C.gold,.72);add(k,w/2+1,L.z+4,C.gold,.72)}});box(-2,-2,26,5,5,2,C.red);for(let r=4;r>=1;r--)box(-r/2,-r/2,28+(4-r),r,r,1,C.roof);add(0,0,33,C.gold,.8);add(0,0,34,C.gold,.5)}
function build(){vox=[]; for(let i=-38;i<=38;i+=2)for(let j=-30;j<=30;j+=2){let edge=Math.abs(i)>30||Math.abs(j)>24;add(i,j,edge?-1:0,edge?C.soil:(Math.random()>.55?C.grass:C.grass2),2.05)}
for(let i=-33;i<=-12;i+=2)for(let j=-16;j<=18;j+=2)add(i,j,.2,(i+j)%4?C.water:C.water2,2.08);
for(let t=-28;t<30;t+=2){add(t,22,1,C.stone,1.4);add(t,-22,1,C.stone2,1.4)}
for(let t=-22;t<=22;t+=2){add(16,t,1,C.stone,1.45);if(Math.abs(t)%6===0)lantern(19,t)}
// arched red bridge
for(let i=-34;i<=-10;i++){let z=2+Math.sin((i+34)/24*Math.PI)*4;add(i,1,z,C.red,1.15);if(i%3===0){add(i,-1,z-1,C.wood,.75);add(i,3,z-1,C.wood,.75)}}
pagoda(); tree(-23,-13,true,1.25);tree(24,-15,true,1.1);tree(-25,21,false,1);tree(29,18,false,1.2);tree(10,-22,true,.72);tree(-6,25,false,.7);
for(let k=0;k<7;k++){let bx=26+k%2*2,by=-2+k*3;box(bx,by,1,1,1,6+k%3,C.leaf2)}
for(let k=0;k<9;k++){let a=k/9*TAU;lantern(Math.cos(a)*12,Math.sin(a)*12,1)}
for(let k=0;k<70;k++)particles.push({x:-28+Math.random()*55,y:-20+Math.random()*40,z:8+Math.random()*20,p:Math.random()*TAU})}
function project(o){let ca=Math.cos(angle),sa=Math.sin(angle),rx=o.x*ca-o.y*sa,ry=o.x*sa+o.y*ca;return {x:W/2+rx*10*zoom,y:H*.60+(ry*5-o.z*9)*zoom,d:ry+o.z*.02}}
function poly(p,fill){x.beginPath();x.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)x.lineTo(p[i][0],p[i][1]);x.closePath();x.fillStyle=fill;x.fill()}
function voxel(v,night){let p=project(v),s=v.s*9.7*zoom,h=v.s*9*zoom, glow=v.c===C.gold&&night>.35;let l=1-night*.48;if(glow){x.shadowBlur=18*zoom;x.shadowColor='#ffbd55'};poly([[p.x,p.y-h],[p.x+s,p.y-h+s*.5],[p.x,p.y-h+s],[p.x-s,p.y-h+s*.5]],shade(v.c,1.13*l));poly([[p.x-s,p.y-h+s*.5],[p.x,p.y-h+s],[p.x,p.y+s],[p.x-s,p.y+s*.5]],shade(v.c,.76*l));poly([[p.x+s,p.y-h+s*.5],[p.x,p.y-h+s],[p.x,p.y+s],[p.x+s,p.y+s*.5]],shade(v.c,.92*l));x.shadowBlur=0}
function draw(now){let n=Math.abs(time-50)/50,night=Math.max(0,(n-.38)/.62),hue=205+time*.7;let top=`hsl(${hue} ${55-night*15}% ${78-night*58}%)`,bot=`hsl(${hue+25} ${46+night*20}% ${52-night*38}%)`;let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);x.fillStyle=g;x.fillRect(0,0,W,H);
// sun / moon and distant mountains
let sx=W*(.18+.64*time/100),sy=H*(.3-Math.sin(time/100*Math.PI)*.2);x.beginPath();x.arc(sx,sy,28*zoom,0,TAU);x.fillStyle=night>.2?'#e7ecdd':'#ffe3a1';x.globalAlpha=.75;x.fill();x.globalAlpha=1;
for(let layer=0;layer<3;layer++){x.beginPath();x.moveTo(0,H*.62);for(let i=0;i<=10;i++)x.lineTo(i*W/10,H*(.48+layer*.04)-Math.sin(i*2.3+layer)*H*(.07-layer*.012));x.lineTo(W,H);x.lineTo(0,H);x.fillStyle=`hsla(${195+layer*10},25%,${24+layer*7}%,${.18+night*.23})`;x.fill()}
vox.sort((a,b)=>project(a).d-project(b).d).forEach(v=>voxel(v,night));
// koi glints
for(let k=0;k<8;k++){let q=(now*.00007+k/8)%1,a=k%2?1:-1,p=project({x:-32+q*20,y:-10+k*3,z:1});x.fillStyle=k%3?'#ffb34e':'#f5eee1';x.fillRect(p.x,p.y,6*zoom*a,2*zoom)}
if(petalsOn){x.fillStyle='#ffd0d8';for(let q of particles){q.y+=.018;q.x+=Math.sin(now*.001+q.p)*.012;q.z-=.009;if(q.z<0){q.z=26;q.y=-22}let p=project(q);x.globalAlpha=.45+.4*Math.sin(now*.002+q.p)**2;x.fillRect(p.x,p.y,3*zoom,3*zoom)}x.globalAlpha=1}
requestAnimationFrame(draw)}
function resize(){dpr=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);zoom=Math.min(W/1050,H/720)*1.05}
c.onpointerdown=e=>{drag=true;lastX=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){angle+=(e.clientX-lastX)*.006;lastX=e.clientX}};c.onpointerup=()=>drag=false;c.onwheel=e=>{e.preventDefault();zoom=Math.max(.42,Math.min(1.8,zoom*(e.deltaY>0?.92:1.08)))},{passive:false};
document.querySelector('#time').oninput=e=>time=+e.target.value;document.querySelector('#petals').onclick=e=>{petalsOn=!petalsOn;e.target.textContent=petalsOn?'ON':'OFF'};document.querySelector('#reset').onclick=()=>{angle=-.78;resize()};addEventListener('resize',resize);build();resize();requestAnimationFrame(draw);
})();
</script>
</body></html>
