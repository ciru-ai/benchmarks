<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Pagoda Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a1a2e; font-family: 'Georgia', serif; }
  canvas { display: block; }
  #title {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd6e0;
    font-size: 22px;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255,182,193,0.6), 0 0 40px rgba(255,105,180,0.3);
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
  }
  #hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    letter-spacing: 2px;
    pointer-events: none;
    z-index: 10;
  }
  #loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffd6e0;
    font-size: 18px;
    letter-spacing: 3px;
    z-index: 20;
    transition: opacity 1s;
  }
</style>
</head>
<body>
<div id="title">· 祥云仙居 ·</div>
<div id="hint">drag to orbit · scroll to zoom</div>
<div id="loading">loading voxels...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ─── Scene Setup ───────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1b2a);
scene.fog = new THREE.FogExp2(0x1a1a3e, 0.012);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 800);
camera.position.set(85, 55, 95);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 15, 0);
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 20;
controls.maxDistance = 200;

// ─── Lighting ─────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x334466, 0.6);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff0d0, 1.2);
sun.position.set(60, 80, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 300;
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
sun.shadow.bias = -0.001;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0x88aaff, 0.4);
fillLight.position.set(-40, 30, -30);
scene.add(fillLight);

const warmLight = new THREE.PointLight(0xff8844, 1.5, 40);
warmLight.position.set(0, 20, 0);
scene.add(warmLight);

const rimLight = new THREE.DirectionalLight(0xff99cc, 0.5);
rimLight.position.set(-30, 20, 60);
scene.add(rimLight);

// ─── Voxel Helpers ────────────────────────────────────────────────────────
const palette = {
  // Pagoda
  pagodaRoof:    [0x8B0000, 0xA52A2A, 0xB22222, 0xCC3300],
  pagodaBody:    [0xD4A574, 0xC19A6B, 0xDEB887, 0xE8C39E],
  pagodaTrim:    [0xFFD700, 0xFFA500, 0xF0E68C, 0xDAA520],
  pagodaPillar:  [0x8B0000, 0xA52A2A, 0xB8860B],
  pagodaFloor:   [0x8B4513, 0x6B3E26, 0x5C3317],
  lantern:       [0xFF6600, 0xFF4400, 0xFF8800, 0xCC3300],
  lanternGlow:   [0xFFFF88, 0xFFEE88, 0xFFD700],

  // Garden
  grass1:        [0x228B22, 0x2E8B2E, 0x32CD32, 0x3CB371, 0x2E8B57, 0x1E7B1E],
  grass2:        [0x90EE90, 0x7CCD7C, 0x6BBF6B, 0x55AA55, 0x4A9E4A],
  dirt:          [0x8B6914, 0x6B4F12, 0x7A5C1A, 0x5C4210],
  path:          [0xC8AD7F, 0xB8986A, 0xD4BC92, 0xA8885A],
  pathBorder:    [0x6B4423, 0x7A5030, 0x5C3A1E],
  stone:         [0x808080, 0x696969, 0x778899, 0x9E9E9E],
  water:         [0x1E90FF, 0x4169E1, 0x6495ED, 0x2E8BDE, 0x1C6EF0, 0x87CEEB],
  waterDeep:     [0x00008B, 0x0000CD, 0x0000AA],
  lilyPad:       [0x228B22, 0x2E8B57, 0x32CD32],
  lilyFlower:    [0xFFB6C1, 0xFF69B4, 0xFFFFFF, 0xFF1493, 0xFFC0CB],

  // Cherry blossoms
  blossomPink:   [0xFFB7C5, 0xFFA0C4, 0xFF8DA1, 0xFF99AA, 0xFFAACD, 0xFFB6C1, 0xFF91A4],
  blossomWhite:  [0xFFFFFF, 0xFFF0F5, 0xFFE4E9, 0xFFD1DC],
  blossomDark:   [0xFF6B8E, 0xFF5C7A, 0xFF4D6D],
  trunk:         [0x4A3728, 0x5D4037, 0x6D4C41, 0x3E2723],
  branch:        [0x5D4037, 0x4E342E, 0x6D4C41],

  // Regular trees
  treeGreen1:    [0x006400, 0x228B22, 0x2E8B2E, 0x1B5E20],
  treeGreen2:    [0x388E3C, 0x43A047, 0x4CAF50, 0x2E7D32],
  treeGreen3:    [0x66BB6A, 0x81C784, 0xA5D6A7],
  pine:          [0x1B5E20, 0x2E7D32, 0x388E3C, 0x004D00],

  // Flowers
  redFlower:     [0xFF4444, 0xFF3333, 0xFF5555, 0xEE2222],
  yellowFlower:  [0xFFD700, 0xFFC125, 0xFFEC8B, 0xFFBE00],
  purpleFlower:  [0x9370DB, 0x8A2BE2, 0x7B68EE, 0x6A5ACD],
  blueFlower:    [0x6495ED, 0x4169E1, 0x1E90FF, 0x87CEEB],
  orangeFlower:  [0xFF8C00, 0xFF7F00, 0xFF6600, 0xFFA500],
  whiteFlower:   [0xFFFAFA, 0xF0F8FF, 0xFFFFFF],
  mixFlower:     [0xFF69B4, 0xFF6EB4, 0xFFB6C1, 0xFF1493],

  // Rocks
  rock1:         [0x696969, 0x808080, 0x5A5A5A, 0x707070],
  rock2:         [0x778899, 0x708090, 0x778899, 0x8899AA],
  rock3:         [0x556B2F, 0x6B8E23, 0x8FBC8F, 0x7CFC00],
  rockMossy:     [0x4A5D23, 0x556B2F, 0x6B8E23],

  // Misc
  bridge:        [0x8B0000, 0xA52A2A, 0xB22222],
  bridgeWood:    [0x6B4423, 0x5C3A1E, 0x7A5030],
  fence:         [0xDEB887, 0xD2B48C, 0xC8AD7F],
  bamboo:        [0x228B22, 0x2E8B2E, 0x32CD32, 0x3CB371, 0x1E7B1E],
  lanternPost:   [0x4A3728, 0x5D4037, 0x3E2723],
  cloud:         [0xFFFFFF, 0xF0F8FF, 0xE6F2FF, 0xDDEEFF],
};

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function createVoxel(x, y, z, color, size = 1) {
  const geo = new THREE.BoxGeometry(size, size, size);
  const mat = new THREE.MeshLambertMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function addVoxelToGroup(group, x, y, z, colors, size = 1) {
  const c = Array.isArray(colors) ? pick(colors) : colors;
  const v = createVoxel(x, y, z, c, size);
  group.add(v);
  return v;
}

// ─── Ground & Terrain ──────────────────────────────────────────────────────
const groundGroup = new THREE.Group();

// Base grass layer
for (let x = -50; x <= 50; x++) {
  for (let z = -50; z <= 50; z++) {
    const dist = Math.sqrt(x*x + z*z);
    if (dist > 52) continue;

    // Gentle hills
    const hill = Math.sin(x * 0.12) * Math.cos(z * 0.12) * 1.5
               + Math.sin(x * 0.07 + 1) * Math.cos(z * 0.09) * 2;
    const baseY = Math.max(0, Math.round(hill));

    if (dist < 22) {
      // Pond area - water
      if (dist < 18) {
        const waterColor = dist < 12 ? pick(palette.waterDeep) : pick(palette.water);
        addVoxelToGroup(groundGroup, x, 0, z, waterColor);
      } else {
        // Pond bank - muddy
        addVoxelToGroup(groundGroup, x, 0, z, pick(palette.dirt));
      }
    } else {
      // Grass
      const grassColor = baseY > 0 ? pick(palette.grass2) : pick(palette.grass1);
      addVoxelToGroup(groundGroup, x, baseY, z, grassColor);
      // Extra grass tufts
      if (Math.random() < 0.08) {
        addVoxelToGroup(groundGroup, x, baseY + 1, z, pick(palette.grass2));
      }
    }
  }
}

scene.add(groundGroup);

// ─── Winding Path ─────────────────────────────────────────────────────────
function layPath(centerX, centerZ, radius, segments, group) {
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const angle = t * Math.PI * 2;
    const px = centerX + Math.cos(angle) * radius + Math.sin(angle * 3) * 4;
    const pz = centerZ + Math.sin(angle) * radius + Math.cos(angle * 2) * 3;
    const px2 = centerX + Math.cos(angle) * (radius - 1.5) + Math.sin(angle * 3) * 3;
    const pz2 = centerZ + Math.sin(angle) * (radius - 1.5) + Math.cos(angle * 2) * 2;

    // Path stones
    for (let ox = -1; ox <= 1; ox++) {
      for (let oz = -1; oz <= 1; oz++) {
        if (Math.random() < 0.7) {
          addVoxelToGroup(group, Math.round(px + ox), 1, Math.round(pz + oz), pick(palette.path));
        }
      }
    }
    // Inner path
    addVoxelToGroup(group, Math.round(px2), 1, Math.round(pz2), pick(palette.pathBorder));
  }
}

// Path to pagoda
for (let i = -12; i <= 12; i++) {
  const wobble = Math.round(Math.sin(i * 0.5) * 2);
  for (let w = -1; w <= 1; w++) {
    if (Math.random() < 0.85) {
      addVoxelToGroup(scene, wobble + w, 1, i, pick(palette.path));
    }
  }
}

// Circular garden path
layPath(0, 0, 30, 48, scene);

// Stone stepping path to cherry trees
for (let i = -8; i <= 8; i++) {
  const sx = Math.round(Math.cos(i * 0.7) * 5);
  const sz = 20 + i;
  addVoxelToGroup(scene, sx, 1, sz, pick(palette.path));
  if (Math.abs(i) < 6) {
    addVoxelToGroup(scene, sx + 1, 1, sz, pick(palette.path));
    addVoxelToGroup(scene, sx - 1, 1, sz, pick(palette.path));
  }
}

// ─── Pagoda ───────────────────────────────────────────────────────────────
const pagodaGroup = new THREE.Group();

function buildPagodaRoof(group, baseX, baseY, baseZ, width, roofColor) {
  const layers = 5;
  for (let l = 0; l < layers; l++) {
    const overhang = Math.max(0, layers - l - 1);
    const w = width - l * 1;
    for (let x = -w - overhang; x <= w + overhang; x++) {
      for (let z = -w - overhang; z <= w + overhang; z++) {
        const d = Math.abs(x) + Math.abs(z);
        if (d <= w + overhang + 0.5) {
          const dist = Math.sqrt(x*x + z*z);
          if (dist <= w + overhang + 0.2) {
            const c = (x === -w-overhang || x === w+overhang || z === -w-overhang || z === w+overhang) && l < layers-1
                      ? pick(palette.pagodaTrim) : pick(roofColor);
            const yOffset = l;
            addVoxelToGroup(group, baseX + x, baseY + yOffset, baseZ + z, c);
          }
        }
      }
    }
  }
  return layers;
}

function buildPagodaBody(group, baseX, baseY, baseZ, width, height, bodyColor) {
  for (let y = 0; y < height; y++) {
    for (let x = -width; x <= width; x++) {
      for (let z = -width; z <= width; z++) {
        const isEdge = Math.abs(x) === width || Math.abs(z) === width;
        const isNearEdge = Math.abs(x) >= width - 1 || Math.abs(z) >= width - 1;

        if (isEdge) {
          // Pillars
          addVoxelToGroup(group, baseX + x, baseY + y, baseZ + z, pick(palette.pagodaPillar));
        } else if (y === 0 || y === Math.floor(height/2) || y === height - 1) {
          // Decorative bands
          addVoxelToGroup(group, baseX + x, baseY + y, baseZ + z, pick(palette.pagodaTrim));
        } else if (isNearEdge) {
          addVoxelToGroup(group, baseX + x, baseY + y, baseZ + z, pick(bodyColor));
        } else {
          // Interior floor
          addVoxelToGroup(group, baseX + x, baseY + y, baseZ + z, pick(palette.pagodaFloor));
        }
      }
    }
  }
  return height;
}

function buildPagodaFloor(group, baseX, baseY, baseZ, width) {
  for (let x = -width; x <= width; x++) {
    for (let z = -width; z <= width; z++) {
      addVoxelToGroup(group, baseX + x, baseY, baseZ + z, pick(palette.pagodaFloor));
    }
  }
}

// Main pagoda - 5 tiers
const pagodaX = 0, pagodaZ = 0;
let currentY = 1;

// Foundation platform
buildPagodaFloor(pagodaGroup, pagodaX, currentY, pagodaZ, 8);
currentY += 1;
buildPagodaRoof(pagodaGroup, pagodaX, currentY, pagodaZ, 7, palette.pagodaRoof);

// Tier 1
currentY += 5;
buildPagodaBody(pagodaGroup, pagodaX, currentY, pagodaZ, 6, 4, palette.pagodaBody);
currentY += 4;
const t1roof = buildPagodaRoof(pagodaGroup, pagodaX, currentY, pagodaZ, 7, palette.pagodaRoof);
currentY += t1roof + 1;

// Tier 2
buildPagodaBody(pagodaGroup, pagodaX, currentY, pagodaZ, 5, 3, palette.pagodaBody);
currentY += 3;
const t2roof = buildPagodaRoof(pagodaGroup, pagodaX, currentY, pagodaZ, 6, palette.pagodaRoof);
currentY += t2roof + 1;

// Tier 3
buildPagodaBody(pagodaGroup, pagodaX, currentY, pagodaZ, 4, 3, palette.pagodaBody);
currentY += 3;
const t3roof = buildPagodaRoof(pagodaGroup, pagodaX, currentY, pagodaZ, 5, palette.pagodaRoof);
currentY += t3roof + 1;

// Tier 4
buildPagodaBody(pagodaGroup, pagodaX, currentY, pagodaZ, 3, 2, palette.pagodaBody);
currentY += 2;
const t4roof = buildPagodaRoof(pagodaGroup, pagodaX, currentY, pagodaZ, 4, palette.pagodaRoof);
currentY += t4roof + 1;

// Tier 5 (top)
buildPagodaBody(pagodaGroup, pagodaX, currentY, pagodaZ, 2, 2, palette.pagodaBody);
currentY += 2;
const t5roof = buildPagodaRoof(pagodaGroup, pagodaX, currentY, pagodaZ, 3, palette.pagodaRoof);
currentY += t5roof;

// Spire
currentY += 2;
for (let i = 0; i < 5; i++) {
  addVoxelToGroup(pagodaGroup, pagodaX, currentY + i, pagodaZ, pick(palette.pagodaTrim));
  if (i < 2) {
    addVoxelToGroup(pagodaGroup, pagodaX + 1, currentY + i, pagodaZ, pick(palette.pagodaTrim));
    addVoxelToGroup(pagodaGroup, pagodaX - 1, currentY + i, pagodaZ, pick(palette.pagodaTrim));
    addVoxelToGroup(pagodaGroup, pagodaX, currentY + i, pagodaZ + 1, pick(palette.pagodaTrim));
    addVoxelToGroup(pagodaGroup, pagodaX, currentY + i, pagodaZ - 1, pick(palette.pagodaTrim));
  }
}
currentY += 5;
// Golden finial
addVoxelToGroup(pagodaGroup, pagodaX, currentY, pagodaZ, 0xFFD700);
addVoxelToGroup(pagodaGroup, pagodaX, currentY+1, pagodaZ, 0xFFD700);
addVoxelToGroup(pagodaGroup, pagodaX, currentY+2, pagodaZ, 0xFFFF00);

// Pagoda lanterns
const lanternPositions = [
  [7,4,7],[7,4,-7],[-7,4,7],[-7,4,-7],
  [5,10,5],[5,10,-5],[-5,10,5],[-5,10,-5],
];
lanternPositions.forEach(([lx,ly,lz]) => {
  addVoxelToGroup(pagodaGroup, pagodaX+lx, ly, pagodaZ+lz, pick(palette.lanternPost));
  addVoxelToGroup(pagodaGroup, pagodaX+lx, ly+1, pagodaZ+lz, pick(palette.lantern));
  addVoxelToGroup(pagodaGroup, pagodaX+lx, ly+2, pagodaZ+lz, pick(palette.lanternGlow));
});

// Pagoda railings
for (let x = -8; x <= 8; x++) {
  if (x % 2 === 0) {
    addVoxelToGroup(pagodaGroup, pagodaX+x, 2, pagodaZ+8, pick(palette.pagodaPillar));
    addVoxelToGroup(pagodaGroup, pagodaX+x, 3, pagodaZ+8, pick(palette.pagodaPillar));
    addVoxelToGroup(pagodaGroup, pagodaX+x, 2, pagodaZ-8, pick(palette.pagodaPillar));
    addVoxelToGroup(pagodaGroup, pagodaX+x, 3, pagodaZ-8, pick(palette.pagodaPillar));
  }
  if (x % 2 === 0) {
    addVoxelToGroup(pagodaGroup, pagodaX+8, 2, pagodaZ+x, pick(palette.pagodaPillar));
    addVoxelToGroup(pagodaGroup, pagodaX+8, 3, pagodaZ+x, pick(palette.pagodaPillar));
    addVoxelToGroup(pagodaGroup, pagodaX-8, 2, pagodaZ+x, pick(palette.pagodaPillar));
    addVoxelToGroup(pagodaGroup, pagodaX-8, 3, pagodaZ+x, pick(palette.pagodaPillar));
  }
}
// Horizontal rails
for (let x = -8; x <= 8; x++) {
  addVoxelToGroup(pagodaGroup, pagodaX+x, 2, pagodaZ+8, pick(palette.pagodaBody));
  addVoxelToGroup(pagodaGroup, pagodaX+x, 2, pagodaZ-8, pick(palette.pagodaBody));
}

scene.add(pagodaGroup);

// ─── Cherry Blossom Trees ──────────────────────────────────────────────────
function buildCherryTree(group, tx, ty, tz, size = 1, density = 1) {
  const trunkH = Math.round(4 * size + Math.random() * 2);
  for (let y = 0; y < trunkH; y++) {
    addVoxelToGroup(group, tx, ty + y, tz, pick(palette.trunk));
    if (y > 1 && Math.random() < 0.4) {
      const bx = Math.random() < 0.5 ? 1 : -1;
      addVoxelToGroup(group, tx + bx, ty + y, tz, pick(palette.branch));
      if (Math.random() < 0.5) addVoxelToGroup(group, tx + bx, ty + y + 1, tz, pick(palette.branch));
    }
  }

  // Canopy layers
  const canopyR = Math.round(3 * size + Math.random() * 2);
  for (let layer = 0; layer < 4; layer++) {
    const layerY = ty + trunkH + layer * 1.5;
    const layerR = Math.max(1, canopyR - layer);
    for (let x = -layerR; x <= layerR; x++) {
      for (let z = -layerR; z <= layerR; z++) {
        const dist = Math.sqrt(x*x + z*z);
        if (dist <= layerR + 0.3) {
          if (Math.random() < density) {
            const isTop = layer === 3;
            const colors = isTop ? palette.blossomWhite : palette.blossomPink;
            addVoxelToGroup(group, tx + x, layerY, tz + z, pick(colors));
            // Extra puffs
            if (Math.random() < 0.3) {
              addVoxelToGroup(group, tx + x, layerY + 1, tz + z, pick(palette.blossomPink));
            }
          }
        }
      }
    }
  }

  // Hanging branches with blossoms
  for (let b = 0; b < 6; b++) {
    const angle = (b / 6) * Math.PI * 2;
    const bx = Math.round(Math.cos(angle) * (canopyR + 1));
    const bz = Math.round(Math.sin(angle) * (canopyR + 1));
    addVoxelToGroup(group, tx + bx, ty + trunkH - 1, tz + bz, pick(palette.branch));
    addVoxelToGroup(group, tx + bx, ty + trunkH, tz + bz, pick(palette.blossomPink));
    addVoxelToGroup(group, tx + bx, ty + trunkH + 1, tz + bz, pick(palette.blossomWhite));
  }
}

// Cherry blossom trees around the garden
const cherryPositions = [
  [25, 1, -20], [-22, 1, 18], [30, 1, 10], [-28, 1, -15],
  [18, 1, 30], [-15, 1, -28], [35, 1, -5], [-32, 1, 8],
  [12, 1, -35], [-10, 1, 35], [38, 1, 20], [-36, 1, -22],
  [22, 1, 38], [-20, 1, -38], [40, 1, -12], [-38, 1, 14],
];

cherryPositions.forEach(([x, y, z], i) => {
  const size = 0.8 + Math.random() * 0.6;
  const density = 0.7 + Math.random() * 0.3;
  buildCherryTree(scene, x, y, z, size, density);
});

// ─── Regular Trees ─────────────────────────────────────────────────────────
function buildPineTree(group, tx, ty, tz, size = 1) {
  const trunkH = Math.round(3 * size + Math.random() * 2);
  for (let y = 0; y < trunkH; y++) {
    addVoxelToGroup(group, tx, ty + y, tz, pick(palette.trunk));
  }

  const layers = 4;
  for (let l = 0; l < layers; l++) {
    const r = Math.round((layers - l) * size * 1.2);
    const ly = ty + trunkH + l * 2;
    for (let x = -r; x <= r; x++) {
      for (let z = -r; z <= r; z++) {
        if (Math.abs(x) + Math.abs(z) <= r + 1) {
          addVoxelToGroup(group, tx + x, ly, tz + z, pick(palette.pine));
          if (l < layers - 1) {
            addVoxelToGroup(group, tx + x, ly + 1, tz + z, pick(palette.treeGreen1));
          }
        }
      }
    }
  }
}

function buildRoundTree(group, tx, ty, tz, size = 1) {
  const trunkH = Math.round(3 * size + Math.random());
  for (let y = 0; y < trunkH; y++) {
    addVoxelToGroup(group, tx, ty + y, tz, pick(palette.trunk));
  }

  const r = Math.round(3 * size);
  for (let x = -r; x <= r; x++) {
    for (let y = 0; y <= r; y++) {
      for (let z = -r; z <= r; z++) {
        const dist = Math.sqrt(x*x + (y - r*0.5)*(y - r*0.5) + z*z);
        if (dist <= r) {
          const colors = y > r * 0.6 ? palette.treeGreen3
                       : y > r * 0.3 ? palette.treeGreen2
                       : palette.treeGreen1;
          addVoxelToGroup(group, tx + x, ty + trunkH + y, tz + z, pick(colors));
        }
      }
    }
  }
}

// Koi fish (voxel art)
function buildKoi(group, kx, ky, kz) {
  const koiColors = [0xFF6347, 0xFFFFFF, 0xFF4500, 0xFFA500, 0xFFD700];
  for (let i = -2; i <= 2; i++) {
    addVoxelToGroup(group, kx + i, ky, kz, pick(koiColors));
    addVoxelToGroup(group, kx + i, ky + 1, kz, pick(koiColors));
  }
  addVoxelToGroup(group, kx - 3, ky, kz, pick(koiColors));
  addVoxelToGroup(group, kx + 3, ky, kz, pick(koiColors));
}

// ─── Bridge ───────────────────────────────────────────────────────────────
function buildBridge(group, bx, by, bz, length) {
  // Bridge deck
  for (let i = 0; i < length; i++) {
    addVoxelToGroup(group, bx + i, by, bz, pick(palette.bridgeWood));
    addVoxelToGroup(group, bx + i, by, bz + 1, pick(palette.bridgeWood));
    addVoxelToGroup(group, bx + i, by, bz - 1, pick(palette.bridgeWood));
  }
  // Railings
  for (let i = 0; i < length; i += 2) {
    addVoxelToGroup(group, bx + i, by + 1, bz - 1, pick(palette.bridge));
    addVoxelToGroup(group, bx + i, by + 2, bz - 1, pick(palette.bridge));
    addVoxelToGroup(group, bx + i, by + 1, bz + 1, pick(palette.bridge));
    addVoxelToGroup(group, bx + i, by + 2, bz + 1, pick(palette.bridge));
  }
  // Top rail
  for (let i = 0; i < length; i++) {
    addVoxelToGroup(group, bx + i, by + 3, bz - 1, pick(palette.bridge));
    addVoxelToGroup(group, bx + i, by + 3, bz + 1, pick(palette.bridge));
  }
}

  addVoxelToGroup(group, lx, ly + 5, lz, pick(palette.lanternGlow));

}

// ─── Flower Beds ───────────────────────────────────────────────────────────
function buildFlowerBed(group, cx, cy, cz, radius, colors) {
  for (let i = 0; i < 25; i++) {

    const r = Math.random() * radius;

    addVoxelToGroup(group, fx, cy, fz, pick(colors));

    if (Math.random() < 0.3) {
      addVoxelToGroup(group, fx, cy + 2, fz, pick(palette.yellowFlower));
    }
  }
}

function buildRockCluster(group, rx, ry, rz, count) {
  for (let i = 0; i < count; i++) {
    const ox = Math.round((Math.random() - 0.5) * 6);
    const oz = Math.round((Math.random() - 0.5) * 6);
    const oy = Math.round(Math.random() * 2);
    const colors = i % 3 === 0 ? palette.rockMossy

                 : palette.rock1;
    addVoxelToGroup(group, rx + ox, ry + oy, rz + oz, pick(colors));
    if (Math.random() < 0.4) {
      addVoxelToGroup(group, rx + ox, ry + oy + 1, rz + oz, pick(colors));
    }
  }
}

// ─── Bamboo Grove ─────────────────────────────────────────────────────────
function buildBamboo(group, bx, by, bz, height) {
  for (let y = 0; y < height; y++) {
    addVoxelToGroup(group, bx, by + y, bz, pick(palette.bamboo));
    if (y % 3 === 0 && y > 0) {
      // Leaves at joints
      for (let l = 0; l < 4; l++) {
        const la = (l / 4) * Math.PI * 2;
        const lx = Math.round(Math.cos(la) * 1.5);
        const lz = Math.round(Math.sin(la) * 1.5);
        addVoxelToGroup(group, bx + lx, by + y, bz + lz, pick(palette.treeGreen2));
      }
    }
  }
}

  // Second beam (nuki)
  for (let x = -4; x <= 4; x++) {
    addVoxelToGroup(group, tx + x, ty + 6, tz, 0xCC0000);

}

// ─── Animation ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Falling petals
  petalMeshes.forEach((mesh) => {
    const ud = mesh.userData;
    mesh.position.y -= ud.fallSpeed;
    mesh.position.x += Math.sin(t * ud.swaySpeed + ud.swayPhase) * ud.swayAmp * 0.01;
    mesh.position.z += Math.cos(t * ud.swaySpeed * 0.7 + ud.swayPhase) * ud.swayAmp * 0.01;
    mesh.rotation.x += ud.rotSpeed;
    mesh.rotation.z += ud.rotSpeed * 0.5;

    // Reset when below ground
    if (mesh.position.y < 0) {
      const angle = Math.random() * Math.PI * 2;
      const r = 10 + Math.random() * 45;
      mesh.position.set(
        Math.cos(angle) * r,
        50 + Math.random() * 20,
        Math.sin(angle) * r
      );
      mesh.userData.fallSpeed = 0.02 + Math.random() * 0.05;
    }
  });

  // Fireflies
  fireflyMeshes.forEach((mesh) => {
    const ud = mesh.userData;
    mesh.position.y = ud.baseY + Math.sin(t * ud.floatSpeed + ud.phase) * ud.floatAmp;
    mesh.position.x += Math.sin(t * 0.3 + ud.phase) * 0.02;
    mesh.position.z += Math.cos(t * 0.2 + ud.phase) * 0.02;

    const glow = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * ud.glowSpeed + ud.glowPhase));
    mesh.material.opacity = glow;
    mesh.material.color.setHSL(
      0.15 + Math.sin(ud.glowPhase) * 0.05,
      1.0,
      0.5 + glow * 0.4
    );

    if (mesh.position.y < 0) mesh.position.y = ud.baseY;
  });

  // Floating lanterns
  lanternMeshes.forEach((group) => {
    const ud = group.userData;
    group.position.y = ud.baseY + Math.sin(t * ud.floatSpeed + ud.phase) * ud.floatAmp;
    group.rotation.y += ud.rotSpeed;

    // Slow drift
    ud.driftAngle += ud.driftSpeed * 0.01;
    group.position.x = Math.cos(ud.driftAngle) * (ud.driftR + Math.sin(t * 0.2) * ud.driftAmp);
    group.position.z = Math.sin(ud.driftAngle) * (ud.driftR + Math.cos(t * 0.15) * ud.driftAmp);
  });

  // Stars twinkle
  scene.children.forEach((child) => {
    if (child.userData.twinkleSpeed) {
      const tw = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * child.userData.twinkleSpeed + child.userData.twinklePhase));
      child.material.opacity = tw * 0.8;
    }
  });

  // Warm lantern glow pulse
  warmLight.intensity = 1.2 + Math.sin(t * 2) * 0.3;

  // Camera gentle drift
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
