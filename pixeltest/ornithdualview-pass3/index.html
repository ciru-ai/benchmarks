<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voxel Pagoda Garden</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#info {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  color: #fff; background: rgba(0,0,0,0.55); padding: 10px 24px;
  border-radius: 20px; font-size: 14px; pointer-events: none;
  backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.15);
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
#legend {
  position: absolute; bottom: 16px; left: 16px;
  color: #fff; background: rgba(0,0,0,0.5); padding: 12px 18px;
  border-radius: 12px; font-size: 12px; pointer-events: none;
  backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1);
  line-height: 1.8;
}
#loading {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: #ffccdd; font-size: 22px; pointer-events: none;
  text-shadow: 0 0 20px rgba(255,100,150,0.6);
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
</style>
</head>
<body>
<div id="info">🏯 Voxel Pagoda Garden — Drag to rotate · Scroll to zoom · Right-drag to pan</div>
<div id="legend">
  🌸 Cherry Blossom · <span style="color:#ff6b9d">Pink</span><br>
  🏯 Pagoda · <span style="color:#cc3333">Red</span> · <span style="color:#ffd700">Gold</span><br>
  💧 Pond · <span style="color:#4499ff">Blue</span> · <span style="color:#ff6644">Koi</span><br>
  🪨 Stone Lantern · <span style="color:#999999">Gray</span><br>
  ⛩️ Torii Gate · <span style="color:#ee2222">Vermillion</span><br>
  🍵 Tea House · <span style="color:#8B4513">Wood</span>
</div>
<div id="loading">Building voxel garden…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Scene Setup ──────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.5, 500);
camera.position.set(45, 35, 55);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI/2.05;
controls.minDistance = 15;
controls.maxDistance = 120;
controls.target.set(0, 8, 0);

// ─── Voxel Palette ────────────────────────────────────────────
const COLORS = {
  grass:        0x4a8c3f,
  darkGrass:    0x3d7a34,
  lightGrass:   0x6abf5e,
  path:         0x888070,
  pathLight:    0x9e9888,
  water:        0x3388dd,
  waterDeep:    0x2266bb,
  waterShallow: 0x55aaee,
  koi:          0xff5522,
  koiWhite:     0xffffff,
  koiGold:      0xffaa00,
  cherryBark:   0x5c3a1e,
  cherryBlossom:0xff6b9d,
  cherryLight:  0xffaacc,
  cherryDark:   0xdd4477,
  cherryWhite:  0xffeef5,
  wood:         0x8B5E3C,
  darkWood:     0x5c3a1e,
  roofGold:     0xd4a017,
  roofDarkGold: 0xb8860b,
  roofEdge:     0x2a1a0a,
  wallWhite:    0xf0ece0,
  wallCream:    0xe8e0d0,
  pillarRed:    0xcc2222,
  pillarDark:   0x991818,
  stone:        0x808080,
  stoneLight:   0xa0a0a0,
  stoneDark:    0x606060,
  torii:        0xee2222,
  toriiDark:    0xbb1111,
  lantern:      0x999999,
  lanternGlow:  0xffdd88,
  rock:         0x707070,
  rockDark:     0x505050,
  moss:         0x4a7a3f,
  gold:         0xffd700,
  goldBright:   0xffee44,
  fence:        0x9e8c6c,
  zenStones:    0xccbbaa,
  bamboo:       0x558833,
  bambooLight:  0x77aa55,
};

// ─── Voxel Data ───────────────────────────────────────────────
const voxels = [];

function addVoxel(x,y,z,color) {
  voxels.push({ x, y, z, color });
}

// ─── Sky & Fog ────────────────────────────────────────────────
const skyGeo = new THREE.SphereGeometry(200, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor:   { value: new THREE.Color(0x4488cc) },
    bottomColor:{ value: new THREE.Color(0xffeecc) },
    offset:     { value: 10 },
    exponent:   { value: 0.4 }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position,1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform float offset;
    uniform float exponent;
    varying vec3 vWorldPos;
    void main() {
      float h = normalize(vWorldPos + offset).y;
      gl_FragColor = vec4(mix(bottomColor, topColor,
        max(pow(max(h,0.0), exponent), 0.0)), 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));
scene.fog = new THREE.FogExp2(0xddeeff, 0.006);

// ─── Lighting ─────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffeedd, 0.5));

const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.8);
sunLight.position.set(30, 50, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048,2048);
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 120;
sunLight.shadow.camera.left = -50;
sunLight.shadow.camera.right = 50;
sunLight.shadow.camera.top = 50;
sunLight.shadow.camera.bottom = -50;
sunLight.shadow.bias = -0.001;
scene.add(sunLight);

scene.add(new THREE.DirectionalLight(0x8899cc, 0.4).translateX(-20).translateY(15).translateZ(-10));

const warmRim = new THREE.PointLight(0xffaa55, 0.6, 60);
warmRim.position.set(-15, 12, 15);
scene.add(warmRim);

// ─── Helpers ──────────────────────────────────────────────────
function buildGround() {
  const SIZE = 50;
  for(let x = -SIZE; x <= SIZE; x++) {
    for(let z = -SIZE; z <= SIZE; z++) {
      const dist = Math.sqrt(x*x + z*z);
      if(dist < 8) continue;
      const h = Math.sin(x*0.08)*0.6 + Math.cos(z*0.1)*0.4 + Math.sin((x+z)*0.05)*0.3;
      const y = Math.max(0, h);
      const r = Math.random();
      let color = COLORS.grass;
      if(r<0.15) color=COLORS.grass;
      else if(r<0.3) color=COLORS.darkGrass;
      else if(r<0.4) color=COLORS.lightGrass;
      addVoxel(x, y, z, color);
      if(y>0.5) addVoxel(x, y-1, z, COLORS.darkGrass);
    }
  }
}

function buildPaths() {
  // Main path gate → pagoda
  for(let t=0;t<=1;t+=0.04){
    const x=Math.round(-20+t*40);
    const z=Math.round(Math.sin(t*Math.PI*1.5)*4);
    const c=Math.random()<0.5?COLORS.path:COLORS.pathLight;
    addVoxel(x,0,z,c);
    addVoxel(x+1,0,z,c);
    addVoxel(x,0,z+1,c);
    addVoxel(x-1,0,z,c);
    addVoxel(x,0,z-1,c);
  }
  // Branch to tea house
  for(let t=0;t<=1;t+=0.05){
    const x=Math.round(12+t*8);
    const z=Math.round(-10+t*12+Math.sin(t*3)*2);
    addVoxel(x,0,z,COLORS.path);
    addVoxel(x+1,0,z,COLORS.path);
    addVoxel(x,0,z+1,COLORS.path);
  }
  // Ring path around pagoda
  for(let a=0;a<Math.PI*2;a+=0.08){
    const x=Math.round(15*Math.cos(a));
    const z=Math.round(15*Math.sin(a));
    addVoxel(x,0,z,COLORS.stone);
    addVoxel(x+1,0,z,COLORS.stoneLight);
    addVoxel(x,0,z+1,COLORS.stone);
  }
}

function buildPond() {
  const cx=-20, cz=5, R=8;
  // Rocks around edge
  for(let a=0;a<Math.PI*2;a+=0.15){
    for(let r=R-1;r<=R+1;r++){
      const x=Math.round(cx+r*Math.cos(a));
      const z=Math.round(cz+r*Math.sin(a));
      addVoxel(x,0,z, Math.random()<0.5?COLORS.rock:COLORS.rockDark);
      if(Math.random()<0.3) addVoxel(x,1,z,COLORS.moss);
    }
  }
  // Water
  for(let x=cx-R+1;x<cx+R-1;x++){
    for(let z=cz-R+1;z<cz+R-1;z++){
      if(Math.sqrt((x-cx)**2+(z-cz)**2)<R-1.5){
        const r=Math.random();
        if(r<0.3) addVoxel(x,0,z,COLORS.water);
        else if(r<0.6) addVoxel(x,0,z,COLORS.waterDeep);
        else addVoxel(x,0,z,COLORS.waterShallow);
      }
    }
  }
  // Koi
  addVoxel(cx+2,1,cz+1,COLORS.koi); addVoxel(cx+3,1,cz+1,COLORS.koi);
  addVoxel(cx-1,1,cz-2,COLORS.koiWhite); addVoxel(cx,1,cz-2,COLORS.koiWhite);
  addVoxel(cx+1,1,cz-1,COLORS.koiGold); addVoxel(cx+2,1,cz-1,COLORS.koiGold);
  // Lily pads
  [[-18,7],[-22,3],[-19,8],[-21,6]].forEach(([lx,lz])=>{
    addVoxel(lx,1,lz,0x228B22); addVoxel(lx+1,1,lz,0x228B22);
    addVoxel(lx,1,lz+1,0x228B22);
    addVoxel(lx,2,lz,0xff99cc); addVoxel(lx+1,2,lz,0xffffff);
  });
}

function buildPagoda() {
  const tiers=5, baseY=2;
  // Foundation
  for(let x=-6;x<=6;x++) for(let z=-6;z<=6;z++){
    addVoxel(x,0,z,COLORS.stone);
    addVoxel(x,1,z,COLORS.stoneLight);
  }
  // Steps (south side, +z)
  for(let y=0;y<2;y++) for(let x=-3;x<=3;x++){
    addVoxel(x,y,7,COLORS.stone);
    addVoxel(x,y,8,COLORS.stoneLight);
  }
  for(let tier=0;tier<tiers;tier++){
    const tb=baseY+tier*5;
    const w=4-Math.floor(tier*0.5);
    const rw=w+3;
    // Walls
    for(let y=0;y<4;y++) for(let x=-w;x<=w;x++) for(let z=-w;z<=w;z++){
      const edge=Math.abs(x)===w||Math.abs(z)===w;
      if(edge&&y===1&&(x===0||z===0)){
        addVoxel(x,tb+y,z,COLORS.gold);
      } else if(edge){
        addVoxel(x,tb+y,z,y===0||y===3?COLORS.pillarDark:COLORS.pillarRed);
      } else {
        addVoxel(x,tb+y,z,y<2?COLORS.wallCream:COLORS.wallWhite);
      }
    }
    // Curved roof
    for(let x=-rw;x<=rw;x++) for(let z=-rw;z<=rw;z++){
      const d=Math.max(Math.abs(x),Math.abs(z));
      if(d<=rw){
        const e=rw-d;
        const up=e<=1?Math.sin((1-e)*Math.PI/2)*1.5:0;
        const yo=Math.floor(up);
        addVoxel(x,tb+4+yo,z,COLORS.roofGold);
        if(e<=1&&up>=1.0) addVoxel(x,tb+4+yo+1,z,COLORS.roofEdge);
        if(e<=1) addVoxel(x,tb+4,z,COLORS.roofDarkGold);
      }
    }
    // Corner ornaments
    [[rw,rw],[-rw,rw],[rw,-rw],[-rw,-rw]].forEach(([ox,oz])=>{
      addVoxel(ox,tb+5,oz,COLORS.gold);
      if(tier<tiers-1) addVoxel(ox,tb+6,oz,COLORS.goldBright);
    });
    // Balcony
    if(tier<tiers-1){
      [[1,0,-1,0],[0,1,0,-1]].forEach(([xa,xb,za,zb])=>{
        for(let i=-w;i<=w;i++){
          addVoxel(xa===1?w:Math.abs(xa)===1?-w:i,tb+3,za===1?w:za===-1?-w:i,COLORS.pillarDark);
          addVoxel(i,tb+3,xa===1?w:xa===-1?-w:w,tb+3,COLORS.pillarDark);
        }
      });
    }
  }
  // Spire
  const sp=baseY+tiers*5;
  for(let y=0;y<6;y++){
    addVoxel(0,sp+y,0,COLORS.gold);
    if(y%2===0&&y>0){
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dz])=>addVoxel(dx,sp+y,dz,COLORS.goldBright));
    }
  }
  addVoxel(0,sp+6,0,COLORS.goldBright);
  addVoxel(0,sp+7,0,COLORS.gold);
}

function buildCherryTree(x,y,z,s=1){
  const th=Math.round(5*s);
  for(let ty=0;ty<th;ty++){
    addVoxel(x,y+ty,z,COLORS.cherryBark);
    if(ty>2&&ty<th-1&&ty%3===0) addVoxel(x+1,y+ty,z,COLORS.cherryBark);
  }
  const topY=y+th;
  // Branches
  [[2,0,1],[-2,0,1],[0,2,1],[0,-2,1],[1,1,2],[-1,-1,2],[1,-1,2],[-1,1,2],
   [3,0,1],[-3,0,1],[0,3,1],[0,-3,1]].forEach(([bx,bz,by])=>{
    const bl=Math.round((2+Math.random()*2)*s);
    for(let i=0;i<bl;i++){
      addVoxel(Math.round(x+bx*i/s),Math.round(topY-i*0.3),Math.round(z+bz*i/s),COLORS.cherryBark);
    }
  });
  // Blossom canopy
  const bColors=[COLORS.cherryBlossom,COLORS.cherryLight,COLORS.cherryDark,COLORS.cherryWhite,
    0xff88aa,0xff7799,0xffbbee,0xff5588,0xff99cc,0xee6699];
  for(let a=0;a<80*s;a++){
    const angle=Math.random()*Math.PI*2;
    const hOff=Math.random()*5*s;
    const rad=Math.random()*4*s;
    const bx=Math.round(x+rad*Math.cos(angle));
    const bz=Math.round(z+rad*Math.sin(angle));
    const by=Math.round(topY+hOff-2*s);
    if(Math.random()<0.6) addVoxel(bx,by,bz,bColors[Math.floor(Math.random()*bColors.length)]);
  }
  for(let a=0;a<30*s;a++){
    addVoxel(Math.round(x+(Math.random()-0.5)*3*s),
             Math.round(topY+(Math.random()-0.5)*2*s),
             Math.round(z+(Math.random()-0.5)*3*s),
             COLORS.cherryBlossom);
  }
}

function buildAllTrees(){
  [{x:15,z:12,s:1.2},{x:-12,z:-10,s:1.0},{x:20,z:-5,s:0.9},
   {x:-18,z:18,s:1.1},{x:25,z:20,s:0.8},{x:-25,z:-15,s:1.0},
   {x:8,z:-18,s:1.15},{x:-8,z:22,s:0.85},{x:30,z:-15,s:0.95},
   {x:-30,z:10,s:1.1},{x:18,z:-20,s:0.8},{x:-22,z:-22,s:1.05}
  ].forEach(t=>buildCherryTree(t.x,1,t.z,t.s));
}

function buildBambooPatch(cx,cz){
  for(let i=0;i<8;i++){
    const bx=cx+Math.floor((Math.random()-0.5)*6);
    const bz2=cz+Math.floor((Math.random()-0.5)*6);
    const h=6+Math.floor(Math.random()*4);
    for(let y=0;y<h;y++){
      addVoxel(bx,y+1,bz2,y%3===0?COLORS.bambooLight:COLORS.bamboo);
      if(y>h*0.6){ addVoxel(bx+1,y,bz2,0x55aa33); addVoxel(bx-1,y,bz2,0x55aa33); addVoxel(bx,y,bz2+1,0x55aa33); }
    }
  }
}

function buildPineTree(x,y,z){
  for(let ty=0;ty<4;ty++) addVoxel(x,y+ty,z,COLORS.cherryBark);
  for(let layer=0;layer<5;layer++){
    const r=3-layer*0.5;
    const ly=y+4+layer*1.5;
    for(let x2=-r;x2<=r;x2++) for(let z2=-r;z2<=r;z2++){
      if(Math.abs(x2)+Math.abs(z2)<=r+0.5){
        addVoxel(x+x2,Math.round(ly),z+z2,Math.random()<0.5?0x2d6b30:0x3a8a3c);
      }
    }
  }
}

function buildAllOtherTrees(){
  buildBambooPatch(25,-25);
  buildBambooPatch(-28,22);
  buildPineTree(22,1,25);
  buildPineTree(-25,1,-20);
  buildPineTree(28,1,10);
  buildPineTree(-15,1,25);
}

function buildLantern(x,y,z){
  // Base
  addVoxel(x-1,y,z,COLORS.lantern); addVoxel(x+1,y,z,COLORS.lantern);
  addVoxel(x,y,z-1,COLORS.lantern); addVoxel(x,y,z+1,COLORS.lantern);
  addVoxel(x,y+1,z,COLORS.stoneLight);
  addVoxel(x,y+2,z,COLORS.lantern);
  // Light chamber
  addVoxel(x,y+3,z,0xffffcc);
  addVoxel(x+1,y+3,z,COLORS.lantern); addVoxel(x-1,y+3,z,COLORS.lantern);
  addVoxel(x,y+3,z+1,COLORS.lantern); addVoxel(x,y+3,z-1,COLORS.lantern);
  // Roof
  addVoxel(x,y+4,z,COLORS.stoneDark);
  addVoxel(x+1,y+4,z,COLORS.stoneDark); addVoxel(x-1,y+4,z,COLORS.stoneDark);
  addVoxel(x,y+4,z+1,COLORS.stoneDark); addVoxel(x,y+4,z-1,COLORS.stoneDark);
  addVoxel(x,y+5,z,COLORS.stone);
  addVoxel(x,y+6,z,COLORS.stoneLight);
  // Glow
  const pl=new THREE.PointLight(0xffdd88,0.8,8);
  pl.position.set(x+0.5,y+3.5,z+0.5);
  scene.add(pl);
}

function buildAllLanterns(){
  [[-5,2],[5,2],[-3,-5],[3,-5],[-15,0],[15,0],[-10,-12],[10,12],[-25,5],[25,-5],[0,15],[0,-15]]
    .forEach(([lx,lz])=>buildLantern(lx,1,lz));
}

function buildToriiGate(x,y,z){
  const pH=10;
  for(let py=0;py<pH;py++){
    addVoxel(x-2,y+py,z,COLORS.torii);
    addVoxel(x+2,y+py,z,COLORS.torii);
    if(py<3){ addVoxel(x-1,y+py,z,COLORS.toriiDark); addVoxel(x+1,y+py,z,COLORS.toriiDark); }
  }
  for(let tx=-4;tx<=4;tx++){
    const up=Math.max(0,(1-Math.abs(tx)/4))*0.8;
    addVoxel(x+tx,y+pH+Math.round(up),z,COLORS.torii);
    if(Math.abs(tx)===4) addVoxel(x+tx,y+pH+Math.round(up)-1,z,COLORS.toriiDark);
  }
  for(let tx=-3;tx<=3;tx++) addVoxel(x+tx,y+Math.floor(pH*0.75),z,COLORS.toriiDark);
  addVoxel(x,y+Math.floor(pH*0.88),z,COLORS.toriiDark);
  for(let bx=-2;bx<=2;bx++){
    addVoxel(x+bx,y,z-1,COLORS.stone);
    addVoxel(x+bx,y,z+1,COLORS.stone);
  }
}

function buildTeaHouse(){
  const x=18,z=-12;
  for(let fx=-3;fx<=3;fx++) for(let fz=-3;fz<=3;fz++){
    addVoxel(x+fx,1,z+fz,COLORS.stone);
  }
  for(let fx=-2;fx<=2;fx++) for(let fz=-2;fz<=2;fz++){
    addVoxel(x+fx,2,z+fz,COLORS.wood);
  }
  for(let wy=0;wy<4;wy++) for(let wx=-2;wx<=2;wx++) for(let wz=-2;wz<=2;wz++){
    const edge=Math.abs(wx)===2||Math.abs(wz)===2;
    if(edge){
      if(wy===1&&(wx===0||wz===0)) addVoxel(x+wx,3+wy,z+wz,0xffffee);
      else addVoxel(x+wx,3+wy,z+wz,COLORS.darkWood);
    }
  }
  [[-2,-2],[2,-2],[-2,2],[2,2]].forEach(([px,pz])=>{
    for(let py=2;py<7;py++) addVoxel(x+px,py,z+pz,COLORS.wood);
  });
  for(let rx=-4;rx<=4;rx++) for(let rz=-4;rz<=4;rz++){
    const d=Math.max(Math.abs(rx),Math.abs(rz));
    if(d<=4){
      const h=7+Math.floor((4-d)*1.2);
      addVoxel(x+rx,h,z+rz,COLORS.roofGold);
      if(d>=3) addVoxel(x+rx,h,z+rz,COLORS.roofDarkGold);
    }
  }
}

function buildZenGarden(){
  const gx=-22,gz=-18;
  for(let x=gx;x<gx+8;x++) for(let z=gz;z<gz+8;z++){
    addVoxel(x,0,z,Math.random()<0.5?0xd4c8a0:0xc8b890);
  }
  for(let x=gx;x<gx+8;x++){
    addVoxel(x,1,gz+2,0xd8d0b8);
    addVoxel(x,1,gz+5,0xd8d0b8);
  }
  [[gx+2,gz+2],[gx+5,gz+4],[gx+3,gz+6],[gx+6,gz+3]].forEach(([sx,sz])=>{
    addVoxel(sx,1,sz,COLORS.zenStones);
    addVoxel(sx+1,1,sz,COLORS.stone);
    addVoxel(sx,2,sz,COLORS.rock);
  });
}

function buildBridge(){
  for(let i=0;i<6;i++){
    const arch=Math.sin(i/5*Math.PI)*2;
    for(let w=-1;w<=1;w++){
      addVoxel(-16+i,Math.round(1+arch),10+w,COLORS.wood);
      if(w!==0&&arch>0.5) addVoxel(-16+i,Math.round(1+arch),10+w,COLORS.fence);
    }
  }
}

function buildRocks(){
  [{x:8,z:3},{x:-8,z:-3},{x:12,z:-8},{x:-14,z:14},{x:22,z:15},
   {x:-20,z:-8},{x:5,z:18},{x:-6,z:-15},{x:16,z:-15},{x:-10,z:20},
   {x:30,z:0},{x:-30,z:-5},{x:10,z:-25},{x:-20,z:25}
  ].forEach(({x:rx,z:rz})=>{
    const sz=1+Math.floor(Math.random()*2);
    for(let dx=-sz;dx<=sz;dx++) for(let dz=-sz;dz<=sz;dz++){
      if(Math.abs(dx)+Math.abs(dz)<=sz+0.5){
        const dy=Math.floor((sz-Math.abs(dx)-Math.abs(dz))*0.6);
        for(let y=0;y<=dy;y++) addVoxel(rx+dx,y,rz+dz,Math.random()<0.4?COLORS.rock:COLORS.rockDark);
        if(dy>0) addVoxel(rx,dy+1,rz,COLORS.moss);
      }
    }
  });
}

function buildFence(){
  for(let x=-25;x<-15;x++){
    addVoxel(x,1,25,COLORS.fence); addVoxel(x,2,25,COLORS.fence);
    if(x%3===0) addVoxel(x,3,25,COLORS.wood);
  }
  for(let z=-15;z<10;z++){
    addVoxel(25,1,z,COLORS.fence); addVoxel(25,2,z,COLORS.fence);
    if(z%3===0) addVoxel(25,3,z,COLORS.wood);
  }
  for(let x=15;x<26;x++){
    addVoxel(x,1,-25,COLORS.fence); addVoxel(x,2,-25,COLORS.fence);
    if(x%3===0) addVoxel(x,3,-25,COLORS.wood);
  }
}

function buildFlowers(){
  const fc=[0xff6699,0xff99cc,0xff4477,0xaa44ff,0xffaa00,0x44aaff,0xff6644,0xff44aa];
  for(let i=0;i<120;i++){
    const x=Math.floor((Math.random()-0.5)*45);
    const z=Math.floor((Math.random()-0.5)*45);
    if(Math.sqrt(x*x+z*z)<8) continue;
    addVoxel(x,1,z,0x338833);
    addVoxel(x,2,z,fc[Math.floor(Math.random()*fc.length)]);
  }
}

function buildWaterWheel(){
  const x=-14,z=12;
  for(let y=1;y<7;y++){ addVoxel(x,y,z,COLORS.wood); addVoxel(x+1,y,z,COLORS.wood); }
  for(let a=0;a<Math.PI*2;a+=Math.PI/6){
    for(let r=0;r<3;r++){
      addVoxel(x+Math.round(r*Math.cos(a)),4,z+Math.round(r*Math.sin(a)),COLORS.wood);
    }
  }
  addVoxel(x,4,z,COLORS.gold);
}

// ─── Build Everything ─────────────────────────────────────────
console.time('build');
buildGround();
buildPaths();
buildPond();
buildPagoda();
buildAllTrees();
buildAllOtherTrees();
buildAllLanterns();
buildToriiGate(-25,1,0);
buildTeaHouse();
buildZenGarden();
buildBridge();
buildRocks();
buildFence();
buildFlowers();
buildWaterWheel();
console.timeEnd('build');
document.getElementById('loading').style.display='none';
console.log(`Total voxels: ${voxels.length}`);

// ─── GPU Instanced Rendering ──────────────────────────────────
const material = new THREE.MeshStandardMaterial({ roughness:0.85, metalness:0.05 });
const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), material, voxels.length);
mesh.castShadow=true;
mesh.receiveShadow=true;

const dummy = new THREE.Object3D();
const color = new THREE.Color();
voxels.forEach((v,i)=>{
  dummy.position.set(v.x,v.y,v.z);
  dummy.updateMatrix();
  mesh.setMatrixAt(i,dummy.matrix);
  mesh.setColorAt(i,color.set(v.color));
});
mesh.instanceMatrix.needsUpdate=true;
mesh.instanceColor.needsUpdate=true;
scene.add(mesh);

// ─── Falling Petals ──────────────────────────────────────────
const petalCount=300;
const petalGeo=new THREE.BufferGeometry();
const petalPos=new Float32Array(petalCount*3);
const petalVel=[];
for(let i=0;i<petalCount;i++){
  petalPos[i*3]=(Math.random()-0.5)*60;
  petalPos[i*3+1]=Math.random()*30+5;
  petalPos[i*3+2]=(Math.random()-0.5)*60;
  petalVel.push({
    x:(Math.random()-0.5)*0.02, y:-0.02-Math.random()*0.03,
    z:(Math.random()-0.5)*0.02, wobble:Math.random()*Math.PI*2
  });
}
petalGeo.setAttribute('position',new THREE.BufferAttribute(petalPos,3));
const petalMat=new THREE.PointsMaterial({color:0xff99bb,size:0.3,transparent:true,opacity:0.8,sizeAttenuation:true});
scene.add(new THREE.Points(petalGeo,petalMat));

// ─── Water Surface ────────────────────────────────────────────
const waterMesh2=new THREE.Mesh(
  new THREE.PlaneGeometry(14,14,1,1),
  new THREE.MeshStandardMaterial({color:0x3388dd,transparent:true,opacity:0.5,roughness:0.1,metalness:0.3})
);
waterMesh2.rotation.x=-Math.PI/2;
waterMesh2.position.set(-20,1.05,5);
scene.add(waterMesh2);

// ─── Animation ────────────────────────────────────────────────
let time=0;
function animate(){
  requestAnimationFrame(animate);
  time+=0.016;
  const pa=petalGeo.getAttribute('position');
  for(let i=0;i<petalCount;i++){
    const v=petalVel[i];
    v.wobble+=0.02;
    pa.array[i*3]+=v.x+Math.sin(v.wobble)*0.01;
    pa.array[i*3+1]+=v.y;
    pa.array[i*3+2]+=v.z+Math.cos(v.wobble)*0.01;
    if(pa.array[i*3+1]<0){
      pa.array[i*3]=(Math.random()-0.5)*60;
      pa.array[i*3+1]=25+Math.random()*10;
      pa.array[i*3+2]=(Math.random()-0.5)*60;
    }
  }
  pa.needsUpdate=true;
  waterMesh2.position.y=1.03+Math.sin(time*1.5)*0.02;
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
