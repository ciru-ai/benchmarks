<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Pagoda Garden</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0b0d17;
        font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 14px;
        top: 12px;
        z-index: 10;
        color: #f2efe9;
        background: rgba(12, 14, 26, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 10px 14px;
        backdrop-filter: blur(6px);
        pointer-events: none;
        line-height: 1.45;
        font-size: 12px;
        max-width: 260px;
      }
      #hud h1 {
        margin: 0 0 4px;
        font-size: 14px;
        letter-spacing: 0.06em;
        color: #ffd54a;
      }
      #hud small {
        color: #b9bcd6;
      }
      #hud .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6ee787;
        margin-right: 6px;
        vertical-align: middle;
      }
      #fps {
        position: fixed;
        right: 14px;
        top: 12px;
        z-index: 10;
        color: #9fe7c0;
        background: rgba(12, 14, 26, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Cjeil2IS.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <h1>🏯 Voxel Pagoda Garden</h1>
      <div><span class="dot"></span><small id="status">initializing…</small></div>
      <div><small>Drag to orbit · Scroll to zoom · Right-drag to pan</small></div>
    </div>
    <div id="fps">— fps</div>
  </body>
</html>
