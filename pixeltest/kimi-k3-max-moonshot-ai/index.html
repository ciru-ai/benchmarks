<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="title">
  <span class="jp">花見の庭</span>
  <span class="rule"></span>
  <span class="en">Hanami &middot; A Voxel Garden at Dusk</span>
</div>
<div class="hint">drag to wander &nbsp;&middot;&nbsp; scroll to draw near</div>
<div id="fallback">This garden needs WebGL and an internet connection (for the three.js CDN) to bloom.</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   0. Seeded random + value noise (organic terrain & canopies)
   ============================================================ */
let _seed = 20260802;
function rnd() { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; }
function hash2(x, z) {
  let h = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return h - Math.floor(h);
}
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z) {
  return vnoise(x, z) * 0.55 + vnoise(x * 2.1 + 7, z * 2.1 + 3) * 0.3 + vnoise(x * 4.3 + 13, z * 4.3 + 9) * 0.15;
}
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const vary = (hex, amt = 0.08) => {
  const c = new THREE.Color(hex);
  const m = 1 + (rnd() * 2 - 1) * amt;
  c.r = Math.min(1, c.r * m); c.g = Math.min(1, c.g * m); c.b = Math.min(1, c.b * m);
  return c.getHex();
};

/* ============================================================
   1. Palette — indigo dusk, cream plaster, vermilion, sakura
   ============================================================ */
const P = {
  grass:   ['#6fae4e', '#63a047', '#7cbb58', '#86c468', '#5d9c4a'],
  moss:    '#4f8f3f',
  dirt:    ['#7b543a', '#6d4a33', '#86603f'],
  stone:   ['#8d8a96', '#7c7987', '#9b98a5', '#6e6b78'],
  stoneDark: '#55525f',
  path:    ['#b9b4ad', '#aaa59f', '#c4beb6'],
  sand:    ['#cbb98c', '#c0ae7f'],
  wood:    '#8a5a34',
  woodDark:'#5f3b22',
  red:     '#b7402f',          // vermilion columns
  redDark: '#8e2f24',          // beams & railing
  redBright:'#d2543a',         // torii / bridge
  cream:   '#f0e3c8',          // plaster walls
  creamSh: '#d9c9a8',
  tileA:   '#2f5d5a',          // roof tiles — deep teal
  tileB:   '#386b66',
  tileDark:'#234744',
  tileUnder:'#1d3836',
  gold:    '#e8b34b',
  goldGlow:'#ffd98a',
  lantern: '#ffce7a',          // lantern firelight
  sakura:  ['#ffd9e8', '#ffc2da', '#ffa6c8', '#fb87b4', '#f26ba1', '#e85a96'],
  sakuraHot:'#fff0f6',
  trunk:   ['#4c3423', '#5a3f2b'],
  pine:    ['#2e5d3f', '#27513a', '#3a704c'],
  bamboo:  ['#7cb84f', '#94cc62', '#5e9c3e'],
  leaf:    ['#4e8f43', '#66a852', '#3c7a38'],
  water:   '#3f8fb5',
  waterDeep:'#2e6f93',
  koi:     ['#ff8c42', '#fff3e6', '#ff6b35'],
  cloud:   ['#f6dbe4', '#eec9d8', '#e3bccd'],
  moon:    '#fdf3d8',
  firefly: '#e8ff9a',
  petal:   ['#ffd0e2', '#ffb9d4', '#ff9fc4', '#ffe4ee'],
  flower:  ['#ffffff', '#ffe66d', '#ff9fc4', '#c9a0ff']
};

/* ============================================================
   2. Voxel collectors
   ============================================================ */
const solid = [];   // lit, shadowed voxels
const glow  = [];   // unlit emissive-looking voxels
const water = [];   // transparent voxels
function V(x, y, z, c)        { solid.push({ x, y, z, c }); }
function G(x, y, z, c)        { glow.push({ x, y, z, c }); }
function W(x, y, z, c)        { water.push({ x, y, z, c }); }
function fill(x0, y0, z0, x1, y1, z1, c) {
  for (let x = Math.min(x0,x1); x <= Math.max(x0,x1); x++)
    for (let y = Math.min(y0,y1); y <= Math.max(y0,y1); y++)
      for (let z = Math.min(z0,z1); z <= Math.max(z0,z1); z++)
        V(x, y, z, typeof c === 'function' ? c(x,y,z) : c);
}

/* ============================================================
   3. Terrain — floating island with rocky underside
   ============================================================ */
const R = 26;                       // island radius
const heights = new Map();          // "x,z" -> top grass y
const POND = { x: -11, z: 9, r: 6.4 };
const key = (x, z) => x + ',' + z;

function inPond(x, z, pad = 0) { return Math.hypot(x - POND.x, z - POND.z) < POND.r + pad; }

function terrainHeight(x, z) {
  const d = Math.hypot(x, z);
  const edge = R - 1.6 * (fbm(x * 0.33 + 40, z * 0.33 + 40) - 0.5) * 4;
  if (d > edge) return null;
  let h = Math.round(fbm(x * 0.14, z * 0.14) * 2.4 - 0.4);
  h = Math.max(0, h);
  if (inPond(x, z, 0.6)) h = -2;                    // pond basin
  else if (inPond(x, z, 1.8)) h = Math.min(h, 0);   // sandy shore ring
  return h;
}

function buildIsland(cx, cy, cz, radius, scaleH, withGarden) {
  for (let x = -radius; x <= radius; x++) {
    for (let z = -radius; z <= radius; z++) {
      const gx = cx + x, gz = cz + z;
      const d = Math.hypot(x, z);
      const rEdge = radius - 1.6 * (fbm(gx * 0.33 + 40, gz * 0.33 + 40) - 0.5) * 4;
      if (d > rEdge) continue;

      let top;
      if (withGarden) {
        top = terrainHeight(x, z);
        if (top === null) continue;
      } else {
        top = Math.round(fbm(gx * 0.2, gz * 0.2) * 1.4);
      }
      heights.set(key(gx, gz), cy + top);
      const ty = cy + top;

      if (withGarden && inPond(x, z, 0.6)) {
        V(gx, ty, gz, vary(pick(P.sand), 0.05));          // pond bed
        W(gx, ty + 1, gz, vary(rnd() < 0.5 ? P.water : P.waterDeep, 0.05));
        continue;
      }
      // grass cap
      const rim = d > rEdge - 1.2;
      let gc = pick(P.grass);
      if (rim) gc = P.moss;
      V(gx, ty, gz, vary(gc, 0.07));
      if (withGarden && !rim) {
        const r = rnd();
        if (r < 0.028) V(gx, ty + 1, gz, vary(pick(P.flower), 0.06));       // wildflowers
        else if (r < 0.075) V(gx, ty + 1, gz, vary(pick(P.leaf), 0.08));    // grass tufts
      }
      // dirt body
      for (let y = ty - 1; y >= ty - 3; y--) V(gx, y, gz, vary(pick(P.dirt), 0.06));
      // tapered stone underside
      const depth = Math.max(2, Math.round((rEdge - d) * 0.62 * scaleH + fbm(gx * 0.5, gz * 0.5) * 2));
      for (let k = 1; k <= depth; k++) {
        const shrink = 1 - k / (depth + 2);
        if (rnd() > 0.35 + shrink * 0.65 && k > 2) continue;   // craggy gaps
        V(gx, ty - 3 - k, gz, vary(pick(P.stone), 0.09));
      }
      if (rim && rnd() < 0.3) {                                 // hanging vines
        const vl = 1 + Math.floor(rnd() * 3);
        for (let k = 1; k <= vl; k++) V(gx, ty - k, gz, vary(pick(P.leaf), 0.1));
      }
    }
  }
}

function groundY(x, z) {
  const h = heights.get(key(Math.round(x), Math.round(z)));
  return h === undefined ? 0 : h;
}

/* ============================================================
   4. The five-tier pagoda
   ============================================================ */
function roof(cx, cz, y, e) {
  for (let dx = -e; dx <= e; dx++) {
    for (let dz = -e; dz <= e; dz++) {
      const ax = Math.abs(dx), az = Math.abs(dz);
      const m = Math.max(ax, az), s = ax + az;
      const lift = Math.round(3.2 * Math.pow(s / (2 * e), 3));   // upturned eaves
      const yy = y + lift;
      let c;
      if (ax === az && m > 1) c = P.tileDark;                    // hip ridges
      else c = ((dx + dz) & 1) === 0 ? P.tileA : P.tileB;        // tile weave
      if (m === e) c = P.gold;                                   // gilt eave trim
      V(cx + dx, yy, cz + dz, vary(c, 0.05));
      if (m >= e - 1) V(cx + dx, yy - 1, cz + dz, P.tileUnder);  // shadowed underside
      // golden horns on the four corners
      if (ax === e && az === e) G(cx + dx, yy + 1, cz + dz, P.goldGlow);
    }
  }
}

function pagoda(cx, cz) {
  const py = groundY(cx, cz) + 1;
  // --- stone platform, three receding steps, stair on the west face
  fill(cx - 9, py, cz - 9, cx + 9, py, cz + 9, (x, y, z) => vary(pick(P.stone), 0.05));
  fill(cx - 8, py + 1, cz - 8, cx + 8, py + 1, cz + 8, () => vary(pick(P.stone), 0.05));
  fill(cx - 7, py + 2, cz - 7, cx + 7, py + 2, cz + 7, () => vary(pick(P.path), 0.04));
  for (let s = 0; s < 4; s++) {   // west stair, descending outward
    const sx = cx - 10 - s;
    const topS = py + 1 - s;
    fill(sx, Math.max(0, topS - 2), cz - 2, sx, topS, cz + 2, () => vary(pick(P.stone), 0.05));
  }
  const base = py + 3;
  const halves = [6, 5, 4, 3, 2];
  let y = base;

  for (let i = 0; i < 5; i++) {
    const s = halves[i];
    const wallH = i === 0 ? 4 : 3;
    // wooden floor slab + balcony
    fill(cx - s - 1, y, cz - s - 1, cx + s + 1, y, cz + s + 1, () => vary(P.woodDark, 0.06));
    // balcony railing (posts + rail), opening on west for the ground floor
    for (let dx = -s - 1; dx <= s + 1; dx++) for (let dz = -s - 1; dz <= s + 1; dz++) {
      if (Math.max(Math.abs(dx), Math.abs(dz)) !== s + 1) continue;
      if (i === 0 && dz >= -1 && dz <= 1 && dx === -s - 1) continue;
      V(cx + dx, y + 1, cz + dz, vary(P.redDark, 0.06));
    }
    // walls: corner columns in vermilion, plaster between, glowing windows
    for (let wy = y + 1; wy <= y + wallH; wy++) {
      for (let dx = -s; dx <= s; dx++) for (let dz = -s; dz <= s; dz++) {
        if (Math.max(Math.abs(dx), Math.abs(dz)) !== s) continue;
        const corner = Math.abs(dx) === s && Math.abs(dz) === s;
        const mid = (wy === y + Math.ceil(wallH / 2) + (i === 0 ? 1 : 0));
        const winCenter = (Math.abs(dx) <= 1 && Math.abs(dz) === s) || (Math.abs(dz) <= 1 && Math.abs(dx) === s);
        if (i === 0 && wy <= y + 3 && dx === -s && Math.abs(dz) <= 1) {
          V(cx + dx, wy, cz + dz, vary(P.woodDark, 0.04));      // doorway
          continue;
        }
        if (winCenter && mid && !corner) {
          G(cx + dx, wy, cz + dz, vary(P.lantern, 0.05));        // lit shoji window
          continue;
        }
        V(cx + dx, wy, cz + dz, vary(corner ? P.red : (wy === y + wallH ? P.redDark : (rnd() < 0.12 ? P.creamSh : P.cream)), 0.05));
      }
    }
    roof(cx, cz, y + wallH + 1, s + 2);
    y += wallH + 3;
  }
  // --- bronze & gold spire (sorin)
  for (let k = 0; k < 6; k++) {
    const c = k % 2 === 0 ? P.gold : '#8a6a3a';
    V(cx, y + k, cz, vary(c, 0.05));
    if (k === 2 || k === 4) {   // rings
      V(cx + 1, y + k, cz, vary(P.gold, 0.05)); V(cx - 1, y + k, cz, vary(P.gold, 0.05));
      V(cx, y + k, cz + 1, vary(P.gold, 0.05)); V(cx, y + k, cz - 1, vary(P.gold, 0.05));
    }
  }
  G(cx, y + 6, cz, P.goldGlow);  // hoju orb
}

/* ============================================================
   5. Flora — cherries, pines, bamboo, shrubs, rocks
   ============================================================ */
function cherryTree(x, z, sc = 1) {
  const gy = groundY(x, z);
  const h = Math.round((4 + rnd() * 2) * sc);
  // trunk with a gentle lean
  let tx = x, tz = z;
  const lean = rnd() < 0.5 ? 1 : -1;
  for (let k = 1; k <= h; k++) {
    V(tx, gy + k, tz, vary(pick(P.trunk), 0.07));
    if (k === Math.floor(h / 2)) { tx += lean; V(tx, gy + k, tz, vary(pick(P.trunk), 0.07)); }
    if (k === h - 1 && rnd() < 0.7) { V(tx + lean, gy + k, tz, vary(pick(P.trunk), 0.07)); }
  }
  // blossom canopy: several noisy ellipsoid puffs
  const blobs = 4 + Math.floor(rnd() * 3);
  for (let b = 0; b < blobs; b++) {
    const bx = tx + Math.round((rnd() * 2 - 1) * 2.4 * sc);
    const by = gy + h + Math.round((rnd() * 2 - 0.5) * 1.6);
    const bz = tz + Math.round((rnd() * 2 - 1) * 2.4 * sc);
    const br = (1.8 + rnd() * 1.6) * sc;
    for (let dx = -Math.ceil(br); dx <= Math.ceil(br); dx++)
      for (let dy = -Math.ceil(br * 0.75); dy <= Math.ceil(br * 0.75); dy++)
        for (let dz = -Math.ceil(br); dz <= Math.ceil(br); dz++) {
          const dd = (dx * dx + dz * dz) / (br * br) + (dy * dy) / (br * br * 0.55);
          if (dd > 1 || rnd() < dd * 0.55) continue;
          let c = pick(P.sakura);
          if (dy > br * 0.3 && rnd() < 0.4) c = P.sakuraHot;    // moonlit tips
          V(bx + dx, by + dy, bz + dz, vary(c, 0.06));
        }
  }
  // fallen petals pooling at the roots
  for (let k = 0; k < 14; k++) {
    const px = x + Math.round((rnd() * 2 - 1) * 4), pz = z + Math.round((rnd() * 2 - 1) * 4);
    if (Math.hypot(px, pz) > R - 2 || inPond(px, pz, 0.5)) continue;
    V(px, groundY(px, pz) + 1, pz, vary(pick(P.petal), 0.05));
  }
}

function pineTree(x, z, sc = 1) {
  const gy = groundY(x, z);
  const h = Math.round(4 * sc) + 1;
  for (let k = 1; k <= h; k++) V(x, gy + k, z, vary(pick(P.trunk), 0.07));
  for (let l = 0; l < 3; l++) {
    const r = Math.round((3 - l) * sc) + 1;
    const ly = gy + h - 1 + l * 2;
    for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++) {
      if (Math.abs(dx) + Math.abs(dz) > r + 1) continue;
      if (rnd() < 0.12) continue;
      V(x + dx, ly + ((Math.abs(dx) + Math.abs(dz)) > r - 0.5 ? 0 : 1), z + dz, vary(pick(P.pine), 0.08));
    }
  }
  V(x, gy + h + 4, z, vary(pick(P.pine), 0.08));
}

function bambooCluster(x, z) {
  const n = 5 + Math.floor(rnd() * 4);
  for (let i = 0; i < n; i++) {
    const bx = x + Math.round((rnd() * 2 - 1) * 2.5), bz = z + Math.round((rnd() * 2 - 1) * 2.5);
    const gy = groundY(bx, bz), h = 6 + Math.floor(rnd() * 4);
    for (let k = 1; k <= h; k++) V(bx, gy + k, bz, vary(k % 3 === 0 ? P.bamboo[2] : pick(P.bamboo), 0.06));
    for (let l = 0; l < 5; l++) {
      const lx = bx + Math.round((rnd() * 2 - 1) * 1.6), lz = bz + Math.round((rnd() * 2 - 1) * 1.6);
      V(lx, gy + h - Math.floor(rnd() * 2), lz, vary(pick(P.leaf), 0.08));
    }
  }
}

function shrub(x, z) {
  const gy = groundY(x, z);
  for (let dx = -1; dx <= 1; dx++) for (let dy = 0; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
    if (Math.abs(dx) + Math.abs(dy) + Math.abs(dz) > 2 || rnd() < 0.2) continue;
    V(x + dx, gy + 1 + dy, z + dz, vary(pick(P.leaf), 0.08));
  }
}

function rock(x, z, big = false) {
  const gy = groundY(x, z);
  const r = big ? 1.6 : 1;
  for (let dx = -1; dx <= 1; dx++) for (let dy = 0; dy <= (big ? 2 : 1); dy++) for (let dz = -1; dz <= 1; dz++) {
    if ((dx * dx + dy * dy * 1.4 + dz * dz) / (r * r * 1.6) > 1 || rnd() < 0.25) continue;
    V(x + dx, gy + 1 + dy, z + dz, vary(pick(P.stone), 0.1));
  }
}

/* ============================================================
   6. Garden furniture — lanterns, torii, bridge, path
   ============================================================ */
function stoneLantern(x, z) {
  const gy = groundY(x, z);
  V(x, gy + 1, z, vary(P.stoneDark, 0.05));
  V(x, gy + 2, z, vary(pick(P.stone), 0.05));
  G(x, gy + 3, z, vary(P.lantern, 0.04));
  fill(x - 1, gy + 4, z - 1, x + 1, gy + 4, z + 1, () => vary(P.stoneDark, 0.05));
  V(x, gy + 5, z, vary(pick(P.stone), 0.05));
}

function torii(x, z) {
  const gy = groundY(x, z);
  for (let k = 1; k <= 6; k++) {
    V(x - 3, gy + k, z, vary(P.redBright, 0.04));
    V(x + 3, gy + k, z, vary(P.redBright, 0.04));
  }
  fill(x - 5, gy + 7, z, x + 5, gy + 7, z, () => vary(P.redBright, 0.04));   // kasagi
  V(x - 5, gy + 8, z, P.tileDark); V(x + 5, gy + 8, z, P.tileDark);          // curved ends
  fill(x - 4, gy + 6, z, x + 4, gy + 6, z, () => vary(P.redDark, 0.04));     // nuki
  V(x, gy + 7, z, vary(P.redDark, 0.04));
}

function bridge(x0, z0) {
  // arched vermilion bridge across the pond (x direction)
  for (let i = -4; i <= 4; i++) {
    const arch = Math.round(1.8 * (1 - Math.pow(i / 4, 2)));
    const y = 1 + arch;
    fill(x0 + i, y, z0 - 1, x0 + i, y, z0 + 1, () => vary(P.redBright, 0.05));
    if (Math.abs(i) === 4) fill(x0 + i, -2, z0 - 1, x0 + i, y - 1, z0 + 1, () => vary(P.woodDark, 0.05));
    if (i % 2 === 0) {   // railing posts
      V(x0 + i, y + 1, z0 - 1, vary(P.redDark, 0.05));
      V(x0 + i, y + 1, z0 + 1, vary(P.redDark, 0.05));
    }
  }
  for (let i = -4; i <= 4; i += 2) {   // top rails
    const arch = Math.round(1.8 * (1 - Math.pow(i / 4, 2)));
    if (i + 2 <= 4) {
      const a2 = Math.round(1.8 * (1 - Math.pow((i + 2) / 4, 2)));
      for (let xi = i; xi <= i + 2; xi++) {
        const yy = 1 + Math.round(arch + (a2 - arch) * ((xi - i) / 2)) + 2;
        V(x0 + xi, yy, z0 - 1, vary(P.redDark, 0.05));
        V(x0 + xi, yy, z0 + 1, vary(P.redDark, 0.05));
      }
    }
  }
}

function path() {
  // stepping stones: torii (0,19) -> bridge -> around the pond -> pagoda stair
  const pts = [
    [0, 17], [0, 14], [-1, 11], [-3, 9], [-5, 9],          // approach (bridge carries over water)
    [-16, 6], [-15, 3], [-13, 0], [-10, -2], [-7, -4], [-4, -5], [-1, -6]
  ];
  for (const [px, pz] of pts) {
    if (inPond(px, pz, 0.2)) continue;
    const gy = groundY(px, pz);
    fill(px, gy + 1, pz, px + 1, gy + 1, pz + 1, () => vary(pick(P.path), 0.05));
  }
}

/* ============================================================
   7. Sky dressing — moon, clouds, satellite islets
   ============================================================ */
function moon(cx, cy, cz) {
  const r = 4;
  for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
    const d = Math.hypot(dx, dy);
    if (d > r + (hash2(dx, dy) - 0.5)) continue;
    const shade = hash2(dx * 3, dy * 3) < 0.18 ? '#e8dcb8' : P.moon;   // maria
    G(cx + dx, cy + dy, cz, vary(shade, 0.03));
  }
}
const cloudGroups = [];
function cloud(cx, cy, cz, s) {
  const grp = [];
  const n = 12 + Math.floor(rnd() * 8);
  for (let i = 0; i < n; i++) {
    const dx = Math.round((rnd() * 2 - 1) * 4 * s), dy = Math.round((rnd() * 2 - 1) * 1.2), dz = Math.round((rnd() * 2 - 1) * 2 * s);
    grp.push({ x: cx + dx, y: cy + dy, z: cz + dz, c: vary(pick(P.cloud), 0.04) });
  }
  cloudGroups.push({ voxels: grp, speed: 0.004 + rnd() * 0.004, cx });
  return grp;
}

/* ============================================================
   8. Assemble the world
   ============================================================ */
buildIsland(0, 0, 0, R, 1, true);

pagoda(7, -7);

torii(0, 19);
bridge(-11, 9);
path();

cherryTree(-16, -3, 1.15);
cherryTree(17, 8, 1.0);
cherryTree(-2, -17, 1.1);
cherryTree(-17, 15, 0.9);
pineTree(19, -4, 1.0);
pineTree(-19, -12, 1.1);
pineTree(14, 17, 0.9);
bambooCluster(20, -14);
bambooCluster(-20, 4);

stoneLantern(2, 15);
stoneLantern(-3, 12);
stoneLantern(-14, 1);
stoneLantern(-8, -6);
stoneLantern(-3, -9);
stoneLantern(1, -4);

rock(-6, 16); rock(12, 14); rock(-15, -8, true); rock(21, 2); rock(-2, 4);
shrub(4, 12); shrub(-9, 15); shrub(11, 3); shrub(-4, -12); shrub(16, -9); shrub(-13, -14);

// satellite islets with their own tiny gardens
buildIsland(-33, 5, -8, 5, 1.6, false);
cherryTree(-33, -8, 0.75);
buildIsland(31, 9, 13, 4, 1.6, false);
pineTree(31, 13, 0.7);
buildIsland(14, 7, 30, 4, 1.4, false);
cherryTree(14, 30, 0.7);

moon(-30, 30, -38);
cloud(-18, 26, -20, 1.2);
cloud(10, 30, -28, 1.5);
cloud(24, 24, 6, 1.0);
cloud(-8, 33, 18, 1.3);

/* ============================================================
   9. Three.js stage
   ============================================================ */
const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x54486e, 70, 190);

// twilight gradient dome
{
  const skyGeo = new THREE.SphereGeometry(240, 24, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top:     { value: new THREE.Color('#141c3a') },
      mid:     { value: new THREE.Color('#54486e') },
      horizon: { value: new THREE.Color('#e88aa8') },
      low:     { value: new THREE.Color('#2a2340') }
    },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      uniform vec3 top, mid, horizon, low; varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 c = h > 0.28 ? mix(mid, top, smoothstep(0.28, 0.85, h))
               : h > 0.0  ? mix(horizon, mid, smoothstep(0.0, 0.28, h))
               : mix(horizon, low, smoothstep(0.0, -0.4, h));
        gl_FragColor = vec4(c, 1.0);
      }`
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
}

// stars
{
  const n = 260, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, e = 0.25 + rnd() * 1.2, r = 200;
    pos[i * 3] = Math.cos(a) * Math.cos(e) * r;
    pos[i * 3 + 1] = Math.sin(e) * r;
    pos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfd6ff, size: 0.7, fog: false, transparent: true, opacity: 0.8 })));
}

// lights
scene.add(new THREE.HemisphereLight(0x9aa8e0, 0x4a3a58, 0.75));
const sun = new THREE.DirectionalLight(0xffb37a, 1.35);
sun.position.set(45, 38, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -42; sun.shadow.camera.right = 42;
sun.shadow.camera.top = 42; sun.shadow.camera.bottom = -42;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 160;
sun.shadow.bias = -0.0006;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x7a8fd0, 0.4);
rim.position.set(-35, 22, -30);
scene.add(rim);
const hearth = new THREE.PointLight(0xffb45e, 30, 30, 1.8);   // pagoda glow
hearth.position.set(7, groundY(7, -7) + 8, -7);
scene.add(hearth);

// camera + controls
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(34, 26, 44);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 18;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* ============================================================
   10. Bake voxel lists into InstancedMeshes
   ============================================================ */
function bake(list, material, { shadow = true, receive = true } = {}) {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mesh = new THREE.InstancedMesh(geo, material, list.length);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  for (let i = 0; i < list.length; i++) {
    m.setPosition(list[i].x, list[i].y, list[i].z);
    mesh.setMatrixAt(i, m);
    mesh.setColorAt(i, c.set(list[i].c));
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = shadow;
  mesh.receiveShadow = receive;
  scene.add(mesh);
  return mesh;
}

bake(solid, new THREE.MeshStandardMaterial({ roughness: 0.92, metalness: 0.02 }));
bake(glow,  new THREE.MeshBasicMaterial({}), { shadow: false, receive: false });
const waterMesh = bake(water, new THREE.MeshStandardMaterial({
  transparent: true, opacity: 0.72, roughness: 0.15, metalness: 0.35
}), { shadow: false });

// clouds as their own instanced mesh so they can drift
const cloudVoxels = cloudGroups.flatMap(g => g.voxels);
const cloudMesh = bake(cloudVoxels, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.85 }), { shadow: false, receive: false });

/* ============================================================
   11. Living things — koi, petals, fireflies
   ============================================================ */
// koi circling the pond
const koi = [];
for (let i = 0; i < 5; i++) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 0.5), new THREE.MeshStandardMaterial({ color: pick(P.koi) }));
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.35), new THREE.MeshStandardMaterial({ color: pick(P.koi) }));
  tail.position.x = -0.6;
  g.add(body, tail);
  g.userData = { a: rnd() * Math.PI * 2, r: 1.5 + rnd() * 3.2, s: 0.25 + rnd() * 0.35, d: rnd() < 0.5 ? 1 : -1 };
  scene.add(g);
  koi.push(g);
}

// falling sakura petals
const PETALS = 320;
const petalMesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(0.34, 0.08, 0.34),
  new THREE.MeshBasicMaterial({}),
  PETALS
);
{
  const c = new THREE.Color();
  for (let i = 0; i < PETALS; i++) petalMesh.setColorAt(i, c.set(pick(P.petal)));
  petalMesh.instanceColor.needsUpdate = true;
}
petalMesh.castShadow = false;
scene.add(petalMesh);
const treesXY = [[-16, -3], [17, 8], [-2, -17], [-17, 15], [-33, -8], [14, 30]];
const petals = [];
for (let i = 0; i < PETALS; i++) {
  const t = pick(treesXY);
  petals.push({
    x: t[0] + (rnd() * 2 - 1) * 6,
    y: 6 + rnd() * 12,
    z: t[1] + (rnd() * 2 - 1) * 6,
    vy: 0.012 + rnd() * 0.02,
    ph: rnd() * Math.PI * 2,
    sw: 0.5 + rnd() * 1.2,
    rx: rnd() * Math.PI, rz: rnd() * Math.PI,
    vrx: (rnd() - 0.5) * 0.04, vrz: (rnd() - 0.5) * 0.04
  });
}

// fireflies
const FLIES = 55;
const flyMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), new THREE.MeshBasicMaterial({}), FLIES);
{
  const c = new THREE.Color();
  for (let i = 0; i < FLIES; i++) flyMesh.setColorAt(i, c.set(vary(P.firefly, 0.05)));
  flyMesh.instanceColor.needsUpdate = true;
}
scene.add(flyMesh);
const flies = [];
for (let i = 0; i < FLIES; i++) {
  flies.push({
    bx: (rnd() * 2 - 1) * 22, bz: (rnd() * 2 - 1) * 22,
    by: 2 + rnd() * 5,
    ph: rnd() * Math.PI * 2, sp: 0.4 + rnd() * 0.8, am: 1 + rnd() * 2.5
  });
}

/* ============================================================
   12. Animate
   ============================================================ */
const dummy = new THREE.Object3D();
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // petals
  for (let i = 0; i < PETALS; i++) {
    const p = petals[i];
    p.y -= p.vy;
    p.x += Math.sin(t * p.sw + p.ph) * 0.014;
    p.z += Math.cos(t * p.sw * 0.8 + p.ph) * 0.011;
    p.rx += p.vrx; p.rz += p.vrz;
    const gy = groundY(p.x, p.z);
    if (p.y < gy + 0.4) {
      const tr = pick(treesXY);
      p.x = tr[0] + (rnd() * 2 - 1) * 6;
      p.z = tr[1] + (rnd() * 2 - 1) * 6;
      p.y = gy + 7 + rnd() * 9;
    }
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(p.rx, p.ph, p.rz);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;

  // fireflies
  for (let i = 0; i < FLIES; i++) {
    const f = flies[i];
    const blink = 0.55 + 0.45 * Math.sin(t * 2.2 * f.sp + f.ph * 3);
    dummy.position.set(
      f.bx + Math.sin(t * f.sp + f.ph) * f.am,
      f.by + Math.sin(t * f.sp * 1.7 + f.ph * 2) * 1.2,
      f.bz + Math.cos(t * f.sp * 0.7 + f.ph) * f.am
    );
    dummy.scale.setScalar(Math.max(0.05, blink));
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    flyMesh.setMatrixAt(i, dummy.matrix);
  }
  flyMesh.instanceMatrix.needsUpdate = true;

  // koi
  for (const g of koi) {
    const u = g.userData;
    u.a += u.s * 0.016 * u.d;
    g.position.set(POND.x + Math.cos(u.a) * u.r, -0.7 + Math.sin(t * 1.5 + u.r) * 0.12, POND.z + Math.sin(u.a) * u.r);
    g.rotation.y = -u.a + (u.d > 0 ? Math.PI : 0) + Math.PI / 2;
  }

  // drifting clouds (wrap around)
  let ci = 0;
  for (const grp of cloudGroups) {
    for (const v of grp.voxels) {
      cloudMesh.getMatrixAt(ci, dummy.matrix);
      dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
      v.x += grp.speed;
      if (v.x > 55) v.x = -55;
      dummy.position.set(v.x, v.y, v.z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.setScalar(1);
      dummy.updateMatrix();
      cloudMesh.setMatrixAt(ci, dummy.matrix);
      ci++;
    }
  }
  cloudMesh.instanceMatrix.needsUpdate = true;

  // breathing water & lantern light
  waterMesh.material.opacity = 0.68 + Math.sin(t * 0.9) * 0.06;
  hearth.intensity = 26 + Math.sin(t * 2.3) * 5;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
